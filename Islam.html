["17-28","Les délices des pieux et les familles réunies","Les pieux seront dans les jardins, accoudés sur des lits alignés. « Ceux qui ont cru et que leurs descendants ont suivis dans la foi, Nous leur ferons rejoindre leurs descendants, sans rien diminuer de leurs œuvres » (v. 21). Allah élève les enfants au rang de leurs parents au Paradis, même s'ils n'ont pas fait autant d'œuvres, pour la joie de leurs parents. Ils se diront : « Nous étions auparavant inquiets au milieu de nos familles ; Allah nous a fait grâce » (v. 26)."],
["29-49","Les questions qui démontent les arguments","Une série de questions : « Ont-ils été créés à partir de rien ? Ou sont-ils eux-mêmes les créateurs ? Ont-ils créé les cieux et la terre ? Non, ils n'ont pas de certitude. Possèdent-ils les trésors de ton Seigneur ? » (v. 35-37). Ces questions montrent qu'il n'y a que trois possibilités pour l'existence de l'homme, et que seule la création par Allah est raisonnable. « Endure le jugement de ton Seigneur, car tu es sous Nos yeux, et glorifie ton Seigneur quand tu te lèves, la nuit, et au déclin des étoiles » (v. 48-49)."]],
les:["Le Coran peut toucher le cœur même d'un adversaire.","Les familles croyantes seront réunies au Paradis.","La raison mène à reconnaître le Créateur.","Le croyant est « sous les yeux » d'Allah : il n'est jamais seul dans l'épreuve."]};

SD[53]={ctx:"Sourate mecquoise, la première sourate contenant une prosternation que le Prophète ﷺ récita en public près de la Ka'ba : tous ceux qui étaient présents, musulmans et polythéistes, se prosternèrent, sauf un vieil homme qui porta de la terre à son front (Bukhari 1067). Elle décrit la révélation et l'Ascension (al-Mi'raj).",
parts:[
["1-18","La révélation et l'Ascension","Par l'étoile quand elle tombe ! Votre compagnon ne s'est pas égaré. « Il ne parle pas sous l'effet de la passion : ce n'est qu'une révélation qui lui est inspirée » (v. 3-4). Jibril, doté d'une grande force, lui a enseigné. Le Prophète ﷺ a vu Jibril sous sa forme réelle à l'horizon, puis une autre fois près du Lotus de la limite (Sidrat al-Mountaha), à côté duquel est le Jardin du refuge, lors de l'Ascension. « Sa vue ne s'est pas détournée ni n'a dépassé la limite ; il a vu certains des plus grands signes de son Seigneur » (v. 17-18)."],
["19-30","Les idoles des Arabes","« Avez-vous vu al-Lat, al-'Ouzza et Manat, la troisième ? » Les trois grandes idoles des Arabes, qu'ils appelaient filles d'Allah. « Ce ne sont que des noms que vous avez inventés, vous et vos ancêtres » (v. 23). Ils ne suivent que la conjecture et leurs passions. Même les anges ne peuvent intercéder qu'avec la permission d'Allah."],
["31-32","Les grands péchés","Ceux qui font le bien sont ceux qui évitent les grands péchés et les turpitudes, à part les fautes légères (al-lamam) ; Allah est vaste en pardon. « Ne vous attribuez pas à vous-mêmes la pureté : Il sait mieux que quiconque qui est pieux » (v. 32)."],
["33-62","Les principes des feuillets anciens","Les feuillets de Moussa et d'Ibrahim contenaient déjà ces principes : « Nul ne portera le fardeau d'un autre ; l'homme n'obtient que le fruit de ses efforts ; son effort lui sera montré, puis il sera pleinement rétribué ; et c'est vers ton Seigneur que tout aboutit » (v. 38-42). C'est Lui qui fait rire et pleurer, qui fait mourir et vivre, qui enrichit et appauvrit. Il a détruit 'Ad, Thamoud et le peuple de Nouh. « Prosternez-vous donc devant Allah et adorez-Le » (v. 62)."]],
les:["Le Prophète ﷺ ne parle pas par passion : la Sunna est aussi une révélation.","Ne pas se croire pur ou supérieur : seul Allah connaît les cœurs.","Chacun récolte le fruit de ses propres efforts.","Allah est vaste en pardon pour ceux qui évitent les grands péchés."]};

SD[54]={ctx:"Sourate mecquoise. Elle commence par le miracle de la lune fendue : les Mecquois demandèrent un signe, et la lune se fendit en deux parties, de part et d'autre de la montagne, puis le Prophète ﷺ dit : « Soyez témoins » (Bukhari 3636, Muslim 2800). Les polythéistes dirent que c'était de la magie. Le Prophète ﷺ la récitait avec Qaf dans la prière de l'Aïd (Muslim 891).",
parts:[
["1-8","La lune fendue","« L'Heure approche et la lune s'est fendue. Et s'ils voient un signe, ils se détournent et disent : une magie continue » (v. 1-2). Ils suivent leurs passions. Le jour où l'appeleur appellera, ils sortiront des tombes comme des sauterelles dispersées."],
["9-17","Nouh","Le peuple de Nouh le démentit et le traita de fou. Il invoqua : « Je suis vaincu, secours-moi. » Allah ouvrit les portes du ciel avec une eau torrentielle et fit jaillir des sources de la terre. Il porta Nouh sur une embarcation de planches et de clous, qui voguait sous Ses yeux. « Nous avons rendu le Coran facile pour le rappel. Y a-t-il quelqu'un pour réfléchir ? » (v. 17), refrain répété quatre fois dans la sourate."],
["18-32","'Ad et Thamoud","'Ad fut détruit par un vent glacial un jour de malheur continu, qui arrachait les gens comme des troncs de palmiers déracinés. Thamoud dit : « Allons-nous suivre un seul homme d'entre nous ? » La chamelle fut envoyée comme épreuve ; ils la tuèrent, et un seul Cri les rendit comme des brindilles sèches."],
["33-42","Lout et Pharaon","Le peuple de Lout voulut abuser de ses hôtes ; Allah les aveugla puis les détruisit par une pluie de pierres, et sauva la famille de Lout à l'aube. La famille de Pharaon démentit tous Nos signes, et Allah la saisit."],
["43-55","Tout est écrit","Les mécréants de La Mecque sont-ils meilleurs que ces peuples ? « Leur rassemblement sera mis en déroute et ils tourneront le dos » (v. 45), une prophétie réalisée à Badr. « Nous avons créé toute chose avec mesure (qadar) » (v. 49). Tout ce qu'ils ont fait est dans les registres. Les pieux seront dans des jardins et des rivières, « dans un siège de vérité, auprès d'un Roi tout-puissant » (v. 55)."]],
les:["La lune fendue est l'un des miracles du Prophète ﷺ.","Le Coran a été rendu facile pour être retenu et médité.","Toute chose a été créée avec mesure et selon un décret.","Les peuples injustes ont tous connu la même fin."]};

SD[55]={ctx:"Sourate médinoise selon le Mushaf de Médine, mecquoise selon d'autres savants. Le Prophète ﷺ la récita aux compagnons, qui se taisaient ; il leur dit : « Je l'ai récitée aux djinns, et ils répondaient mieux que vous : chaque fois que j'arrivais à : Lequel donc des bienfaits de votre Seigneur nierez-vous ? ils disaient : Nous ne nions aucun de Tes bienfaits, notre Seigneur, à Toi la louange » (Tirmidhi 3291, jugé bon). Le refrain est répété 31 fois et s'adresse aux deux catégories d'êtres responsables : les humains et les djinns.",
parts:[
["1-13","Les premiers bienfaits","« Le Tout Miséricordieux. Il a enseigné le Coran. Il a créé l'homme. Il lui a enseigné à s'exprimer clairement. » L'enseignement du Coran est cité avant même la création de l'homme, car c'est le plus grand bienfait. Le soleil et la lune suivent un calcul précis ; les plantes et les arbres se prosternent. Allah a élevé le ciel et établi la balance : « Ne transgressez pas dans la balance ; donnez le poids exact » (v. 8-9). La terre avec ses fruits, ses palmiers, ses grains et ses plantes parfumées. Premier refrain : « Lequel donc des bienfaits de votre Seigneur nierez-vous ? » (v. 13)."],
["14-25","L'homme, le djinn et les mers","L'homme créé d'argile sonnante comme la poterie, le djinn d'une flamme sans fumée. Le Seigneur des deux levants et des deux couchants (été et hiver). Les deux mers qui se rencontrent avec une barrière entre elles, d'où sortent la perle et le corail. Les bateaux élevés comme des montagnes."],
["26-30","Tout passe sauf Lui","« Tout ce qui est sur la terre périra. Seul subsistera le visage de ton Seigneur, plein de majesté et de générosité » (v. 26-27). Tous ceux qui sont dans les cieux et sur la terre L'implorent ; « chaque jour, Il est à une œuvre nouvelle » (v. 29)."],
["31-45","Le Jour du jugement","Allah s'occupera de vous, ô humains et djinns. Si vous pouvez sortir des limites des cieux et de la terre, sortez ! Vous ne le pourrez qu'avec un pouvoir (v. 33). Le ciel se fendra et deviendra rouge comme du cuir. Les criminels seront reconnus à leurs marques et saisis par le toupet et les pieds."],
["46-61","Les deux jardins des rapprochés","« Pour celui qui craint de comparaître devant son Seigneur, il y aura deux jardins » (v. 46) : aux branches abondantes, avec deux sources qui coulent, deux espèces de chaque fruit, des lits doublés de brocart, des épouses au regard chaste. « La récompense du bien est-elle autre chose que le bien ? » (v. 60)."],
["62-78","Deux autres jardins","En deçà, deux autres jardins, d'un vert sombre, avec deux sources jaillissantes, des fruits, des palmiers et des grenadiers. La sourate se termine par : « Béni soit le nom de ton Seigneur, plein de majesté et de générosité » (v. 78)."]],
les:["Le plus grand bienfait est l'enseignement du Coran.","Répondre au refrain : « Nous ne nions aucun de Tes bienfaits, notre Seigneur, à Toi la louange. »","La justice dans les poids et les mesures fait partie de l'équilibre voulu par Allah.","Tout disparaîtra, sauf Allah.","Le bien est récompensé par le bien."]};

SD[56]={ctx:"Sourate mecquoise. Elle décrit le Jour du jugement et la répartition des gens en trois groupes. Les hadiths attribuant à sa lecture quotidienne une protection contre la pauvreté sont jugés faibles par les spécialistes ; sa valeur vient de son contenu. Le Prophète ﷺ citait al-Waqi'a parmi les sourates qui lui avaient fait blanchir les cheveux (Tirmidhi 3297).",
parts:[
["1-12","L'Événement","Quand l'Événement arrivera, nul ne pourra nier sa venue. Il abaissera les uns et élèvera les autres. La terre sera secouée, les montagnes pulvérisées en poussière. Vous serez alors trois groupes : les gens de la droite, les gens de la gauche, et les devanciers, qui sont les rapprochés d'Allah."],
["13-26","Les devanciers","Une multitude parmi les premières générations et un petit nombre parmi les dernières. Sur des lits ornés, face à face, servis par des jeunes garçons éternels, avec des coupes d'une source pure qui ne donne ni mal de tête ni ivresse, des fruits de leur choix et la chair d'oiseaux qu'ils désirent. Ils n'y entendront ni futilité ni péché, seulement : « Paix ! Paix ! »"],
["27-40","Les gens de la droite","Parmi des jujubiers sans épines, des bananiers aux fruits superposés, une ombre étendue, une eau qui coule, des fruits abondants jamais épuisés ni interdits."],
["41-56","Les gens de la gauche","Dans un vent brûlant et une eau bouillante, à l'ombre d'une fumée noire, ni fraîche ni agréable. Ils vivaient dans le luxe, persistaient dans le grand péché et niaient la résurrection. Ils mangeront de l'arbre de Zaqqoum et boiront comme boivent les chameaux assoiffés."],
["57-74","Les preuves tirées du quotidien","Une série de questions : « Avez-vous vu ce que vous éjaculez ? Est-ce vous qui le créez, ou Nous ? » « Avez-vous vu ce que vous semez ? Est-ce vous qui le faites pousser, ou Nous ? » « Avez-vous vu l'eau que vous buvez ? Est-ce vous qui la faites descendre des nuages ? Si Nous voulions, Nous la rendrions salée ; pourquoi n'êtes-vous pas reconnaissants ? » « Avez-vous vu le feu que vous allumez ? » « Glorifie donc le nom de ton Seigneur, l'Immense » (v. 74) ; le Prophète ﷺ dit de mettre cette glorification dans l'inclinaison (Abou Daoud 869)."],
["75-96","Le Coran et l'instant de la mort","Allah jure par les positions des étoiles, un serment immense : c'est un Coran noble, dans un Livre préservé, que seuls touchent les purifiés (v. 77-79). Puis la scène de la mort : quand l'âme remonte à la gorge et que vous regardez, impuissants, Nous sommes plus proche du mourant que vous (v. 83-85). S'il est des rapprochés : repos, parfum et jardin de délices. S'il est des gens de la droite : « Paix à toi. » S'il est des négateurs : un séjour dans l'eau bouillante. « Glorifie le nom de ton Seigneur, l'Immense » (v. 96)."]],
les:["Être parmi les devanciers dans les bonnes œuvres.","Chaque bouchée, chaque gorgée d'eau est un bienfait d'Allah.","Respecter le Coran ; les savants recommandent d'être en état de pureté pour toucher le mushaf.","Dire « Soubhana rabbiya al-'adhim » dans l'inclinaison.","Penser à l'instant de la mort pour s'y préparer."]};

SD[57]={ctx:"Sourate médinoise. Elle fait partie des sourates appelées al-Mousabbihat, qui commencent par la glorification d'Allah (57, 59, 61, 62, 64). Elle appelle les croyants à dépenser dans la voie d'Allah et à renouveler la foi de leur cœur. Elle porte le nom du fer, cité au verset 25.",
parts:[
["1-6","Les noms d'Allah","Tout ce qui est dans les cieux et sur la terre glorifie Allah. « Il est le Premier et le Dernier, l'Apparent et le Caché, et Il sait toute chose » (v. 3). Le Prophète ﷺ expliquait : Tu es le Premier, rien n'est avant Toi ; le Dernier, rien n'est après Toi ; l'Apparent, rien n'est au-dessus de Toi ; le Caché, rien n'est plus proche que Toi (Muslim 2713). « Il est avec vous où que vous soyez » (v. 4) par Sa science."],
["7-11","Dépensez","« Croyez en Allah et en Son Messager, et dépensez de ce dont Il vous a fait les dépositaires » (v. 7) : l'argent appartient à Allah, nous n'en sommes que les gérants. Ceux qui ont dépensé et combattu avant la conquête (quand l'islam était faible) ont un rang plus élevé que ceux qui l'ont fait après (v. 10). « Qui fera à Allah un prêt sincère pour qu'Il le lui multiplie ? » (v. 11)."],
["12-15","La lumière des croyants","Au Jour du jugement, les croyants et les croyantes auront leur lumière qui courra devant eux et à leur droite. Les hypocrites leur diront : « Attendez-nous, que nous prenions un peu de votre lumière ! » On leur dira : « Retournez en arrière chercher une lumière. » Une muraille sera dressée entre eux (v. 13)."],
["16-17","Les cœurs humbles","« N'est-il pas temps pour ceux qui ont cru que leurs cœurs s'humilient au rappel d'Allah et devant la vérité descendue, et qu'ils ne soient pas comme ceux qui ont reçu le Livre avant eux, dont les cœurs se sont endurcis avec le temps ? » (v. 16). Allah fait revivre la terre après sa mort : de même, Il peut faire revivre un cœur endurci."],
["18-24","La vraie valeur de ce monde","« Sachez que la vie de ce monde n'est que jeu, amusement, parure, vantardise entre vous et rivalité dans l'accumulation des biens et des enfants », comme une pluie qui fait pousser une végétation qui plaît aux cultivateurs, puis qui jaunit et devient débris (v. 20). « Rivalisez vers un pardon de votre Seigneur et un Paradis aussi large que le ciel et la terre » (v. 21). Aucun malheur n'arrive sans être écrit auparavant, « afin que vous ne vous attristiez pas de ce qui vous a échappé, ni ne vous réjouissiez avec orgueil de ce qui vous a été donné » (v. 22-23)."],
["25-29","Le fer et la balance","Allah a envoyé Ses messagers avec des preuves, le Livre et la balance, pour que les gens établissent la justice. « Et Nous avons fait descendre le fer, dans lequel il y a une force redoutable et des utilités pour les gens » (v. 25). Nouh et Ibrahim, puis 'Issa : ses disciples inventèrent le monachisme (ar-rahbaniyya), qu'Allah ne leur avait pas prescrit, et ne le respectèrent pas comme il se devait (v. 27)."]],
les:["L'argent appartient à Allah : nous en sommes les gérants.","Dépenser pour Allah est un prêt qu'Il multiplie.","Renouveler sa foi pour que le cœur ne s'endurcisse pas.","Tout est écrit : ne pas désespérer pour ce qu'on perd ni s'enorgueillir de ce qu'on gagne.","La religion vient avec la justice."]};

SD[58]={ctx:"Sourate médinoise. Khawla bint Tha'laba vint se plaindre au Prophète ﷺ : son mari Aws ibn as-Samit lui avait dit « Tu es pour moi comme le dos de ma mère » (dhihar), une formule pré-islamique qui rendait la femme interdite à son mari sans la libérer. Elle discutait avec le Prophète ﷺ et se plaignait à Allah. 'Aïcha, présente dans la pièce, raconta : « Louange à Allah dont l'ouïe embrasse toutes les voix ! Elle parlait à côté de moi et je n'entendais pas tout ce qu'elle disait, et Allah a révélé : Allah a entendu… » (Bukhari 7385, Ibn Majah 188). Le nom d'Allah apparaît dans chaque verset de cette sourate.",
parts:[
["1-6","Le dhihar aboli","« Allah a entendu la parole de celle qui discutait avec toi au sujet de son mari et se plaignait à Allah » (v. 1). Leurs épouses ne sont pas leurs mères ; cette formule est une parole blâmable et mensongère. Celui qui la prononce et veut revenir à sa femme doit expier : affranchir un esclave ; sinon jeûner deux mois consécutifs ; sinon nourrir soixante pauvres (v. 3-4). L'islam abolit ainsi une pratique qui faisait souffrir les femmes."],
["7-13","Les conciliabules et les assemblées","Il n'y a pas de conversation secrète à trois sans qu'Allah soit le quatrième, ni à cinq sans qu'Il soit le sixième (v. 7). Les conciliabules pour le péché et la désobéissance sont interdits ; parlez en secret pour la bonté et la piété. Le Prophète ﷺ a interdit que deux personnes se parlent en secret en excluant une troisième, car cela l'attriste (Bukhari 6290). « Quand on vous dit : faites de la place dans les assemblées, faites-en, Allah vous fera de la place. Allah élève en degrés ceux d'entre vous qui ont cru et ceux qui ont reçu la science » (v. 11)."],
["14-22","Le parti d'Allah","Les hypocrites qui prennent pour alliés des gens contre qui Allah est en colère. Ils jurent faussement. Satan les a dominés : ils sont le parti de Satan. « Tu ne trouveras pas des gens qui croient en Allah et au Jour dernier aimer ceux qui s'opposent à Allah et à Son Messager, fussent-ils leurs pères, leurs fils, leurs frères ou leur clan… Ceux-là sont le parti d'Allah, et le parti d'Allah, ce sont eux qui réussissent » (v. 22)."]],
les:["Allah entend toute plainte, même discrète.","L'islam a aboli les pratiques qui opprimaient les femmes.","Ne pas parler en secret à deux en excluant un troisième.","Faire de la place dans les assemblées.","La science et la foi élèvent en degrés."]};

SD[59]={ctx:"Sourate médinoise, révélée en l'an 4 au sujet de la tribu juive des Banou an-Nadir. Ils avaient un pacte avec les musulmans, mais complotèrent pour tuer le Prophète ﷺ en faisant tomber une pierre sur lui. Après un siège, ils furent expulsés de Médine avec ce que leurs chameaux pouvaient porter. Ibn 'Abbas appelait cette sourate « la sourate des Banou an-Nadir » (Bukhari 4882).",
parts:[
["1-10","L'expulsion et le partage","Allah fit sortir de leurs demeures ceux qui avaient trahi ; ils pensaient que leurs forteresses les protégeraient, mais Allah jeta l'effroi dans leurs cœurs (v. 2). « Tirez-en une leçon, ô gens doués de clairvoyance. » Les biens obtenus sans combat (al-fay') reviennent à Allah, au Messager, aux proches, aux orphelins, aux pauvres et aux voyageurs, « afin que cela ne circule pas seulement entre les riches d'entre vous » (v. 7). « Ce que le Messager vous donne, prenez-le ; ce qu'il vous interdit, abstenez-vous-en » (v. 7). Puis l'éloge des émigrés et des Ansar : « Ils les préfèrent à eux-mêmes, même s'ils sont dans le besoin » (v. 9). Les générations suivantes invoquent : « Notre Seigneur, pardonne-nous ainsi qu'à nos frères qui nous ont précédés dans la foi, et ne mets dans nos cœurs aucune rancune envers ceux qui ont cru » (v. 10)."],
["11-17","Les hypocrites et leurs fausses promesses","Les hypocrites avaient promis aux Banou an-Nadir de les soutenir ; ils ne le firent pas. Ils sont comme Satan qui dit à l'homme : « Mécrois ! » puis, quand il a mécru, dit : « Je te désavoue » (v. 16)."],
["18-24","Préparer demain et les noms d'Allah","« Ô vous qui croyez, craignez Allah, et que chaque âme regarde ce qu'elle a préparé pour demain » (v. 18). « Ne soyez pas comme ceux qui ont oublié Allah, et Allah leur a fait oublier leurs propres âmes » (v. 19). « Si Nous avions fait descendre ce Coran sur une montagne, tu l'aurais vue s'humilier et se fendre par crainte d'Allah » (v. 21). La sourate se termine par une série de noms d'Allah : l'Unique, le Connaisseur de l'invisible et du visible, le Tout Miséricordieux, le Roi, le Saint, la Paix, le Sécurisant, le Préservateur, le Tout-Puissant, le Contraignant, l'Orgueilleux (au sens du Très-Grand), le Créateur, Celui qui donne l'existence, Celui qui donne forme ; « à Lui les plus beaux noms » (v. 22-24)."]],
les:["Trahir un pacte a des conséquences graves.","La richesse ne doit pas circuler seulement entre les riches.","Suivre ce que le Prophète ﷺ ordonne et éviter ce qu'il interdit.","Préférer les autres à soi-même, comme les Ansar.","Ne pas garder de rancune envers les croyants.","Préparer « demain », le jour du jugement."]};

SD[60]={ctx:"Sourate médinoise, révélée en l'an 8, avant la conquête de La Mecque. Hatib ibn Abi Balta'a, un compagnon de Badr, écrivit secrètement une lettre aux Qouraychites pour les prévenir de l'expédition, afin de protéger sa famille restée à La Mecque. Le Prophète ﷺ, informé par révélation, envoya 'Ali intercepter la lettre. Il pardonna à Hatib, qui avait agi sans renier sa foi, en rappelant qu'il avait participé à Badr (Bukhari 3007).",
parts:[
["1-7","Ne prenez pas pour alliés les ennemis","« Ô vous qui croyez, ne prenez pas Mon ennemi et le vôtre pour alliés, en leur témoignant de l'amitié, alors qu'ils ont mécru en la vérité qui vous est venue et ont expulsé le Messager et vous-mêmes » (v. 1). Ni vos proches ni vos enfants ne vous serviront au Jour du jugement. « Vous avez eu un bel exemple dans Ibrahim et ceux qui étaient avec lui » (v. 4), qui désavouèrent l'idolâtrie de leur peuple. Peut-être Allah mettra-t-Il de l'affection entre vous et vos ennemis (v. 7), ce qui arriva après la conquête de La Mecque."],
["8-9","La règle avec les non-musulmans","« Allah ne vous défend pas d'être bons et justes envers ceux qui ne vous ont pas combattus pour votre religion et ne vous ont pas chassés de vos demeures. Allah aime ceux qui sont justes » (v. 8). Il interdit seulement de s'allier à ceux qui vous combattent pour votre religion et vous expulsent (v. 9). Asma', fille d'Abou Bakr, demanda si elle pouvait recevoir sa mère polythéiste ; le Prophète ﷺ répondit : « Oui, maintiens le lien avec ta mère » (Bukhari 2620)."],
["10-13","Les femmes émigrées et le serment","Quand des croyantes émigrent de La Mecque, mettez-les à l'épreuve pour vérifier leur foi (d'où le nom « l'Éprouvée »), et ne les renvoyez pas aux mécréants. Puis le serment que prêtaient les femmes au Prophète ﷺ : ne rien associer à Allah, ne pas voler, ne pas commettre la fornication, ne pas tuer leurs enfants, ne pas inventer de calomnie, et ne pas désobéir au Prophète ﷺ dans ce qui est convenable (v. 12)."]],
les:["La loyauté va aux croyants, pas à ceux qui combattent la religion.","Être bon et juste envers les non-musulmans pacifiques est encouragé.","Maintenir le lien avec ses parents, même non musulmans.","Le pardon envers un compagnon qui s'est trompé de bonne foi.","Les femmes prêtaient serment directement au Prophète ﷺ."]};

// Sourates 61 à 77
SD[61]={ctx:"Sourate médinoise. 'Abdullah ibn Salam rapporte que des compagnons se demandaient quelle action était la plus aimée d'Allah, pour la faire ; Allah révéla cette sourate, et le Prophète ﷺ la leur récita en entier (Tirmidhi 3309).",
parts:[
["1-4","Dire et faire","Tout ce qui est dans les cieux et sur la terre glorifie Allah. « Ô vous qui croyez, pourquoi dites-vous ce que vous ne faites pas ? C'est une chose très détestable auprès d'Allah que de dire ce que vous ne faites pas » (v. 2-3). « Allah aime ceux qui combattent dans Son chemin en rang serré, comme un édifice bien construit » (v. 4)."],
["5-9","Moussa, 'Issa et l'annonce d'Ahmad","Moussa dit à son peuple : « Pourquoi me faites-vous du mal, alors que vous savez que je suis le messager d'Allah ? » 'Issa dit : « Ô Enfants d'Israël, je suis le messager d'Allah envoyé vers vous, confirmant la Torah, et annonçant un messager qui viendra après moi, dont le nom sera Ahmad » (v. 6), l'un des noms du Prophète ﷺ. « Ils veulent éteindre de leurs bouches la lumière d'Allah, mais Allah parachèvera Sa lumière, même si les mécréants le détestent » (v. 8)."],
["10-14","Le commerce qui sauve","« Ô vous qui croyez, vous indiquerai-Je un commerce qui vous sauvera d'un châtiment douloureux ? Croyez en Allah et en Son Messager, et luttez dans le chemin d'Allah avec vos biens et vos personnes » (v. 10-11). La récompense : le pardon, le Paradis, et la victoire prochaine. « Soyez les alliés d'Allah, comme 'Issa dit aux apôtres : qui sont mes alliés vers Allah ? Les apôtres dirent : nous sommes les alliés d'Allah » (v. 14)."]],
les:["Faire ce que l'on dit : la cohérence entre paroles et actes.","L'unité et l'organisation des croyants.","'Issa a annoncé la venue du Prophète Muhammad ﷺ.","La foi et l'effort sont le commerce qui ne perd jamais."]};

SD[62]={ctx:"Sourate médinoise. Le verset 11 fut révélé un vendredi où le Prophète ﷺ faisait le sermon ; une caravane de marchandises arriva à Médine, et la plupart des gens sortirent pour la voir, ne laissant que douze hommes (Bukhari 936). Le Prophète ﷺ récitait cette sourate dans la prière du vendredi, avec al-Mounafiqoun (Muslim 877).",
parts:[
["1-4","Le Messager des illettrés","Tout glorifie Allah, le Roi, le Saint. « C'est Lui qui a envoyé à des illettrés un messager de parmi eux, qui leur récite Ses versets, les purifie et leur enseigne le Livre et la sagesse, alors qu'ils étaient auparavant dans un égarement évident » (v. 2). Ce message s'adresse aussi à « d'autres qui ne les ont pas encore rejoints » (v. 3) : le Prophète ﷺ posa sa main sur Salman le Perse et dit que des hommes de son peuple atteindraient la foi même si elle était aux Pléiades (Bukhari 4897)."],
["5-8","L'âne chargé de livres","Ceux qui ont reçu la Torah sans l'appliquer sont comme un âne qui porte des livres (v. 5) : il porte le savoir sans en profiter. Une leçon pour tous ceux qui apprennent sans agir. « La mort que vous fuyez va certes vous rencontrer » (v. 8)."],
["9-11","La prière du vendredi","« Ô vous qui croyez, quand on appelle à la prière du jour du vendredi, accourez au rappel d'Allah et laissez le commerce : cela est meilleur pour vous, si vous saviez » (v. 9). « Puis, quand la prière est achevée, dispersez-vous sur la terre, recherchez la grâce d'Allah, et souvenez-vous beaucoup d'Allah afin de réussir » (v. 10). L'islam équilibre l'adoration et le travail. Le dernier verset reproche à ceux qui laissèrent le Prophète ﷺ debout pour la caravane : « Ce qui est auprès d'Allah est meilleur que l'amusement et le commerce » (v. 11)."]],
les:["La prière du vendredi est obligatoire et passe avant le commerce.","Après la prière, il est encouragé de travailler et de chercher sa subsistance.","Le savoir sans action est comme un âne chargé de livres.","Le message de l'islam s'adresse à tous les peuples."]};

SD[63]={ctx:"Sourate médinoise, révélée en l'an 6 au retour de l'expédition contre les Banou al-Moustaliq. Après une dispute entre un émigré et un Ansari, 'Abdullah ibn Oubayy, chef des hypocrites, dit : « Quand nous retournerons à Médine, le plus puissant en fera sortir le plus vil. » Le jeune Zayd ibn Arqam l'entendit et le rapporta ; Ibn Oubayy jura qu'il n'avait rien dit, et Zayd fut accusé de mentir, jusqu'à ce qu'Allah révèle cette sourate pour confirmer ses paroles (Bukhari 4900).",
parts:[
["1-4","Le portrait des hypocrites","Quand les hypocrites viennent à toi, ils disent : « Nous attestons que tu es le Messager d'Allah. » Allah sait que tu es Son Messager, et Il atteste que les hypocrites sont des menteurs (v. 1). Ils se font de leurs serments un bouclier. « Quand tu les vois, leur apparence te plaît ; quand ils parlent, tu écoutes leurs paroles. Ils sont comme des bûches appuyées contre un mur ; ils croient que chaque cri est dirigé contre eux. Ce sont eux les ennemis : prends garde à eux » (v. 4)."],
["5-8","Leur orgueil","Quand on leur dit : « Venez, le Messager d'Allah va demander pardon pour vous », ils détournent la tête avec orgueil. Ils disent : « Ne dépensez pas pour ceux qui sont auprès du Messager d'Allah, afin qu'ils se dispersent », alors que les trésors des cieux et de la terre appartiennent à Allah. Ils disent : « Le plus puissant fera sortir le plus vil », alors que « la puissance appartient à Allah, à Son Messager et aux croyants » (v. 8)."],
["9-11","Avant que la mort vienne","« Ô vous qui croyez, que ni vos biens ni vos enfants ne vous distraient du rappel d'Allah » (v. 9). « Dépensez de ce que Nous vous avons attribué, avant que la mort ne vienne à l'un de vous et qu'il dise : Seigneur, si seulement Tu m'accordais un court délai, je ferais l'aumône et je serais parmi les vertueux ! » (v. 10). Mais Allah ne retarde aucune âme quand son terme est venu."]],
les:["L'hypocrisie peut se cacher derrière une belle apparence et de beaux discours.","La vraie puissance appartient à Allah et aux croyants.","Les biens et les enfants ne doivent pas faire oublier Allah.","Donner l'aumône maintenant, pas au moment de la mort."]};

SD[64]={ctx:"Sourate médinoise, dernière des Mousabbihat. Elle tire son nom du Jour du jugement, appelé « le jour de la grande perte » (at-taghabun), où les gens du Paradis apparaîtront comme les vrais gagnants et ceux de l'Enfer comme les vrais perdants.",
parts:[
["1-10","Le Créateur et le jour de la grande perte","Tout glorifie Allah ; à Lui la royauté et la louange. C'est Lui qui vous a créés : parmi vous il y a des mécréants et des croyants. Il vous a donné forme et l'a rendue belle. Il sait ce qui est dans les poitrines. « Le jour où Il vous réunira pour le jour du rassemblement, ce sera le jour de la grande perte » (v. 9) : celui qui a échangé l'au-delà contre ce monde découvrira sa perte."],
["11-13","Le malheur et la foi","« Aucun malheur n'arrive sans la permission d'Allah. Et quiconque croit en Allah, Allah guide son cœur » (v. 11). 'Alqama expliquait : c'est l'homme qui, frappé d'un malheur, sait qu'il vient d'Allah, l'accepte et s'y soumet. « Obéissez à Allah et obéissez au Messager » (v. 12)."],
["14-18","Les épouses, les enfants et la générosité","« Parmi vos épouses et vos enfants, il y a pour vous un ennemi : prenez garde. Mais si vous pardonnez, passez outre et effacez, Allah est Pardonneur et Très Miséricordieux » (v. 14). Ils peuvent pousser à délaisser une obéissance ou à commettre un péché. « Vos biens et vos enfants ne sont qu'une épreuve » (v. 15). « Craignez Allah autant que vous le pouvez » (v. 16). « Celui qui se préserve de son avarice, ceux-là sont les gagnants. Si vous faites à Allah un prêt sincère, Il vous le multipliera » (v. 16-17)."]],
les:["Accepter les malheurs comme venant d'Allah guide le cœur.","Être vigilant envers ceux qu'on aime quand ils éloignent d'Allah, tout en pardonnant.","Allah demande seulement ce que nous pouvons.","Se préserver de l'avarice est une réussite."]};

SD[65]={ctx:"Sourate médinoise, appelée aussi « la petite sourate des femmes ». Elle détaille les règles du divorce avec justice et humanité. Ibn 'Umar avait divorcé sa femme pendant ses règles ; le Prophète ﷺ se fâcha et lui ordonna de la reprendre et d'attendre qu'elle soit pure (Bukhari 5251).",
parts:[
["1-7","Les règles du divorce","« Ô Prophète, quand vous divorcez des femmes, divorcez-les en respectant leur délai d'attente (l'idda) » (v. 1) : au moment où elle est pure, sans relation intime depuis. Pendant ce délai, la femme reste dans la maison conjugale et n'en est pas chassée ; « peut-être Allah fera-t-Il ensuite survenir quelque chose de nouveau » (une réconciliation). À la fin du délai : retenez-les de façon convenable ou séparez-vous d'elles de façon convenable, devant deux témoins justes (v. 2).\nAu milieu de ces règles, des promesses : « Quiconque craint Allah, Il lui donnera une issue et le pourvoira d'où il ne s'attend pas. Quiconque place sa confiance en Allah, Il lui suffit » (v. 2-3). Le délai est de trois mois pour celle qui n'a plus ou pas encore de règles, et pour la femme enceinte, jusqu'à l'accouchement (v. 4). Logez-les selon vos moyens ; si elles allaitent, donnez-leur leur salaire. « Allah n'impose à personne que selon ce qu'Il lui a donné ; Allah fera succéder la facilité à la difficulté » (v. 7)."],
["8-12","Les cités punies et les sept cieux","Combien de cités ont désobéi à l'ordre de leur Seigneur et ont goûté la mauvaise conséquence de leur conduite ! Allah a envoyé un messager qui récite des versets clairs, pour faire sortir des ténèbres à la lumière ceux qui croient. « C'est Allah qui a créé sept cieux, et autant de terres » (v. 12)."]],
les:["Même dans la séparation, l'islam impose le respect et la justice.","La femme divorcée garde son logement pendant le délai d'attente.","La crainte d'Allah ouvre des issues inattendues.","La confiance en Allah suffit au croyant.","Allah ne demande à chacun que selon ses moyens."]};

SD[66]={ctx:"Sourate médinoise. Le Prophète ﷺ avait l'habitude de boire du miel chez son épouse Zaynab ; deux autres épouses, par jalousie, lui dirent qu'il sentait le maghafir (une gomme à l'odeur forte). Il jura de ne plus boire de miel (Bukhari 4912). Allah lui reprocha avec douceur de s'interdire une chose licite pour plaire à ses épouses.",
parts:[
["1-5","Ne pas s'interdire le licite","« Ô Prophète, pourquoi t'interdis-tu ce qu'Allah t'a rendu licite, cherchant à plaire à tes épouses ? » (v. 1). Allah a prescrit l'expiation des serments. Le Prophète ﷺ avait confié un secret à une épouse, qui le répéta à une autre ; Allah l'en informa. Les deux épouses sont appelées à se repentir."],
["6-8","Protéger sa famille et se repentir","« Ô vous qui croyez, préservez-vous, vous et vos familles, d'un Feu dont le combustible est les hommes et les pierres » (v. 6) : le chef de famille est responsable d'enseigner la religion aux siens. « Ô vous qui croyez, repentez-vous à Allah d'un repentir sincère (tawba nasouh) » (v. 8). Les savants en donnent les conditions : arrêter le péché, le regretter, être déterminé à ne pas recommencer, et rendre les droits des gens s'il y en a. Au Jour du jugement, la lumière des croyants courra devant eux et ils diront : « Notre Seigneur, parachève-nous notre lumière. »"],
["9-12","Quatre femmes en exemple","Deux exemples de femmes mécréantes : l'épouse de Nouh et l'épouse de Lout, mariées à deux serviteurs vertueux, qui les trahirent dans la foi ; être l'épouse d'un prophète ne leur servit à rien. Deux exemples de femmes croyantes : l'épouse de Pharaon (Assiya), qui invoqua sous la torture : « Seigneur, construis-moi auprès de Toi une maison au Paradis, et délivre-moi de Pharaon et de son œuvre » (v. 11) ; et Maryam, fille de 'Imran, qui préserva sa chasteté et crut aux paroles de son Seigneur (v. 12). Le Prophète ﷺ a dit que parmi les femmes, Assiya et Maryam ont atteint la perfection (Bukhari 3411)."]],
les:["Ne pas s'interdire ce qu'Allah a permis.","Chacun est responsable d'éduquer sa famille dans la foi.","Le repentir sincère a des conditions claires.","Chacun est jugé sur sa propre foi, pas sur celle de ses proches.","Assiya et Maryam sont des modèles pour tous les croyants."]};

SD[67]={ctx:"Sourate mecquoise. Le Prophète ﷺ a dit : « Une sourate du Coran de trente versets a intercédé pour un homme jusqu'à ce qu'il soit pardonné : Tabaraka lladhi biyadihi l-moulk » (Tirmidhi 2891, Abou Daoud 1400, jugé bon). Il ne dormait pas avant de l'avoir récitée avec as-Sajda (Tirmidhi 2892). On l'appelle « al-Mani'a », celle qui protège du châtiment de la tombe.",
parts:[
["1-5","La royauté et le but de la vie","« Béni soit Celui qui détient la royauté, et Il est capable de toute chose ; Celui qui a créé la mort et la vie afin de vous éprouver, pour savoir qui de vous fait la meilleure œuvre » (v. 1-2). Al-Foudayl ibn 'Iyad expliquait : la meilleure œuvre est la plus sincère (faite pour Allah) et la plus juste (conforme à la Sunna). Allah a créé sept cieux superposés : « Tu ne vois aucune disproportion dans la création du Tout Miséricordieux. Ramène ton regard : vois-tu une fissure ? » (v. 3)."],
["6-11","Le regret des gens de l'Enfer","Quand ils y seront jetés, ils entendront son mugissement ; il éclate presque de fureur. Ses gardiens leur demanderont : « Aucun avertisseur n'est-il venu à vous ? » Ils diront : « Si, mais nous l'avons démenti. » « Si nous avions écouté ou raisonné, nous ne serions pas parmi les gens du brasier » (v. 10). Écouter et réfléchir sont les deux voies du salut."],
["12-15","Il connaît les secrets","Ceux qui craignent leur Seigneur sans Le voir auront un pardon et une grande récompense. « Ne connaîtrait-Il pas, Celui qui a créé ? Il est le Subtil, le Parfaitement Informé » (v. 14). « C'est Lui qui vous a soumis la terre ; parcourez ses étendues et mangez de Sa subsistance ; c'est vers Lui la résurrection » (v. 15)."],
["16-22","Les oiseaux et la subsistance","Êtes-vous à l'abri de Celui qui est au ciel, qu'Il fasse que la terre vous engloutisse ? « N'ont-ils pas vu les oiseaux au-dessus d'eux, déployant et repliant leurs ailes ? Seul le Tout Miséricordieux les retient » (v. 19). Qui pourrait vous nourrir s'Il retenait Sa subsistance ? Celui qui marche le visage collé au sol est-il mieux guidé que celui qui marche droit sur un chemin droit ?"],
["23-30","L'eau qui pourrait disparaître","C'est Allah qui vous a donné l'ouïe, la vue et les cœurs : combien peu vous êtes reconnaissants ! La date de l'Heure est connue d'Allah seul. Dernier verset : « Si votre eau venait à s'enfoncer profondément dans la terre, qui vous apporterait une eau courante ? » (v. 30)."]],
les:["La vie et la mort ont été créées pour nous éprouver.","La meilleure œuvre est sincère et conforme à la Sunna.","Écouter et réfléchir sauvent du Feu.","L'eau, l'air, le vol des oiseaux : rien ne tient sans Allah.","La réciter chaque soir protège du châtiment de la tombe."]};

SD[68]={ctx:"Sourate mecquoise, parmi les premières révélées. Les polythéistes accusaient le Prophète ﷺ de folie ; Allah le défend et loue son caractère.",
parts:[
["1-16","Un caractère éminent","Noun. Par le calame et ce qu'ils écrivent ! « Par la grâce de ton Seigneur, tu n'es pas fou. Tu auras une récompense jamais interrompue. Et tu es certes d'un caractère éminent » (v. 2-4). Ne cède pas aux négateurs qui voudraient que tu sois conciliant pour qu'ils le soient aussi. N'obéis pas à celui qui jure beaucoup, méprisable, diffamateur, colporteur de médisances, empêcheur du bien, transgresseur, pécheur, grossier, et en plus de naissance douteuse, qui dit des versets : « des légendes anciennes » (v. 10-15)."],
["17-33","Les gens du jardin","Une parabole : des frères héritent d'un jardin dont leur père donnait une part aux pauvres. Ils jurent de cueillir les fruits au petit matin, avant l'arrivée des pauvres, sans dire « in cha Allah ». Pendant la nuit, un fléau détruit le jardin. Le matin, ils le trouvent noir et croient s'être trompés de chemin, puis comprennent : « Nous sommes privés ! » Le plus modéré d'entre eux dit : « Ne vous avais-je pas dit de glorifier Allah ? » Ils se repentent. « Tel est le châtiment, et le châtiment de l'au-delà est plus grand encore » (v. 33)."],
["34-47","Les pieux et les criminels","Les pieux auront des jardins de délices. Traiterons-Nous les musulmans comme les criminels ? Le jour où le Tibia sera dévoilé et où ils seront appelés à se prosterner, ils ne le pourront pas (v. 42) : le Prophète ﷺ a expliqué que les croyants se prosterneront, alors que celui qui se prosternait pour être vu aura le dos raide comme une seule planche (Bukhari 4919)."],
["48-52","La patience de Younous","« Endure le jugement de ton Seigneur, et ne sois pas comme l'homme du poisson (Younous) quand il appela, plein d'angoisse » (v. 48). Sans la grâce d'Allah, il aurait été rejeté sur une terre nue, blâmé ; mais son Seigneur le choisit et le mit parmi les vertueux. Les mécréants le transpercent presque de leurs regards (le mauvais œil) quand ils entendent le Coran (v. 51)."]],
les:["Le caractère du Prophète ﷺ est loué par Allah Lui-même.","Ne pas obéir aux médisants et aux arrogants.","Priver les pauvres de leur part fait perdre la bénédiction.","Dire « in cha Allah » pour ses projets.","La patience dans l'attente du jugement d'Allah."]};

SD[69]={ctx:"Sourate mecquoise. 'Umar ibn al-Khattab raconte qu'avant sa conversion, il suivit le Prophète ﷺ jusqu'à la Ka'ba et l'entendit réciter cette sourate ; il pensa « c'est un poète », puis entendit : « Ce n'est pas la parole d'un poète », puis « un devin », et entendit : « ni la parole d'un devin » ; l'islam commença alors à entrer dans son cœur (Ahmad 107).",
parts:[
["1-12","L'Inévitable et les peuples détruits","« L'Inévitable ! Qu'est-ce que l'Inévitable ? » Thamoud et 'Ad démentirent le Fracas : Thamoud fut détruit par le Cri, et 'Ad par un vent mugissant et glacial pendant sept nuits et huit jours. Pharaon et les cités renversées commirent des fautes ; Allah les saisit. Lors du déluge, Allah vous porta sur l'arche pour en faire un rappel."],
["13-18","Le Jour du jugement","On soufflera une seule fois dans la trompe ; la terre et les montagnes seront soulevées et broyées d'un seul coup. Le ciel se fendra. Huit anges porteront le Trône. Ce jour-là, vous serez exposés, et rien de vous ne restera caché (v. 18)."],
["19-37","Le livre dans la main droite ou gauche","Celui qui reçoit son livre dans sa main droite dit : « Voici, lisez mon livre ! J'étais sûr que je rencontrerais mon compte » (v. 19-20). Il aura une vie agréable dans un jardin élevé : « Mangez et buvez en paix, pour ce que vous avez fait dans les jours passés. » Celui qui reçoit son livre dans sa main gauche dit : « Hélas ! Si seulement on ne m'avait pas donné mon livre… Ma fortune ne m'a servi à rien, mon pouvoir m'a quitté » (v. 25-29). Il ne croyait pas en Allah l'Immense et n'encourageait pas à nourrir le pauvre (v. 33-34)."],
["38-52","La parole d'un noble messager","Allah jure par ce que vous voyez et ce que vous ne voyez pas : c'est la parole d'un noble messager, ni d'un poète, ni d'un devin. Si le Prophète ﷺ avait inventé quelque chose contre Allah, Allah l'aurait saisi par la main droite et lui aurait tranché l'aorte (v. 44-46). « C'est la vérité certaine. Glorifie donc le nom de ton Seigneur, l'Immense » (v. 51-52)."]],
les:["Rien de nous ne restera caché au Jour du jugement.","Être sûr de rencontrer son compte pousse à bien agir.","Le pouvoir et la fortune ne servent à rien ce jour-là.","Ne pas nourrir le pauvre est cité à côté du manque de foi.","Le Coran a touché le cœur de 'Umar."]};

SD[70]={ctx:"Sourate mecquoise. Selon des commentateurs, elle fut révélée quand un polythéiste, an-Nadr ibn al-Harith, défia Allah de faire tomber sur eux le châtiment si le Coran était la vérité.",
parts:[
["1-18","Le châtiment demandé","Un demandeur a réclamé un châtiment inévitable. Les anges et l'Esprit montent vers Allah en un jour dont la durée est de cinquante mille ans (v. 4). « Patiente d'une belle patience » (v. 5). Ce jour-là, le ciel sera comme du métal fondu et les montagnes comme de la laine. Aucun ami intime ne demandera des nouvelles de son ami. Le criminel voudrait racheter son âme par ses enfants, son épouse, son frère, son clan, et toute la terre."],
["19-35","L'homme anxieux et ceux qui prient","« L'homme a été créé anxieux : quand le mal le touche, il est abattu ; quand le bien le touche, il devient avare » (v. 19-21). Sauf ceux qui prient : ceux qui sont constants dans leur prière ; dans les biens desquels il y a un droit reconnu pour le mendiant et le démuni ; qui croient au Jour de la rétribution ; qui craignent le châtiment de leur Seigneur ; qui préservent leur chasteté ; qui respectent les dépôts et leurs engagements ; qui témoignent avec droiture ; et qui sont assidus à leurs prières (v. 22-34). La liste commence et se termine par la prière, comme dans al-Mou'minoun."],
["36-44","Les mécréants pressés","Qu'ont les mécréants à accourir vers toi de droite et de gauche, en groupes, en espérant entrer au Paradis ? Allah jure par le Seigneur des levants et des couchants qu'Il est capable de les remplacer par meilleurs qu'eux. Laisse-les jusqu'au jour où ils sortiront des tombes en hâte, les regards baissés, couverts d'humiliation."]],
les:["La « belle patience » : patienter sans se plaindre aux gens.","La prière régulière guérit l'anxiété et l'avarice naturelles de l'homme.","Les biens du croyant contiennent un droit pour le pauvre.","Respecter ses engagements et témoigner avec justice."]};

SD[71]={ctx:"Sourate mecquoise, entièrement consacrée à Nouh, premier messager envoyé à un peuple polythéiste. Elle décrit sa méthode de prédication sur 950 ans : un modèle de patience et de sagesse.",
parts:[
["1-4","La mission","Allah envoya Nouh à son peuple : « Avertis ton peuple avant que leur vienne un châtiment douloureux. » Nouh dit : « Adorez Allah, craignez-Le et obéissez-moi ; Il vous pardonnera une partie de vos péchés et vous accordera un délai jusqu'à un terme fixé. »"],
["5-20","Toutes les méthodes","Nouh décrit ses efforts à son Seigneur : il les a appelés nuit et jour ; ils ont mis leurs doigts dans leurs oreilles et se sont couverts de leurs vêtements. Il les a appelés ouvertement, puis en public et en secret. Il leur a dit : « Demandez pardon à votre Seigneur, car Il est grand pardonneur : Il vous enverra du ciel des pluies abondantes, vous donnera des biens et des enfants, et vous donnera des jardins et des rivières » (v. 10-12). Il leur a parlé des étapes de leur création, des sept cieux, de la lune comme lumière et du soleil comme lampe, et de la terre étendue comme un tapis."],
["21-28","Le refus et l'invocation","Ils ont suivi ceux dont les biens et les enfants n'ont fait qu'augmenter la perte, et ont dit : « N'abandonnez pas vos divinités : ni Wadd, ni Souwa', ni Yaghouth, ni Ya'ouq, ni Nasr » (v. 23). Selon Ibn 'Abbas, c'étaient les noms d'hommes pieux dont on avait fait des statues, puis qu'on avait fini par adorer (Bukhari 4920). Ils furent noyés à cause de leurs fautes. Nouh invoqua : « Seigneur, ne laisse sur la terre aucun mécréant » après qu'Allah lui eut révélé que personne d'autre ne croirait. Puis : « Seigneur, pardonne-moi, ainsi qu'à mes parents, à celui qui entre dans ma maison en croyant, et aux croyants et aux croyantes » (v. 28)."]],
les:["Varier les méthodes pour transmettre le message, sans se décourager.","Demander pardon apporte la pluie, les biens et les enfants.","L'exagération envers les gens pieux a mené à l'idolâtrie.","Invoquer pour ses parents et tous les croyants."]};

SD[72]={ctx:"Sourate mecquoise. Ibn 'Abbas raconte que le Prophète ﷺ priait la prière de l'aube avec ses compagnons à Nakhla, sur le chemin du marché de 'Oukadh ; un groupe de djinns, qui cherchait pourquoi ils ne pouvaient plus écouter les nouvelles du ciel, entendit le Coran et crut (Bukhari 773). Cette sourate rapporte leurs paroles.",
parts:[
["1-15","Les paroles des djinns","« Nous avons entendu un Coran merveilleux, qui guide vers la droiture ; nous y avons cru, et nous n'associerons jamais personne à notre Seigneur » (v. 1-2). Ils disent que leur Seigneur n'a ni compagne ni enfant ; que certains hommes cherchaient protection auprès des djinns, ce qui ne faisait qu'augmenter leur égarement (v. 6) ; qu'ils ne peuvent plus écouter le ciel, gardé par des gardes et des météores ; et qu'il y a parmi eux des vertueux et d'autres non, des musulmans et des injustes."],
["16-19","La droiture et les mosquées","S'ils s'étaient tenus droits sur la voie, Allah leur aurait donné une eau abondante. « Les mosquées sont à Allah : n'invoquez donc personne avec Allah » (v. 18)."],
["20-28","Le Messager ne possède rien","« Dis : je n'invoque que mon Seigneur et je ne Lui associe personne. Je ne possède pour vous ni mal ni bien » (v. 20-21). Personne ne peut le protéger contre Allah. Allah connaît l'invisible et ne le dévoile à personne, sauf à un messager qu'Il agrée, qu'Il entoure de gardiens (v. 26-27)."]],
les:["Les djinns existent ; certains sont croyants, d'autres non.","Chercher protection auprès des djinns est interdit et augmente l'égarement.","N'invoquer qu'Allah, surtout dans les mosquées.","Même le Prophète ﷺ ne possède ni bien ni mal pour les gens : tout est entre les mains d'Allah.","Les devins et voyants ne connaissent pas l'invisible."]};

SD[73]={ctx:"Sourate mecquoise, parmi les premières révélées après le début de la révélation. Le Prophète ﷺ s'était enveloppé de ses vêtements. 'Aïcha rapporte qu'au début de cette sourate, Allah rendit obligatoire la prière de nuit pour le Prophète ﷺ et ses compagnons, pendant un an, jusqu'à ce que leurs pieds enflent ; puis la fin de la sourate allégea cette obligation (Muslim 746).",
parts:[
["1-10","La prière de nuit","« Ô toi l'enveloppé ! Lève-toi la nuit, sauf une petite partie : sa moitié, ou un peu moins, ou un peu plus, et récite le Coran lentement et clairement (tartil) » (v. 1-4). « Nous allons te révéler une parole lourde » (v. 5) : la responsabilité du message. La prière de la nuit est plus efficace pour le recueillement et plus propice à la récitation (v. 6). Le jour, tu as de longues occupations. « Endure ce qu'ils disent, et écarte-toi d'eux d'une belle manière » (v. 10)."],
["11-19","L'avertissement","Laisse-Moi avec les négateurs qui vivent dans l'aisance. Allah a envoyé un messager comme Il en avait envoyé un à Pharaon, qui désobéit et fut saisi. Comment vous préserverez-vous d'un jour qui rendra les enfants vieillards ?"],
["20","L'allègement","Un long verset révélé plus tard, à Médine selon certains : Allah sait que le Prophète ﷺ et un groupe de ceux qui sont avec lui se lèvent près des deux tiers de la nuit, ou la moitié, ou le tiers. Il sait que vous ne pourrez pas le faire tout le temps : « Récitez donc ce qui vous est facile du Coran. » Certains seront malades, d'autres voyageront pour chercher la grâce d'Allah, d'autres combattront. « Accomplissez la prière, donnez la zakat, et faites à Allah un prêt sincère ; tout bien que vous avancez pour vous-mêmes, vous le retrouverez auprès d'Allah, meilleur et plus grand en récompense. Et demandez pardon à Allah. »"]],
les:["La prière de nuit fortifie le cœur pour porter les responsabilités.","Réciter le Coran lentement et clairement (tartil).","S'écarter des gens hostiles « d'une belle manière ».","Allah allège : chacun prie la nuit selon ce qui lui est facile.","Tout bien avancé sera retrouvé auprès d'Allah."]};

SD[74]={ctx:"Sourate mecquoise, parmi les toutes premières. Après la première révélation, il y eut une pause. Puis le Prophète ﷺ vit Jibril assis sur un trône entre le ciel et la terre ; effrayé, il rentra chez lui en disant : « Couvrez-moi ! » Allah révéla alors le début de cette sourate (Bukhari 4925). C'est le début de l'ordre de prêcher.",
parts:[
["1-7","Lève-toi et avertis","« Ô toi, revêtu d'un manteau ! Lève-toi et avertis. Et ton Seigneur, proclame Sa grandeur. Et tes vêtements, purifie-les. Et l'impureté (les idoles), fuis-la. Ne donne pas pour recevoir davantage. Et pour ton Seigneur, endure » (v. 1-7). Ces versets résument la mission : avertir, glorifier Allah, être pur intérieurement et extérieurement, fuir le chirk, donner sans calcul et patienter."],
["8-30","Al-Walid ibn al-Moughira","Quand on soufflera dans la trompe, ce sera un jour difficile pour les mécréants. Puis le portrait d'un homme qu'Allah a créé seul et à qui Il a donné de grands biens et des fils présents : al-Walid ibn al-Moughira, un notable de Qouraych selon les commentateurs. Il avait été touché par le Coran, mais sous la pression des siens, il réfléchit, calcula, fronça les sourcils, se détourna avec orgueil et dit : « Ce n'est que de la magie apprise » (v. 18-24). Allah annonce qu'il brûlera dans Saqar, qui ne laisse rien ni n'épargne rien, et sur laquelle veillent dix-neuf gardiens."],
["31-37","Les dix-neuf gardiens","Le nombre dix-neuf est une épreuve pour les mécréants, une certitude pour les gens du Livre et une augmentation de foi pour les croyants. « Nul ne connaît les armées de ton Seigneur, à part Lui » (v. 31). Par la lune, la nuit et l'aube : c'est un avertissement pour celui qui veut avancer ou reculer."],
["38-56","Chacun otage de ses actes","« Toute âme est l'otage de ce qu'elle a acquis, sauf les gens de la droite » (v. 38-39). Dans les jardins, ils interrogeront les criminels : « Qu'est-ce qui vous a menés à Saqar ? » « Nous n'étions pas de ceux qui priaient, nous ne nourrissions pas le pauvre, nous discutions dans le futile avec ceux qui discutaient, et nous démentions le Jour de la rétribution » (v. 43-46). Pourquoi se détournent-ils du rappel comme des ânes effrayés qui fuient un lion ? « Ceci est un rappel ; que celui qui veut s'en souvienne » (v. 54-55)."]],
les:["Le message commence par l'ordre d'avertir et de glorifier Allah.","La pureté du corps, des vêtements et du cœur.","Ne pas laisser la pression sociale nous éloigner de la vérité.","Abandonner la prière et ne pas nourrir le pauvre mènent à la perte.","Chacun est otage de ses propres actes."]};

SD[75]={ctx:"Sourate mecquoise. Ibn 'Abbas rapporte qu'au début de la révélation, le Prophète ﷺ bougeait rapidement les lèvres pour mémoriser le Coran en même temps que Jibril le récitait ; Allah révéla les versets 16-19 pour le rassurer (Bukhari 5).",
parts:[
["1-15","Le Jour et l'âme qui se blâme","Allah jure par le Jour de la résurrection et par l'âme qui se blâme (an-nafs al-lawwama) : la conscience du croyant qui se reproche ses fautes et ses manques. L'homme pense-t-il qu'Allah ne réunira pas ses os ? « Si, Nous sommes capables de reconstituer jusqu'aux bouts de ses doigts » (v. 4). Les savants y voient aussi une allusion aux empreintes digitales, uniques à chaque personne. Ce jour-là, la vue sera éblouie, la lune s'éclipsera, le soleil et la lune seront réunis, et l'homme dira : « Où fuir ? » « L'homme sera un témoin lucide contre lui-même, même s'il présente des excuses » (v. 14-15)."],
["16-19","Ne te hâte pas","« Ne remue pas ta langue pour te hâter de le réciter. C'est à Nous de le rassembler (dans ton cœur) et de le faire réciter. Quand Nous le récitons, suis sa récitation. Puis c'est à Nous de l'expliquer » (v. 16-19). Allah garantit la mémorisation, la récitation et l'explication du Coran. Après cela, le Prophète ﷺ écoutait Jibril, puis récitait comme il l'avait récité."],
["20-30","Les visages et l'agonie","Vous aimez ce monde qui passe et délaissez l'au-delà. « Ce jour-là, des visages seront rayonnants, regardant leur Seigneur » (v. 22-23) : un verset qui prouve, selon les sunnites, que les croyants verront Allah au Paradis. D'autres visages seront sombres. Puis la scène de la mort : quand l'âme arrive à la clavicule, on dit : « Qui est guérisseur ? » ; il comprend que c'est la séparation, et les jambes s'entrelacent. Ce jour-là, c'est vers ton Seigneur que sera le retour."],
["31-40","L'homme laissé sans but ?","Il n'a ni cru ni prié, mais a démenti et s'est détourné, puis est parti vers les siens en se pavanant. « L'homme pense-t-il qu'on le laissera sans but ? N'était-il pas une goutte de sperme éjaculée ? Puis une adhérence ; puis Allah l'a créé et formé harmonieusement. Celui-là n'est-Il pas capable de ressusciter les morts ? » (v. 36-40). Le Prophète ﷺ répondait à ce dernier verset : « Gloire à Toi, si ! » (Abou Daoud 884)."]],
les:["La conscience qui se reproche ses fautes est un signe de foi.","Allah a garanti la préservation et l'explication du Coran.","Les croyants verront leur Seigneur au Paradis.","L'homme n'a pas été créé sans but.","Répondre au dernier verset : « Gloire à Toi, si ! »"]};

SD[76]={ctx:"Sourate médinoise selon le Mushaf de Médine (mecquoise selon d'autres). Elle s'appelle aussi « ad-Dahr » (le Temps). Le Prophète ﷺ la récitait dans la deuxième unité de la prière de l'aube du vendredi, avec as-Sajda dans la première (Bukhari 891).",
parts:[
["1-4","La création et le choix","« S'est-il écoulé pour l'homme une période de temps où il n'était même pas une chose mentionnée ? » (v. 1). Allah l'a créé d'une goutte mélangée pour l'éprouver, et lui a donné l'ouïe et la vue. « Nous l'avons guidé sur le chemin, qu'il soit reconnaissant ou ingrat » (v. 3). Pour les mécréants, des chaînes, des carcans et un brasier."],
["5-12","Les pieux qui nourrissent","Les pieux boiront d'une coupe dont le mélange est de camphre. Ils accomplissent leurs vœux et craignent un jour dont le mal s'étendra partout. « Ils donnent la nourriture, malgré leur amour pour elle, au pauvre, à l'orphelin et au captif : Nous ne vous nourrissons que pour le visage d'Allah ; nous ne voulons de vous ni récompense ni remerciement » (v. 8-9). Allah les a préservés du mal de ce jour et leur a donné éclat et joie, un jardin et de la soie pour leur patience."],
["13-22","La description du Paradis","Accoudés sur des lits, ils n'y verront ni soleil brûlant ni froid glacial. Les ombrages seront proches et les fruits à portée de main. On fera circuler des récipients d'argent et des coupes de cristal, une boisson mélangée de gingembre, d'une source appelée Salsabil. Des jeunes garçons éternels les serviront, comme des perles éparpillées. « Tu y verras des délices et un vaste royaume » (v. 20). Vêtus de soie verte, parés de bracelets d'argent, leur Seigneur leur donnera une boisson pure. « Votre effort est reconnu » (v. 22)."],
["23-31","Patience et rappel","« C'est Nous qui t'avons révélé le Coran progressivement. Endure le jugement de ton Seigneur, et n'obéis ni au pécheur ni au mécréant. Mentionne le nom de ton Seigneur matin et soir, prosterne-toi devant Lui une partie de la nuit, et glorifie-Le longuement la nuit » (v. 23-26). Ces gens aiment ce monde éphémère et délaissent un jour lourd. « Vous ne voudrez que si Allah veut » (v. 30)."]],
les:["L'homme a reçu les moyens de choisir entre la gratitude et l'ingratitude.","Nourrir le pauvre, l'orphelin et le captif pour le seul visage d'Allah.","Donner sans attendre de remerciement.","La patience est récompensée par le Paradis.","Réciter as-Sajda et al-Insan à l'aube du vendredi."]};

SD[77]={ctx:"Sourate mecquoise. Ibn Mas'oud raconte qu'elle fut révélée au Prophète ﷺ dans une grotte de Mina, et qu'ils l'apprirent de sa bouche toute fraîche ; un serpent sortit et s'enfuit (Bukhari 1830). Le refrain « Malheur, ce jour-là, à ceux qui criaient au mensonge ! » y revient dix fois.",
parts:[
["1-15","Les serments et le Jour du tri","Allah jure par les vents envoyés successivement, par les tempêtes, par ceux qui répandent, par ceux qui séparent et par les anges qui lancent le rappel : ce qui vous est promis arrivera. Quand les étoiles s'éteindront, que le ciel se fendra, que les montagnes seront pulvérisées et que les messagers seront convoqués… pour le Jour du tri. « Malheur, ce jour-là, à ceux qui criaient au mensonge ! » (v. 15)."],
["16-28","Les preuves","N'avons-Nous pas fait périr les anciens ? Ne vous avons-Nous pas créés d'une eau vile, placée dans un réceptacle sûr jusqu'à un terme connu ? N'avons-Nous pas fait de la terre un lieu qui rassemble les vivants et les morts, avec de hautes montagnes et une eau douce ?"],
["29-40","L'Enfer et l'humiliation","Allez vers ce que vous traitiez de mensonge ! Vers une ombre à trois branches, qui ne protège pas de la flamme. Elle lance des étincelles grandes comme des châteaux, comme des chameaux jaunes. Ce jour-là, ils ne parleront pas et on ne leur permettra pas de s'excuser."],
["41-50","Les pieux et la dernière question","Les pieux seront parmi les ombrages et les sources, avec les fruits qu'ils désirent : « Mangez et buvez en paix pour ce que vous faisiez. » Quand on disait aux mécréants : « Inclinez-vous », ils ne s'inclinaient pas (v. 48). « À quelle parole croiront-ils donc après celle-ci ? » (v. 50) : si le Coran ne les convainc pas, rien ne les convaincra."]],
les:["Le Jour du tri est certain.","Notre création d'une goutte d'eau est une preuve de la résurrection.","Refuser de s'incliner devant Allah est un signe d'orgueil.","Le Coran est la parole la plus convaincante qui soit."]};

// Histoires détaillées des prophètes (1/4). Sources : le Coran, les hadiths authentiques et Qisas al-Anbiya' d'Ibn Kathir.
// Les récits isra'iliyyat non confirmés par le Coran ou la Sunna ont été écartés ou signalés comme tels.
const PD={};
PD.adam=[
{h:"L'annonce aux anges",v:"2:30-33",p:[
"Avant de créer Adam, Allah annonça aux anges : « Je vais établir sur la terre un lieutenant (khalifa). » Les anges demandèrent avec respect : « Vas-Tu y placer quelqu'un qui y sèmera la corruption et répandra le sang, alors que nous Te glorifions et Te sanctifions ? » Ce n'était pas une contestation, mais une question pour comprendre la sagesse de ce choix. Allah répondit : « Je sais ce que vous ne savez pas. »"]},
{h:"La création d'Adam",v:"15:26-29 · 38:71-72 · 3:59",p:[
"Allah créa Adam de Ses mains, à partir d'argile prise de toute la terre. Le Prophète ﷺ a dit qu'Allah a créé Adam d'une poignée prise de toute la terre, et que c'est pourquoi ses descendants sont de couleurs et de caractères différents : blancs, rouges, noirs, doux, rudes, bons et mauvais (Abou Daoud 4693, Tirmidhi 2955, authentique).",
"L'argile passa par plusieurs états : terre, argile collante, argile sèche sonnante comme de la poterie. Puis Allah lui insuffla de l'esprit qui vient de Lui. Selon un hadith, Adam éternua et dit « Al-hamdou lillah », et Allah lui répondit « Yarhamouka Allah » (qu'Allah te fasse miséricorde). Il fut ensuite envoyé saluer un groupe d'anges : « As-salamou 'alaykoum », ils répondirent « Wa 'alayka as-salamou wa rahmatou Allah », et ce fut sa salutation et celle de sa descendance (Bukhari 3326, Tirmidhi 3368)."]},
{h:"L'enseignement des noms",v:"2:31-33",p:[
"Allah enseigna à Adam les noms de toutes choses, puis présenta ces choses aux anges : « Informez-Moi de leurs noms, si vous êtes véridiques. » Ils répondirent : « Gloire à Toi ! Nous n'avons de savoir que ce que Tu nous as appris. » Adam, lui, put les nommer. Les anges comprirent alors la supériorité que la science donnait à cette nouvelle créature."]},
{h:"Le refus d'Iblis",v:"2:34 · 7:11-18 · 18:50 · 38:73-85",p:[
"Allah ordonna aux anges de se prosterner devant Adam, une prosternation d'honneur et non d'adoration. Tous obéirent, sauf Iblis. Iblis était un djinn (18:50) qui se trouvait parmi les anges à cause de son adoration. Interrogé, il répondit : « Je suis meilleur que lui : Tu m'as créé de feu et Tu l'as créé d'argile. »",
"Ce fut le premier raisonnement orgueilleux. Allah le chassa : « Sors d'ici, tu es banni ! » Iblis demanda un délai jusqu'au Jour de la résurrection, qui lui fut accordé, et jura d'égarer les descendants d'Adam en venant à eux « par devant, par derrière, par leur droite et par leur gauche ». Allah répondit que ceux qui le suivraient rempliraient l'Enfer avec lui."]},
{h:"Le Paradis et l'arbre interdit",v:"2:35-36 · 7:19-22 · 20:115-121",p:[
"Allah créa pour Adam son épouse, Hawwa' (Ève), afin qu'il trouve auprès d'elle la tranquillité (7:189). Il les installa au Paradis : « Mangez-en de partout à votre guise, mais n'approchez pas de cet arbre. » Le Coran ne précise pas de quel arbre il s'agissait, et il n'est pas utile de le savoir.",
"Satan leur murmura : « Votre Seigneur ne vous a interdit cet arbre que pour que vous ne deveniez pas des anges ou des immortels », et il leur jura qu'il était un conseiller sincère. Ils mangèrent de l'arbre ; leur nudité leur apparut et ils se couvrirent de feuilles du Paradis. Le Coran attribue la faute aux deux ensemble : rien n'indique que Hawwa' l'ait poussé, contrairement à certains récits anciens."]},
{h:"Le repentir et la descente sur terre",v:"2:37-39 · 7:23-25 · 20:122-123",p:[
"Contrairement à Iblis, Adam et Hawwa' reconnurent immédiatement leur faute. Allah inspira à Adam des paroles de repentir : « Notre Seigneur, nous nous sommes fait du tort à nous-mêmes. Si Tu ne nous pardonnes pas et ne nous fais pas miséricorde, nous serons parmi les perdants » (7:23). Allah accepta leur repentir, car Il est At-Tawwab, Celui qui accepte le repentir.",
"Ils descendirent ensuite sur terre, comme cela avait été prévu dès le départ (2:30), avec cette promesse : « Quiconque suivra Ma guidée n'aura rien à craindre et ne sera pas affligé. » Il n'y a donc pas de « péché originel » transmis : chaque âme ne porte que ses propres actes (53:38)."]},
{h:"Les deux fils d'Adam",v:"5:27-31",p:[
"Deux fils d'Adam, que les commentateurs nomment Qabil (Caïn) et Habil (Abel), offrirent chacun une offrande. Celle de Habil fut acceptée, celle de Qabil non. Jaloux, Qabil menaça de tuer son frère. Habil répondit : « Allah n'accepte que de ceux qui Le craignent. Si tu étends ta main vers moi pour me tuer, je n'étendrai pas la mienne vers toi pour te tuer, car je crains Allah, Seigneur des mondes. »",
"Qabil le tua. Ne sachant que faire du corps, il vit un corbeau creuser la terre pour enterrer un autre corbeau, et il dit : « Malheur à moi ! Suis-je incapable d'être comme ce corbeau ? » Ce fut le premier meurtre de l'humanité. Le Prophète ﷺ a dit que chaque meurtre injuste porte une part de péché sur le premier fils d'Adam, car il fut le premier à instaurer le meurtre (Bukhari 3335, Muslim 1677). Le Coran en tire la règle : « Quiconque tue une âme injustement, c'est comme s'il avait tué toute l'humanité » (5:32)."]},
{h:"La fin de sa vie",v:"7:172",p:[
"Adam fut le premier prophète : Allah lui parla et lui révéla des enseignements (Ibn Hibban, authentique). Selon un hadith, Allah fit sortir de son dos toute sa descendance et leur fit attester qu'Il est leur Seigneur (7:172).",
"Ibn Kathir rapporte qu'Adam vécut longtemps, entouré de nombreux descendants, et qu'il désigna son fils Chith (Seth) pour lui succéder dans l'enseignement. Le Prophète ﷺ a rencontré Adam au premier ciel lors du Voyage nocturne (Bukhari 349). Au Jour du jugement, les gens viendront à lui pour demander l'intercession, et il les renverra vers Nouh en rappelant sa faute (Bukhari 4712)."]}
];
PD.idris=[
{h:"Ce que dit le Coran",v:"19:56-57 · 21:85-86",p:[
"« Et mentionne Idris dans le Livre. C'était un homme très véridique et un prophète. Et Nous l'avons élevé à un rang haut placé » (19:56-57). Il est aussi cité avec Isma'il et Dhoul-Kifl : « tous étaient parmi les patients ; Nous les fîmes entrer dans Notre miséricorde, car ils étaient parmi les gens de bien » (21:85-86)."]},
{h:"La rencontre lors du Voyage nocturne",v:"Bukhari 3207, Muslim 162",p:[
"Lors du Mi'raj, le Prophète ﷺ rencontra Idris au quatrième ciel. Idris l'accueillit en disant : « Bienvenue au frère vertueux et au prophète vertueux. » Beaucoup de savants comprennent « le rang haut placé » de ce lien."]},
{h:"Ce que rapportent les historiens",v:"Ibn Kathir",p:[
"Ibn Kathir mentionne qu'Idris vécut entre Adam et Nouh, qu'il fut parmi les ancêtres de Nouh, et qu'il aurait été le premier à écrire avec le calame. Ces détails viennent de récits historiques et non de textes authentiques ; il faut donc les prendre avec prudence. On ne lui attribue pas non plus avec certitude les légendes qui l'identifient à Hermès.",
"La leçon principale reste ce que le Coran affirme : la véracité (siddiq) et la patience élèvent le rang d'un serviteur auprès d'Allah."]}
];
PD.nuh=[
{h:"L'origine de l'idolâtrie",v:"71:23 · Bukhari 4920",p:[
"Pendant dix siècles après Adam, les gens suivaient le tawhid (selon Ibn 'Abbas, rapporté par al-Hakim). Puis il y eut des hommes pieux nommés Wadd, Souwa', Yaghouth, Ya'ouq et Nasr. À leur mort, Satan inspira à leur peuple de dresser des statues à leur image, pour se souvenir d'eux et être encouragés à l'adoration. La génération suivante oublia le but initial, et les statues finirent par être adorées (Bukhari 4920, d'après Ibn 'Abbas).",
"C'est ainsi que l'exagération envers les gens vertueux devint la première forme de chirk sur terre."]},
{h:"Le premier messager",v:"7:59 · 71:1-4",p:[
"Allah envoya Nouh, le premier messager envoyé à un peuple de polythéistes (Bukhari 4712). Son message : « Ô mon peuple, adorez Allah ; vous n'avez pas d'autre divinité que Lui. Je crains pour vous le châtiment d'un jour terrible. » Il leur promettait aussi le pardon, la pluie, les biens et les enfants s'ils demandaient pardon à Allah (71:10-12)."]},
{h:"950 ans de prédication",v:"29:14 · 71:5-20",p:[
"Nouh resta parmi son peuple neuf cent cinquante ans. Il décrit lui-même ses efforts : « Seigneur, j'ai appelé mon peuple nuit et jour, mais mon appel n'a fait qu'augmenter leur fuite. Chaque fois que je les ai appelés pour que Tu leur pardonnes, ils ont mis leurs doigts dans leurs oreilles, se sont enveloppés de leurs vêtements, se sont obstinés et se sont montrés très orgueilleux. Puis je les ai appelés ouvertement, puis en public et en privé. »",
"Il leur parlait de la création des cieux, de la lune et du soleil, de la terre étalée comme un tapis : autant de signes de l'unicité d'Allah."]},
{h:"Le refus des notables",v:"11:27-34 · 26:111-116",p:[
"Les chefs de son peuple lui reprochèrent d'être suivi par « les plus vils d'entre nous » et demandèrent qu'il chasse les pauvres croyants. Nouh refusa : « Je ne repousserai pas ceux qui ont cru. » Ils l'accusèrent de folie, le menacèrent de lapidation et finirent par dire : « Fais venir ce dont tu nous menaces, si tu es véridique ! »"]},
{h:"La construction de l'arche",v:"11:36-39 · 23:27",p:[
"Allah révéla à Nouh : « Aucun de ton peuple ne croira plus, en dehors de ceux qui ont déjà cru. » Nouh invoqua alors contre les mécréants (71:26-27). Allah lui ordonna de construire l'arche sous Ses yeux et selon Sa révélation.",
"Chaque fois que les notables passaient près de lui, ils se moquaient d'un homme qui construisait un bateau loin de la mer. Nouh répondait : « Si vous vous moquez de nous, nous nous moquerons de vous comme vous vous moquez. »"]},
{h:"Le déluge",v:"11:40-44 · 54:11-13",p:[
"Quand vint l'ordre d'Allah et que « le four bouillonna », Nouh fit monter un couple de chaque espèce, sa famille sauf celui contre qui la parole était déjà prononcée, et les croyants, qui étaient peu nombreux. Les portes du ciel s'ouvrirent avec une eau torrentielle et la terre jaillit de sources ; l'arche voguait sur des vagues comme des montagnes.",
"L'épouse de Nouh fait partie de ceux qui périrent : le Coran la donne comme exemple de femme mécréante mariée à un homme pieux (66:10)."]},
{h:"Le fils de Nouh",v:"11:42-47",p:[
"Nouh appela son fils resté à l'écart : « Ô mon fils, monte avec nous et ne reste pas avec les mécréants. » Il répondit : « Je vais me réfugier sur une montagne qui me protégera de l'eau. » « Il n'y a aujourd'hui aucun protecteur contre l'ordre d'Allah. » Une vague les sépara et il fut parmi les noyés.",
"Nouh dit ensuite : « Seigneur, mon fils fait partie de ma famille, et Ta promesse est vérité. » Allah répondit : « Ô Nouh, il ne fait pas partie de ta famille, car il a commis un acte non vertueux. » Nouh demanda aussitôt pardon d'avoir posé une question dont il n'avait pas la science."]},
{h:"Après le déluge",v:"11:44, 48 · 37:77",p:[
"« Ô terre, absorbe ton eau ! Ô ciel, cesse ! » L'eau baissa, l'ordre fut accompli et l'arche s'immobilisa sur le mont Joudi. Nouh descendit avec paix et bénédictions. Allah fit de sa descendance celle qui survécut (37:77), d'où son surnom de « second père de l'humanité ».",
"Le Prophète ﷺ rapporte qu'au moment de mourir, Nouh recommanda à ses fils deux choses : « La ilaha illa Allah » et « Soubhan Allah wa bihamdih », et les mit en garde contre le chirk et l'orgueil (Ahmad 6583, authentique)."]}
];
PD.hud=[
{h:"Le peuple de 'Ad",v:"7:65-69 · 89:6-8 · 46:21",p:[
"'Ad vivait dans al-Ahqaf, les dunes du sud de l'Arabie, entre le Yémen et Oman. C'étaient des hommes d'une force et d'une taille exceptionnelles, bâtisseurs d'Iram « aux colonnes, dont on n'a jamais créé de pareille dans aucun pays » (89:7-8). Ils vinrent après le peuple de Nouh et héritèrent de la terre.",
"Ils adoraient des idoles et se vantaient : « Qui est plus fort que nous ? » (41:15). Ils oubliaient que Celui qui les avait créés était plus fort qu'eux."]},
{h:"L'appel de Houd",v:"26:123-140",p:[
"Allah leur envoya l'un des leurs, Houd. Il les appela à adorer Allah seul et leur reprocha leur arrogance : « Bâtissez-vous sur chaque colline un monument pour vous amuser ? Et vous édifiez des forteresses comme si vous deviez vivre éternellement ? Et quand vous frappez, vous frappez comme des tyrans. » Il leur rappelait les bienfaits d'Allah : les troupeaux, les enfants, les jardins et les sources.",
"Il leur promettait que s'ils demandaient pardon, Allah leur enverrait la pluie en abondance et ajouterait force à leur force (11:52)."]},
{h:"Le défi",v:"11:53-57",p:[
"Ils répondirent : « Tu ne nous as apporté aucune preuve, nous n'abandonnerons pas nos divinités sur ta parole. Nous disons seulement que l'une de nos divinités t'a frappé d'un mal. » Houd, seul face à eux, lança un défi d'une grande foi : « Je prends Allah à témoin, et soyez témoins, que je désavoue ce que vous Lui associez. Rusez donc tous contre moi et ne me donnez aucun répit. Je place ma confiance en Allah, mon Seigneur et le vôtre. Il n'y a pas d'être vivant qu'Il ne tienne par le toupet. »",
"Personne ne put lui faire de mal."]},
{h:"Le nuage et le vent",v:"46:24-25 · 69:6-8 · 54:19-20",p:[
"Après une longue sécheresse, ils virent un nuage avancer vers leurs vallées et se réjouirent : « Voici un nuage qui nous apporte la pluie ! » « Non, c'est ce que vous cherchiez à hâter : un vent porteur d'un châtiment douloureux. »",
"Un vent glacial et mugissant souffla sur eux sept nuits et huit jours consécutifs. On voyait les gens renversés « comme des troncs de palmiers creux ». C'est pourquoi le Prophète ﷺ, quand il voyait des nuages ou du vent, s'inquiétait et invoquait Allah, craignant que ce soit un châtiment comme celui de 'Ad (Bukhari 3206, Muslim 899).",
"Houd et ceux qui avaient cru avec lui furent sauvés par la miséricorde d'Allah (11:58)."]}
];
PD.salih=[
{h:"Le peuple de Thamoud",v:"7:73-74 · 15:80-84 · 89:9",p:[
"Thamoud succéda à 'Ad. Ils vivaient à al-Hijr (Mada'in Salih, au nord-ouest de l'Arabie) et « taillaient les rochers dans la vallée » pour en faire des demeures. Ils avaient des jardins, des sources et des palmiers. Mais ils adoraient des idoles et suivaient des chefs corrompus."]},
{h:"L'appel de Salih",v:"11:61-63 · 26:141-152",p:[
"Salih, l'un des leurs, était estimé de son peuple avant sa mission : « Ô Salih, tu étais pour nous un espoir avant cela. » Il les appela à adorer Allah seul, leur rappela qu'Allah les avait fait naître de la terre et qu'Il était proche et répondait aux invocations. Seuls des gens faibles crurent ; les orgueilleux le traitèrent d'ensorcelé."]},
{h:"La chamelle, signe d'Allah",v:"26:154-156 · 54:27-28 · 91:13",p:[
"Ils exigèrent un miracle. Allah fit sortir une chamelle comme signe. Salih leur dit : « Voici la chamelle d'Allah, un signe pour vous. Laissez-la manger sur la terre d'Allah et ne lui faites aucun mal. » L'eau devait être partagée : un jour pour elle, un jour pour eux."]},
{h:"Le crime",v:"54:29 · 91:11-14 · 27:48-49",p:[
"Neuf hommes de la ville semaient la corruption (27:48). Le plus misérable d'entre eux se chargea de tuer la chamelle, avec l'accord du peuple. Le Prophète ﷺ a décrit cet homme comme un homme puissant et respecté dans sa tribu (Bukhari 4942).",
"Ils dirent ensuite à Salih par défi : « Fais venir ce dont tu nous menaces ! » Les neuf conspirateurs jurèrent même de l'attaquer de nuit avec sa famille, mais Allah fit échouer leur ruse."]},
{h:"Le châtiment",v:"11:65-68 · 7:78-79",p:[
"Salih leur dit : « Jouissez de vos demeures pendant trois jours. C'est une promesse qui ne sera pas démentie. » Puis le Cri et un tremblement de terre les saisirent, et au matin ils gisaient sans vie dans leurs maisons. Salih se détourna d'eux en disant : « Ô mon peuple, je vous ai transmis le message de mon Seigneur et je vous ai conseillés, mais vous n'aimez pas les conseillers. »",
"Lors de l'expédition de Tabouk, le Prophète ﷺ passa près d'al-Hijr. Il interdit d'utiliser l'eau de leurs puits, sauf celui où buvait la chamelle, et ordonna de traverser ces lieux en pleurant ou de ne pas y entrer (Bukhari 3378-3381)."]}
];
PD.lut=[
{h:"Le neveu d'Ibrahim",v:"29:26 · 21:71",p:[
"Lout était le fils du frère d'Ibrahim. Il crut en lui dès le début (29:26) et émigra avec lui de l'Irak vers la terre bénie du Cham. Allah l'envoya ensuite aux habitants de Sodome et des villes voisines, près de la mer Morte."]},
{h:"Un peuple corrompu",v:"7:80-81 · 29:28-29",p:[
"Ce peuple commettait une turpitude « que personne au monde n'avait commise avant eux » : ils délaissaient les femmes pour les hommes. Ils coupaient aussi les routes et commettaient le mal ouvertement dans leurs assemblées. Lout les appela à craindre Allah et à revenir à la nature saine. Leur seule réponse : « Expulsez-les de votre cité ! Ce sont des gens qui veulent rester purs » (7:82)."]},
{h:"La visite des anges chez Ibrahim",v:"11:69-76 · 51:24-37",p:[
"Des anges, sous forme humaine, passèrent d'abord chez Ibrahim, lui annoncèrent la naissance d'Ishaq, puis l'informèrent qu'ils étaient envoyés pour détruire le peuple de Lout. Ibrahim plaida pour eux : « Lout s'y trouve ! » Ils répondirent : « Nous savons mieux qui s'y trouve. Nous le sauverons, lui et sa famille, sauf sa femme. »"]},
{h:"Les invités de Lout",v:"11:77-81 · 15:61-72",p:[
"Les anges arrivèrent chez Lout sous l'apparence de beaux jeunes hommes. Lout en fut très inquiet : « C'est un jour terrible. » Son peuple accourut vers sa maison. Lout leur dit : « Voici mes filles : elles sont plus pures pour vous. » Les commentateurs expliquent qu'il désignait les femmes de son peuple, à épouser de façon licite, car un prophète est comme le père de sa communauté. « N'y a-t-il pas parmi vous un homme sensé ? »",
"Il souhaita avoir une force pour les repousser. Les anges se révélèrent alors : « Ô Lout, nous sommes les envoyés de ton Seigneur. Ils ne parviendront pas jusqu'à toi. » Selon 54:37, Allah aveugla ceux qui voulaient entrer.",
"Le Prophète ﷺ a dit : « Qu'Allah fasse miséricorde à Lout, il cherchait refuge auprès d'un appui solide » (Bukhari 3372), c'est-à-dire Allah."]},
{h:"Le départ et le châtiment",v:"11:81-83 · 15:65-66",p:[
"Les anges ordonnèrent : « Pars avec ta famille pendant la nuit, et que personne ne se retourne, sauf ta femme : elle sera touchée par ce qui les touchera. Leur rendez-vous est le matin. Le matin n'est-il pas proche ? »",
"Au lever du soleil, le Cri les saisit. Allah renversa leur cité de fond en comble et fit pleuvoir sur eux des pierres d'argile cuite, marquées auprès de ton Seigneur. L'épouse de Lout périt avec eux : elle avait trahi son mari en soutenant son peuple (66:10), et non par une infidélité conjugale.",
"Le Coran laisse les ruines de cette région comme un signe pour ceux qui réfléchissent (15:75-77)."]}
];

// Histoires détaillées (2/4)
PD.ibrahim=[
{h:"Un jeune homme face aux idoles",v:"19:41-48 · 21:51-56",p:[
"Ibrahim naquit en Mésopotamie (région de Babylone, selon Ibn Kathir) dans un peuple qui adorait des idoles et des astres. Son père, Azar, fabriquait des idoles. Très jeune, Allah lui donna la droiture.",
"Il parla à son père avec une grande douceur, en commençant chaque phrase par « Ô mon père » : « Pourquoi adores-tu ce qui n'entend pas, ne voit pas et ne te sert à rien ? Ô mon père, il m'est venu une science qui ne t'est pas venue ; suis-moi, je te guiderai sur un chemin droit. » Son père le menaça de le lapider et le chassa. Ibrahim répondit : « Paix sur toi. Je demanderai pardon pour toi à mon Seigneur. » Il cessa plus tard de demander pardon pour lui quand il lui apparut qu'il était un ennemi d'Allah (9:114)."]},
{h:"Le raisonnement sur les astres",v:"6:74-83",p:[
