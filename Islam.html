les:["Suivre le Prophète ﷺ est la preuve de l'amour d'Allah.","L'unité des croyants autour du Coran est une obligation.","Une défaite est une leçon : l'obéissance et la sincérité sont les conditions de la victoire.","Maîtriser sa colère, pardonner et se repentir vite sont les qualités des pieux.","Méditer sur la création fait partie de l'adoration.","Allah ne laisse perdre l'œuvre de personne, homme ou femme."]};

SD[4]={ctx:"Sourate médinoise, révélée en grande partie après la bataille d'Ouhoud, quand de nombreux hommes étaient morts en laissant des veuves et des orphelins. Elle établit des règles de justice pour protéger les plus faibles de la société, en particulier les femmes et les orphelins.",
parts:[
["1","Une seule âme","« Ô gens ! Craignez votre Seigneur qui vous a créés d'une seule âme, et d'elle a créé son épouse, et des deux a fait répandre beaucoup d'hommes et de femmes. » Tous les humains sont une seule famille. Ce verset est récité dans le sermon du mariage, et rappelle les liens de parenté (al-arham)."],
["2-10","Les orphelins et la dot","Rendez aux orphelins leurs biens et ne les échangez pas contre de moins bons. Si vous craignez de ne pas être justes envers les orphelines, épousez d'autres femmes, deux, trois ou quatre ; et si vous craignez de ne pas être justes, alors une seule (v. 3). Donnez aux femmes leur dot de bon cœur. Ceux qui dévorent injustement les biens des orphelins ne font que mettre du feu dans leur ventre (v. 10)."],
["11-14","Les règles de l'héritage","Allah détaille Lui-même les parts d'héritage : les enfants, le père et la mère, les époux, les frères et sœurs. « Vos pères et vos fils, vous ne savez pas lesquels vous sont les plus utiles : c'est un ordre obligatoire venant d'Allah » (v. 11). Avant l'islam, les femmes et les enfants étaient souvent exclus de l'héritage chez les Arabes ; l'islam leur a donné des parts fixées. Ces limites sont celles d'Allah ; les respecter mène au Paradis."],
["15-28","Le mariage et ses règles","Les femmes ne doivent pas être héritées comme des biens ni maltraitées ; « comportez-vous avec elles de façon convenable ; si vous les détestez, il se peut que vous détestiez une chose où Allah a placé un grand bien » (v. 19). La liste des femmes qu'il est interdit d'épouser (mères, filles, sœurs, tantes, nièces, mères de lait…) (v. 23-24). « Allah veut vous alléger, car l'homme a été créé faible » (v. 28)."],
["29-35","Les biens et la vie de couple","Ne dévorez pas vos biens entre vous injustement, sauf par un commerce consenti, et ne vous tuez pas (v. 29). Évitez les grands péchés, et Allah effacera vos petites fautes (v. 31). Le verset 34 établit la responsabilité de l'homme dans la famille (qiwama), liée à ses dépenses, et donne les étapes pour régler un conflit conjugal ; les savants précisent que toute forme de violence blessante est interdite, et le Prophète ﷺ n'a jamais frappé une femme. En cas de grave désaccord, on désigne un arbitre de chaque famille pour réconcilier (v. 35)."],
["36-57","Les droits des gens","« Adorez Allah sans rien Lui associer, soyez bons envers vos parents, les proches, les orphelins, les pauvres, le voisin proche et le voisin lointain, le compagnon, le voyageur… » (v. 36). Allah n'aime pas l'orgueilleux, l'avare et celui qui donne pour être vu. Allah ne lèse personne du poids d'un atome (v. 40). « Allah ne pardonne pas qu'on Lui associe quoi que ce soit, et pardonne ce qui est en deçà à qui Il veut » (v. 48)."],
["58-70","Justice et obéissance","« Allah vous ordonne de rendre les dépôts à leurs ayants droit et, quand vous jugez entre les gens, de juger avec justice » (v. 58). « Obéissez à Allah, obéissez au Messager et à ceux qui détiennent l'autorité ; en cas de désaccord, ramenez-le à Allah et au Messager » (v. 59). Les hypocrites cherchent un autre jugement que celui d'Allah. « Non, par ton Seigneur ! Ils ne seront pas croyants tant qu'ils ne t'auront pas demandé de juger leurs disputes, et qu'ils n'auront éprouvé aucune gêne dans leur cœur face à ton jugement » (v. 65). Celui qui obéit à Allah et au Messager sera avec les prophètes, les véridiques, les martyrs et les vertueux (v. 69)."],
["71-104","Le combat, l'émigration et la prière en danger","Les croyants sont appelés à défendre les faibles, hommes, femmes et enfants opprimés qui crient au secours (v. 75). Le Coran démasque ceux qui ont peur du combat et rappelle que la mort atteindra tout le monde, même dans des tours fortifiées (v. 78). Rendre un salut par un meilleur salut (v. 86). La gravité du meurtre d'un croyant (v. 92-93), et l'obligation de vérifier avant de juger quelqu'un (v. 94). L'émigration pour ceux qui ne peuvent pratiquer leur religion (v. 97-100). Enfin, le raccourcissement de la prière en voyage et la façon de prier en situation de danger (v. 101-104). « La prière est, pour les croyants, une prescription à des moments déterminés » (v. 103)."],
["105-134","La justice, même contre les siens","Révélé selon Tirmidhi (3036) au sujet d'un vol à Médine : une famille musulmane accusa un innocent pour couvrir l'un des siens. Allah ordonne au Prophète ﷺ de ne pas défendre les traîtres (v. 105). Celui qui commet un mal puis demande pardon trouvera Allah Pardonneur (v. 110). Suivent des règles sur les femmes, l'équité entre épouses et la réconciliation : « la réconciliation est meilleure » (v. 128)."],
["135-152","Témoins de la justice et hypocrites","« Ô vous qui croyez, observez strictement la justice et soyez des témoins pour Allah, fût-ce contre vous-mêmes, vos parents ou vos proches » (v. 135). Les hypocrites sont décrits : ils prennent les mécréants pour alliés, se lèvent paresseusement pour la prière pour être vus, et hésitent entre les deux camps (v. 142-143). Ils seront au plus bas de l'Enfer, sauf ceux qui se repentent (v. 145-146)."],
["153-175","Les gens du Livre et 'Issa","Le Coran rappelle les manquements de certains des Enfants d'Israël et affirme que 'Issa n'a été ni tué ni crucifié : Allah l'a élevé vers Lui (v. 157-158). Allah a fait des révélations à Muhammad ﷺ comme à Nouh et aux prophètes après lui (v. 163). Aux chrétiens : « N'exagérez pas dans votre religion… le Messie, 'Issa fils de Maryam, n'est qu'un messager d'Allah, Sa parole qu'Il a lancée à Maryam et un esprit venant de Lui. Croyez en Allah et en Ses messagers et ne dites pas trois » (v. 171)."],
["176","Le défunt sans parent direct","Le dernier verset complète les règles d'héritage pour la kalala, la personne qui meurt sans père ni enfant : la part des frères et sœurs. Allah conclut : « Allah vous donne ces explications pour que vous ne vous égariez pas. »"]],
les:["Protéger les orphelins et leurs biens est une obligation grave.","L'islam a donné aux femmes des droits fixés : dot, héritage, bon traitement.","La justice doit être rendue même contre soi-même et ses proches.","La réconciliation dans le couple est meilleure que la séparation.","Le chirk est le seul péché qu'Allah ne pardonne pas si l'on meurt dessus.","La prière est fixée à des horaires précis, même en voyage et en danger."]};

// Sourates 5 à 9
SD[5]={ctx:"Sourate médinoise, parmi les dernières révélées, en grande partie lors du pèlerinage d'adieu ou peu avant. Le verset 3 (« Aujourd'hui, J'ai parachevé pour vous votre religion ») fut révélé à 'Arafat un vendredi, selon 'Umar (Bukhari 45). Elle porte le nom de la table servie demandée par les apôtres de 'Issa.",
parts:[
["1-5","Engagements, licite et religion parachevée","« Ô vous qui croyez, remplissez vos engagements » (v. 1). Les règles de la chasse en état d'ihram, le respect des rites sacrés, puis un principe : « Entraidez-vous dans la bonté et la piété, et ne vous entraidez pas dans le péché et la transgression » (v. 2). Le verset 3 énumère les viandes interdites (bête morte, sang, porc, ce qui est sacrifié pour autre qu'Allah, la bête étouffée ou assommée) et contient la phrase : « Aujourd'hui, J'ai parachevé pour vous votre religion, accompli sur vous Mon bienfait, et agréé l'islam comme religion pour vous. » La nourriture des gens du Livre et le mariage avec leurs femmes chastes sont permis (v. 5)."],
["6","Les ablutions et le tayammoum","Le verset qui décrit les ablutions : laver le visage, les mains jusqu'aux coudes, passer les mains sur la tête et laver les pieds jusqu'aux chevilles ; le grand lavage après l'état d'impureté majeure ; et le tayammoum avec de la terre propre en l'absence d'eau ou en cas de maladie. « Allah ne veut pas vous imposer de gêne, mais Il veut vous purifier. »"],
["7-11","La justice, même envers l'ennemi","« Que la haine envers un peuple ne vous pousse pas à être injustes. Soyez justes, cela est plus proche de la piété » (v. 8). La justice est due à tous, amis comme ennemis."],
["12-26","Les pactes et l'errance","Allah rappelle le pacte pris avec les Enfants d'Israël et avec les chrétiens, et leurs ruptures. Puis l'histoire de Moussa ordonnant à son peuple d'entrer en Terre sainte ; ils refusent par peur : « Va, toi et ton Seigneur, et combattez ; nous restons ici » (v. 24). Allah leur interdit cette terre pendant quarante ans d'errance."],
["27-32","Les deux fils d'Adam","Le récit du premier meurtre : l'offrande de l'un est acceptée, celle de l'autre non ; l'un tue son frère, puis voit un corbeau creuser la terre et apprend à l'enterrer. La conclusion : « Quiconque tue une âme, non pour une âme ou pour une corruption sur terre, c'est comme s'il avait tué tous les hommes. Et quiconque sauve une vie, c'est comme s'il avait sauvé tous les hommes » (v. 32)."],
["33-40","Les crimes graves et le repentir","La peine de ceux qui font la guerre à Allah et à Son Messager en semant la terreur (brigandage armé), avec la possibilité du repentir avant d'être arrêtés. Puis la peine du vol (v. 38), appliquée par l'autorité avec des conditions strictes définies par la Sunna, et la porte du repentir : « Celui qui se repent après son injustice et se réforme, Allah accepte son repentir » (v. 39)."],
["41-50","Juger selon la révélation","Allah console le Prophète ﷺ face à ceux qui se hâtent vers la mécréance. La Torah contenait guidée et lumière (v. 44) ; l'Évangile aussi (v. 46) ; et le Coran confirme et domine ce qui l'a précédé (v. 48). « Pour chacun de vous, Nous avons fait une législation et une voie… rivalisez donc dans les bonnes œuvres » (v. 48)."],
["51-86","Alliances, fidélité et dialogue","Les croyants ne doivent pas prendre pour alliés ceux qui sont hostiles à leur religion. « Allah fera venir un peuple qu'Il aime et qui L'aime, humble envers les croyants, fier envers les mécréants » (v. 54). « Ô Messager, transmets ce qui t'a été révélé » (v. 67). Le Coran critique la croyance en la divinité de 'Issa (v. 72-75) : « Le Messie fils de Maryam n'est qu'un messager… lui et sa mère mangeaient de la nourriture. » Il décrit enfin des chrétiens dont les yeux débordent de larmes en entendant le Coran (v. 82-86)."],
["87-108","Le licite, l'alcool et les serments","Ne vous interdisez pas les bonnes choses qu'Allah a rendues licites (v. 87). L'expiation du serment rompu (v. 89). L'interdiction définitive de l'alcool et des jeux de hasard : « une souillure, œuvre de Satan ; évitez-la afin de réussir » (v. 90-91) ; les compagnons versèrent alors l'alcool dans les rues de Médine. Les règles de la chasse en état d'ihram (v. 94-96), et « ne posez pas de questions sur des choses qui, si elles vous étaient révélées, vous peineraient » (v. 101). Enfin, les règles du testament avec témoins en voyage (v. 106-108)."],
["109-120","'Issa et la table servie","Au Jour du jugement, Allah rappellera à 'Issa Ses bienfaits : parler au berceau, les miracles, la protection contre les Enfants d'Israël. Les apôtres demandent une table servie descendue du ciel ; 'Issa invoque, et Allah répond qu'Il la fera descendre, mais que celui qui mécroira ensuite sera châtié sévèrement (v. 112-115). La sourate se termine par le dialogue où 'Issa désavoue ceux qui l'ont divinisé, lui et sa mère : « Je ne leur ai dit que ce que Tu m'avais ordonné : adorez Allah, mon Seigneur et votre Seigneur » (v. 116-118)."]],
les:["Respecter ses engagements et ses contrats est un ordre d'Allah.","S'entraider dans le bien, jamais dans le mal.","La justice est due même à ceux que l'on n'aime pas.","Une vie sauvée vaut toute l'humanité.","L'alcool et les jeux de hasard sont interdits.","La religion a été parachevée : il n'y a rien à y ajouter."]};

SD[6]={ctx:"Sourate mecquoise, révélée selon des rapports en une seule fois, accompagnée de nombreux anges. C'est l'une des grandes sourates de la croyance ('aqida) : elle répond point par point aux arguments des polythéistes de La Mecque et établit le tawhid par la raison et l'observation de la nature.",
parts:[
["1-11","Le Créateur","« Louange à Allah qui a créé les cieux et la terre et établi les ténèbres et la lumière » (v. 1). C'est Lui qui a créé l'homme d'argile et fixé un terme à sa vie. Pourtant, les mécréants Lui donnent des égaux et se détournent de chaque signe. « Parcourez la terre et voyez quelle a été la fin de ceux qui ont démenti » (v. 11)."],
["12-32","À qui appartient tout ?","Allah s'est prescrit la miséricorde (v. 12). « Si Allah fait qu'un mal te touche, nul autre que Lui ne peut l'écarter » (v. 17). Au Jour du jugement, les polythéistes nieront avoir associé quoi que ce soit, et voudront revenir sur terre pour croire. « La vie de ce monde n'est que jeu et amusement ; la demeure dernière est meilleure pour ceux qui craignent Allah » (v. 32)."],
["33-58","Consolation et appel","Allah console le Prophète ﷺ : les messagers avant lui ont été démentis et ont patienté. Il n'y a pas d'animal sur terre ni d'oiseau qui ne forme une communauté comme vous (v. 38). Ne repousse pas les croyants pauvres qui invoquent leur Seigneur matin et soir (v. 52) : les notables voulaient que le Prophète ﷺ éloigne les faibles pour les écouter. « Quand viennent à toi ceux qui croient en Nos versets, dis : paix sur vous ; votre Seigneur s'est prescrit la miséricorde » (v. 54)."],
["59-73","Les clés de l'invisible","« C'est Lui qui détient les clés de l'invisible ; nul autre que Lui ne les connaît. Il sait ce qui est sur la terre et dans la mer. Pas une feuille ne tombe sans qu'Il le sache » (v. 59). Il vous reprend la nuit pendant le sommeil et sait ce que vous avez fait le jour (v. 60). Seul Allah sauve des ténèbres de la terre et de la mer."],
["74-90","Ibrahim et les prophètes","Ibrahim reproche à son père Azar d'adorer des idoles. Allah lui montre le royaume des cieux et de la terre. Il raisonne sur l'étoile, la lune et le soleil qui disparaissent, pour montrer à son peuple qu'ils ne peuvent être des divinités, et conclut : « Je tourne mon visage vers Celui qui a créé les cieux et la terre » (v. 79). Puis une liste de dix-huit prophètes de sa descendance et d'autres : Ishaq, Ya'qub, Nouh, Daoud, Soulayman, Ayyoub, Yousouf, Moussa, Haroun, Zakariyya, Yahya, 'Issa, Ilyas, Isma'il, al-Yasa', Younous, Lout. « Voilà ceux qu'Allah a guidés : suis donc leur guidée » (v. 90)."],
["91-117","Les signes dans la nature","Allah fend le grain et le noyau, fait sortir le vivant du mort, a fait de la nuit un repos, du soleil et de la lune un calcul, des étoiles des repères (v. 95-97). Il fait descendre l'eau qui fait pousser toutes sortes de plantes, de palmiers, de vignes, d'oliviers et de grenadiers : « Regardez leurs fruits quand ils se forment et mûrissent » (v. 99). « Les regards ne L'atteignent pas » (v. 103). « N'insultez pas ceux qu'ils invoquent en dehors d'Allah, car ils insulteraient Allah par ignorance » (v. 108)."],
["118-150","Les superstitions sur les animaux","Mangez de ce sur quoi le nom d'Allah a été prononcé (v. 118). Puis une critique détaillée des superstitions des Arabes : ils réservaient une part des récoltes et des bêtes aux idoles, interdisaient certaines bêtes à certaines personnes, tuaient leurs enfants par sottise (v. 136-140). Allah a créé les jardins, les palmiers et les troupeaux : « Mangez de leurs fruits et donnez-en le dû le jour de la récolte, et ne gaspillez pas » (v. 141). Le passage explique pourquoi la sourate s'appelle « les Bestiaux »."],
["151-153","Les dix recommandations","« Dis : venez, je vais vous réciter ce que votre Seigneur vous a interdit : ne Lui associez rien ; soyez bons envers vos parents ; ne tuez pas vos enfants par peur de la pauvreté, c'est Nous qui vous nourrissons ainsi qu'eux ; n'approchez pas des turpitudes, apparentes ou cachées ; ne tuez pas la vie qu'Allah a rendue sacrée, sauf par droit ; n'approchez des biens de l'orphelin que de la meilleure façon ; donnez la juste mesure et le bon poids ; quand vous parlez, soyez justes, même envers un proche ; remplissez votre engagement envers Allah. » Et : « Voici Mon chemin droit, suivez-le, et ne suivez pas les sentiers qui vous écartent de Son chemin » (v. 153). Ibn Mas'oud a dit que ces versets sont comme le testament scellé du Prophète ﷺ."],
["154-165","La conclusion","Le Coran est un livre béni : suivez-le (v. 155). « Celui qui vient avec une bonne action en aura dix fois autant ; celui qui vient avec une mauvaise ne sera rétribué que par son équivalent » (v. 160). « Dis : ma prière, mes actes de dévotion, ma vie et ma mort appartiennent à Allah, Seigneur des mondes » (v. 162). Personne ne portera le fardeau d'un autre (v. 164)."]],
les:["L'observation de la nature mène au tawhid.","Seul Allah connaît l'invisible ; pas une feuille ne tombe sans qu'Il le sache.","Ne pas repousser les pauvres pour plaire aux puissants.","Ne pas insulter ce que les autres adorent, pour qu'ils n'insultent pas Allah.","Les dix recommandations résument la morale de l'islam.","Toute la vie, la prière comme la mort, doit être pour Allah."]};

SD[7]={ctx:"Sourate mecquoise, la plus longue des sourates mecquoises. Elle présente l'histoire de l'humanité comme une lutte entre la guidée et l'égarement, depuis Adam jusqu'à Moussa, à travers six prophètes. Le Prophète ﷺ la récita entièrement dans les deux unités de la prière du Maghrib (Bukhari 764).",
parts:[
["1-10","Le Livre et l'avertissement","Le Coran est descendu pour avertir ; qu'il n'y ait aucune gêne dans la poitrine du Prophète ﷺ à son sujet. « Suivez ce qui vous a été révélé de votre Seigneur » (v. 3). Combien de cités Allah a détruites ! La pesée des actes, ce jour-là, sera la vérité (v. 8)."],
["11-25","Adam, Iblis et la sortie du Paradis","Le récit le plus détaillé du refus d'Iblis : « Je suis meilleur que lui ; Tu m'as créé de feu et Tu l'as créé d'argile » (v. 12). Iblis jure d'attaquer les humains par devant, par derrière, par la droite et par la gauche (v. 16-17). Adam et son épouse mangent de l'arbre, leur nudité leur apparaît, et ils se repentent : « Notre Seigneur, nous nous sommes fait du tort ; si Tu ne nous pardonnes pas et ne nous fais pas miséricorde, nous serons parmi les perdants » (v. 23)."],
["26-58","Le vêtement, la parure et l'au-delà","« Ô enfants d'Adam, Nous avons fait descendre pour vous un vêtement pour cacher votre nudité et une parure ; mais le vêtement de la piété, voilà qui est meilleur » (v. 26). Les Arabes faisaient la circumambulation nus ; Allah ordonne : « Prenez votre parure en tout lieu de prière ; mangez et buvez, mais ne gaspillez pas » (v. 31). Puis des scènes de l'au-delà : le dialogue entre les gens du Paradis et ceux de l'Enfer, et les gens d'al-A'raf, sur les hauteurs entre les deux, dont les bonnes et mauvaises œuvres sont égales (v. 46-49). « Invoquez votre Seigneur avec humilité et en secret » (v. 55)."],
["59-64","Nouh","Nouh appelle son peuple à adorer Allah seul. Les notables le traitent d'égaré. Il répond qu'il est un messager qui transmet et conseille. Ils le démentent ; Allah le sauve dans l'arche et noie les autres."],
["65-72","Houd","Houd est envoyé à 'Ad, à qui Allah a donné force et taille. Il leur rappelle qu'ils ont succédé au peuple de Nouh. Ils l'accusent de sottise et refusent d'abandonner les divinités de leurs ancêtres. Allah les détruit."],
["73-79","Salih","Salih est envoyé à Thamoud avec la chamelle comme signe. Les orgueilleux la tuent et défient Salih ; le tremblement les saisit. Salih se détourne d'eux en disant : « Je vous ai conseillés, mais vous n'aimez pas les conseillers » (v. 79)."],
["80-84","Lout","Lout reproche à son peuple une turpitude que personne n'avait commise avant eux. Leur seule réponse : « Chassez-les de votre cité, ce sont des gens qui se veulent purs » (v. 82). Allah le sauve avec sa famille, sauf sa femme, et fait pleuvoir sur eux une pluie de pierres."],
["85-102","Chou'ayb et la loi des peuples","Chou'ayb appelle Madyan au tawhid et à l'honnêteté dans les poids et mesures. Les notables menacent de l'expulser s'il ne revient pas à leur religion. Le tremblement les saisit. Puis une leçon générale : Allah éprouve les peuples par la détresse pour qu'ils s'humilient, puis par l'aisance ; « si les gens des cités avaient cru et craint Allah, Nous leur aurions ouvert les bénédictions du ciel et de la terre » (v. 96)."],
["103-171","Moussa : de Pharaon au sabbat","Le plus long récit de Moussa dans le Coran. Moussa face à Pharaon avec le bâton et la main ; le duel avec les magiciens, qui croient et restent fermes malgré les menaces (v. 103-126) ; les fléaux envoyés sur l'Égypte (inondation, sauterelles, poux, grenouilles, sang) (v. 133) ; la mer et la noyade de Pharaon.\nPuis les quarante nuits au mont Tour, la demande de Moussa de voir Allah et la montagne pulvérisée (v. 143), les Tablettes, le veau d'or et la colère de Moussa contre Haroun (v. 148-154). Au milieu, l'annonce du « prophète illettré » que les gens du Livre trouvent mentionné dans la Torah et l'Évangile (v. 157) : « Dis : ô gens, je suis le Messager d'Allah envoyé vers vous tous » (v. 158). Enfin, les gens de la cité au bord de la mer qui contournaient l'interdiction de pêcher le samedi, transformés en singes (v. 163-166)."],
["172-174","Le pacte primordial","« Quand ton Seigneur tira une descendance des reins des fils d'Adam et les fit témoigner sur eux-mêmes : Ne suis-Je pas votre Seigneur ? Ils répondirent : Si, nous en témoignons » (v. 172). Selon les savants, cette connaissance d'Allah est inscrite dans la nature de chaque être humain (la fitra)."],
["175-206","La conclusion","L'exemple de celui qui avait reçu les signes d'Allah puis s'en est détaché, comparé au chien qui halète (v. 175-176). Beaucoup de djinns et d'humains ont des cœurs qui ne comprennent pas et des yeux qui ne voient pas (v. 179). « À Allah les plus beaux noms ; invoquez-Le par eux » (v. 180). Personne ne connaît la date de l'Heure (v. 187). « Pratique le pardon, ordonne le bien et détourne-toi des ignorants » (v. 199). Quand le Coran est récité, écoutez-le attentivement (v. 204). Dernier verset avec une prosternation de récitation."]],
les:["L'orgueil d'Iblis est le premier péché ; l'humilité et le repentir d'Adam sont le modèle à suivre.","Le meilleur vêtement est celui de la piété.","Tous les prophètes ont apporté le même message : adorez Allah seul.","La foi et la piété d'un peuple attirent les bénédictions.","Contourner une interdiction par des ruses reste une désobéissance.","Pardonner, ordonner le bien et ignorer les ignorants."]};

SD[8]={ctx:"Sourate médinoise révélée après la bataille de Badr (17 Ramadan, an 2), la première grande bataille de l'islam, que le Coran appelle « le jour du discernement » (8:41). Environ 313 musulmans mal équipés y affrontèrent près de 1 000 Mecquois. Après la victoire, une discussion eut lieu sur le partage du butin ; la sourate commence par répondre à cette question.",
parts:[
["1-4","Le butin appartient à Allah","« Ils t'interrogent sur le butin. Dis : le butin est à Allah et au Messager. Craignez Allah et réconciliez-vous. » Puis les qualités des vrais croyants : leur cœur frémit quand on mentionne Allah, leur foi augmente quand on leur récite Ses versets, ils placent leur confiance en Lui, accomplissent la prière et dépensent de ce qu'Il leur a donné."],
["5-19","La bataille de Badr","Certains croyants n'avaient pas voulu sortir : ils espéraient intercepter la caravane commerciale sans combat, mais Allah voulait faire triompher la vérité. Ils implorèrent le secours de leur Seigneur, et Il leur envoya mille anges (v. 9). Allah fit tomber sur eux une somnolence apaisante et une pluie qui affermit leurs pieds dans le sable (v. 11). « Ce n'est pas toi qui as lancé quand tu as lancé, c'est Allah qui a lancé » (v. 17) : la poignée de sable lancée par le Prophète ﷺ vers l'ennemi."],
["20-40","Obéir et ne pas trahir","« Répondez à Allah et au Messager quand il vous appelle à ce qui vous donne la vie » (v. 24). Ne trahissez pas Allah et le Messager, ni vos dépôts (v. 27). Vos biens et vos enfants sont une épreuve. « Si vous craignez Allah, Il vous donnera un discernement » (v. 29). Allah rappelle le complot des Mecquois pour emprisonner, tuer ou expulser le Prophète ﷺ avant l'Hégire : « Ils rusent, et Allah ruse, et Allah est le meilleur des stratèges » (v. 30)."],
["41-54","Le partage du butin et le récit de la bataille","Le cinquième du butin revient à Allah et au Messager, aux proches, aux orphelins, aux pauvres et aux voyageurs (v. 41). Allah fit paraître les ennemis peu nombreux aux yeux des croyants, et inversement, pour que la bataille ait lieu (v. 44). « Obéissez à Allah et à Son Messager, ne vous disputez pas, sinon vous fléchirez et perdrez votre force ; soyez patients » (v. 46). Satan avait encouragé les Mecquois, puis les abandonna."],
["55-63","Traités et paix","Les règles des traités : en cas de trahison avérée, on dénonce le traité ouvertement. Préparez la force pour dissuader l'ennemi (v. 60). « Et s'ils inclinent à la paix, incline vers elle aussi et place ta confiance en Allah » (v. 61). C'est Allah qui a uni les cœurs des croyants, ce que tout l'or de la terre n'aurait pu faire (v. 63)."],
["64-75","Les captifs et la fraternité","La question des prisonniers de Badr, pour lesquels on accepta une rançon (v. 67-71). La sourate se termine par les liens entre les émigrés (mouhajiroun) et les Ansar de Médine, qui les ont accueillis : « Ceux-là sont les vrais croyants, ils auront un pardon et une subsistance généreuse » (v. 74)."]],
les:["La victoire vient d'Allah, pas du nombre ni des armes.","Les disputes internes font perdre la force d'une communauté.","La paix est préférable quand l'ennemi y est sincèrement disposé.","Les cœurs unis sont un don d'Allah que l'argent ne peut acheter.","Les biens et les enfants sont une épreuve."]};

SD[9]={ctx:"Sourate médinoise, parmi les dernières révélées (an 9). C'est la seule sourate qui ne commence pas par « Bismillah ». 'Ali expliqua que la basmala est une sécurité, alors que cette sourate commence par une déclaration de rupture ; 'Uthman expliqua qu'on ne savait pas si elle était une suite d'al-Anfal (Tirmidhi 3086). Elle porte aussi le nom d'al-Bara'a (le désaveu). Elle traite de la rupture des traités violés par les polythéistes, de l'expédition de Tabouk contre l'armée byzantine (an 9), et démasque longuement les hypocrites.",
parts:[
["1-16","La proclamation","Une proclamation lue publiquement lors du pèlerinage de l'an 9 : les polythéistes qui avaient violé leurs traités ont quatre mois de sécurité. Ceux qui ont respecté leurs traités les voient respectés jusqu'à leur terme (v. 4). Si un polythéiste demande protection, accorde-la-lui pour qu'il entende la parole d'Allah, puis conduis-le en lieu sûr (v. 6). Il s'agissait de ceux qui avaient rompu leurs pactes et attaqué les premiers (v. 13)."],
["17-28","Les mosquées et l'amour d'Allah","Ne peuplent les mosquées d'Allah que ceux qui croient en Allah et au Jour dernier, accomplissent la prière et donnent la zakat (v. 18). Si vos pères, vos fils, vos frères, vos épouses, votre clan, vos biens, votre commerce et vos demeures vous sont plus chers qu'Allah, Son Messager et l'effort dans Sa voie, attendez (v. 24). Le rappel de Hounayn, où le grand nombre des musulmans ne leur servit à rien au début (v. 25-26)."],
["29-37","Les gens du Livre et les mois sacrés","Les règles concernant les gens du Livre qui combattaient l'État musulman, et la jizya. Le Coran critique ceux qui prenaient leurs rabbins et moines pour seigneurs en suivant leurs avis contre la loi d'Allah (v. 31), et ceux qui thésaurisent l'or et l'argent sans en donner le dû (v. 34-35). Le nombre des mois est de douze, dont quatre sacrés (v. 36)."],
["38-72","L'expédition de Tabouk","Une expédition lointaine, dans une chaleur extrême, au moment de la récolte des dattes. « Qu'avez-vous, quand on vous dit de sortir dans le sentier d'Allah, à rester attachés à la terre ? » (v. 38). Allah rappelle comment Il a secouru le Prophète ﷺ dans la grotte : « Ne t'attriste pas, Allah est avec nous » (v. 40). Les hypocrites inventèrent des excuses : la chaleur, la peur de la tentation. Le verset 60 fixe les huit catégories de bénéficiaires de la zakat : les pauvres, les nécessiteux, ceux qui la collectent, ceux dont on veut gagner les cœurs, l'affranchissement des esclaves, les endettés, la voie d'Allah et le voyageur. Les croyants et les croyantes sont alliés les uns des autres : ils ordonnent le bien et interdisent le mal (v. 71)."],
["73-110","Les hypocrites démasqués","Portraits des hypocrites : ceux qui se moquent de ceux qui donnent peu parce qu'ils n'ont que peu (v. 79), ceux qui se réjouissent d'être restés en arrière (v. 81), les Bédouins hypocrites. Il est interdit au Prophète ﷺ de prier sur eux (v. 84). Puis la mosquée ad-Dirar, construite par des hypocrites pour nuire et diviser ; Allah interdit au Prophète ﷺ d'y prier et lui préfère la mosquée fondée sur la piété dès le premier jour (Qouba') (v. 107-108)."],
["111-118","Le marché et les trois compagnons","« Allah a acheté aux croyants leurs personnes et leurs biens en échange du Paradis » (v. 111). Les qualités de ces croyants : ceux qui se repentent, adorent, louent, jeûnent, s'inclinent, se prosternent (v. 112). Le repentir de trois compagnons restés en arrière sans excuse (Ka'b ibn Malik et deux autres) : ils avouèrent leur faute au lieu de mentir, furent mis à l'écart cinquante jours, la terre leur parut étroite, puis Allah accepta leur repentir (v. 117-118 ; récit complet dans Bukhari 4418). C'est de cet épisode que vient le nom « le Repentir »."],
["119-129","La conclusion","« Ô vous qui croyez, craignez Allah et soyez avec les véridiques » (v. 119), conclusion de l'histoire de Ka'b, sauvé par sa sincérité. Il ne faut pas que tous les croyants partent au combat : un groupe doit rester pour étudier la religion et enseigner (v. 122). Les deux derniers versets décrivent le Prophète ﷺ : « Un messager de parmi vous est venu à vous ; vos souffrances lui pèsent, il est plein de sollicitude pour vous, compatissant et miséricordieux envers les croyants » (v. 128)."]],
les:["La sincérité sauve : Ka'b a dit la vérité et Allah a accepté son repentir.","Rien ne doit être plus cher que l'amour d'Allah et de Son Messager.","La zakat a huit catégories précises de bénéficiaires.","L'hypocrisie se révèle dans les moments difficiles.","Il faut toujours un groupe qui étudie la religion pour l'enseigner aux autres.","Même dans une sourate de guerre, les pactes respectés doivent être honorés."]};

// Sourates 10 à 17
SD[10]={ctx:"Sourate mecquoise, révélée dans la période des grandes résistances de Qouraych. Les polythéistes s'étonnaient qu'Allah choisisse un homme d'entre eux comme messager et demandaient des miracles. La sourate répond en montrant les signes d'Allah dans l'univers et en racontant l'histoire de Nouh, de Moussa et du peuple de Younous.",
parts:[
["1-10","La révélation et les signes","Les gens s'étonnent qu'Allah ait inspiré un homme d'entre eux pour avertir. Pourtant, Allah a créé les cieux et la terre en six jours, fait du soleil une clarté et de la lune une lumière, avec des phases pour compter les années (v. 5). Ceux qui n'espèrent pas Le rencontrer se contentent de ce monde ; les croyants seront guidés grâce à leur foi, et leur invocation au Paradis sera : « Gloire à Toi, ô Allah », leur salutation « Paix », et leur dernière invocation « Louange à Allah, Seigneur des mondes » (v. 10)."],
["11-25","L'homme dans la détresse et l'aisance","Quand un malheur touche l'homme, il invoque Allah couché, assis ou debout ; quand Allah l'en délivre, il passe son chemin comme s'il n'avait rien demandé (v. 12). Sur un bateau pris dans la tempête, ils invoquent Allah sincèrement, puis une fois sauvés, ils retournent à leur injustice (v. 22-23). La vie de ce monde est comparée à une pluie qui fait pousser une végétation magnifique, puis tout est rasé en une nuit (v. 24). « Allah appelle à la Demeure de la paix » (v. 25)."],
["26-36","Le bien pour ceux qui font le bien","« Pour ceux qui font le bien, la meilleure récompense et davantage » (v. 26) : le Prophète ﷺ a expliqué que « davantage » est la vision du visage d'Allah au Paradis (Muslim 181). Puis des questions aux polythéistes : qui vous nourrit du ciel et de la terre ? Qui fait sortir le vivant du mort ? Ils diront : Allah. Alors pourquoi ne Le craignez-vous pas ? (v. 31)."],
["37-56","Le défi du Coran","Le Coran ne peut pas avoir été inventé : « Produisez une sourate semblable et appelez qui vous pouvez en dehors d'Allah » (v. 38). Chaque communauté a un messager, et elle sera jugée avec justice (v. 47). Les mécréants demandent quand viendra le châtiment ; quand il viendra, il sera trop tard pour croire."],
["57-70","Le Coran, guérison des cœurs","« Ô gens, une exhortation vous est venue de votre Seigneur, une guérison pour ce qui est dans les poitrines, une guidée et une miséricorde » (v. 57). « Qu'ils se réjouissent de la grâce d'Allah et de Sa miséricorde : cela vaut mieux que ce qu'ils amassent » (v. 58). « Les alliés d'Allah n'auront rien à craindre et ne seront pas affligés : ceux qui croient et craignent Allah » (v. 62-63)."],
["71-93","Nouh et Moussa","Nouh défie son peuple de lui nuire en plaçant sa confiance en Allah. Puis Moussa et Haroun face à Pharaon : le duel avec les magiciens, la foi de quelques jeunes du peuple de Moussa malgré la peur, l'ordre de faire des maisons des lieux de prière (v. 87), l'invocation de Moussa contre Pharaon, et la traversée de la mer. Au moment de se noyer, Pharaon dit : « Je crois qu'il n'y a de divinité que Celui en qui ont cru les Enfants d'Israël. » « Maintenant ? Alors qu'auparavant tu as désobéi ? Aujourd'hui, Nous allons sauver ton corps pour que tu sois un signe pour ceux qui viendront après toi » (v. 90-92)."],
["94-109","Le peuple de Younous et la liberté de croire","Le seul peuple dont la foi, au dernier moment, a été utile : le peuple de Younous, qui crut en voyant venir le châtiment, et Allah le leva (v. 98). « Si ton Seigneur l'avait voulu, tous ceux qui sont sur terre auraient cru. Est-ce à toi de contraindre les gens à devenir croyants ? » (v. 99). La sourate se termine par l'ordre de patienter jusqu'à ce qu'Allah juge (v. 109)."]],
les:["Ne pas se souvenir d'Allah seulement dans la détresse.","La plus grande récompense du Paradis est de voir Allah.","Le Coran est une guérison pour les cœurs.","La foi doit venir avant qu'il soit trop tard, pas au moment de la mort.","Personne ne peut être forcé à croire."]};

SD[11]={ctx:"Sourate mecquoise révélée dans l'une des périodes les plus dures pour le Prophète ﷺ, probablement autour de l'année de la tristesse. Elle raconte sept prophètes face à leurs peuples pour le consoler et l'affermir. Abou Bakr dit au Prophète ﷺ : « Tu as blanchi ! » Il répondit : « Houd et ses sœurs m'ont fait blanchir » (Tirmidhi 3297), à cause de la gravité de leurs avertissements, notamment l'ordre « Sois droit comme il t'a été ordonné ».",
parts:[
["1-24","Le Livre et les deux catégories","Un livre dont les versets sont parfaits puis détaillés : n'adorez qu'Allah et demandez-Lui pardon. Allah connaît ce que les gens cachent, même quand ils s'enveloppent de leurs vêtements. « Il n'y a pas de bête sur terre dont la subsistance n'incombe à Allah » (v. 6). L'homme désespère quand on lui retire un bienfait et devient arrogant quand on le lui rend, sauf ceux qui patientent et font le bien (v. 9-11)."],
["25-49","Nouh et l'arche","Le récit le plus détaillé de Nouh : le refus des notables qui méprisent ses suiveurs pauvres, son refus de les chasser, la construction de l'arche sous les moqueries, le déluge, l'appel à son fils qui refuse de monter et se noie, puis l'invocation de Nouh pour son fils et la réponse d'Allah : « Il ne fait pas partie de ta famille, car il a commis un acte non vertueux » (v. 46). L'arche se pose sur le mont Joudi."],
["50-60","Houd et 'Ad","Houd appelle son peuple : « Demandez pardon à votre Seigneur, puis repentez-vous : Il enverra du ciel une pluie abondante et ajoutera force à votre force » (v. 52). Il les défie de lui nuire tous ensemble, en plaçant sa confiance en Allah (v. 54-56). Ils sont détruits, et Houd est sauvé avec les croyants."],
["61-68","Salih et Thamoud","Salih rappelle à Thamoud qu'Allah les a fait naître de la terre et qu'Il est proche et répond. La chamelle leur est donnée comme signe ; ils la tuent, et le Cri les saisit après trois jours."],
["69-83","Ibrahim et Lout","Les anges visitent Ibrahim, qui leur sert un veau rôti, et annoncent à Sara la naissance d'Ishaq puis de Ya'qub. Ibrahim plaide pour le peuple de Lout. Puis les anges chez Lout, l'assaut de son peuple, et la destruction de la ville renversée sous une pluie de pierres."],
["84-95","Chou'ayb et Madyan","Chou'ayb appelle à la justice dans les poids et mesures : « Je ne veux que la réforme, autant que je le peux. Ma réussite ne dépend que d'Allah » (v. 88). Son peuple dit : « Sans ton clan, nous t'aurions lapidé. » Le Cri les saisit."],
["96-123","Les leçons et la droiture","Après un rappel de Moussa et de Pharaon, qui conduira son peuple vers l'Enfer, la sourate tire les leçons : Allah n'a pas été injuste envers ces peuples, ce sont eux qui l'ont été envers eux-mêmes (v. 101). « Sois droit comme il t'a été ordonné, toi et ceux qui se repentent avec toi » (v. 112). « Accomplis la prière aux deux extrémités du jour et à certaines heures de la nuit : les bonnes actions effacent les mauvaises » (v. 114). Le récit des messagers sert à affermir le cœur du Prophète ﷺ (v. 120)."]],
les:["La droiture (istiqama) est le plus grand défi du croyant.","Demander pardon attire les bienfaits d'Allah.","Les bonnes actions effacent les mauvaises.","Le lien de la foi passe avant celui du sang.","Les récits des prophètes affermissent le cœur dans les épreuves."]};

SD[12]={ctx:"Sourate mecquoise révélée vers la fin de la période mecquoise, pendant l'année de la tristesse (mort de Khadija et d'Abou Talib), pour consoler le Prophète ﷺ. Selon des commentateurs, des Juifs avaient demandé aux Qouraychites de l'interroger sur l'histoire de Yousouf, qui était peu connue des Arabes. C'est la seule sourate qui raconte une histoire complète du début à la fin. Allah l'appelle « la plus belle des histoires » (v. 3). Pour le récit détaillé chapitre par chapitre, voir aussi l'histoire de Yousouf dans la section Prophètes.",
parts:[
["1-6","Le rêve","Le Coran est en langue arabe pour être compris. Yousouf voit en rêve onze astres, le soleil et la lune se prosterner devant lui. Ya'qub lui conseille de ne pas le raconter à ses frères, car Satan est un ennemi déclaré de l'homme."],
["7-20","La jalousie et le puits","Les frères complotent par jalousie, jettent Yousouf dans le puits et rapportent sa chemise tachée de faux sang. Ya'qub répond : « Belle patience ! » Une caravane le retire du puits et le vend pour quelques dirhams."],
["21-34","La maison d'al-'Aziz","Al-'Aziz l'achète et le traite honorablement. Sa femme tente de le séduire ; il refuse : « Qu'Allah me protège ! » La chemise déchirée par derrière prouve son innocence. Les femmes de la ville se coupent les mains en le voyant. Yousouf préfère la prison au péché."],
["35-42","La prison","Innocent, il est emprisonné. Il appelle ses deux codétenus au tawhid avant d'interpréter leurs rêves : « Des seigneurs multiples valent-ils mieux qu'Allah, l'Unique, le Dominateur ? » (v. 39). Celui qui est libéré oublie de parler de lui au roi."],
["43-57","Le rêve du roi et la libération","Le roi voit sept vaches grasses mangées par sept maigres. Yousouf interprète et donne la solution : sept années d'abondance à stocker, sept de famine. Il refuse de sortir avant que son innocence soit reconnue ; la femme d'al-'Aziz avoue. Il devient responsable des réserves du pays."],
["58-82","Les frères en Égypte","La famine amène les frères à venir chercher du blé. Yousouf les reconnaît sans être reconnu. Il exige qu'ils reviennent avec Binyamin, puis place la coupe du roi dans son sac pour le garder auprès de lui."],
["83-101","Les retrouvailles","Ya'qub perd la vue de chagrin mais dit : « Je ne me plains qu'à Allah » et « Ne désespérez pas de la miséricorde d'Allah » (v. 86-87). Yousouf se fait connaître et pardonne : « Pas de reproche contre vous aujourd'hui » (v. 92). Sa chemise rend la vue à son père. Toute la famille vient en Égypte et se prosterne : le rêve est réalisé. Yousouf invoque : « Fais-moi mourir soumis et fais-moi rejoindre les vertueux » (v. 101)."],
["102-111","La leçon","Le Prophète ﷺ ne pouvait connaître ces détails : c'est une révélation. La plupart des gens ne croient pas même s'il le désire ardemment. « Dans leurs récits, il y a une leçon pour les gens doués d'intelligence » (v. 111)."]],
les:["La jalousie peut pousser à de grands crimes, même entre frères.","La chasteté face à la tentation, quel qu'en soit le prix.","Chaque épreuve peut être une étape vers l'honneur.","Ne jamais désespérer de la miséricorde d'Allah.","Pardonner quand on a le pouvoir de se venger."]};

SD[13]={ctx:"Sourate médinoise selon le Mushaf de Médine, mais son style et ses thèmes ressemblent beaucoup aux sourates mecquoises, et de nombreux savants la considèrent comme mecquoise. Elle présente les signes d'Allah dans la nature et décrit la différence entre les gens de la vérité et ceux du mensonge.",
parts:[
["1-4","Les signes dans les cieux et la terre","Allah a élevé les cieux sans piliers visibles, soumis le soleil et la lune, étendu la terre, placé les montagnes et les fleuves. Sur la terre, des parcelles voisines sont arrosées de la même eau, mais donnent des fruits différents (v. 4) : un signe pour ceux qui raisonnent."],
["5-18","La science et la puissance d'Allah","Allah sait ce que porte chaque femelle. Chaque personne a des anges qui se relaient pour la protéger par ordre d'Allah. « Allah ne change pas l'état d'un peuple tant qu'ils ne changent pas ce qui est en eux-mêmes » (v. 11). Le tonnerre glorifie Allah par Sa louange (v. 13). Parabole : la pluie remplit les vallées et produit une écume qui disparaît, comme le métal fondu ; ce qui est utile aux gens demeure sur terre (v. 17). Ainsi le mensonge passe et la vérité reste."],
["19-29","Les gens doués d'intelligence","Ceux qui tiennent leurs engagements, maintiennent les liens qu'Allah a ordonné de maintenir, craignent leur Seigneur, patientent pour Son visage, accomplissent la prière, dépensent en secret et en public, et repoussent le mal par le bien (v. 19-22). Les anges entreront chez eux au Paradis : « Paix sur vous pour ce que vous avez enduré » (v. 24). « C'est par le rappel d'Allah que les cœurs s'apaisent » (v. 28)."],
["30-43","Le rôle du Messager","Même si un Coran faisait bouger les montagnes, les mécréants ne croiraient pas. Les messagers avant lui ont été moqués. Le Prophète ﷺ n'a qu'à transmettre ; le jugement appartient à Allah. Allah efface ce qu'Il veut et confirme ce qu'Il veut, et auprès de Lui est la Mère du Livre (v. 39)."]],
les:["Le changement d'une société commence par le changement intérieur des individus.","La vérité demeure, le mensonge passe comme l'écume.","Le rappel d'Allah apaise les cœurs.","Maintenir les liens familiaux et repousser le mal par le bien."]};

SD[14]={ctx:"Sourate mecquoise, de la fin de la période de La Mecque. Elle présente la mission des messagers comme une sortie des ténèbres vers la lumière, et contient l'invocation d'Ibrahim pour La Mecque.",
parts:[
["1-12","Des ténèbres à la lumière","Le Coran a été révélé pour faire sortir les gens des ténèbres vers la lumière (v. 1). Chaque messager a été envoyé dans la langue de son peuple. Moussa rappela à son peuple les bienfaits d'Allah : « Si vous êtes reconnaissants, J'augmenterai Mes bienfaits pour vous ; si vous êtes ingrats, Mon châtiment est sévère » (v. 7). Les messagers répondirent aux menaces de leurs peuples : « Pourquoi ne placerions-nous pas notre confiance en Allah, alors qu'Il nous a guidés ? » (v. 12)."],
["13-21","Les menaces et la fin des oppresseurs","Les mécréants menacent d'expulser les messagers ; Allah promet de les remplacer sur la terre par les croyants. Les actions des mécréants sont comme des cendres emportées par le vent un jour de tempête (v. 18)."],
["22-23","Le discours de Satan","Au Jour du jugement, Satan dira à ses suiveurs : « Allah vous avait fait une promesse vraie ; moi, je vous ai fait une promesse que je n'ai pas tenue. Je n'avais aucun pouvoir sur vous, je n'ai fait que vous appeler et vous m'avez répondu. Ne me blâmez pas, blâmez-vous vous-mêmes » (v. 22). Chacun est responsable de ses choix."],
["24-27","Les deux arbres","« Une bonne parole est comme un bel arbre dont la racine est ferme et la ramure dans le ciel ; il donne ses fruits en toute saison » (v. 24-25). La bonne parole est la chahada, « la ilaha illa Allah ». La mauvaise parole est comme un arbre arraché, sans stabilité. « Allah affermit les croyants par la parole ferme dans ce monde et dans l'au-delà » (v. 27) : le Prophète ﷺ a dit que ce verset concerne l'interrogatoire dans la tombe (Bukhari 1369)."],
["28-34","Les bienfaits innombrables","Ceux qui ont échangé le bienfait d'Allah contre l'ingratitude. Allah a créé le ciel et la terre, fait descendre la pluie, soumis les bateaux, les fleuves, le soleil, la lune, la nuit et le jour. « Si vous comptiez les bienfaits d'Allah, vous ne pourriez les dénombrer » (v. 34)."],
["35-41","L'invocation d'Ibrahim","« Seigneur, fais de cette cité un lieu sûr, et préserve-moi, moi et mes enfants, de l'adoration des idoles… Seigneur, j'ai établi une partie de ma descendance dans une vallée sans culture, près de Ta Maison sacrée, pour qu'ils accomplissent la prière ; fais que les cœurs de certains gens se penchent vers eux… Seigneur, fais de moi quelqu'un qui accomplit la prière, ainsi que ma descendance… Notre Seigneur, pardonne-moi, ainsi qu'à mes parents et aux croyants, le jour où se dressera le jugement » (v. 35-41)."],
["42-52","Allah n'est pas inattentif","« Ne pense pas qu'Allah soit inattentif à ce que font les injustes ; Il leur accorde un délai jusqu'au jour où les regards se figeront » (v. 42). Le jour où la terre sera remplacée par une autre terre (v. 48). Le Coran est un message pour les gens."]],
les:["La gratitude augmente les bienfaits.","La chahada est comme un arbre solide qui porte ses fruits toute l'année.","Satan n'a pas de pouvoir sur nous : il ne fait qu'appeler.","Invoquer Allah pour soi, ses parents et sa descendance, comme Ibrahim.","Allah donne un délai aux injustes, mais Il n'oublie rien."]};

SD[15]={ctx:"Sourate mecquoise. Elle porte le nom d'al-Hijr, le territoire du peuple de Thamoud au nord-ouest de l'Arabie. Elle affirme la préservation du Coran et console le Prophète ﷺ face aux moqueries.",
parts:[
["1-15","La préservation du Coran","Les mécréants disent au Prophète ﷺ qu'il est fou et demandent qu'il fasse venir les anges. « C'est Nous qui avons fait descendre le Rappel, et c'est Nous qui en sommes le gardien » (v. 9). Le Coran est le seul livre révélé dont Allah a garanti la préservation, et il nous est parvenu sans altération."],
["16-25","Les signes de la création","Les constellations dans le ciel, protégées des démons ; la terre étendue avec ses montagnes et ses plantes en juste mesure. « Il n'y a rien dont Nous n'ayons les réserves ; Nous ne le faisons descendre qu'en quantité déterminée » (v. 21). Les vents fécondateurs (v. 22)."],
["26-48","Adam et Iblis","La création de l'homme d'argile sèche, et du djinn auparavant d'un feu ardent. Le refus d'Iblis, sa demande de délai et sa menace d'égarer les humains « sauf Tes serviteurs sincères ». Allah répond : « Sur Mes serviteurs tu n'auras aucun pouvoir » (v. 42). Puis la description des sept portes de l'Enfer et des pieux au Paradis, débarrassés de toute rancune, frères sur des lits face à face (v. 47)."],
["49-77","Les hôtes d'Ibrahim et le peuple de Lout","« Informe Mes serviteurs que Je suis le Pardonneur, le Très Miséricordieux, et que Mon châtiment est le châtiment douloureux » (v. 49-50). Les anges annoncent à Ibrahim la naissance d'un garçon savant, puis vont chez Lout et détruisent son peuple."],
["78-99","Al-Ayka, al-Hijr et la consolation","Les gens d'al-Ayka et ceux d'al-Hijr, qui taillaient des maisons dans la montagne, ont été détruits. Allah a donné au Prophète ﷺ les « sept versets répétés » (al-Fatiha) et le Coran immense (v. 87). Proclame ce qui t'est ordonné et détourne-toi des polythéistes ; Nous te suffisons contre les moqueurs (v. 94-95). « Adore ton Seigneur jusqu'à ce que te vienne la certitude » (v. 99), c'est-à-dire la mort."]],
les:["Allah a garanti Lui-même la préservation du Coran.","Satan n'a pas de pouvoir sur les serviteurs sincères.","Le Paradis est un lieu sans rancune entre les croyants.","L'adoration continue jusqu'à la mort."]};

SD[16]={ctx:"Sourate mecquoise, sauf les derniers versets révélés à Médine selon des savants. On l'appelle aussi « la sourate des bienfaits » (an-Ni'am), car elle énumère un grand nombre de bienfaits d'Allah pour pousser l'homme à la gratitude. Elle porte le nom de l'abeille, à qui Allah a « inspiré » son mode de vie.",
parts:[
["1-21","Les bienfaits de la création","L'ordre d'Allah arrive ; ne le hâtez pas. Allah a créé l'homme d'une goutte, et le voilà qui dispute ! Les bestiaux donnent chaleur, nourriture et beauté ; les chevaux, mulets et ânes servent de montures et de parure. La pluie, les cultures, les oliviers, les palmiers, les vignes. La nuit et le jour, le soleil, la lune et les étoiles. La mer, d'où l'on tire de la chair fraîche et des parures, et où voguent les bateaux. Les montagnes, les rivières, les chemins et les étoiles pour se guider. « Si vous comptiez les bienfaits d'Allah, vous ne pourriez les dénombrer » (v. 18)."],
["22-50","L'orgueil et le message","L'orgueilleux refuse la vérité. Les anges prennent les âmes des injustes et des bons de façon différente (v. 28-32). Chaque communauté a reçu un messager qui disait : « Adorez Allah et écartez-vous du taghout » (v. 36). « Interrogez les gens du rappel si vous ne savez pas » (v. 43). Toute chose se prosterne devant Allah, même les ombres (v. 48-49)."],
["51-60","Le préjugé contre les filles","Le Coran dénonce une pratique des Arabes : « Quand on annonce à l'un d'eux la naissance d'une fille, son visage s'assombrit et il est plein de colère. Il se cache des gens à cause du malheur qu'on lui a annoncé : doit-il la garder avec humiliation, ou l'enfouir dans la terre ? Quel mauvais jugement ! » (v. 58-59). L'islam a combattu ce mépris des filles."],
["61-74","L'abeille et les autres signes","Le lait pur entre les excréments et le sang (v. 66), le fruit du palmier et de la vigne. « Ton Seigneur a inspiré à l'abeille : prends des demeures dans les montagnes, les arbres et ce que les hommes construisent, puis mange de tous les fruits… De leur ventre sort une boisson aux couleurs variées, dans laquelle il y a une guérison pour les gens » (v. 68-69). Allah vous a donné des épouses, des enfants et des petits-enfants."],
["75-89","Les paraboles et le témoignage","Deux paraboles comparent un esclave incapable à un homme libre et généreux, et un homme muet et incapable à celui qui ordonne la justice : peut-on les mettre au même niveau qu'Allah ? Allah vous a fait sortir du ventre de vos mères sans rien savoir, et vous a donné l'ouïe, la vue et les cœurs (v. 78). Les oiseaux dans le ciel ne sont tenus que par Allah. Au Jour du jugement, chaque communauté aura un témoin."],
["90-100","La justice et les engagements","« Allah ordonne la justice, la bienfaisance et la générosité envers les proches, et Il interdit la turpitude, le blâmable et la transgression » (v. 90). Ce verset est récité dans les sermons du vendredi depuis le califat de 'Umar ibn 'Abd al-'Aziz. Remplissez vos engagements, ne soyez pas comme celle qui défaisait son fil après l'avoir solidement filé (v. 92). « Quiconque fait le bien, homme ou femme, en étant croyant, Nous lui ferons vivre une bonne vie » (v. 97). Avant de lire le Coran, cherchez refuge auprès d'Allah contre Satan (v. 98)."],
["101-128","La cité ingrate et la méthode de l'appel","Ceux qui sont contraints de prononcer la mécréance alors que leur cœur reste ferme dans la foi ne sont pas coupables (v. 106), un verset révélé au sujet de 'Ammar ibn Yassir torturé. Parabole d'une cité qui vivait en sécurité et dans l'abondance, puis renia les bienfaits d'Allah et connut la faim et la peur (v. 112). Ibrahim était une communauté à lui seul (v. 120). « Appelle au chemin de ton Seigneur par la sagesse et la bonne exhortation, et discute avec eux de la meilleure façon » (v. 125). Si vous punissez, que ce soit à la mesure du tort subi ; mais la patience est meilleure (v. 126)."]],
les:["Chaque bienfait, même ordinaire, mérite la gratitude.","L'islam a combattu le mépris des filles.","Le miel est une guérison, et l'abeille un signe de la sagesse d'Allah.","Justice, bienfaisance, générosité : le résumé de la morale.","Appeler à l'islam avec sagesse, douceur et bons arguments."]};

SD[17]={ctx:"Sourate mecquoise, révélée vers la fin de la période de La Mecque, autour de l'événement du Voyage nocturne (al-Isra') et de l'Ascension (al-Mi'raj), environ un an avant l'Hégire. Elle s'appelle aussi « Banou Isra'il ». Le Prophète ﷺ ne dormait pas avant d'avoir récité al-Isra' et az-Zoumar (Tirmidhi 3405).",
parts:[
["1","Le Voyage nocturne","« Gloire à Celui qui a fait voyager de nuit Son serviteur, de la Mosquée sacrée (La Mecque) à la Mosquée al-Aqsa (Jérusalem), dont Nous avons béni les alentours, pour lui montrer certains de Nos signes. » Le Prophète ﷺ voyagea sur al-Bouraq, dirigea les prophètes en prière à Jérusalem, puis monta à travers les cieux. Le récit complet se trouve dans Bukhari (3207) et Muslim (162). Le mot « serviteur » montre que la servitude envers Allah est le plus grand honneur."],
["2-8","Les Enfants d'Israël et leurs deux corruptions","Allah donna le Livre à Moussa. Il annonça aux Enfants d'Israël qu'ils sèmeraient deux fois la corruption sur la terre et qu'à chaque fois ils seraient punis par des ennemis. « Si vous faites le bien, c'est pour vous ; si vous faites le mal, c'est contre vous » (v. 7)."],
["9-22","Le Coran guide vers le plus droit","« Ce Coran guide vers ce qu'il y a de plus droit » (v. 9). Chaque homme porte son destin attaché à son cou, et on lui dira : « Lis ton livre, tu suffis aujourd'hui pour faire ton propre compte » (v. 13-14). « Nul ne portera le fardeau d'un autre, et Nous ne châtions pas avant d'avoir envoyé un messager » (v. 15)."],
["23-39","Les commandements","Un ensemble de règles morales : n'adorer qu'Allah ; être bon envers les parents : « Quand l'un d'eux ou les deux atteignent la vieillesse auprès de toi, ne leur dis pas ‹ ouf › et ne les brusque pas ; adresse-leur des paroles respectueuses et abaisse pour eux l'aile de l'humilité par miséricorde, et dis : Seigneur, fais-leur miséricorde comme ils m'ont élevé quand j'étais petit » (v. 23-24). Donner aux proches et aux pauvres sans gaspiller ; ne pas être avare ni dépensier ; ne pas tuer ses enfants par peur de la pauvreté ; ne pas approcher la fornication ; ne pas tuer ; respecter les biens de l'orphelin ; tenir ses engagements ; donner la juste mesure ; ne pas suivre ce dont on n'a aucune connaissance, car l'ouïe, la vue et le cœur seront interrogés ; et ne pas marcher sur terre avec arrogance (v. 26-37)."],
["40-65","Le tawhid et Iblis","Les sept cieux, la terre et tout ce qui s'y trouve glorifient Allah, mais vous ne comprenez pas leur glorification (v. 44). Dites aux gens la meilleure parole, car Satan sème la discorde (v. 53). Iblis refuse de se prosterner devant Adam et promet de mener sa descendance ; Allah lui répond qu'il n'aura aucun pouvoir sur Ses serviteurs."],
["66-84","L'honneur des fils d'Adam et la prière","« Nous avons honoré les fils d'Adam » (v. 70). Les heures de prière : « Accomplis la prière du déclin du soleil jusqu'à l'obscurité de la nuit, et la récitation de l'aube, car la récitation de l'aube a des témoins » (v. 78), puis la prière de nuit, qui peut mener au « rang louable » de l'intercession (v. 79). « La vérité est venue et le mensonge a disparu » (v. 81), récité par le Prophète ﷺ en brisant les idoles de la Ka'ba. Le Coran est une guérison et une miséricorde pour les croyants (v. 82)."],
["85-100","L'âme et le défi","« Ils t'interrogent sur l'âme (ar-rouh). Dis : l'âme relève de l'ordre de mon Seigneur, et on ne vous a donné que peu de science » (v. 85). Le défi : « Si les hommes et les djinns s'unissaient pour produire un Coran semblable, ils ne le pourraient pas » (v. 88). Les polythéistes posent des exigences : une source jaillissante, un jardin, une maison d'or, monter au ciel ; le Prophète ﷺ répond : « Gloire à mon Seigneur ! Ne suis-je qu'un homme messager ? » (v. 93)."],
["101-111","Moussa et la conclusion","Moussa reçut neuf signes clairs. Le Coran a été divisé pour être lu aux gens lentement (v. 106). « Invoquez Allah ou invoquez le Tout Miséricordieux : quel que soit le nom, Il a les plus beaux noms. Ne récite pas ta prière à voix trop haute ni trop basse, cherche le juste milieu » (v. 110). La sourate se termine par : « Louange à Allah qui ne S'est pas donné d'enfant, n'a pas d'associé dans la royauté… et proclame Sa grandeur » (v. 111)."]],
les:["La servitude envers Allah est le plus grand honneur.","La bonté envers les parents, surtout dans leur vieillesse, vient juste après le tawhid.","Ne pas suivre ce dont on n'a pas de connaissance : l'ouïe, la vue et le cœur seront interrogés.","La prière de l'aube et la prière de nuit ont une valeur particulière.","Notre science est petite face aux mystères comme l'âme."]};

// Sourates 19 à 29 (la sourate 18 a son espace dédié)
SD[19]={ctx:"Sourate mecquoise, révélée avant la première émigration en Abyssinie (vers l'an 5 de la prophétie). Ja'far ibn Abi Talib en récita le début devant le Négus, roi chrétien, qui pleura au point de mouiller sa barbe et refusa de livrer les musulmans à Qouraych (Ahmad 1740). C'est la seule sourate qui porte le nom d'une femme. Le nom ar-Rahman (le Tout Miséricordieux) y revient seize fois.",
parts:[
["1-15","Zakariyya et Yahya","Zakariyya, âgé, invoque son Seigneur d'une voix discrète : « Mes os sont affaiblis, ma tête s'est enflammée de cheveux blancs, et je n'ai jamais été malheureux en T'invoquant » (v. 4). Il demande un héritier pour la religion. Allah lui annonce Yahya, un nom que personne n'avait porté. Comme signe, il ne parlera pas aux gens pendant trois nuits. Yahya reçoit la sagesse dès l'enfance ; il est pieux et bon envers ses parents."],
["16-40","Maryam et la naissance de 'Issa","Maryam se retire de sa famille ; Jibril lui apparaît sous forme humaine et lui annonce un fils pur. Elle s'étonne : aucun homme ne l'a touchée. Les douleurs de l'accouchement l'amènent au tronc d'un palmier ; on l'appelle : un ruisseau coule à ses pieds, qu'elle secoue le palmier pour en faire tomber des dattes. Elle revient vers les siens avec l'enfant, accusée ; le bébé parle : « Je suis le serviteur d'Allah ; Il m'a donné le Livre et a fait de moi un prophète » (v. 30). Allah conclut : « Il ne convient pas à Allah de Se donner un enfant. Gloire à Lui ! Quand Il décide une chose, Il dit seulement : Sois, et elle est » (v. 35)."],
["41-50","Ibrahim et son père","Ibrahim parle à son père avec une grande douceur, en commençant par « Ô mon père » : pourquoi adorer ce qui n'entend ni ne voit ? Son père le menace de lapidation et le chasse. Ibrahim répond : « Paix sur toi ; je demanderai pardon pour toi à mon Seigneur » (v. 47). Il s'éloigne, et Allah lui donne Ishaq et Ya'qub."],
["51-58","Moussa, Isma'il et Idris","Moussa, appelé du côté droit du mont, choisi et rapproché ; Haroun, donné comme prophète par miséricorde. Isma'il, fidèle à ses promesses, ordonnait la prière et la zakat à sa famille. Idris, véridique, élevé à un haut rang. Quand on leur récitait les versets du Tout Miséricordieux, ils tombaient prosternés en pleurant (v. 58, prosternation de récitation)."],
["59-72","Les générations qui ont délaissé la prière","« Puis leur succédèrent des générations qui délaissèrent la prière et suivirent leurs passions ; ils trouveront la perdition, sauf celui qui se repent, croit et fait le bien » (v. 59-60). Les paroles des anges : « Nous ne descendons que sur ordre de ton Seigneur… et ton Seigneur n'oublie rien » (v. 64). « Il n'y a aucun d'entre vous qui n'y passera (au-dessus de l'Enfer) » (v. 71) : sur le pont (as-sirat), puis Allah sauvera les pieux."],
["73-98","Le Tout Miséricordieux n'a pas d'enfant","Ceux qui disent que le Tout Miséricordieux S'est donné un enfant ont avancé une chose monstrueuse : peu s'en faut que les cieux se fendent, que la terre s'ouvre et que les montagnes s'écroulent (v. 88-91). Tous ceux qui sont dans les cieux et sur la terre viendront à Lui en serviteurs. « Ceux qui croient et font de bonnes œuvres, le Tout Miséricordieux leur accordera de l'amour » (v. 96) : Allah les aime et met leur amour dans les cœurs des gens (Bukhari 3209)."]],
les:["Invoquer Allah avec humilité et sans jamais désespérer.","Maryam est un modèle de pureté et de confiance en Allah.","Parler à ses parents avec douceur, même en désaccord sur la religion.","Délaisser la prière est le début de la perdition.","La foi et les bonnes œuvres attirent l'amour d'Allah et des gens."]};

SD[20]={ctx:"Sourate mecquoise, révélée tôt, avant l'émigration en Abyssinie. Sa récitation fut la cause de la conversion de 'Umar ibn al-Khattab : sorti pour tuer le Prophète ﷺ, il apprit que sa sœur Fatima et son mari étaient musulmans, les frappa, puis lut le début de Ta-Ha et son cœur s'ouvrit à l'islam (Ibn Ishaq). Elle consacre la plus grande partie de ses versets à l'histoire de Moussa.",
parts:[
["1-8","Le Coran n'est pas un fardeau","« Nous n'avons pas fait descendre sur toi le Coran pour que tu sois malheureux, mais seulement comme un rappel pour celui qui craint. » Le Prophète ﷺ priait la nuit jusqu'à la fatigue. Le Tout Miséricordieux est établi sur le Trône ; à Lui ce qui est dans les cieux et sur la terre. Il connaît le secret et ce qui est encore plus caché. « Allah, pas de divinité à part Lui ; à Lui les plus beaux noms » (v. 8)."],
["9-36","Le feu et l'appel","Moussa, de retour de Madyan avec sa famille, voit un feu. Il s'en approche et est appelé : « C'est Moi ton Seigneur ; ôte tes sandales, tu es dans la vallée sacrée de Touwa… Je suis Allah, pas de divinité à part Moi ; adore-Moi et accomplis la prière pour te souvenir de Moi » (v. 12-14). Allah lui montre le bâton qui devient serpent et la main blanche. Moussa demande : « Seigneur, ouvre-moi ma poitrine, facilite ma tâche, dénoue ma langue pour qu'ils comprennent ma parole, et donne-moi un assistant de ma famille, Haroun mon frère » (v. 25-30)."],
["37-41","Les bienfaits passés","Allah rappelle à Moussa ce qu'Il a fait pour lui : l'inspiration donnée à sa mère de le mettre dans le coffre sur le fleuve, l'amour qu'Allah a mis en lui, le retour à sa mère, le salut après le meurtre involontaire. « Je t'ai choisi pour Moi » (v. 41)."],
["42-76","Pharaon et les magiciens","« Allez vers Pharaon, il a transgressé. Parlez-lui avec douceur ; peut-être se rappellera-t-il ou craindra-t-il » (v. 43-44). Pharaon demande : « Qui est votre Seigneur ? » « Notre Seigneur est Celui qui a donné à chaque chose sa création, puis l'a guidée » (v. 50). Le duel avec les magiciens le jour de la fête ; Moussa ressent une crainte, Allah le rassure ; le bâton avale leurs artifices. Les magiciens se prosternent et répondent aux menaces de Pharaon : « Décide ce que tu veux ; tu ne décides que pour cette vie » (v. 72)."],
["77-98","La mer, le veau d'or et as-Samiri","La traversée de la mer et la noyade de Pharaon. Allah donne rendez-vous à Moussa ; pendant son absence, as-Samiri fabrique un veau d'or qui mugit. Haroun avertit le peuple sans être écouté. Moussa revient, saisit son frère par la barbe ; Haroun explique qu'il a craint la division. As-Samiri est condamné à l'isolement (dire « ne me touchez pas »), et le veau est brûlé et ses cendres jetées à la mer. « Votre seule divinité est Allah » (v. 98)."],
["99-114","Le Jour du jugement","Les mécréants se chuchoteront qu'ils ne sont restés que dix jours sur terre. Les montagnes seront pulvérisées, les voix se tairont devant le Tout Miséricordieux. Le Coran est en arabe, avec des avertissements variés. « Ne te hâte pas de réciter le Coran avant que sa révélation te soit achevée, et dis : Seigneur, augmente-moi en science » (v. 114)."],
["115-127","Adam et l'oubli","Adam oublia l'engagement et n'eut pas de résolution ferme. Satan lui proposa « l'arbre de l'éternité ». Puis Allah le choisit, accepta son repentir et le guida. « Celui qui suit Ma guidée ne s'égarera pas et ne sera pas malheureux. Celui qui se détourne de Mon rappel aura une vie misérable, et Nous le ressusciterons aveugle » (v. 123-124)."],
["128-135","Patience et prière","« Endure ce qu'ils disent, et glorifie ton Seigneur avant le lever du soleil et avant son coucher, et pendant la nuit » (v. 130), une allusion aux heures de prière. « Ne tends pas les yeux vers ce que Nous avons donné à certains d'entre eux comme jouissance » (v. 131). « Ordonne la prière à ta famille et sois-y constant ; Nous ne te demandons pas de subsistance, c'est Nous qui te nourrissons » (v. 132)."]],
les:["La religion n'est pas faite pour rendre malheureux.","Demander à Allah de faciliter sa mission et d'ouvrir sa poitrine.","Même au pire tyran, on parle avec douceur.","Se détourner du rappel d'Allah rend la vie difficile.","Ordonner la prière à sa famille et y être constant soi-même."]};

SD[21]={ctx:"Sourate mecquoise, révélée dans la période moyenne de La Mecque. Ibn Mas'oud la comptait parmi les sourates les plus anciennes et les plus précieuses pour lui (Bukhari 4708). Elle cite seize prophètes et montre que tous ont apporté le même message et ont été exaucés par Allah.",
parts:[
["1-15","L'insouciance des gens","« Le jugement des gens approche, alors qu'ils se détournent dans l'insouciance » (v. 1). Chaque nouveau rappel les trouve en train de jouer. Ils disent que le Prophète ﷺ est un poète ou un magicien. Combien de cités injustes ont été brisées !"],
["16-35","La création n'est pas un jeu","« Nous n'avons pas créé le ciel et la terre et ce qui est entre eux pour nous amuser » (v. 16). S'il y avait d'autres divinités qu'Allah, le ciel et la terre seraient en désordre (v. 22). « Les cieux et la terre formaient une masse compacte, puis Nous les avons séparés, et Nous avons fait de l'eau toute chose vivante » (v. 30). « Toute âme goûtera la mort ; Nous vous éprouvons par le mal et par le bien, comme tentation » (v. 35)."],
["36-50","L'homme est hâtif","Les mécréants se moquent du Prophète ﷺ. « L'homme a été créé hâtif » (v. 37). Au Jour du jugement, les balances seront justes : même le poids d'un grain de moutarde sera compté (v. 47). Moussa et Haroun ont reçu le Discernement."],
["51-73","Ibrahim et les idoles","Ibrahim demande à son père et à son peuple : « Que sont ces statues auxquelles vous êtes attachés ? » « Nos pères les adoraient. » Il brise les idoles sauf la plus grande, et quand on l'accuse : « Demandez-leur, si elles parlent ! » Ils sont confondus mais le jettent au feu. « Ô feu, sois fraîcheur et paix pour Ibrahim ! » (v. 69). Allah le sauve avec Lout vers la terre bénie."],
["74-91","Les prophètes exaucés","Lout sauvé de la cité corrompue ; Nouh exaucé contre son peuple ; Daoud et Soulayman jugeant l'affaire du champ, Soulayman comprenant mieux, et les montagnes et oiseaux glorifiant avec Daoud ; Ayyoub : « Le mal m'a touché et Tu es le plus Miséricordieux des miséricordieux », et Allah le guérit ; Isma'il, Idris et Dhoul-Kifl, patients ; Younous : « Pas de divinité à part Toi, gloire à Toi, j'ai été parmi les injustes », sauvé de l'angoisse, « et ainsi sauvons-Nous les croyants » (v. 88) ; Zakariyya exaucé avec Yahya ; et Maryam et son fils, signe pour l'univers. Leur point commun : « Ils rivalisaient dans les bonnes œuvres et Nous invoquaient avec espoir et crainte » (v. 90)."],
["92-112","Une seule communauté","« Votre communauté est une seule communauté, et Je suis votre Seigneur : adorez-Moi » (v. 92). La sortie de Ya'jouj et Ma'jouj annonce la fin (v. 96). Le ciel sera plié comme on plie un rouleau (v. 104). « La terre, ce sont Mes serviteurs vertueux qui en hériteront » (v. 105). « Nous ne t'avons envoyé que comme miséricorde pour l'univers » (v. 107)."]],
les:["La vie a un but : ce n'est pas un jeu.","Le bien comme le mal sont des épreuves.","Les prophètes ont été exaucés parce qu'ils invoquaient avec espoir et crainte.","L'invocation de Younous est une clé dans toute détresse.","Le Prophète ﷺ est une miséricorde pour toute l'humanité."]};

SD[22]={ctx:"Sourate médinoise selon le Mushaf de Médine, avec des versets mecquois selon d'autres savants. Elle contient la première autorisation de combattre donnée aux musulmans opprimés (v. 39-40), et décrit l'origine et le sens du pèlerinage. Elle contient deux prosternations de récitation (v. 18 et 77).",
parts:[
["1-7","La terreur de l'Heure et la création","« Ô gens, craignez votre Seigneur ; le tremblement de l'Heure est une chose terrible » : chaque nourrice oubliera son nourrisson, chaque femme enceinte avortera, et les gens sembleront ivres sans l'être (v. 1-2). Preuve de la résurrection : la création de l'homme de terre, puis d'une goutte, d'une adhérence, d'un morceau de chair formé et non formé, puis l'enfance et la vieillesse ; et la terre morte qui revit sous la pluie (v. 5)."],
["8-24","Ceux qui adorent Allah sur le bord","Certains disputent au sujet d'Allah sans science. D'autres adorent Allah « sur le bord » : si un bien les touche, ils sont satisfaits ; si une épreuve les touche, ils se retournent (v. 11). Tout ce qui est dans les cieux et sur la terre se prosterne devant Allah : le soleil, la lune, les étoiles, les montagnes, les arbres, les animaux et beaucoup de gens (v. 18). Les deux groupes adverses et leur sort."],
["25-37","Le pèlerinage","Allah indiqua à Ibrahim l'emplacement de la Maison : « Ne M'associe rien, et purifie Ma Maison pour ceux qui tournent autour, qui se tiennent debout, s'inclinent et se prosternent. Et appelle les gens au pèlerinage : ils viendront à toi à pied et sur toute monture, de tout chemin lointain » (v. 26-27). Les rites : mentionner le nom d'Allah sur les bêtes, en manger et nourrir le pauvre, accomplir les vœux, faire le tour de la Maison antique. « Quiconque honore les rites d'Allah, cela vient de la piété des cœurs » (v. 32). « Ni leur chair ni leur sang n'atteignent Allah, mais la piété de votre part L'atteint » (v. 37)."],
["38-41","La permission de se défendre","« Autorisation est donnée à ceux qui sont combattus, parce qu'ils ont été lésés… ceux qui ont été expulsés de leurs demeures injustement, seulement pour avoir dit : Allah est notre Seigneur » (v. 39-40). Sans cette défense, les monastères, les églises, les synagogues et les mosquées où le nom d'Allah est souvent mentionné auraient été détruits (v. 40). Ceux qui reçoivent le pouvoir accomplissent la prière, donnent la zakat, ordonnent le bien et interdisent le mal (v. 41)."],
["42-57","Les cœurs aveugles","Les peuples d'avant ont démenti leurs prophètes. « Ce ne sont pas les yeux qui sont aveugles, ce sont les cœurs dans les poitrines » (v. 46). Un jour auprès d'Allah est comme mille ans de votre calcul (v. 47)."],
["58-78","La faiblesse des idoles et l'appel final","Parabole : ceux que vous invoquez en dehors d'Allah ne pourraient pas créer une mouche, même s'ils s'unissaient ; et si la mouche leur enlevait quelque chose, ils ne pourraient le lui reprendre (v. 73). « Ô vous qui croyez, inclinez-vous, prosternez-vous, adorez votre Seigneur et faites le bien afin de réussir » (v. 77). « Il ne vous a imposé aucune gêne dans la religion, la religion de votre père Ibrahim ; c'est Lui qui vous a nommés musulmans » (v. 78)."]],
les:["L'adoration ne doit pas dépendre des circonstances.","Le pèlerinage remonte à l'appel d'Ibrahim.","C'est la piété du cœur qui atteint Allah, pas la viande du sacrifice.","Le combat en islam est d'abord une défense contre l'oppression.","La religion d'Allah ne comporte pas de gêne."]};

SD[23]={ctx:"Sourate mecquoise. 'Umar rapporte que, lors de la révélation de son début, le Prophète ﷺ dit : « Dix versets m'ont été révélés : celui qui les applique entrera au Paradis », puis récita les versets 1 à 10 (Tirmidhi 3173).",
parts:[
["1-11","Les croyants qui réussissent","« Ont réussi les croyants : ceux qui sont humbles dans leur prière, qui se détournent des futilités, qui s'acquittent de la zakat, qui préservent leur chasteté sauf avec leurs épouses, qui respectent les dépôts et leurs engagements, et qui sont assidus à leurs prières. Ce sont eux les héritiers qui hériteront du Firdaws, où ils demeureront éternellement. » La liste commence et se termine par la prière."],
["12-22","Les étapes de la création","« Nous avons créé l'homme d'un extrait d'argile, puis Nous en avons fait une goutte dans un réceptacle sûr, puis une adhérence, puis un morceau de chair, puis des os que Nous avons revêtus de chair, puis une autre création. Béni soit Allah, le meilleur des créateurs ! » (v. 12-14). Puis la mort, la résurrection, les sept cieux, la pluie, les jardins, l'olivier du Sinaï, les bestiaux et les bateaux."],
["23-50","Les messagers et leurs peuples","Nouh et l'arche ; un autre messager après lui (Houd ou Salih selon les commentateurs), démenti par des notables qui disaient : « Ce n'est qu'un homme comme vous, il mange ce que vous mangez » ; Moussa et Haroun face à Pharaon ; 'Issa et sa mère, établis sur une colline sûre."],
["51-77","Une seule communauté et les croyants inquiets","« Ô messagers, mangez des bonnes choses et faites le bien » (v. 51). Les gens se sont divisés en sectes, chacune fière de ce qu'elle a. Les vrais croyants sont « ceux qui donnent ce qu'ils donnent alors que leurs cœurs sont craintifs de retourner vers leur Seigneur » (v. 60). 'Aïcha demanda s'il s'agissait de ceux qui boivent et volent ; le Prophète ﷺ répondit : « Non, ce sont ceux qui jeûnent, prient et donnent l'aumône, et craignent que cela ne soit pas accepté » (Tirmidhi 3175). « Nous n'imposons à personne que selon sa capacité » (v. 62)."],
["78-98","Les questions aux polythéistes","Allah vous a donné l'ouïe, la vue et les cœurs : combien peu vous êtes reconnaissants ! Questions : à qui appartient la terre ? Qui est le Seigneur des sept cieux ? Ils répondront : Allah. Alors pourquoi ne réfléchissent-ils pas ? « Repousse le mal par ce qui est meilleur » (v. 96). Invocation : « Seigneur, je cherche refuge auprès de Toi contre les suggestions des démons » (v. 97)."],
["99-118","Le regret après la mort","« Quand la mort vient à l'un d'eux, il dit : Seigneur, fais-moi revenir, afin que je fasse le bien que j'ai délaissé. Non ! C'est une simple parole qu'il prononce » (v. 99-100). Derrière eux, une barrière (barzakh) jusqu'au jour de la résurrection. Les balances : lourdes ou légères. « Pensiez-vous que Nous vous avions créés sans but, et que vous ne seriez pas ramenés vers Nous ? » (v. 115). Dernier verset : « Seigneur, pardonne et fais miséricorde, Tu es le meilleur des miséricordieux » (v. 118)."]],
les:["L'humilité dans la prière est la première qualité des croyants qui réussissent.","Se détourner des futilités fait partie de la foi.","Le croyant fait le bien tout en craignant qu'il ne soit pas accepté.","Repousser le mal par le bien.","Il faut agir maintenant : après la mort, il n'y a pas de retour."]};

SD[24]={ctx:"Sourate médinoise, révélée principalement en l'an 5 ou 6 de l'Hégire, après l'affaire de la calomnie (al-ifk) contre 'Aïcha, mère des croyants, au retour de l'expédition contre les Banou al-Moustaliq. Elle établit des règles pour protéger l'honneur et la famille. 'Umar écrivit aux habitants de Koufa : « Enseignez à vos femmes la sourate an-Nour. »",
parts:[
["1-10","Les peines et le serment d'anathème","Une sourate révélée et rendue obligatoire. La peine de la fornication, appliquée par l'autorité avec des conditions de preuve très strictes. La peine de celui qui accuse une femme chaste sans quatre témoins : quatre-vingts coups de fouet, et son témoignage n'est plus jamais accepté (v. 4). Puis le li'an : quand un mari accuse sa femme sans témoins, chacun prête des serments, et le mariage est dissous (v. 6-10)."],
["11-26","L'affaire de la calomnie","'Aïcha s'était éloignée du campement pour chercher un collier perdu ; l'armée partit sans s'apercevoir de son absence. Un compagnon, Safwan ibn al-Mou'attal, la trouva et la ramena. Les hypocrites, menés par 'Abdullah ibn Oubayy, répandirent une calomnie, reprise par quelques musulmans. Pendant un mois, aucune révélation ne vint. Puis Allah révéla dix versets proclamant son innocence (récit complet dans Bukhari 4750).\nLes leçons : « Pourquoi, quand vous l'avez entendue, les croyants et les croyantes n'ont-ils pas pensé du bien d'eux-mêmes et dit : c'est une calomnie évidente ? » (v. 12). « Vous la receviez de vos langues et disiez de vos bouches ce dont vous n'aviez aucune science, et vous la pensiez légère alors qu'elle est énorme auprès d'Allah » (v. 15). Abou Bakr avait juré de ne plus aider un parent qui avait participé à la rumeur ; Allah révéla : « N'aimez-vous pas qu'Allah vous pardonne ? » (v. 22), et il reprit son aide."],
["27-34","Les règles de la vie privée","Ne pas entrer dans une maison sans demander la permission et saluer (v. 27). « Dis aux croyants de baisser leurs regards et de préserver leur chasteté… Et dis aux croyantes de baisser leurs regards, de préserver leur chasteté, de ne montrer de leurs atours que ce qui en paraît, et de rabattre leur voile sur leurs poitrines » (v. 30-31). Mariez les célibataires ; s'ils sont pauvres, Allah les enrichira de Sa grâce (v. 32)."],
["35-46","Le verset de la lumière","« Allah est la lumière des cieux et de la terre. Sa lumière est comparable à une niche où se trouve une lampe ; la lampe est dans un cristal, et le cristal est comme un astre brillant ; son combustible vient d'un arbre béni, un olivier ni de l'Orient ni de l'Occident, dont l'huile éclaire presque sans que le feu la touche. Lumière sur lumière. Allah guide vers Sa lumière qui Il veut » (v. 35). Les savants y voient l'image de la lumière de la foi dans le cœur du croyant. Cette lumière se trouve dans les maisons où le nom d'Allah est mentionné (les mosquées), par des hommes que ni le commerce ni la vente ne distraient de Son rappel (v. 36-37). À l'inverse, les œuvres des mécréants sont comme un mirage dans le désert, ou des ténèbres superposées sur une mer profonde (v. 39-40)."],
["47-57","Obéissance et promesse","Les hypocrites disent qu'ils obéissent mais se détournent quand on les appelle au jugement d'Allah. Les croyants disent : « Nous avons entendu et obéi » (v. 51). « Allah a promis à ceux d'entre vous qui croient et font de bonnes œuvres de leur donner la succession sur terre… et de changer leur peur en sécurité ; ils M'adorent sans rien M'associer » (v. 55)."],
