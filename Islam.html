const SIRA_D=[
{h:"L'Arabie avant l'islam",y:"Avant 570",p:[
"Au VIe siècle, la péninsule arabique est entourée de deux grands empires en guerre : l'empire byzantin (chrétien) au nord-ouest et l'empire perse sassanide (zoroastrien) au nord-est. Au sud, le Yémen passe sous domination abyssine. L'Arabie centrale, désertique, n'a ni État ni roi : la société est organisée en tribus, et chaque tribu protège ses membres.",
"Les historiens appellent cette période la Jahiliyya, « l'époque de l'ignorance ». La plupart des Arabes adorent des idoles : il y en a plus de trois cent soixante autour de la Ka'ba. Pourtant, ils reconnaissent encore Allah comme Créateur suprême, un reste de la religion d'Ibrahim et d'Isma'il, mais Lui associent des intermédiaires. Quelques personnes, appelées les hounafa', refusent les idoles et cherchent la religion pure d'Ibrahim, comme Zayd ibn 'Amr ibn Noufayl.",
"La société a de belles qualités : la générosité envers l'invité, le courage, le respect de la parole donnée, l'amour de la poésie et de l'éloquence. Mais elle connaît aussi de graves injustices : les guerres de vengeance entre tribus durant parfois des dizaines d'années, l'alcool et les jeux de hasard, l'usure, le mépris des femmes privées d'héritage, et dans certaines tribus l'enterrement des filles vivantes.",
"La Mecque est une ville commerçante au cœur d'une vallée aride. Elle doit son importance à la Ka'ba, construite par Ibrahim et Isma'il, où les Arabes viennent en pèlerinage chaque année. La tribu de Qouraych, descendante d'Isma'il, en est la gardienne : elle organise le pèlerinage et deux grandes caravanes commerciales, vers le Yémen en hiver et vers la Syrie en été (sourate 106)."],
src:"Ar-Rahiq al-Makhtoum ; Coran 106 et 81:8-9"},
{h:"Naissance et enfance",y:"570 – 583",p:[
"Muhammad est né à La Mecque un lundi (Muslim 1162) du mois de Rabi' al-Awwal, l'année de l'Éléphant, vers 570. Son père 'Abdullah, fils de 'Abd al-Mouttalib, du clan des Banou Hachim, est mort quelques mois avant sa naissance. Sa mère s'appelle Amina bint Wahb. Le Prophète ﷺ a dit : « Allah a choisi Kinana parmi les fils d'Isma'il, Qouraych parmi Kinana, les Banou Hachim parmi Qouraych, et Il m'a choisi parmi les Banou Hachim » (Muslim 2276).",
"Selon la coutume des familles nobles de La Mecque, il fut confié à une nourrice bédouine, Halima as-Sa'diyya, pour grandir au désert, dans un air pur et une langue arabe correcte. Halima raconta que sa famille, très pauvre, connut une bénédiction extraordinaire dès son arrivée : ses bêtes donnèrent du lait en abondance. C'est chez elle qu'eut lieu l'ouverture de sa poitrine : Jibril vint, ouvrit sa poitrine, en retira un caillot noir en disant « Ceci est la part de Satan en toi », puis lava son cœur avec l'eau de Zamzam dans un bassin d'or et le remit en place (Muslim 162).",
"Il revint chez sa mère vers l'âge de quatre ou cinq ans. À six ans, lors d'un voyage à Médine pour visiter des proches, sa mère tomba malade et mourut sur le chemin du retour, à al-Abwa'. Des années plus tard, le Prophète ﷺ demanda à Allah la permission de visiter sa tombe et pleura, faisant pleurer ceux qui étaient autour de lui (Muslim 976).",
"Son grand-père 'Abd al-Mouttalib, chef respecté de La Mecque, le prit en charge avec beaucoup d'affection, mais mourut deux ans plus tard. L'enfant, âgé de huit ans, fut alors confié à son oncle Abou Talib, père de 'Ali, qui l'aima comme son propre fils et le protégea jusqu'à sa mort. Le Coran rappelle : « Ne t'a-t-Il pas trouvé orphelin, et ne t'a-t-Il pas donné un refuge ? » (93:6)."],
src:"Muslim 162, 976, 1162, 2276 ; Ar-Rahiq al-Makhtoum"},
{h:"Jeunesse : al-Amin",y:"583 – 605",p:[
"Comme beaucoup de jeunes de son époque, Muhammad gardait des moutons pour les gens de La Mecque. Il a dit plus tard : « Allah n'a envoyé aucun prophète sans qu'il ait gardé des moutons » (Bukhari 2262). Cette expérience apprend la patience, la douceur et la responsabilité.",
"Il se distinguait par son honnêteté absolue, au point que les Mecquois l'appelaient al-Amin, « le digne de confiance », et lui confiaient leurs biens. Allah le préserva des pratiques de la Jahiliyya : il ne se prosterna jamais devant une idole et ne but jamais d'alcool.",
"Vers vingt ans, il participa au pacte des vertueux (Hilf al-Foudoul), conclu entre plusieurs clans pour défendre toute personne opprimée à La Mecque, après qu'un commerçant yéménite eut été volé par un notable. Le Prophète ﷺ dit plus tard : « J'ai assisté dans la maison de 'Abdullah ibn Jad'an à un pacte que je n'échangerais pas contre les plus beaux chameaux ; si on m'y appelait en islam, j'y répondrais » (rapporté par al-Bayhaqi).",
"Devenu commerçant, il fut engagé par Khadija bint Khouwaylid, une riche femme d'affaires respectée, pour conduire sa caravane en Syrie avec son serviteur Maysara. Il revint avec un grand bénéfice, et Maysara lui raconta son honnêteté et son caractère. Khadija, veuve d'environ quarante ans selon l'avis le plus connu, lui proposa le mariage ; il avait vingt-cinq ans. Ils vécurent vingt-cinq ans ensemble, et il n'épousa aucune autre femme de son vivant. Ils eurent deux fils, al-Qasim et 'Abdullah, morts en bas âge, et quatre filles : Zaynab, Rouqayya, Oumm Koulthoum et Fatima."],
src:"Bukhari 2262 ; Ar-Rahiq al-Makhtoum ; Sirat Ibn Hicham"},
{h:"La pierre noire et la grotte de Hira'",y:"605 – 610",p:[
"Vers l'an 605, quand le Prophète ﷺ avait trente-cinq ans, une inondation fragilisa la Ka'ba, et Qouraych décida de la reconstruire. Les clans se partagèrent le travail. Mais au moment de replacer la pierre noire, chaque clan voulut cet honneur, et la dispute faillit tourner à la guerre. Ils décidèrent de laisser trancher le premier homme qui entrerait dans la mosquée : ce fut Muhammad. « C'est al-Amin, nous l'acceptons ! »",
"Il étendit un manteau, posa la pierre au milieu, et demanda à un représentant de chaque clan de tenir un coin. Ensemble, ils la soulevèrent, et il la mit lui-même à sa place. Sa sagesse évita un bain de sang. Faute de moyens licites suffisants, Qouraych reconstruisit la Ka'ba plus petite que les fondations d'Ibrahim ; la partie laissée hors des murs est le Hijr Isma'il (Bukhari 1584).",
"Dans les années qui suivirent, Allah lui fit aimer la solitude. Il se retirait dans la grotte de Hira', sur une montagne près de La Mecque, pendant plusieurs nuits, avec des provisions, pour adorer Allah et méditer, loin de l'idolâtrie de son peuple. Puis il revenait chez Khadija prendre d'autres provisions. Ses rêves se réalisaient exactement, comme la clarté de l'aube (Bukhari 3) : c'était le début de la prophétie."],
src:"Bukhari 3, 1584 ; Ar-Rahiq al-Makhtoum"},
{h:"La première révélation",y:"610",p:[
"Pendant le mois de Ramadan de l'année 610, alors qu'il avait quarante ans, l'ange Jibril vint à lui dans la grotte. 'Aïcha raconte (Bukhari 3) : l'ange lui dit : « Lis ! » Il répondit : « Je ne sais pas lire. » L'ange le serra jusqu'à l'épuisement, puis le lâcha : « Lis ! » « Je ne sais pas lire. » Une troisième fois, puis l'ange dit : « Lis, au nom de ton Seigneur qui a créé, qui a créé l'homme d'une adhérence. Lis, et ton Seigneur est le Très Généreux, qui a enseigné par le calame, qui a enseigné à l'homme ce qu'il ne savait pas » (96:1-5).",
"Il rentra le cœur tremblant chez Khadija : « Couvrez-moi, couvrez-moi ! » On le couvrit jusqu'à ce que sa peur passe. Il lui raconta tout et dit : « J'ai eu peur pour moi-même. » Khadija répondit par des paroles restées célèbres : « Non, par Allah, Allah ne t'humiliera jamais : tu maintiens les liens de parenté, tu portes le fardeau du faible, tu donnes à celui qui n'a rien, tu honores l'invité et tu aides face aux malheurs de la vie. »",
"Elle l'emmena chez son cousin Waraqa ibn Nawfal, un vieil homme aveugle devenu chrétien, qui connaissait les Écritures. Waraqa lui dit : « C'est le Namous (l'ange de la révélation) qu'Allah a envoyé à Moussa. Si seulement j'étais jeune et vivant quand ton peuple te chassera ! » « Vont-ils me chasser ? » « Oui, aucun homme n'a apporté ce que tu apportes sans être combattu. » Waraqa mourut peu après.",
"La révélation s'interrompit ensuite pendant un temps, ce qui attrista beaucoup le Prophète ﷺ. Puis il vit à nouveau Jibril, assis sur un trône entre le ciel et la terre ; il rentra en disant « Couvrez-moi ! », et Allah révéla : « Ô toi, revêtu d'un manteau ! Lève-toi et avertis » (74:1-2). Dès lors, la révélation se succéda sans interruption pendant vingt-trois ans (Bukhari 4925)."],
src:"Bukhari 3, 4925 ; Coran 96:1-5, 74:1-7"},
{h:"Les premiers musulmans",y:"610 – 613",p:[
"Pendant environ trois ans, le Prophète ﷺ appela à l'islam en secret, d'abord ses proches et ses amis de confiance. La première à croire fut son épouse Khadija. Parmi les hommes, ce fut son ami Abou Bakr, commerçant respecté ; parmi les enfants, son cousin 'Ali, âgé d'une dizaine d'années, qui vivait chez lui ; parmi les affranchis, Zayd ibn Haritha, qu'il avait adopté.",
"Abou Bakr, aimé et estimé, fit entrer dans l'islam plusieurs hommes qui allaient devenir des figures majeures : 'Uthman ibn 'Affan, az-Zoubayr ibn al-'Awwam, 'Abd ar-Rahman ibn 'Awf, Sa'd ibn Abi Waqqas et Talha ibn 'Oubaydillah. Puis vinrent Abou 'Oubayda, Bilal l'Abyssin, 'Ammar ibn Yassir et ses parents, 'Abdullah ibn Mas'oud et d'autres. Beaucoup étaient jeunes, et beaucoup étaient pauvres ou esclaves.",
"Les croyants se réunissaient discrètement dans la maison d'al-Arqam ibn Abi al-Arqam, près du mont as-Safa, pour apprendre le Coran et prier. La prière se faisait alors deux unités le matin et deux le soir, selon des savants. Les premières sourates révélées parlaient surtout de l'unicité d'Allah, du Jour du jugement, de la purification de l'âme et de la générosité envers les pauvres."],
src:"Ar-Rahiq al-Makhtoum ; Sirat Ibn Hicham"},
{h:"L'appel public et les persécutions",y:"613 – 615",p:[
"Allah ordonna : « Avertis les plus proches de ta famille » (26:214). Le Prophète ﷺ monta sur le mont as-Safa et appela les clans de Qouraych. Quand ils furent réunis, il demanda : « Si je vous disais qu'une cavalerie va vous attaquer derrière cette vallée, me croiriez-vous ? » « Oui, nous ne t'avons jamais connu menteur. » « Je suis un avertisseur pour vous avant un châtiment terrible. » Son oncle Abou Lahab dit : « Que tu périsses ! C'est pour cela que tu nous as réunis ? » Et la sourate al-Masad fut révélée (Bukhari 4770, 4971).",
"Puis vint l'ordre : « Proclame ce qui t'est ordonné » (15:94). Qouraych réagit d'abord par la moquerie, en le traitant de fou, de poète ou de magicien. Puis ils essayèrent de négocier : un notable, 'Outba ibn Rabi'a, lui proposa de l'argent, le pouvoir ou des soins médicaux s'il renonçait. Le Prophète ﷺ lui récita le début de la sourate Foussilat, et 'Outba repartit troublé.",
"Face à l'échec, ils choisirent la violence, surtout contre les faibles qui n'avaient pas de clan pour les protéger. Bilal, esclave d'Oumayya ibn Khalaf, était allongé sur le sable brûlant avec un rocher sur la poitrine ; il répétait seulement « Ahad, Ahad » (l'Unique). Abou Bakr l'acheta et l'affranchit. La famille de Yassir fut torturée ; le Prophète ﷺ passait près d'eux et disait : « Patience, famille de Yassir, votre rendez-vous est le Paradis. » Soumayya, la mère, fut tuée par Abou Jahl : elle fut la première martyre de l'islam. Le Prophète ﷺ lui-même fut insulté, on jeta des entrailles de chameau sur son dos pendant qu'il était prosterné (Bukhari 240), et on tenta de l'étrangler (Bukhari 3678)."],
src:"Bukhari 240, 3678, 4770, 4971 ; Ar-Rahiq al-Makhtoum"},
{h:"L'émigration en Abyssinie",y:"615 – 616",p:[
"Face à la persécution, le Prophète ﷺ conseilla à des musulmans de partir en Abyssinie (l'Éthiopie actuelle), dont le roi chrétien, le Négus (an-Najachi), était connu pour sa justice. Un premier groupe d'une quinzaine de personnes partit en l'an 5 de la prophétie, dont 'Uthman et son épouse Rouqayya, fille du Prophète ﷺ. Un second groupe plus important suivit, de plus de quatre-vingts personnes.",
"Qouraych envoya deux émissaires, dont 'Amr ibn al-'As, avec de riches cadeaux, pour demander au Négus de leur livrer les fugitifs. Le Négus refusa de les livrer sans les entendre. Ja'far ibn Abi Talib, cousin du Prophète ﷺ, prit la parole : « Ô roi, nous étions un peuple d'ignorance : nous adorions des idoles, mangions des bêtes mortes, commettions des turpitudes, rompions les liens de parenté, maltraitions nos voisins, et le fort parmi nous dévorait le faible. Allah nous a envoyé un messager dont nous connaissons la lignée, la sincérité et l'honnêteté. Il nous a appelés à adorer Allah seul, à dire la vérité, à rendre les dépôts, à maintenir les liens de parenté, à bien traiter nos voisins… »",
"Le Négus demanda à entendre quelque chose de ce qui avait été révélé. Ja'far récita le début de la sourate Maryam. Le Négus pleura jusqu'à mouiller sa barbe, et ses évêques pleurèrent aussi. Il dit : « Ceci et ce qu'a apporté 'Issa viennent de la même source de lumière. » Le lendemain, 'Amr tenta de le monter contre les musulmans en l'interrogeant sur leur vision de 'Issa. Ja'far répondit : « Il est le serviteur d'Allah, Son messager, Son esprit et Sa parole déposée en Maryam. » Le Négus prit un bâton et dit : « 'Issa ne dépasse pas ce que tu as dit de la longueur de ce bâton. » Il renvoya les émissaires et leurs cadeaux (Ahmad 1740).",
"Le Négus embrassa l'islam en secret. À sa mort, en l'an 9, le Prophète ﷺ annonça la nouvelle à Médine et fit pour lui la prière funéraire en son absence (Bukhari 1245)."],
src:"Ahmad 1740 ; Bukhari 1245 ; Ar-Rahiq al-Makhtoum"},
{h:"Hamza, 'Umar et le boycott",y:"616 – 619",p:[
"En l'an 6 de la prophétie, deux conversions changèrent la situation. Hamza, oncle du Prophète ﷺ et guerrier redouté, apprit qu'Abou Jahl avait insulté son neveu. Furieux, il alla le frapper de son arc devant les notables et déclara : « Tu l'insultes alors que je suis de sa religion ? » Il embrassa ensuite sincèrement l'islam.",
"Quelques jours plus tard, 'Umar ibn al-Khattab, l'un des plus durs ennemis de l'islam, sortit avec son épée pour tuer le Prophète ﷺ. En chemin, on lui apprit que sa propre sœur Fatima et son mari étaient musulmans. Il alla chez eux, les frappa, puis, voyant le sang sur le visage de sa sœur, se calma et demanda à lire la feuille qu'ils récitaient : c'était le début de la sourate Ta-Ha. Son cœur s'ouvrit. Il alla chez le Prophète ﷺ à Dar al-Arqam et prononça la chahada. Le Prophète ﷺ avait invoqué : « Ô Allah, renforce l'islam par l'un des deux hommes que Tu aimes le plus : Abou Jahl ou 'Umar » (Tirmidhi 3681). Ibn Mas'oud a dit : « Nous n'avons cessé d'être forts depuis que 'Umar est devenu musulman » (Bukhari 3684) ; les musulmans purent alors prier ouvertement près de la Ka'ba.",
"Inquiets de voir l'islam progresser, les chefs de Qouraych signèrent un pacte de boycott contre les Banou Hachim et les Banou al-Mouttalib, musulmans ou non, tant qu'ils ne leur livreraient pas le Prophète ﷺ : interdiction de commercer avec eux, de se marier avec eux ou de leur vendre de la nourriture. Le document fut accroché dans la Ka'ba.",
"Pendant environ trois ans, le clan vécut enfermé dans la vallée d'Abou Talib. La faim fut si dure qu'ils mangeaient des feuilles et que l'on entendait pleurer les enfants. Abou Talib, bien que non musulman, resta fidèle à son neveu. Finalement, quelques hommes de Qouraych, honteux, décidèrent d'annuler le pacte ; on découvrit que des termites avaient mangé tout le document, sauf les mots « Bismika Allahoumma »."],
src:"Tirmidhi 3681 ; Bukhari 3684 ; Ar-Rahiq al-Makhtoum"},
{h:"L'année de la tristesse et Ta'if",y:"619",p:[
"Peu après la fin du boycott, en l'an 10 de la prophétie, le Prophète ﷺ perdit coup sur coup les deux personnes qui l'avaient le plus soutenu. Son oncle Abou Talib tomba malade. Le Prophète ﷺ lui demanda de dire « La ilaha illa Allah », une parole par laquelle il pourrait plaider pour lui auprès d'Allah ; mais, poussé par Abou Jahl, il mourut sur la religion de 'Abd al-Mouttalib. Allah révéla : « Tu ne guides pas qui tu aimes, mais Allah guide qui Il veut » (28:56 ; Bukhari 3884).",
"Quelques semaines plus tard mourut Khadija, son épouse, son soutien et sa confidente pendant vingt-cinq ans. Il ne cessa jamais de l'évoquer avec amour : « Allah ne m'a pas donné meilleure qu'elle : elle a cru en moi quand les gens me rejetaient, elle m'a cru quand les gens me traitaient de menteur, elle m'a soutenu de ses biens quand les gens me privaient » (Ahmad 24864). On appela cette année « l'année de la tristesse ».",
"Privé de la protection de son oncle, le Prophète ﷺ partit à pied, avec Zayd ibn Haritha, vers Ta'if, une ville à environ 80 km, pour appeler la tribu de Thaqif à l'islam. Ses chefs le reçurent très mal et lancèrent contre lui les enfants et les esclaves, qui le poursuivirent en lui jetant des pierres jusqu'à ce que ses pieds saignent.",
"'Aïcha rapporte qu'il lui confia que ce jour fut le plus dur de sa vie. Sur le chemin du retour, Jibril vint avec l'ange des montagnes, qui lui proposa d'écraser les gens de Ta'if entre les deux montagnes. Le Prophète ﷺ répondit : « Non, j'espère plutôt qu'Allah fera sortir de leurs reins des gens qui adoreront Allah seul, sans rien Lui associer » (Bukhari 3231). Sur le chemin, un groupe de djinns écouta sa récitation et crut (46:29-32). Il rentra à La Mecque sous la protection d'un notable non musulman, al-Mout'im ibn 'Adiy."],
src:"Bukhari 3231, 3884 ; Ahmad 24864 ; Ar-Rahiq al-Makhtoum"},
{h:"Le Voyage nocturne et l'Ascension",y:"Vers 620",p:[
"Après ces épreuves, Allah honora Son Prophète ﷺ par un voyage extraordinaire. Une nuit, Jibril vint à lui à La Mecque, ouvrit sa poitrine, la lava avec l'eau de Zamzam et la remplit de foi et de sagesse. On lui amena al-Bouraq, une monture blanche plus grande qu'un âne et plus petite qu'un mulet, dont chaque pas atteignait l'horizon. Il voyagea jusqu'à Jérusalem, où il dirigea la prière des prophètes dans la mosquée al-Aqsa (17:1 ; Muslim 162, 172).",
"Puis il monta à travers les sept cieux avec Jibril. Au premier ciel, il rencontra Adam ; au deuxième, 'Issa et Yahya ; au troisième, Yousouf ; au quatrième, Idris ; au cinquième, Haroun ; au sixième, Moussa ; au septième, Ibrahim, adossé à la Maison peuplée (al-Bayt al-Ma'mour), où entrent chaque jour soixante-dix mille anges qui n'y reviennent jamais. Puis il fut élevé jusqu'au Lotus de la limite (Sidrat al-Mountaha) (Bukhari 3207, 349).",
"Là, Allah prescrivit cinquante prières par jour. En redescendant, Moussa lui conseilla de demander un allègement, car sa communauté ne pourrait le supporter. Le Prophète ﷺ remonta plusieurs fois, jusqu'à ce qu'elles soient réduites à cinq. Allah dit : « Ce sont cinq, et elles valent cinquante ; Ma parole ne change pas » (Bukhari 349). Il reçut aussi les derniers versets d'al-Baqara et la promesse du pardon pour celui de sa communauté qui ne Lui associe rien (Muslim 173).",
"Le lendemain, quand il raconta son voyage, les polythéistes se moquèrent, et certains musulmans fragiles hésitèrent. On alla dire à Abou Bakr : « Ton ami prétend être allé à Jérusalem cette nuit ! » Il répondit : « S'il l'a dit, alors il a dit vrai. Je le crois pour plus étonnant encore : les nouvelles du ciel qui lui parviennent matin et soir. » Il fut alors surnommé as-Siddiq, le véridique. Le Prophète ﷺ décrivit Jérusalem aux sceptiques, et Allah la lui montra pour qu'il réponde à leurs questions (Bukhari 3886)."],
src:"Coran 17:1, 53:13-18 ; Bukhari 349, 3207, 3886 ; Muslim 162, 172, 173"},
{h:"Les serments d'al-'Aqaba",y:"620 – 622",p:[
"Chaque année, pendant le pèlerinage, le Prophète ﷺ allait à la rencontre des tribus arabes pour leur présenter l'islam et chercher une tribu qui le protégerait. Toutes refusaient. En l'an 11 de la prophétie, il rencontra à al-'Aqaba, près de Mina, six hommes de Yathrib (l'ancien nom de Médine), de la tribu des Khazraj. Ils avaient entendu leurs voisins juifs annoncer la venue d'un prophète. Ils crurent et promirent de transmettre le message.",
"L'année suivante, douze hommes de Yathrib vinrent et prêtèrent le premier serment d'al-'Aqaba : ne rien associer à Allah, ne pas voler, ne pas commettre la fornication, ne pas tuer leurs enfants, ne pas calomnier et ne pas désobéir au Prophète ﷺ dans le bien (Bukhari 18). Le Prophète ﷺ envoya avec eux Mous'ab ibn 'Oumayr, un jeune Mecquois de bonne famille, pour leur enseigner le Coran. Grâce à sa douceur et à sa sagesse, l'islam entra dans presque toutes les maisons de Yathrib en une année, dont celles des chefs Sa'd ibn Mou'adh et Ousayd ibn Houdayr.",
"En l'an 13 de la prophétie, soixante-treize hommes et deux femmes de Yathrib rencontrèrent le Prophète ﷺ de nuit, en secret, à al-'Aqaba. Ils prêtèrent le second serment : écouter et obéir, dépenser dans l'aisance et la gêne, ordonner le bien et interdire le mal, et protéger le Prophète ﷺ comme ils protégeaient leurs femmes et leurs enfants, en échange du Paradis. Le Prophète ﷺ autorisa alors les musulmans de La Mecque à émigrer vers Yathrib."],
src:"Bukhari 18 ; Ar-Rahiq al-Makhtoum ; Sirat Ibn Hicham"},
{h:"L'Hégire",y:"622",p:[
"Les musulmans quittèrent La Mecque par petits groupes, souvent en abandonnant leurs biens. Certains furent retenus de force. Bientôt, il ne resta presque plus que le Prophète ﷺ, Abou Bakr, 'Ali et quelques faibles. Inquiets, les chefs de Qouraych se réunirent à Dar an-Nadwa et décidèrent de le tuer : un jeune homme de chaque clan le frapperait en même temps, pour que son clan ne puisse se venger de toute la tribu (8:30).",
"Jibril informa le Prophète ﷺ du complot. Cette nuit-là, il demanda à 'Ali de dormir dans son lit, enveloppé de son manteau, et de rendre ensuite aux Mecquois les dépôts qu'ils lui avaient confiés : même ses ennemis lui confiaient leurs biens. Il sortit à travers les assassins postés devant sa porte en récitant des versets de Ya-Sin (36:9), et ils ne le virent pas.",
"Il rejoignit Abou Bakr, qui avait préparé deux chameaux, et ils se cachèrent trois jours dans la grotte de Thawr, au sud de La Mecque, dans la direction opposée à Médine. Les poursuivants arrivèrent jusqu'à l'entrée. Abou Bakr dit : « Si l'un d'eux regardait à ses pieds, il nous verrait ! » Le Prophète ﷺ répondit : « Que penses-tu de deux personnes dont Allah est le troisième ? » (Bukhari 3653). « Ne t'attriste pas, Allah est avec nous » (9:40). Asma', la fille d'Abou Bakr, leur apportait de la nourriture, et son frère 'Abdullah les informait des nouvelles.",
"Puis ils prirent la route du littoral avec un guide. Qouraych avait promis cent chameaux à qui ramènerait le Prophète ﷺ. Un cavalier, Souraqa ibn Malik, les rattrapa, mais les pattes de son cheval s'enfoncèrent dans le sable à plusieurs reprises. Comprenant qu'il était protégé, il demanda la sécurité et repartit en détournant les autres poursuivants (Bukhari 3906). Après environ deux semaines de voyage, ils arrivèrent à Qouba', aux portes de Médine, où le Prophète ﷺ fonda la première mosquée. Les habitants de Médine montaient chaque matin sur les hauteurs pour guetter son arrivée, et l'accueillirent avec une immense joie. Cet événement marque le début du calendrier musulman, l'Hégire."],
src:"Coran 8:30, 9:40 ; Bukhari 3653, 3906 ; Ar-Rahiq al-Makhtoum"},
{h:"Construire la communauté de Médine",y:"An 1 – 2",p:[
"À Médine, chaque famille voulait accueillir le Prophète ﷺ. Il laissa sa chamelle avancer librement : « Laissez-la, elle est guidée par l'ordre d'Allah. » Elle s'agenouilla sur un terrain appartenant à deux orphelins ; il l'acheta et y construisit sa mosquée, en portant lui-même les briques avec ses compagnons. Il logea d'abord chez Abou Ayyoub al-Ansari.",
"La mosquée devint le centre de la communauté : lieu de prière, d'enseignement, de conseil et d'accueil des délégations. Une partie couverte, la Souffa, abritait les compagnons pauvres sans famille, dont Abou Hourayra. L'appel à la prière (adhan) fut institué après un rêve de 'Abdullah ibn Zayd, confirmé par 'Umar, et Bilal, à la belle voix, devint le premier muezzin (Abou Daoud 499).",
"Le Prophète ﷺ établit une fraternité entre les émigrés de La Mecque (al-Mouhajiroun), qui avaient tout perdu, et les habitants de Médine (al-Ansar). Sa'd ibn ar-Rabi', un Ansari, proposa à 'Abd ar-Rahman ibn 'Awf de partager ses biens en deux. 'Abd ar-Rahman répondit : « Qu'Allah te bénisse dans ta famille et tes biens ; montre-moi seulement le chemin du marché. » Il commença à commercer et devint l'un des hommes les plus riches de Médine (Bukhari 2049).",
"Il rédigea aussi un document, appelé la Charte de Médine, qui organisait les relations entre les musulmans, les tribus arabes et les tribus juives de la ville : défense commune de Médine, liberté de religion, et recours au Prophète ﷺ pour trancher les différends. En l'an 2, la direction de la prière passa de Jérusalem à La Mecque (2:144), et le jeûne du Ramadan ainsi que la zakat furent prescrits."],
src:"Bukhari 2049 ; Abou Daoud 499 ; Ar-Rahiq al-Makhtoum"},
{h:"La bataille de Badr",y:"Ramadan, an 2 (624)",p:[
"Une grande caravane de Qouraych, conduite par Abou Soufyan, revenait de Syrie chargée de marchandises. Le Prophète ﷺ sortit avec environ 313 compagnons, deux chevaux et soixante-dix chameaux, pour l'intercepter, en compensation des biens que les Mecquois avaient pris aux émigrés. Abou Soufyan changea de route et prévint La Mecque, qui envoya une armée d'environ mille hommes bien équipés.",
"La caravane s'étant échappée, le Prophète ﷺ consulta ses compagnons sur l'idée d'affronter l'armée. Les émigrés acceptèrent. Il voulait aussi l'avis des Ansar, qui n'avaient promis de le protéger qu'à Médine. Sa'd ibn Mou'adh répondit : « Nous avons cru en toi ; si tu traversais la mer avec nous, nous y entrerions avec toi. Conduis-nous où Allah le veut. » Al-Miqdad ajouta : « Nous ne te dirons pas comme le peuple de Moussa : va, toi et ton Seigneur, et combattez. »",
"Sur le conseil d'al-Houbab ibn al-Moundhir, les musulmans s'installèrent près des puits de Badr. La nuit précédant la bataille, Allah fit tomber une pluie qui affermit le sable sous leurs pieds et une somnolence qui apaisa leurs cœurs (8:11). Le Prophète ﷺ passa la nuit à invoquer, les mains levées, jusqu'à ce que son manteau tombe de ses épaules : « Ô Allah, si ce petit groupe périt, Tu ne seras plus adoré sur terre » (Muslim 1763).",
"Le 17 Ramadan, la bataille eut lieu. Allah envoya des anges en renfort (8:9). Les musulmans remportèrent une victoire éclatante : soixante-dix Mecquois furent tués, dont Abou Jahl et d'autres chefs, et soixante-dix capturés. Quatorze musulmans tombèrent en martyrs. Les prisonniers furent bien traités, et certains furent libérés contre une rançon ou contre l'enseignement de la lecture à dix enfants de Médine. Le Coran appelle ce jour « le jour du discernement » (8:41)."],
src:"Coran 8 ; Muslim 1763 ; Bukhari 3952 ; Ar-Rahiq al-Makhtoum"},
{h:"La bataille d'Ouhoud",y:"Chawwal, an 3 (625)",p:[
"Un an après Badr, Qouraych revint avec trois mille hommes pour se venger. Le Prophète ﷺ préférait défendre Médine de l'intérieur, mais de nombreux jeunes compagnons, qui n'avaient pas participé à Badr, insistèrent pour sortir. Il accepta, en respectant l'avis de la majorité. En chemin, l'hypocrite 'Abdullah ibn Oubayy se retira avec trois cents hommes, laissant environ sept cents musulmans.",
"Le Prophète ﷺ plaça cinquante archers sur une petite colline (le mont des archers) avec un ordre clair : « Ne quittez pas votre position, même si vous voyez les oiseaux nous emporter » (Bukhari 3039). Au début, les musulmans prirent l'avantage et les Mecquois s'enfuirent. Voyant cela, la plupart des archers descendirent ramasser le butin, malgré leur chef.",
"Khalid ibn al-Walid, alors encore polythéiste, profita de l'ouverture pour contourner la colline et attaquer par derrière. La panique gagna les rangs. Le Prophète ﷺ fut blessé au visage, une de ses dents fut cassée, et la rumeur de sa mort se répandit. Un petit groupe de compagnons le protégea de leurs corps. Soixante-dix musulmans furent tués, dont Hamza, l'oncle du Prophète ﷺ, tué par Wahchi, et Mous'ab ibn 'Oumayr, qui portait l'étendard.",
"Le Coran tira les leçons de cette défaite dans la sourate Al 'Imran (3:121-179) : l'obéissance est une condition de la victoire ; « certains d'entre vous voulaient ce monde, et d'autres l'au-delà » (3:152) ; et « Muhammad n'est qu'un messager ; des messagers sont passés avant lui. S'il mourait ou était tué, retourneriez-vous sur vos talons ? » (3:144). Le lendemain, malgré les blessures, le Prophète ﷺ poursuivit l'armée mecquoise jusqu'à Hamra' al-Asad pour montrer que les musulmans restaient forts (3:172-173)."],
src:"Coran 3:121-179 ; Bukhari 3039 ; Ar-Rahiq al-Makhtoum"},
{h:"La bataille du Fossé",y:"Chawwal, an 5 (627)",p:[
"Des chefs de la tribu juive des Banou an-Nadir, expulsés de Médine pour trahison, allèrent à La Mecque et dans les tribus arabes pour former une grande coalition (al-Ahzab) contre les musulmans. Environ dix mille hommes marchèrent sur Médine, qui ne comptait qu'environ trois mille défenseurs.",
"Salman al-Farisi, un compagnon d'origine perse, proposa une technique inconnue des Arabes : creuser un grand fossé (khandaq) au nord de Médine, le seul côté ouvert. Les musulmans le creusèrent en quelques jours, dans le froid et la faim, le Prophète ﷺ portant la terre avec eux. Il frappa lui-même un rocher que personne n'arrivait à briser, et à chaque coup annonça les futures conquêtes du Cham, de la Perse et du Yémen (Ahmad 18694).",
"Les coalisés, surpris par le fossé, assiégèrent Médine pendant près d'un mois. La situation devint critique quand la tribu juive des Banou Qourayza, à l'intérieur de Médine, rompit son pacte avec les musulmans. « Les cœurs remontèrent aux gorges » (33:10). Les hypocrites se moquaient, mais les croyants dirent : « Voilà ce qu'Allah et Son Messager nous avaient promis » (33:22).",
"Un nouveau musulman, Nou'aym ibn Mas'oud, réussit à semer la méfiance entre les coalisés et les Banou Qourayza. Puis Allah envoya un vent glacial et violent qui renversa leurs marmites et arracha leurs tentes. Les coalisés repartirent sans avoir rien obtenu (33:9, 25). Le Prophète ﷺ dit : « Désormais, c'est nous qui irons vers eux, et ils ne viendront plus vers nous » (Bukhari 4110). Les Banou Qourayza furent ensuite assiégés et jugés pour leur trahison."],
src:"Coran 33:9-27 ; Bukhari 4110 ; Ar-Rahiq al-Makhtoum"},
{h:"Houdaybiyya, les lettres aux rois et Khaybar",y:"An 6 – 7 (628)",p:[
"En l'an 6, le Prophète ﷺ vit en rêve qu'il faisait la 'Omra. Il partit avec environ 1 400 compagnons, en état d'ihram, sans armes de guerre, avec des bêtes à sacrifier. Qouraych refusa de les laisser entrer à La Mecque. Ils campèrent à al-Houdaybiyya. Le Prophète ﷺ envoya 'Uthman négocier ; la rumeur de sa mort se répandit, et les compagnons prêtèrent serment sous un arbre de combattre jusqu'à la mort : c'est le serment de la satisfaction (Bay'at ar-Ridwan) (48:18).",
"Finalement, un traité fut signé : une trêve de dix ans ; les musulmans repartiraient cette année et reviendraient l'année suivante pour la 'Omra ; et tout Mecquois rejoignant Médine sans permission serait renvoyé, mais pas l'inverse. 'Umar, choqué, demanda : « Ne sommes-nous pas dans la vérité ? Pourquoi accepter cette humiliation ? » Le Prophète ﷺ répondit : « Je suis le Messager d'Allah, je ne Lui désobéis pas, et Il me secourra » (Bukhari 2731). Sur le chemin du retour, Allah révéla : « Nous t'avons accordé une victoire éclatante » (48:1).",
"La paix permit à l'islam de se répandre comme jamais. Le Prophète ﷺ envoya des lettres aux grands souverains : Héraclius, empereur byzantin, qui interrogea Abou Soufyan sur le Prophète ﷺ et reconnut la vérité de son message sans oser le suivre (Bukhari 7) ; Chosroès, roi de Perse, qui déchira la lettre ; al-Mouqawqis, gouverneur d'Égypte, qui envoya des cadeaux ; et le Négus.",
"En l'an 7, les musulmans assiégèrent Khaybar, une oasis fortifiée au nord de Médine d'où partaient de nombreux complots. Après plusieurs jours, le Prophète ﷺ dit : « Demain, je donnerai l'étendard à un homme qui aime Allah et Son Messager, et qu'Allah et Son Messager aiment ; Allah lui donnera la victoire. » Le lendemain, il le donna à 'Ali, qui prit la forteresse principale (Bukhari 3701). L'année suivante, les musulmans accomplirent la 'Omra prévue par le traité."],
src:"Coran 48 ; Bukhari 7, 2731, 3701 ; Ar-Rahiq al-Makhtoum"},
{h:"La conquête de La Mecque",y:"Ramadan, an 8 (630)",p:[
"Moins de deux ans après le traité, la tribu des Banou Bakr, alliée de Qouraych, attaqua de nuit la tribu de Khouza'a, alliée des musulmans, avec l'aide d'armes et d'hommes de Qouraych. Le traité était rompu. Le Prophète ﷺ prépara en secret une armée de dix mille hommes et marcha sur La Mecque pendant le mois de Ramadan.",
"Abou Soufyan, chef de Qouraych, sortit en reconnaissance, fut amené devant le Prophète ﷺ et embrassa l'islam. Le Prophète ﷺ fit annoncer : « Celui qui entre dans la maison d'Abou Soufyan est en sécurité ; celui qui ferme sa porte est en sécurité ; celui qui entre dans la Mosquée sacrée est en sécurité » (Muslim 1780). L'armée entra presque sans combat. Le Prophète ﷺ entra la tête baissée sur sa monture, en signe d'humilité devant Allah, en récitant la sourate al-Fath.",
"Il se rendit à la Ka'ba et brisa les trois cent soixante idoles qui l'entouraient avec un bâton, en récitant : « La vérité est venue et le mensonge a disparu ; le mensonge est voué à disparaître » (17:81 ; Bukhari 4287). Bilal monta sur la Ka'ba pour lancer l'appel à la prière.",
"Puis il s'adressa aux Qouraychites réunis, ceux qui l'avaient insulté, persécuté, chassé et combattu pendant vingt ans : « Que pensez-vous que je vais faire de vous ? » « Du bien : tu es un frère généreux, fils d'un frère généreux. » « Je vous dis ce que Yousouf a dit à ses frères : pas de reproche contre vous aujourd'hui. Allez, vous êtes libres. » Les gens entrèrent en foule dans l'islam. Quelques semaines plus tard, les musulmans affrontèrent les tribus de Hawazin à Hounayn ; leur grand nombre les rendit d'abord fiers, ils furent surpris, puis Allah leur donna la victoire (9:25-26)."],
src:"Coran 17:81, 9:25-26, 110 ; Muslim 1780 ; Bukhari 4287 ; Ar-Rahiq al-Makhtoum"},
{h:"Tabouk et l'année des délégations",y:"An 9 (630 – 631)",p:[
"En l'an 9, on apprit que l'empire byzantin rassemblait des troupes au nord. Le Prophète ﷺ appela à une expédition lointaine vers Tabouk, en pleine chaleur, au moment de la récolte des dattes, et en période de pauvreté : on l'appela « l'armée de la difficulté ». 'Uthman équipa une grande partie de l'armée à ses frais ; Abou Bakr donna tous ses biens, et 'Umar la moitié des siens (Tirmidhi 3675). Environ trente mille hommes partirent.",
"Arrivés à Tabouk, ils ne trouvèrent pas d'armée byzantine. Le Prophète ﷺ y resta une vingtaine de jours et conclut des traités avec les tribus de la région. Les hypocrites qui étaient restés à Médine sous de faux prétextes furent démasqués par la sourate at-Tawba. Trois compagnons sincères, dont Ka'b ibn Malik, restés sans excuse, avouèrent leur faute ; ils furent mis à l'écart cinquante jours, puis Allah accepta leur repentir (9:118 ; Bukhari 4418).",
"Après la conquête de La Mecque et Tabouk, les tribus de toute l'Arabie envoyèrent des délégations à Médine pour embrasser l'islam ou conclure des pactes : l'an 9 fut appelé « l'année des délégations ». Thaqif, la tribu de Ta'if qui avait chassé le Prophète ﷺ à coups de pierres, vint embrasser l'islam, comme il l'avait espéré. Le Prophète ﷺ envoya des compagnons comme Mou'adh ibn Jabal au Yémen pour enseigner la religion, en lui recommandant de commencer par le tawhid, puis la prière, puis la zakat (Bukhari 1395).",
"Cette année-là, Abou Bakr dirigea le pèlerinage, et l'on proclama qu'aucun polythéiste ne ferait plus le pèlerinage et que personne ne ferait plus le tour de la Ka'ba nu (Bukhari 369)."],
src:"Coran 9 ; Bukhari 369, 1395, 4418 ; Tirmidhi 3675"},
{h:"Le pèlerinage d'adieu",y:"Dhoul-Hijja, an 10 (632)",p:[
"En l'an 10, le Prophète ﷺ annonça qu'il ferait le pèlerinage. Plus de cent mille personnes vinrent de toute l'Arabie pour l'accompagner et apprendre de lui les rites. Ce fut son unique pèlerinage. Il disait : « Prenez de moi vos rites, car je ne sais pas si je ferai le pèlerinage après cette année » (Muslim 1297).",
"Le jour de 'Arafat, il prononça un sermon resté célèbre (Muslim 1218) : « Votre sang et vos biens vous sont sacrés, comme ce jour, en ce mois, en cette ville. Toute pratique de la Jahiliyya est abolie sous mes pieds. L'usure de la Jahiliyya est abolie. Craignez Allah au sujet des femmes : vous les avez prises sous la garantie d'Allah. Je laisse parmi vous ce qui, si vous vous y attachez, vous empêchera de vous égarer : le Livre d'Allah. » Puis il demanda : « On vous interrogera sur moi, que direz-vous ? » « Nous témoignons que tu as transmis, accompli et conseillé. » Il leva l'index vers le ciel puis vers les gens : « Ô Allah, sois témoin ! » trois fois.",
"Dans un autre sermon du pèlerinage, il dit : « Ô gens, votre Seigneur est unique et votre père est unique. Un Arabe n'a aucune supériorité sur un non-Arabe, ni un non-Arabe sur un Arabe, ni un blanc sur un noir, ni un noir sur un blanc, sauf par la piété » (Ahmad 23489). Ce jour-là fut révélé : « Aujourd'hui, J'ai parachevé pour vous votre religion, accompli sur vous Mon bienfait, et agréé l'islam comme religion pour vous » (5:3 ; Bukhari 45). Certains compagnons pleurèrent, comprenant que la mission touchait à sa fin."],
src:"Coran 5:3 ; Muslim 1218, 1297 ; Bukhari 45 ; Ahmad 23489"},
{h:"La maladie et le décès",y:"Rabi' al-Awwal, an 11 (632)",p:[
"Quelques semaines après son retour de La Mecque, le Prophète ﷺ visita le cimetière d'al-Baqi' et pria pour les morts, puis tomba malade, avec une forte fièvre et des maux de tête. Il demanda à ses épouses la permission d'être soigné dans la chambre de 'Aïcha. Quand il ne put plus sortir, il ordonna : « Dites à Abou Bakr de diriger la prière des gens » (Bukhari 664).",
"Pendant sa maladie, il recommanda la prière et le bon traitement des esclaves et des serviteurs, et dit : « Je mets en garde contre le fait de prendre les tombes des prophètes pour lieux de prière. » Il confia à sa fille Fatima qu'il allait mourir, et elle pleura ; puis il lui dit qu'elle serait la première de sa famille à le rejoindre, et elle sourit (Bukhari 3623). Le lundi matin, il souleva le rideau de sa chambre et regarda les musulmans rangés en prière derrière Abou Bakr ; il sourit de joie (Bukhari 680).",
"Dans ses derniers instants, la tête posée sur la poitrine de 'Aïcha, il trempait sa main dans un récipient d'eau, s'essuyait le visage et disait : « La ilaha illa Allah, la mort a ses agonies. » Puis il leva la main et dit : « Avec le Compagnon suprême (ar-Rafiq al-A'la) », et son âme fut reprise (Bukhari 4449, 6510). C'était le lundi 12 Rabi' al-Awwal de l'an 11, selon l'avis le plus répandu. Il avait soixante-trois ans.",
"La nouvelle bouleversa Médine. 'Umar, sous le choc, refusait d'y croire. Abou Bakr entra, découvrit le visage du Prophète ﷺ, l'embrassa et dit : « Tu es pur vivant et mort. » Puis il sortit et dit aux gens : « Celui qui adorait Muhammad, Muhammad est mort. Et celui qui adore Allah, Allah est vivant et ne meurt pas. » Et il récita : « Muhammad n'est qu'un messager ; des messagers sont passés avant lui… » (3:144). Les gens eurent l'impression de n'avoir jamais entendu ce verset (Bukhari 1241). Il fut enterré dans la chambre de 'Aïcha, à l'endroit où il était mort, aujourd'hui dans la mosquée du Prophète à Médine. Il ne laissa ni or ni argent, mais le Coran et la Sunna."],
src:"Coran 3:144 ; Bukhari 664, 680, 1241, 3623, 4449, 6510"},
{h:"Sa famille et son caractère",y:"",p:[
"Ses épouses, les mères des croyants (33:6) : Khadija, Sawda, 'Aïcha, Hafsa, Zaynab bint Khouzayma, Oumm Salama, Zaynab bint Jahch, Jouwayriyya, Oumm Habiba, Safiyya et Maymouna. À part 'Aïcha, toutes avaient été mariées auparavant, et la plupart de ces mariages avaient un but social ou politique : protéger des veuves, unir des tribus ou abolir des coutumes. Ses enfants : al-Qasim, 'Abdullah et Ibrahim, morts petits, et quatre filles, Zaynab, Rouqayya, Oumm Koulthoum et Fatima. Seule Fatima lui survécut ; elle mourut six mois après lui. Sa descendance vient d'elle et de 'Ali, par al-Hassan et al-Houssayn.",
"Sa description : il était de taille moyenne, au teint clair légèrement rosé, aux cheveux noirs ondulés qui atteignaient ses oreilles ou ses épaules, à la barbe épaisse ; son visage était le plus beau des visages, lumineux « comme la lune » (Bukhari 3549, 3552). Il marchait d'un pas vif, comme s'il descendait une pente.",
"Son caractère : « Tu es d'un caractère éminent » (68:4). 'Aïcha a dit : « Son caractère était le Coran » (Muslim 746). Anas, qui le servit dix ans, a dit : « Il ne m'a jamais dit ouf, ni demandé pourquoi j'avais fait ceci ou pourquoi je ne l'avais pas fait » (Bukhari 6038). Il raccommodait ses vêtements, réparait ses sandales, aidait sa famille dans les tâches de la maison, et quand venait l'heure de la prière, il sortait prier (Bukhari 676). Il n'a jamais frappé de sa main ni une femme ni un serviteur, sauf en combattant dans la voie d'Allah (Muslim 2328).",
"Il était le plus généreux des hommes, surtout pendant le Ramadan (Bukhari 6). Il ne refusait rien à celui qui demandait. Il souriait souvent, plaisantait sans jamais mentir, saluait les enfants, visitait les malades, même non musulmans, et acceptait l'invitation des pauvres. Il dormait sur une natte qui laissait des marques sur son côté ; 'Umar en pleura, et il répondit : « Ne veux-tu pas qu'ils aient ce monde et que nous ayons l'au-delà ? » (Bukhari 4913). Il priait la nuit jusqu'à ce que ses pieds enflent, et disait : « Ne devrais-je pas être un serviteur reconnaissant ? » (Bukhari 4837). Allah dit : « Vous avez dans le Messager d'Allah un excellent modèle » (33:21)."],
src:"Coran 33:21, 68:4 ; Bukhari 6, 676, 3549, 4837, 4913, 6038 ; Muslim 746, 2328"}
];

// Explications complètes des réponses du quiz (remplacent les explications courtes, dans l'ordre de QUIZ)
const QUIZ_E=[
"C'est le hadith « Les actes ne valent que par les intentions », rapporté par 'Umar ibn al-Khattab (Bukhari 1, Muslim 1907). An-Nawawi et beaucoup de savants avant lui ont placé ce hadith en tête de leurs livres pour rappeler au lecteur de purifier son intention avant d'apprendre. Une même action peut être une adoration récompensée ou un acte sans valeur selon l'intention.",
"Le Prophète ﷺ a défini l'ihsan ainsi : « Adorer Allah comme si tu Le voyais ; car si tu ne Le vois pas, Lui te voit » (Muslim 8). C'est le plus haut degré de la religion, après l'islam (les actes) et l'iman (la foi du cœur). Il a deux niveaux : prier avec la présence du cœur comme si l'on voyait Allah, ou au moins garder conscience qu'Allah nous voit.",
"C'est le cœur. Le hadith 6 dit : « Il y a dans le corps un morceau de chair : s'il est sain, tout le corps est sain ; s'il est corrompu, tout le corps est corrompu. C'est le cœur » (Bukhari 52, Muslim 1599). Les actes extérieurs suivent l'état du cœur : réformer ses intentions et ses sentiments est donc la base de tout.",
"Le Prophète ﷺ répondit « Ne te mets pas en colère », et le répéta plusieurs fois quand l'homme redemanda un conseil (Bukhari 6116, hadith 16). La colère pousse à beaucoup de péchés : insultes, violence, ruptures. Les remèdes de la Sunna : chercher refuge auprès d'Allah contre Satan, s'asseoir ou s'allonger, se taire et faire les ablutions.",
"Ce sont « les récoltes de leurs langues » (Tirmidhi 2616, hadith 29). Après avoir enseigné à Mou'adh les piliers et les portes du bien, le Prophète ﷺ montra sa langue et dit : « Retiens ceci. » La médisance, le mensonge, la calomnie et la moquerie peuvent détruire les bonnes œuvres.",
"Il reçoit une bonne action complète (Bukhari 6491, Muslim 131). Renoncer à un péché par crainte d'Allah est en soi un acte récompensé. Dans le même hadith : l'intention d'une bonne action est déjà écrite comme une bonne action, et une bonne action accomplie est multipliée de dix à sept cents fois, alors qu'une mauvaise action n'est comptée qu'une fois.",
"« Sois dans ce monde comme un étranger ou un voyageur de passage » (Bukhari 6416, hadith 40). Le Prophète ﷺ le dit en prenant Ibn 'Umar par l'épaule. Le voyageur ne s'attache pas à l'étape : il prend ce qui lui est utile et prépare sa destination. Ibn 'Umar ajoutait : « Le soir, n'attends pas le matin ; le matin, n'attends pas le soir. »",
"Un hadith qoudsi est une parole dont le sens vient d'Allah, rapportée par le Prophète ﷺ avec ses propres mots, souvent introduite par « Allah a dit ». Il est différent du Coran, qui est la parole d'Allah dans sa lettre et son sens, récitée dans la prière. Dans le recueil d'an-Nawawi, les hadiths 24, 38 et 42 sont des hadiths qoudsi.",
"La moitié : « La purification est la moitié de la foi » (Muslim 223, hadith 23). Les savants l'expliquent de deux façons : la purification extérieure (ablutions) est la moitié de la prière, qui est elle-même une grande partie de la foi ; ou bien la foi consiste à se purifier des péchés et à s'embellir d'obéissance, et la purification en est la première moitié.",
"« Muttafaq 'alayh » signifie « sur lequel ils sont d'accord » : un hadith rapporté à la fois par al-Bukhari et par Muslim, d'après le même compagnon. C'est le plus haut degré d'authenticité, car les deux recueils sont considérés par les savants comme les livres les plus authentiques après le Coran.",
"C'est Iblis. Il refusa par orgueil en disant : « Je suis meilleur que lui ; Tu m'as créé de feu et Tu l'as créé d'argile » (7:12). Iblis était un djinn (18:50), pas un ange, mais il se trouvait parmi eux. Ce refus est le premier péché d'orgueil, et la raison de son inimitié envers les enfants d'Adam.",
"950 ans : « Il demeura parmi eux mille ans moins cinquante » (29:14). Nouh appela son peuple nuit et jour, en public et en privé, sans se décourager, mais seuls quelques-uns crurent. Son histoire est un modèle de patience pour tous ceux qui appellent au bien.",
"Une chamelle, sortie du rocher comme signe d'Allah, envoyée au peuple de Thamoud par le prophète Salih (7:73). Ils devaient la laisser en paix et partager l'eau avec elle un jour sur deux. Ils la tuèrent, et un Cri terrible les anéantit trois jours plus tard.",
"Le feu devint « fraîcheur et paix pour Ibrahim » sur l'ordre d'Allah (21:69). Son peuple l'y avait jeté parce qu'il avait brisé leurs idoles. Ibrahim dit alors : « Allah me suffit, quel excellent garant » (Bukhari 4563). Le feu ne brûla que ses liens.",
"Isma'il, le fils d'Ibrahim et de Hajar. « Ibrahim et Isma'il élevaient les fondations de la Maison : Notre Seigneur, accepte cela de nous » (2:127). Isma'il apportait les pierres et Ibrahim construisait, debout sur la pierre appelée Maqam Ibrahim.",
"La sourate 12, Yousouf. C'est la seule sourate qui raconte une histoire complète du début à la fin : le rêve, le puits, l'Égypte, la prison, le pouvoir et les retrouvailles. Allah l'appelle « la plus belle des histoires » (12:3).",
"Ayyoub (Job). Après de longues années de maladie et la perte de ses biens et de ses enfants, il invoqua sans se plaindre d'Allah : « Le mal m'a touché, et Tu es le plus Miséricordieux des miséricordieux » (21:83). Allah le guérit et lui rendit sa famille, et dit de lui : « Quel excellent serviteur ! » (38:44).",
"Le peuple de Madyan, à qui fut envoyé Chou'ayb (11:84-85). En plus de l'idolâtrie, ils trichaient sur les balances et diminuaient les biens des gens. Chou'ayb leur montra que l'honnêteté commerciale fait partie de la religion. Ils furent anéantis par un tremblement de terre.",
"Soulayman (Salomon). En arrivant à la vallée des fourmis, il entendit une fourmi avertir les siennes de rentrer pour ne pas être écrasées par son armée (27:18-19). Il sourit et remercia Allah de ce bienfait. Allah lui avait donné le langage des oiseaux et des animaux.",
"« La ilaha illa anta, soubhanaka, inni kountou mina adh-dhalimin » : il n'y a de divinité que Toi, gloire à Toi, j'ai été parmi les injustes (21:87). Allah l'exauça et le sauva. Le Prophète ﷺ a dit qu'aucun musulman n'invoque par ces paroles sans qu'Allah ne l'exauce (Tirmidhi 3505).",
"25 prophètes sont nommés dans le Coran, d'Adam à Muhammad ﷺ. Mais Allah a envoyé bien d'autres prophètes et messagers : « Il en est dont Nous t'avons raconté l'histoire, et il en est dont Nous ne t'avons pas raconté l'histoire » (40:78). On croit en tous, sans faire de distinction entre eux dans la foi.",
"Allah l'a élevé vers Lui : « Ils ne l'ont ni tué ni crucifié, mais cela leur a été rendu ambigu… Allah l'a élevé vers Lui » (4:157-158). Les musulmans croient aussi à son retour à la fin des temps, annoncé dans des hadiths authentiques, où il tuera le Dajjal (Muslim 2937).",
"Dans la grotte de Hira', sur une montagne près de La Mecque, pendant le Ramadan de l'année 610 (Bukhari 3). Le Prophète ﷺ avait quarante ans et aimait s'y retirer pour adorer Allah. La grotte de Thawr, elle, est celle où il se cacha pendant l'Hégire.",
"« Lis, au nom de ton Seigneur qui a créé… » : les cinq premiers versets de la sourate al-'Alaq (96:1-5). La première parole de la révélation est un ordre de lire et d'apprendre au nom d'Allah. Al-Fatiha est la première sourate du Mushaf, mais pas la première révélée.",
"En 622 de l'ère commune, l'année de l'émigration du Prophète ﷺ de La Mecque vers Médine. Le calendrier de l'Hégire fut fixé plus tard par le calife 'Umar, sur le conseil des compagnons. C'est un calendrier lunaire : l'année compte environ 354 jours.",
"Abou Bakr as-Siddiq. Ils se cachèrent trois jours dans la grotte de Thawr. Quand les poursuivants arrivèrent à l'entrée, Abou Bakr s'inquiéta, et le Prophète ﷺ lui dit : « Ne t'attriste pas, Allah est avec nous » (9:40 ; Bukhari 3653). 'Ali, lui, dormit dans le lit du Prophète ﷺ cette nuit-là.",
"La bataille du Fossé (al-Khandaq), en l'an 5. Sur le conseil de Salman al-Farisi, les musulmans creusèrent un fossé au nord de Médine face à une coalition d'environ dix mille hommes. Après un mois de siège, Allah envoya un vent glacial et les coalisés repartirent (33:9).",
"Le Négus (an-Najachi), roi d'Abyssinie. Quand Qouraych demanda qu'on lui livre les musulmans, il écouta d'abord Ja'far ibn Abi Talib réciter la sourate Maryam, pleura, puis refusa de les livrer (Ahmad 1740). À sa mort, le Prophète ﷺ pria sur lui la prière funéraire en son absence (Bukhari 1245).",
"« Une victoire éclatante » (48:1). Le traité semblait défavorable, mais la paix permit aux gens de découvrir l'islam librement : en deux ans, plus de gens se convertirent qu'en dix-neuf ans auparavant, et La Mecque fut conquise peu après. Le Prophète ﷺ disait que cette sourate lui était plus chère que tout ce sur quoi le soleil se lève (Bukhari 4177).",
"Khadija, son épouse. Quand il revint tremblant de la grotte de Hira', elle le rassura : « Allah ne t'humiliera jamais… » et le conduisit chez Waraqa (Bukhari 3). Elle crut en lui la première, et le soutint de ses biens pendant les années difficiles. Parmi les hommes, le premier fut Abou Bakr ; parmi les enfants, 'Ali.",
"Trois unités. Les cinq prières comptent : Fajr 2 unités, Dhouhr 4, 'Asr 4, Maghrib 3 et 'Icha 4, soit 17 unités obligatoires par jour. Le Maghrib est la seule prière obligatoire qui compte un nombre impair d'unités, et elle ne se raccourcit pas en voyage.",
"2,5 % (un quarantième) de l'épargne en argent, en or ou en marchandises, quand elle atteint le seuil (nisab, l'équivalent de 85 g d'or) et reste en possession pendant une année lunaire. La zakat est le troisième pilier de l'islam. Elle purifie les biens et est donnée aux huit catégories citées en 9:60.",
"Six piliers de la foi : croire en Allah, en Ses anges, en Ses livres, en Ses messagers, au Jour dernier et au destin, dans son bien comme dans son mal (Muslim 8). À ne pas confondre avec les cinq piliers de l'islam, qui sont des actes : la chahada, la prière, la zakat, le jeûne et le pèlerinage.",
"Le Zabour, c'est-à-dire les Psaumes : « Nous avons donné le Zabour à Daoud » (4:163). Les autres livres cités dans le Coran sont la Torah donnée à Moussa, l'Évangile (Injil) donné à 'Issa, les feuillets d'Ibrahim, et le Coran révélé à Muhammad ﷺ.",
"Al-Ikhlas (sourate 112), qui équivaut au tiers du Coran (Bukhari 5013). Les savants expliquent que le Coran parle de trois grands thèmes : Allah et Ses attributs, les lois, et les récits avec la rétribution. Al-Ikhlas résume entièrement le premier thème : l'unicité d'Allah.",
"« Soubhana rabbiya al-a'la » : gloire à mon Seigneur le Très-Haut, dit au moins une fois et de préférence trois fois. Cette formule vient de la sourate al-A'la : le Prophète ﷺ a dit de la mettre dans la prosternation (Abou Daoud 869). Dans l'inclinaison, on dit « Soubhana rabbiya al-'adhim ».",
"Sayyid al-istighfar, « le maître de la demande de pardon » (Bukhari 6306). Celui qui la dit le matin avec conviction et meurt ce jour-là entre au Paradis, de même le soir. Elle réunit la reconnaissance d'Allah comme Seigneur, l'aveu de ses péchés et la demande de pardon.",
"« Allahoumma ftah li abwaba rahmatik » : ô Allah, ouvre-moi les portes de Ta miséricorde (Muslim 713). On entre du pied droit. En sortant, on dit : « Allahoumma inni as'alouka min fadlik » (ô Allah, je Te demande de Ta grâce), et on sort du pied gauche.",
"« Rabbana atina fi d-dounya hassana, wa fi l-akhirati hassana, wa qina 'adhaba n-nar » : notre Seigneur, accorde-nous une belle part ici-bas et une belle part dans l'au-delà, et protège-nous du châtiment du Feu (2:201). Anas rapporte que c'était l'invocation que le Prophète ﷺ faisait le plus souvent (Bukhari 6389). Elle réunit tout le bien des deux mondes.",
"Al-Wadoud signifie le Très Aimant : Celui qui aime Ses serviteurs croyants et qui est aimé d'eux. Il apparaît dans « Il est le Pardonneur, le Très Aimant » (85:14). Allah aime ceux qui se repentent, les pieux, les patients et les bienfaisants.",
"At-Tawwab signifie Celui qui accepte toujours le repentir. Le mot exprime la répétition : Allah accepte le repentir encore et encore, chaque fois que le serviteur revient vers Lui sincèrement. Il est aussi Celui qui guide d'abord Son serviteur vers le repentir.",
"As-Samad est le Soutien universel : le Maître parfait vers qui toutes les créatures se tournent dans leurs besoins, alors que Lui n'a besoin de personne. Ce nom apparaît dans la sourate al-Ikhlas : « Allah, as-Samad » (112:2)."
];

// Explications détaillées des sourates. Sources : Tafsir d'Ibn Kathir, Tafsir as-Sa'di, Tafsir at-Tabari ; causes de révélation authentiques citées avec leur source.
const SD={};
SD[78]={ctx:"Sourate mecquoise révélée à une période où les Qouraychites discutaient entre eux de la résurrection annoncée par le Prophète ﷺ : certains la niaient, d'autres doutaient. La sourate répond à ces discussions en commençant par une question, puis en présentant des preuves visibles de la puissance d'Allah.",
parts:[
["1-5","La grande nouvelle","« Sur quoi s'interrogent-ils mutuellement ? Sur la grande nouvelle, à propos de laquelle ils divergent. » La grande nouvelle est la résurrection et le Jour du jugement, selon la majorité des commentateurs. Allah répond par une menace répétée deux fois : « Non, ils sauront bientôt ! Encore non, ils sauront bientôt ! » Ce qu'ils discutent avec légèreté, ils le verront de leurs yeux."],
["6-16","Les preuves dans la création","Allah énumère des bienfaits que chacun peut voir, pour montrer que Celui qui les a créés peut aussi ressusciter : la terre étalée comme un berceau, les montagnes plantées comme des piquets qui la stabilisent, la création en couples (homme et femme), le sommeil qui coupe la fatigue, la nuit qui couvre comme un vêtement, le jour pour gagner sa vie, les sept cieux solides au-dessus de nous, le soleil comme une lampe ardente, et la pluie qui fait pousser les grains, les plantes et les jardins touffus.\nLe raisonnement est simple : Celui qui a fait tout cela à partir de rien est capable de recréer l'homme après sa mort."],
["17-20","Le Jour du tri","« Le Jour du tri a un terme fixé. » Ce jour-là, on soufflera dans la trompe et les gens viendront en groupes. Le ciel s'ouvrira et deviendra comme des portes, et les montagnes seront mises en marche jusqu'à devenir un mirage."],
["21-30","L'Enfer, une embuscade","L'Enfer guette les transgresseurs comme une embuscade. Ils y demeureront pendant de longues périodes, sans goûter fraîcheur ni boisson, sauf une eau bouillante et un pus. C'est une rétribution juste et équivalente : ils n'espéraient pas rendre de comptes et traitaient Nos signes de mensonges. Or chaque chose a été comptée et écrite. « Goûtez donc ! Nous ne ferons qu'augmenter votre châtiment. »"],
["31-36","La réussite des pieux","Pour les pieux, il y a la réussite : des jardins, des vignes, des compagnes du même âge et une coupe pleine. Ils n'y entendront ni futilités ni mensonges. C'est une récompense de leur Seigneur, un don largement suffisant. Le contraste avec le passage précédent est voulu : le Coran présente souvent ensemble la crainte et l'espoir."],
["37-40","Le regret du mécréant","Ce jour-là, l'Esprit (Jibril) et les anges se tiendront en rangs ; personne ne parlera sauf celui à qui le Tout Miséricordieux le permettra et qui dira la vérité. « C'est le Jour de la vérité : que celui qui le veut prenne un chemin de retour vers son Seigneur. » La sourate se termine par une image forte : le mécréant regardera ce que ses mains ont préparé et dira : « Hélas, si seulement j'étais poussière ! », en voyant les animaux redevenir poussière après avoir été jugés entre eux."]],
les:["La résurrection n'est pas un sujet de débat léger : c'est la grande nouvelle qui donne un sens à la vie.","Regarder la nature avec réflexion renforce la foi : le sommeil, la pluie ou les montagnes sont des signes.","Chaque acte est écrit ; rien n'est oublié.","Il est encore temps de « prendre un chemin de retour » vers Allah, avant le jour du regret."]};

SD[79]={ctx:"Sourate mecquoise qui continue le thème de la précédente : la réalité de la résurrection. Elle répond à ceux qui se moquaient en disant : « Serons-nous ramenés à notre état premier, alors que nous serons des os pourris ? » Elle rappelle l'exemple de Pharaon pour consoler le Prophète ﷺ face à l'arrogance de Qouraych.",
parts:[
["1-5","Les serments par les anges","Allah jure par cinq catégories d'anges selon la majorité des commentateurs : ceux qui arrachent avec violence l'âme des mécréants, ceux qui retirent avec douceur l'âme des croyants, ceux qui voguent dans l'espace, ceux qui devancent pour accomplir les ordres, et ceux qui règlent les affaires sur ordre d'Allah. Ces serments soulignent l'importance de ce qui suit."],
["6-14","Le jour du tremblement","Le jour où la première sonnerie fera tout trembler, suivie de la seconde, les cœurs seront agités et les regards baissés. Les négateurs disaient : « Serons-nous vraiment ramenés à la vie, après être devenus des os pourris ? Ce serait un retour perdant ! » Allah répond qu'il suffira d'un seul cri, et ils se retrouveront à la surface de la terre."],
["15-26","Moussa et Pharaon","« L'histoire de Moussa t'est-elle parvenue ? » Allah l'appela dans la vallée sacrée de Touwa et l'envoya vers Pharaon, qui avait dépassé les limites, avec une invitation douce : « Veux-tu te purifier, que je te guide vers ton Seigneur pour que tu Le craignes ? » Moussa lui montra le grand signe (le bâton et la main), mais Pharaon démentit, se détourna, rassembla son peuple et proclama : « Je suis votre seigneur le très-haut. » Allah le saisit pour un châtiment exemplaire dans ce monde et dans l'autre. « Il y a là une leçon pour celui qui craint Allah. »"],
["27-33","Qui est le plus difficile à créer ?","Allah interroge : « Êtes-vous plus difficiles à créer, ou bien le ciel qu'Il a construit ? » Il a élevé sa voûte, rendu sa nuit obscure et fait sortir sa clarté, puis étendu la terre, en a fait sortir l'eau et les pâturages, et a fixé les montagnes, pour votre jouissance et celle de vos troupeaux. Si Allah a créé ces immensités, recréer l'homme est encore plus facile."],
["34-41","Les deux destins","Quand viendra le grand cataclysme, l'homme se rappellera ses efforts et l'Enfer sera exposé à la vue. Celui qui a transgressé et préféré la vie de ce monde aura l'Enfer pour refuge. Celui qui a craint la comparution devant son Seigneur et a préservé son âme de la passion aura le Paradis pour refuge. Ces deux versets résument toute la morale : la passion contre la crainte d'Allah."],
["42-46","La date de l'Heure","Ils interrogent le Prophète ﷺ sur la date de l'Heure. « Que peux-tu en dire ? Sa connaissance appartient à ton Seigneur. Tu n'es que l'avertisseur de celui qui la craint. » Le jour où ils la verront, il leur semblera n'être restés dans ce monde qu'un soir ou une matinée."]],
les:["Retenir son âme de la passion par crainte d'Allah est la clé du Paradis (v. 40-41).","Même face au pire tyran, le message commence par une parole douce.","La vie de ce monde paraîtra très courte : il faut l'utiliser pour l'essentiel.","Personne ne connaît la date de l'Heure ; l'important est de s'y préparer."]};

SD[80]={ctx:"Selon Tirmidhi (3331) et l'avis de tous les commentateurs, cette sourate fut révélée au sujet de 'Abdullah ibn Oumm Maktoum, un compagnon aveugle. Il vint demander au Prophète ﷺ de lui enseigner, au moment où celui-ci parlait avec des notables de Qouraych en espérant leur conversion. Le Prophète ﷺ fronça les sourcils et se détourna de lui. Par la suite, il honorait Ibn Oumm Maktoum en disant : « Bienvenue à celui pour qui mon Seigneur m'a fait un reproche », et il le désigna plusieurs fois pour diriger la prière à Médine en son absence.",
parts:[
["1-10","Un reproche plein de délicatesse","« Il s'est renfrogné et s'est détourné, parce que l'aveugle est venu à lui. » Le reproche est formulé à la troisième personne, par délicatesse envers le Prophète ﷺ. « Qui te dit qu'il ne cherchait pas à se purifier, ou à se rappeler pour que le rappel lui soit utile ? » Quant à celui qui se croit riche et se suffit à lui-même, le Prophète ﷺ s'empressait de lui parler, alors que ce n'est pas sa responsabilité s'il refuse de se purifier. « Et celui qui vient à toi en courant, plein de crainte, tu t'en détournes ? »\nLa leçon est universelle : celui qui vient sincèrement chercher la science mérite la priorité, quel que soit son statut social."],
["11-16","Le Coran, un rappel honoré","« Non ! Ceci est un rappel ; que celui qui veut s'en souvienne. » Le Coran est consigné dans des feuilles honorées, élevées, purifiées, entre les mains d'anges scribes nobles et pieux."],
["17-23","L'ingratitude de l'homme","« Que périsse l'homme ! Qu'il est ingrat ! » Allah rappelle de quoi il a été créé : d'une goutte de sperme, puis Allah lui a facilité le chemin (de la naissance, ou de la guidée), puis le fait mourir et l'enterre, et le ressuscitera quand Il voudra. Pourtant, l'homme n'a pas encore accompli ce qu'Allah lui a ordonné."],
["24-32","Que l'homme regarde sa nourriture","Allah invite l'homme à réfléchir sur son assiette : Nous avons versé l'eau en abondance, puis fendu la terre, et y avons fait pousser des grains, des vignes, des légumes, des oliviers, des palmiers, des jardins touffus, des fruits et des herbages, pour votre jouissance et celle de vos bestiaux. Chaque repas devient ainsi un rappel de la puissance et de la générosité d'Allah."],
["33-42","Le jour où l'on fuit ses proches","Quand viendra le Fracas, l'homme fuira son frère, sa mère, son père, son épouse et ses enfants : chacun sera occupé par sa propre affaire. 'Aïcha rapporte que le Prophète ﷺ a dit que les gens seront rassemblés pieds nus et nus ; elle s'étonna, et il répondit que l'affaire serait trop grave pour qu'ils se regardent (Bukhari 6527). Ce jour-là, des visages seront rayonnants, riants et joyeux ; d'autres seront couverts de poussière et de noirceur : ce sont les mécréants pervers."]],
les:["Chaque personne qui cherche sincèrement la guidée mérite notre attention, même si elle n'a ni rang ni richesse.","Le Prophète ﷺ a transmis ce reproche dans le Coran : preuve de son honnêteté absolue.","Chaque repas est une occasion de remercier Allah.","Au Jour du jugement, personne ne pourra porter le fardeau d'un autre."]};

SD[81]={ctx:"Sourate mecquoise. Le Prophète ﷺ a dit : « Celui qui veut voir le Jour de la résurrection comme s'il le voyait de ses yeux, qu'il lise : Idha ach-chamsou kouwwirat (at-Takwir), Idha as-sama'ou nfatarat (al-Infitar) et Idha as-sama'ou nchaqqat (al-Inchiqaq) » (Tirmidhi 3333, authentique).",
parts:[
["1-14","Douze bouleversements","Une série de douze scènes, chacune introduite par « quand » : le soleil sera enroulé et perdra sa lumière, les étoiles tomberont, les montagnes seront mises en marche, les chamelles pleines (le bien le plus précieux des Arabes) seront délaissées, les bêtes sauvages seront rassemblées, les mers seront allumées, les âmes seront réunies à leurs semblables, la fillette enterrée vivante sera interrogée : « Pour quel péché a-t-elle été tuée ? », les livres des actes seront ouverts, le ciel sera dépouillé, l'Enfer sera attisé et le Paradis rapproché.\nAlors chaque âme saura ce qu'elle a présenté. La question posée à la fillette condamne une pratique de certaines tribus arabes avant l'islam, qui enterraient leurs filles par peur de la pauvreté ou de la honte."],
["15-21","Le serment par les astres","Allah jure par les astres qui reculent et disparaissent, par la nuit quand elle s'avance et par l'aube quand elle respire, que le Coran est la parole d'un noble messager : Jibril, puissant, élevé auprès du Maître du Trône, obéi et digne de confiance."],
["22-29","Votre compagnon n'est pas fou","« Votre compagnon (Muhammad ﷺ) n'est pas fou. » Il a bien vu Jibril à l'horizon clair, et il ne garde pas pour lui l'invisible qui lui est révélé. Le Coran n'est pas la parole d'un démon banni. « Où allez-vous donc ? Ce n'est qu'un rappel pour l'univers, pour celui d'entre vous qui veut suivre le droit chemin. » Mais « vous ne pouvez vouloir que si Allah, Seigneur des mondes, le veut » : l'homme a une volonté, mais elle reste soumise à celle d'Allah."]],
les:["La fin du monde bouleversera tout ce qui paraît stable aujourd'hui.","L'islam a aboli l'infanticide des filles et rendu justice aux plus faibles.","Le Coran est une révélation transmise fidèlement par Jibril, et non une invention.","L'homme est libre de choisir, mais il doit demander à Allah de vouloir pour lui le bien."]};

SD[82]={ctx:"Sourate mecquoise, citée dans le même hadith que la précédente (Tirmidhi 3333) parmi les sourates qui montrent le Jour de la résurrection comme si on le voyait.",
parts:[
["1-5","Quand le ciel se rompra","Quand le ciel se rompra, que les étoiles se disperseront, que les mers seront déchaînées et que les tombes seront bouleversées, chaque âme saura ce qu'elle a avancé (ses actes) et ce qu'elle a laissé derrière elle (ses habitudes, ses enfants, les effets de ses actes)."],
["6-8","Qu'est-ce qui t'a trompé ?","« Ô homme ! Qu'est-ce qui t'a trompé au sujet de ton Seigneur, le Généreux, qui t'a créé, puis façonné et harmonisé, et t'a donné la forme qu'Il a voulue ? » Les savants remarquent qu'Allah mentionne ici Son nom « le Généreux » : Sa générosité devrait pousser l'homme à la gratitude, et non à la négligence."],
["9-12","Les anges gardiens","Les gens démentent la rétribution, alors qu'il y a sur eux des gardiens, de nobles scribes, qui savent ce qu'ils font. Chaque personne est accompagnée d'anges qui notent ses actes."],
["13-19","Les deux demeures","Les vertueux seront dans les délices et les pervers dans une fournaise où ils brûleront le Jour de la rétribution, sans pouvoir s'en absenter. Le Jour de la rétribution, aucune âme ne pourra rien pour une autre, et l'ordre ce jour-là appartiendra à Allah seul."]],
les:["La générosité d'Allah doit nous rendre reconnaissants, pas négligents.","Nos actes continuent à produire des effets après notre mort, en bien ou en mal.","Les anges écrivent tout : il faut faire attention même aux petites choses.","Ce jour-là, personne ne pourra aider personne : il faut se préparer soi-même."]};

SD[83]={ctx:"Selon Ibn 'Abbas (rapporté par Nasa'i et Ibn Majah 2223, chaîne bonne), quand le Prophète ﷺ arriva à Médine, ses habitants étaient parmi les pires fraudeurs dans les mesures ; Allah révéla cette sourate, et ils améliorèrent leurs mesures. Beaucoup de savants la considèrent comme l'une des dernières sourates mecquoises ou l'une des premières de Médine.",
parts:[
["1-6","Malheur aux fraudeurs","« Malheur aux fraudeurs, qui exigent la pleine mesure quand ils achètent aux gens, mais qui trichent quand ils leur mesurent ou leur pèsent. » Ne pensent-ils pas qu'ils seront ressuscités pour un jour immense, le jour où les gens se tiendront debout devant le Seigneur des mondes ? La fraude commerciale est présentée comme un manque de foi en la rétribution."],
["7-17","Le registre des pervers","Le livre des pervers est dans Sijjin, un registre bien tenu. Malheur, ce jour-là, à ceux qui démentaient le Jour de la rétribution : seul le transgresseur pécheur le dément. Quand on lui récite les versets d'Allah, il dit : « Des contes d'autrefois. » « Non ! Ce qu'ils ont acquis a recouvert leurs cœurs de rouille. » Le Prophète ﷺ a expliqué que chaque péché dépose un point noir sur le cœur, que le repentir efface ; s'il recommence, le point grandit jusqu'à couvrir le cœur : c'est la rouille dont parle ce verset (Tirmidhi 3334, authentique). Ce jour-là, ils seront voilés de leur Seigneur."],
["18-28","Le registre des vertueux","Le livre des vertueux est dans 'Illiyyin, en présence des anges rapprochés. Les vertueux seront dans les délices, sur des lits, regardant ; on reconnaîtra sur leurs visages l'éclat du bonheur. On leur servira un nectar scellé, dont le cachet est de musc. « Que ceux qui veulent rivaliser rivalisent pour cela ! » La vraie compétition n'est pas pour ce monde, mais pour le Paradis."],
["29-36","Les moqueurs et les moqués","Les criminels riaient des croyants, se faisaient des clins d'œil en passant près d'eux, rentraient chez eux en plaisantant, et disaient : « Ceux-là sont des égarés. » Pourtant, ils n'avaient pas été envoyés pour les surveiller. Aujourd'hui, ce sont les croyants qui rient des mécréants, sur des lits, regardant. Les mécréants ont-ils été rétribués de ce qu'ils faisaient ?"]],
les:["L'honnêteté dans le commerce fait partie de la foi.","Les péchés répétés endurcissent le cœur ; le repentir le nettoie.","La vraie compétition doit porter sur l'au-delà.","Les moqueries subies pour sa religion seront compensées au Jour du jugement."]};

SD[84]={ctx:"Sourate mecquoise, citée par le Prophète ﷺ parmi les trois qui montrent le Jour de la résurrection (Tirmidhi 3333). Abou Hourayra se prosternait en la récitant, et il dit avoir vu le Prophète ﷺ s'y prosterner (Bukhari 1074, Muslim 578).",
parts:[
["1-5","Le ciel et la terre obéissent","Quand le ciel se déchirera et obéira à son Seigneur, comme il se doit, et quand la terre sera étendue, rejettera ce qu'elle contient et se videra, et obéira à son Seigneur… La création entière se soumet à l'ordre d'Allah."],
["6","L'homme en marche vers son Seigneur","« Ô homme ! Toi qui fais des efforts vers ton Seigneur, tu Le rencontreras. » Toute la vie de l'homme est un chemin qui mène à Allah ; chaque effort, bon ou mauvais, sera présenté."],
["7-15","Le livre dans la main droite ou derrière le dos","Celui qui recevra son livre dans sa main droite sera jugé d'un jugement facile et retournera joyeux vers les siens. 'Aïcha demanda au Prophète ﷺ ce qu'est ce jugement facile ; il répondit que c'est la simple présentation des actes, car celui dont on discute les comptes en détail est perdu (Bukhari 103). Celui qui recevra son livre derrière son dos appellera la destruction et brûlera dans le Feu. Il vivait joyeux parmi les siens et pensait ne jamais revenir à Allah."],
["16-19","Des étapes successives","Allah jure par le crépuscule, par la nuit et ce qu'elle rassemble, et par la lune quand elle devient pleine : vous passerez certainement d'un état à un autre. La vie humaine est faite d'étapes : naissance, enfance, jeunesse, vieillesse, mort, tombe, résurrection."],
["20-25","Pourquoi ne croient-ils pas ?","Qu'ont-ils à ne pas croire et à ne pas se prosterner quand on leur récite le Coran ? (Ici se trouve une prosternation de récitation.) Allah sait ce qu'ils cachent. Annonce-leur un châtiment douloureux, sauf à ceux qui croient et font de bonnes œuvres : ils auront une récompense jamais interrompue."]],
les:["Toute notre vie est un voyage vers la rencontre d'Allah.","Demander à Allah un « jugement facile » est une belle invocation.","Celui qui vit dans l'insouciance totale risque de regretter.","Se prosterner à la lecture du verset 21 est une Sunna."]};

SD[85]={ctx:"Sourate mecquoise révélée quand les premiers musulmans étaient torturés à La Mecque. Elle raconte l'histoire des « gens du fossé » pour leur montrer que d'autres croyants avant eux ont été persécutés et sont restés fermes. Le Prophète ﷺ récitait cette sourate et at-Tariq à la prière du Dhouhr et de l''Asr (Abou Daoud 805).",
parts:[
["1-3","Les serments","Allah jure par le ciel aux constellations, par le Jour promis (le Jour de la résurrection), et par le témoin et ce dont il témoigne."],
["4-9","Les gens du fossé","Maudits soient les gens du fossé, au feu plein de combustible, assis au bord, témoins de ce qu'ils faisaient aux croyants. Ils ne leur reprochaient qu'une chose : croire en Allah, le Tout-Puissant, le Digne de louange.\nMuslim (3005) rapporte une histoire liée à ce passage : un roi tyrannique avait un magicien qui forma un jeune garçon. Le garçon rencontra un moine et crut en Allah. Par la permission d'Allah, il guérissait les malades. Le roi tenta plusieurs fois de le tuer sans succès. Le garçon lui dit : « Tu ne pourras me tuer que si tu rassembles les gens, prends une flèche de mon carquois et dis : au nom d'Allah, Seigneur de ce garçon. » Le roi le fit et le garçon mourut ; alors tout le peuple dit : « Nous croyons au Seigneur du garçon ! » Le roi fit creuser des fossés remplis de feu et y jeta ceux qui refusaient de renier leur foi."],
["10-11","Le sort des persécuteurs et des croyants","Ceux qui persécutent les croyants et les croyantes, puis ne se repentent pas, auront le châtiment de l'Enfer et de la brûlure. Remarquons qu'Allah leur laisse la porte du repentir ouverte malgré leur crime. Ceux qui croient et font le bien auront des jardins sous lesquels coulent les rivières : c'est le grand succès."],
["12-16","La puissance et l'amour d'Allah","La riposte de ton Seigneur est redoutable. C'est Lui qui commence la création et la recommence. Il est le Pardonneur, le Très Aimant (al-Wadoud), le Maître du Trône glorieux, et Il fait ce qu'Il veut."],
["17-22","Les armées de Pharaon et de Thamoud","L'histoire des armées de Pharaon et de Thamoud t'est-elle parvenue ? Les mécréants persistent dans le démenti, mais Allah les encercle de partout. « C'est plutôt un Coran glorieux, sur une Tablette préservée. »"]],
les:["La foi peut demander des sacrifices ; la fermeté est récompensée par le grand succès.","Même les pires criminels peuvent se repentir.","Allah est al-Wadoud : Il aime Ses serviteurs croyants.","Le Coran est préservé sur la Tablette gardée : personne ne peut le falsifier."]};

SD[86]={ctx:"Sourate mecquoise. Le Prophète ﷺ la récitait avec al-Bourouj dans les prières du Dhouhr et de l''Asr (Abou Daoud 805).",
parts:[
["1-4","L'astre nocturne et l'ange gardien","Allah jure par le ciel et par at-Tariq, « l'astre perçant » qui apparaît la nuit, pour affirmer que chaque âme a sur elle un gardien : des anges qui la protègent et notent ses actes."],
["5-10","De quoi l'homme a été créé","« Que l'homme regarde donc de quoi il a été créé : d'une eau éjaculée, sortie d'entre les lombes et les côtes. » Celui qui l'a créé ainsi est capable de le ramener à la vie, le jour où les secrets seront dévoilés : les intentions cachées, la sincérité ou l'hypocrisie. Ce jour-là, l'homme n'aura ni force ni secours."],
["11-14","Un Coran décisif","Allah jure par le ciel qui fait revenir la pluie et par la terre qui se fend pour laisser sortir les plantes : le Coran est une parole décisive, qui tranche entre le vrai et le faux, et non une plaisanterie."],
["15-17","Laisse-leur un peu de temps","Les mécréants usent de ruses, et Allah use aussi de Sa stratégie. « Accorde donc un délai aux mécréants, accorde-leur un court délai. » Le Prophète ﷺ est invité à la patience : la victoire de la vérité est certaine."]],
les:["Nous ne sommes jamais seuls : des anges nous gardent et notent nos actes.","Les intentions cachées seront dévoilées : la sincérité compte autant que les actes.","Le Coran est une parole sérieuse qu'il faut prendre comme guide.","La patience face aux ruses des ennemis de la vérité."]};

SD[87]={ctx:"Sourate mecquoise. Le Prophète ﷺ l'aimait beaucoup : il la récitait avec al-Ghachiya dans la prière du vendredi et des deux Aïds (Muslim 878), et dans la prière du witr avec al-Kafiroun et al-Ikhlas (Abou Daoud 1423). Quand fut révélé le premier verset, il dit : « Mettez-le dans votre prosternation » : c'est l'origine de « Soubhana rabbiya al-a'la » (Abou Daoud 869).",
parts:[
["1-5","Glorifie le nom de ton Seigneur","« Glorifie le nom de ton Seigneur, le Très-Haut, qui a créé et harmonisé, qui a décrété et guidé. » Allah a donné à chaque créature la forme qui lui convient et l'a guidée vers ce qui lui est utile (l'oiseau vers son nid, l'abeille vers les fleurs, le bébé vers le sein). Il fait sortir le pâturage, puis le transforme en foin sombre : rappel que tout ce qui pousse finit par se faner."],
["6-8","La mémorisation du Coran garantie","« Nous te ferons réciter et tu n'oublieras pas, sauf ce qu'Allah veut. » Allah promet au Prophète ﷺ de préserver le Coran dans son cœur. « Et Nous te faciliterons la voie la plus facile » : la religion est facilité."],
["9-13","Rappelle, si le rappel est utile","Celui qui craint Allah profitera du rappel, et le plus malheureux s'en écartera : il brûlera dans le grand Feu, où il ne mourra pas et ne vivra pas vraiment."],
["14-19","La réussite par la purification","« A réussi celui qui s'est purifié, qui a mentionné le nom de son Seigneur et a prié. » La purification de l'âme (du chirk, des péchés, des mauvais traits), le rappel d'Allah et la prière sont la recette de la réussite. « Mais vous préférez la vie de ce monde, alors que l'au-delà est meilleur et plus durable. » Ce message se trouve déjà dans les premières Écritures, les feuillets d'Ibrahim et de Moussa : le cœur du message est le même chez tous les prophètes."]],
les:["Dire « Soubhana rabbiya al-a'la » en se prosternant vient de cette sourate.","Allah guide chaque créature vers ce qui lui convient.","La réussite passe par la purification de l'âme, le rappel et la prière.","L'au-delà est meilleur et plus durable : ce monde se fane comme l'herbe."]};

SD[88]={ctx:"Sourate mecquoise. Le Prophète ﷺ la récitait avec al-A'la dans la prière du vendredi et des Aïds (Muslim 878).",
parts:[
["1-7","Les visages humiliés","« T'est-il parvenu le récit de l'Enveloppante ? » C'est le Jour de la résurrection, qui enveloppe tout de ses terreurs. Ce jour-là, des visages seront humiliés, épuisés, fatigués : ils ont peiné, parfois même dans des adorations sans fondement, et brûleront dans un feu ardent. Ils boiront d'une source bouillante et n'auront pour nourriture qu'un arbuste épineux qui n'engraisse pas et n'apaise pas la faim."],
