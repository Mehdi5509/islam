["8-16","Les visages heureux","D'autres visages seront épanouis, satisfaits de leurs efforts, dans un jardin élevé où l'on n'entend aucune parole futile. Il y a une source qui coule, des lits élevés, des coupes posées, des coussins alignés et des tapis étendus."],
["17-20","Ne regardent-ils pas ?","« Ne regardent-ils pas les chameaux, comment ils ont été créés ? Et le ciel, comment il a été élevé ? Et les montagnes, comment elles ont été dressées ? Et la terre, comment elle a été étendue ? » Allah commence par ce que les Arabes du désert voyaient chaque jour : le chameau, animal extraordinaire qui supporte la soif, porte les charges et obéit à un enfant. Puis le regard monte au ciel, descend sur les montagnes et s'étend sur la terre."],
["21-26","Tu n'es qu'un rappeleur","« Rappelle donc : tu n'es qu'un rappeleur, et tu n'es pas un dominateur sur eux. » Le rôle du Prophète ﷺ est de transmettre ; la guidée appartient à Allah. Celui qui se détourne et mécroit, Allah le châtiera du plus grand châtiment. « Vers Nous est leur retour, et à Nous de leur demander des comptes. »"]],
les:["Un grand effort n'a de valeur que s'il est fait pour Allah et selon Sa voie.","Observer la création (animaux, ciel, montagnes) est une adoration qui renforce la foi.","Notre rôle est de rappeler avec sagesse, pas de forcer.","Chacun rendra ses comptes à Allah."]};

SD[89]={ctx:"Sourate mecquoise. Les « dix nuits » par lesquelles Allah jure sont, selon Ibn 'Abbas et la majorité des commentateurs, les dix premiers jours de Dhoul-Hijja. Le Prophète ﷺ a dit qu'aucun jour n'est plus aimé d'Allah pour les bonnes œuvres que ces dix jours (Bukhari 969).",
parts:[
["1-5","Les serments","Allah jure par l'aube, par les dix nuits, par le pair et l'impair, et par la nuit quand elle s'écoule. « N'y a-t-il pas là un serment pour un homme doué d'intelligence ? »"],
["6-14","Les tyrans d'autrefois","N'as-tu pas vu comment ton Seigneur a traité 'Ad, la cité d'Iram aux colonnes, dont on n'a jamais créé de pareille ; Thamoud, qui taillait les rochers dans la vallée ; et Pharaon, l'homme aux pieux, qui transgressaient dans les pays et y multipliaient la corruption ? Ton Seigneur a abattu sur eux le fouet du châtiment. « Ton Seigneur est toujours aux aguets. »"],
["15-20","La fausse idée sur la richesse","Quand Allah éprouve l'homme en l'honorant et en le comblant, il dit : « Mon Seigneur m'a honoré. » Quand Il l'éprouve en restreignant sa subsistance, il dit : « Mon Seigneur m'a humilié. » « Non ! » La richesse et la pauvreté sont toutes deux des épreuves, et non des signes d'amour ou de mépris. Le vrai problème : vous n'honorez pas l'orphelin, vous n'encouragez pas à nourrir le pauvre, vous dévorez l'héritage avec avidité et vous aimez les richesses d'un amour excessif."],
["21-26","Le jour du grand regret","Quand la terre sera complètement pulvérisée, que ton Seigneur viendra ainsi que les anges en rangs, et que l'Enfer sera amené, l'homme se souviendra. Mais à quoi lui servira ce souvenir ? Il dira : « Hélas ! Si seulement j'avais préparé quelque chose pour ma vraie vie ! » La vraie vie, c'est celle de l'au-delà."],
["27-30","L'âme apaisée","« Ô toi, âme apaisée, retourne vers ton Seigneur, satisfaite et agréée. Entre parmi Mes serviteurs, et entre dans Mon Paradis. » L'âme apaisée est celle qui est sereine par sa foi, son rappel d'Allah et sa confiance en Lui. Selon des commentateurs, ces paroles lui sont dites au moment de la mort et au Jour de la résurrection."]],
les:["Les dix premiers jours de Dhoul-Hijja sont les meilleurs jours de l'année.","La richesse n'est pas une preuve de l'amour d'Allah, ni la pauvreté de Son mépris : ce sont des épreuves.","Honorer l'orphelin et nourrir le pauvre sont des signes de foi.","La vraie vie est celle de l'au-delà : il faut la préparer maintenant."]};

SD[90]={ctx:"Sourate mecquoise. La « cité » par laquelle Allah jure est La Mecque, à une époque où les polythéistes y persécutaient le Prophète ﷺ alors qu'elle était un lieu sacré.",
parts:[
["1-4","L'homme créé pour l'effort","Allah jure par cette cité (La Mecque), alors que le Prophète ﷺ y vit (ou : alors qu'il lui sera permis d'y entrer en vainqueur), et par un père et ce qu'il engendre (Adam et sa descendance, selon des commentateurs) : « Nous avons créé l'homme dans la peine. » La vie est faite d'efforts et de difficultés, de la naissance à la mort."],
["5-7","L'orgueil de l'homme","L'homme pense-t-il que personne ne pourra rien contre lui ? Il se vante : « J'ai dépensé des biens considérables. » Pense-t-il que personne ne l'a vu ? Allah sait d'où vient son argent et pourquoi il l'a dépensé."],
["8-10","Les dons d'Allah","« Ne lui avons-Nous pas donné deux yeux, une langue et deux lèvres, et ne lui avons-Nous pas montré les deux voies ? » Allah a donné à l'homme les moyens de voir, de parler et de discerner le bien du mal."],
["11-16","La voie difficile","« Il ne s'est pas engagé dans la voie difficile. » Qu'est-ce que la voie difficile ? Affranchir un esclave, ou nourrir, en un jour de famine, un orphelin proche ou un pauvre dans la misère. C'est difficile parce que l'âme aime l'argent, surtout dans les temps durs."],
["17-20","Les gens de la droite et de la gauche","Il faut ensuite être parmi ceux qui croient, se recommandent mutuellement la patience et la miséricorde. Ceux-là sont les gens de la droite. Ceux qui mécroient à Nos signes sont les gens de la gauche ; un feu fermé sera sur eux."]],
les:["La vie est un effort : c'est normal de rencontrer des difficultés.","Allah voit l'origine et la destination de chaque argent dépensé.","La voie difficile : libérer les gens et nourrir les plus démunis.","Les croyants se recommandent la patience et la miséricorde."]};

SD[91]={ctx:"Sourate mecquoise. Le Prophète ﷺ conseilla à Mou'adh de la réciter dans la prière plutôt que d'allonger (Bukhari 705). Elle contient onze serments consécutifs, le plus grand nombre dans le Coran.",
parts:[
["1-8","Onze serments","Allah jure par le soleil et sa clarté, par la lune quand elle le suit, par le jour quand il l'éclaire, par la nuit quand elle le couvre, par le ciel et Celui qui l'a construit, par la terre et Celui qui l'a étendue, et par l'âme et Celui qui l'a harmonisée, puis lui a inspiré son immoralité et sa piété. Allah a placé en chaque âme la capacité de reconnaître le bien et le mal."],
["9-10","La réponse aux serments","« A réussi celui qui la purifie, et a échoué celui qui la corrompt. » Tous ces serments ont pour but d'affirmer cette vérité : notre réussite dépend de ce que nous faisons de notre âme. Le Prophète ﷺ invoquait : « Ô Allah, donne à mon âme sa piété et purifie-la, Tu es le meilleur à la purifier » (Muslim 2722)."],
["11-15","L'exemple de Thamoud","Thamoud a démenti par sa transgression, quand le plus misérable d'entre eux se leva pour tuer la chamelle. Le messager d'Allah (Salih) leur avait dit : « Laissez la chamelle d'Allah et son tour de boire. » Ils le traitèrent de menteur et la tuèrent. Leur Seigneur les anéantit pour leur péché et nivela le châtiment sur eux, sans craindre les conséquences."]],
les:["Chaque âme connaît naturellement le bien et le mal.","La réussite dépend de la purification de l'âme ; l'échec, de sa corruption.","Demander à Allah de purifier notre âme, comme le faisait le Prophète ﷺ.","Approuver un crime, c'est y participer : tout Thamoud fut puni pour le crime d'un seul."]};

SD[92]={ctx:"Sourate mecquoise. Beaucoup de commentateurs, dont Ibn Kathir, rapportent que les versets 17 à 21 concernent Abou Bakr as-Siddiq, qui achetait et affranchissait des esclaves musulmans torturés, comme Bilal, uniquement pour Allah.",
parts:[
["1-4","Des efforts divergents","Allah jure par la nuit quand elle enveloppe, par le jour quand il éclaire, et par Celui qui a créé le mâle et la femelle : « Vos efforts sont vraiment divergents. » Les gens courent tous, mais pas dans la même direction."],
["5-11","Les deux chemins","Celui qui donne, craint Allah et croit à la meilleure récompense, Allah lui facilitera la voie de la facilité (le bien et le Paradis). Celui qui est avare, se croit suffisant et dément la meilleure récompense, Allah lui facilitera la voie de la difficulté. Ses biens ne lui serviront à rien quand il tombera. Le Prophète ﷺ cita ce passage pour expliquer qu'il faut agir : chacun est facilité vers ce pour quoi il a été créé (Bukhari 4949)."],
["12-16","À Nous la guidée","« C'est à Nous de guider, et à Nous appartiennent l'au-delà et ce bas monde. » Allah avertit d'un feu brûlant où n'entrera que le plus misérable, qui dément et se détourne."],
["17-21","Celui qui donne pour Allah","Le plus pieux en sera écarté : celui qui donne ses biens pour se purifier, sans attendre de récompense de personne, uniquement par recherche du visage de son Seigneur le Très-Haut. « Il sera certes satisfait. »"]],
les:["Donner, craindre Allah et croire à la récompense ouvrent la voie de la facilité.","L'avarice et l'orgueil mènent à la difficulté.","Il faut agir : Allah facilite chacun vers ce qu'il recherche sincèrement.","La sincérité dans le don : donner sans rien attendre des gens."]};

SD[93]={ctx:"Selon Bukhari (4950) et Muslim (1797), la révélation s'interrompit pendant un temps. Une femme polythéiste se moqua : « Ô Muhammad, je pense que ton démon t'a abandonné. » Allah révéla alors cette sourate pour consoler Son Prophète ﷺ.",
parts:[
["1-3","Ton Seigneur ne t'a pas abandonné","Allah jure par le jour montant (ad-douha) et par la nuit quand elle est calme : « Ton Seigneur ne t'a ni abandonné ni détesté. » Comme la lumière revient après la nuit, la révélation revient après l'interruption."],
["4-5","Le meilleur est à venir","« L'au-delà est meilleur pour toi que la vie présente. Et ton Seigneur te donnera, et tu seras satisfait. » Les savants y voient notamment l'intercession que le Prophète ﷺ obtiendra pour sa communauté."],
["6-8","Les trois bienfaits passés","Allah rappelle trois bienfaits : « Ne t'a-t-Il pas trouvé orphelin, et t'a donné un refuge ? Ne t'a-t-Il pas trouvé égaré (sans connaître la Loi), et t'a guidé ? Ne t'a-t-Il pas trouvé pauvre, et t'a enrichi ? » Celui qui a pris soin de toi dans le passé ne t'abandonnera pas dans l'avenir."],
["9-11","Les trois devoirs","À chaque bienfait correspond un devoir : « L'orphelin, ne le maltraite pas. Le demandeur, ne le repousse pas. Et le bienfait de ton Seigneur, proclame-le. » Parler des bienfaits d'Allah est une forme de gratitude, sans orgueil."]],
les:["Après chaque période difficile, la lumière revient : Allah n'abandonne pas Ses serviteurs.","Se souvenir de la façon dont Allah nous a aidés dans le passé donne confiance pour l'avenir.","Celui qui a connu une difficulté doit aider ceux qui la vivent.","Parler des bienfaits d'Allah est une forme de remerciement."]};

SD[94]={ctx:"Sourate mecquoise révélée juste après ad-Douha, dans la même période difficile. Elle continue de consoler le Prophète ﷺ.",
parts:[
["1-4","Trois grâces","« N'avons-Nous pas ouvert pour toi ta poitrine ? » Allah a élargi le cœur du Prophète ﷺ pour recevoir la révélation et supporter les difficultés. « Et ne t'avons-Nous pas déchargé du fardeau qui accablait ton dos ? Et n'avons-Nous pas élevé pour toi ta renommée ? » Son nom est mentionné avec celui d'Allah dans l'appel à la prière, dans l'attestation de foi et dans chaque prière."],
["5-6","Avec la difficulté, la facilité","« Avec la difficulté vient certes une facilité. Avec la difficulté vient certes une facilité. » La phrase est répétée deux fois. Les savants remarquent que, en arabe, « la difficulté » est la même dans les deux phrases (avec l'article), alors que « une facilité » est sans article, donc deux facilités différentes. Ibn 'Abbas et d'autres en déduisent qu'une difficulté ne l'emportera jamais sur deux facilités. La facilité n'est pas seulement après la difficulté : elle est « avec » elle."],
["7-8","Après l'effort, l'adoration","« Quand tu as terminé une tâche, mets-toi à l'effort (dans l'adoration), et c'est vers ton Seigneur que tu dois aspirer. » Le croyant passe d'une bonne œuvre à une autre, et dirige ses désirs vers Allah."]],
les:["Demander à Allah d'ouvrir notre poitrine, comme Moussa (20:25).","Aucune difficulté ne dure : la facilité l'accompagne toujours.","Le temps libre est une occasion de se tourner vers Allah.","Le Prophète ﷺ a une place unique : son nom est associé à celui d'Allah."]};

SD[95]={ctx:"Sourate mecquoise. Le Prophète ﷺ l'a récitée dans la prière de la nuit ('Icha) pendant un voyage ; al-Bara' dit n'avoir jamais entendu une plus belle voix que la sienne (Bukhari 769).",
parts:[
["1-3","Quatre serments par des lieux bénis","Allah jure par le figuier et l'olivier, par le mont Sinaï et par cette cité sûre (La Mecque). Beaucoup de commentateurs y voient les terres des grands messagers : la terre du figuier et de l'olivier (Jérusalem, terre de 'Issa), le mont Sinaï (où Allah parla à Moussa) et La Mecque (terre de Muhammad ﷺ)."],
["4-6","La plus belle forme, puis le plus bas","« Nous avons créé l'homme sous la plus belle forme », dans son corps et dans sa nature. « Puis Nous l'avons ramené au plus bas des plus bas », par la vieillesse selon certains commentateurs, ou par l'Enfer pour celui qui mécroit selon d'autres. « Sauf ceux qui croient et font de bonnes œuvres : ils auront une récompense jamais interrompue. »"],
["7-8","Allah n'est-Il pas le plus juste ?","« Qu'est-ce qui te fait encore démentir la rétribution ? Allah n'est-Il pas le plus juste des juges ? » Il est recommandé de répondre en lisant ce verset : « Si, et j'en suis témoin » (rapporté d'après des compagnons)."]],
les:["L'homme a été honoré par une forme et une nature excellentes.","Sans la foi et les bonnes œuvres, il peut tomber au plus bas.","Les bonnes œuvres ont une récompense qui ne s'arrête jamais.","Allah est le plus juste des juges : personne ne sera lésé."]};

SD[96]={ctx:"Ses cinq premiers versets sont les tout premiers du Coran. 'Aïcha raconte (Bukhari 3) que le Prophète ﷺ se retirait dans la grotte de Hira'. L'ange vint et lui dit : « Lis ! » Il répondit : « Je ne sais pas lire. » L'ange le serra fort trois fois, puis lui dit : « Lis, au nom de ton Seigneur qui a créé… » Il rentra tremblant chez Khadija. La suite de la sourate (v. 6-19) fut révélée plus tard, au sujet d'Abou Jahl.",
parts:[
["1-5","Lis !","« Lis, au nom de ton Seigneur qui a créé, qui a créé l'homme d'une adhérence ('alaq). Lis, et ton Seigneur est le Très Généreux, qui a enseigné par le calame, qui a enseigné à l'homme ce qu'il ne savait pas. » La première parole de la révélation est un ordre de lire et d'apprendre, mais « au nom de ton Seigneur » : la science doit mener à Allah. Le mot 'alaq décrit l'embryon qui s'accroche à la paroi de l'utérus."],
["6-8","L'homme se rebelle quand il se croit riche","« L'homme se rebelle dès qu'il se voit riche. » Pourtant, c'est vers Allah qu'est le retour."],
["9-14","Celui qui empêche de prier","Abou Jahl avait juré que s'il voyait le Prophète ﷺ prier près de la Ka'ba, il lui écraserait la tête. Allah dit : « As-tu vu celui qui interdit à un serviteur de prier ? Et s'il était sur la bonne voie, ou s'il ordonnait la piété ? Et s'il démentait et se détournait ? Ne sait-il pas qu'Allah voit ? »"],
["15-19","Prosterne-toi et rapproche-toi","« Non ! S'il ne cesse pas, Nous le saisirons par le toupet, un toupet menteur et pécheur. Qu'il appelle son assemblée ! Nous appellerons les gardiens de l'Enfer. » Muslim (2797) rapporte qu'Abou Jahl s'approcha un jour pour frapper le Prophète ﷺ pendant sa prière, puis recula en se protégeant avec les mains : il avait vu un fossé de feu et des ailes. La sourate se termine par : « Ne lui obéis pas ; prosterne-toi et rapproche-toi » (prosternation de récitation). Le Prophète ﷺ a dit : « Le moment où le serviteur est le plus proche de son Seigneur, c'est quand il est prosterné » (Muslim 482)."]],
les:["L'islam commence par l'ordre de lire et d'apprendre.","La science doit être recherchée au nom d'Allah et mener à Lui.","La richesse peut rendre l'homme arrogant s'il oublie qu'il reviendra à Allah.","La prosternation est le moment où l'on est le plus proche d'Allah."]};

SD[97]={ctx:"Sourate mecquoise selon la majorité. Elle annonce que le Coran a commencé à être révélé pendant Laylat al-Qadr, une nuit du mois de Ramadan (2:185).",
parts:[
["1","La révélation du Coran","« Nous l'avons fait descendre pendant la Nuit du destin. » Selon Ibn 'Abbas, le Coran fut descendu en entier de la Tablette préservée vers le ciel le plus proche cette nuit-là, puis révélé progressivement au Prophète ﷺ pendant vingt-trois ans. Le mot qadr signifie à la fois « destin » (les décrets de l'année y sont détaillés) et « valeur » (c'est une nuit d'une grande valeur)."],
["2-3","Meilleure que mille mois","« Et qui te dira ce qu'est la Nuit du destin ? La Nuit du destin est meilleure que mille mois. » Mille mois font plus de quatre-vingt-trois ans : une vie entière. L'adoration de cette seule nuit vaut mieux que celle de mille mois qui n'en contiennent pas."],
["4-5","Paix jusqu'à l'aube","Les anges et l'Esprit (Jibril) descendent en grand nombre, avec la permission de leur Seigneur, pour chaque affaire. « Elle est paix jusqu'à l'apparition de l'aube. »\nLe Prophète ﷺ a dit de la chercher dans les nuits impaires des dix dernières nuits du Ramadan (Bukhari 2017). Il a enseigné à 'Aïcha de dire cette nuit-là : « Allahoumma innaka 'afouwwoun touhibbou al-'afwa fa'fou 'anni » (Ô Allah, Tu es Celui qui efface les fautes, Tu aimes effacer, efface donc mes fautes) (Tirmidhi 3513)."]],
les:["Le Coran a commencé à descendre pendant le Ramadan, lors de Laylat al-Qadr.","Une seule nuit d'adoration peut valoir plus qu'une vie entière.","Il faut chercher cette nuit dans les nuits impaires des dix dernières nuits du Ramadan.","Qui la veille avec foi et espoir voit ses péchés passés pardonnés (Bukhari 1901)."]};

SD[98]={ctx:"Sourate médinoise. Le Prophète ﷺ dit à Oubayy ibn Ka'b : « Allah m'a ordonné de te réciter la sourate Lam yakouni lladhina kafarou (al-Bayyina). » Oubayy demanda : « Il m'a nommé ? » « Oui. » Et Oubayy pleura (Bukhari 4959).",
parts:[
["1-3","L'attente d'une preuve","Les mécréants parmi les gens du Livre et les polythéistes ne devaient pas cesser leur égarement avant que leur vienne la preuve claire : un messager venant d'Allah, récitant des feuilles purifiées contenant des écrits droits."],
["4-5","La division après la preuve","Ceux qui avaient reçu le Livre ne se sont divisés qu'après que la preuve leur est venue. Pourtant, il ne leur était ordonné que d'adorer Allah en Lui vouant un culte sincère, en monothéistes purs, d'accomplir la prière et de donner la zakat. « Voilà la religion droite. » Ce verset résume l'essentiel de la religion de tous les prophètes."],
["6-8","Les pires et les meilleures créatures","Les mécréants parmi les gens du Livre et les polythéistes iront au feu de l'Enfer ; ce sont les pires des créatures. Ceux qui croient et font de bonnes œuvres sont les meilleures des créatures. Leur récompense : des jardins de séjour éternel. « Allah est satisfait d'eux et ils sont satisfaits de Lui. Cela, pour celui qui craint son Seigneur. »"]],
les:["La religion de tous les prophètes : sincérité, prière et zakat.","La sincérité (ikhlas) est la condition de l'acceptation des actes.","Les meilleures créatures sont ceux qui croient et agissent bien, quelle que soit leur origine.","La plus grande récompense : la satisfaction d'Allah."]};

// Juz' 'Amma, suite (99-114)
SD[99]={ctx:"Sourate médinoise selon le Mushaf de Médine (mecquoise selon d'autres savants). Elle décrit le dernier tremblement de terre et la pesée exacte des actes.",
parts:[
["1-3","Le grand tremblement","Quand la terre tremblera d'un violent tremblement, qu'elle rejettera ses fardeaux (les morts et ce qu'elle contient), et que l'homme dira : « Qu'a-t-elle ? »"],
["4-5","La terre raconte","Ce jour-là, elle racontera ses nouvelles, selon ce que ton Seigneur lui aura révélé. Le Prophète ﷺ expliqua que ses nouvelles sont son témoignage sur chaque homme et chaque femme pour ce qu'ils ont fait sur elle : il a fait telle chose, tel jour (Tirmidhi 2429, jugé bon par Tirmidhi). Chaque endroit où l'on a prié, ou péché, témoignera."],
["6-8","Le poids d'un atome","Ce jour-là, les gens sortiront en groupes dispersés pour qu'on leur montre leurs œuvres. « Quiconque fait le poids d'un atome de bien le verra, et quiconque fait le poids d'un atome de mal le verra. » Le Prophète ﷺ appelait ce verset « le verset unique et complet » (Bukhari 2371), car il englobe tous les actes. Il a aussi dit : « Préservez-vous du Feu, ne serait-ce qu'avec une moitié de datte » (Bukhari 1417)."]],
les:["La terre témoignera de ce que nous avons fait sur elle.","Aucun acte n'est trop petit pour être compté, en bien comme en mal.","Ne jamais mépriser une petite bonne action : un sourire, une demi-datte.","Ne jamais minimiser un petit péché."]};

SD[100]={ctx:"Sourate mecquoise selon la majorité. Allah jure par les chevaux de combat, très précieux pour les Arabes, pour dénoncer l'ingratitude de l'homme.",
parts:[
["1-5","Les chevaux au galop","Allah jure par les coursiers qui halètent en galopant, qui font jaillir des étincelles en frappant les pierres de leurs sabots, qui attaquent à l'aube, soulèvent la poussière et pénètrent au centre de l'ennemi. Le cheval se donne entièrement à son maître, au risque de sa vie."],
["6-8","L'ingratitude de l'homme","« L'homme est très ingrat envers son Seigneur. » Le contraste est frappant : l'animal se dévoue pour celui qui le nourrit, alors que l'homme oublie Celui qui lui donne tout. « Et il en est lui-même témoin » : ses actes le prouvent. « Et il est très attaché à l'amour des richesses. »"],
["9-11","Ne sait-il pas ?","« Ne sait-il donc pas que, lorsque ce qui est dans les tombes sera bouleversé et que ce qui est dans les poitrines sera dévoilé, ce jour-là leur Seigneur sera parfaitement informé d'eux ? » Les intentions cachées seront exposées."]],
les:["Un animal peut être plus fidèle à son maître que l'homme à son Créateur.","L'amour excessif de l'argent rend ingrat.","Nos intentions cachées seront dévoilées : il faut purifier son cœur."]};

SD[101]={ctx:"Sourate mecquoise. Al-Qari'a, « celle qui frappe à grand fracas », est l'un des noms du Jour de la résurrection.",
parts:[
["1-3","Le Fracas","« Le Fracas ! Qu'est-ce que le Fracas ? Et qui te dira ce qu'est le Fracas ? » La répétition sous forme de question montre la gravité de cet événement."],
["4-5","Des papillons et de la laine","Ce jour-là, les gens seront comme des papillons dispersés, perdus et désorientés, et les montagnes comme de la laine cardée, légère et colorée. Ce qui paraît le plus solide aujourd'hui deviendra le plus léger."],
["6-11","La balance","Celui dont la balance sera lourde de bonnes œuvres sera dans une vie agréable. Celui dont la balance sera légère aura pour mère (pour refuge) un abîme (hawiya). « Et qui te dira ce qu'est l'abîme ? Un feu ardent. » Le Prophète ﷺ a dit que rien n'est plus lourd dans la balance que le bon caractère (Tirmidhi 2002) et que « Soubhan Allah wa bihamdih, Soubhan Allah al-'adhim » sont deux paroles lourdes dans la balance (Bukhari 6406)."]],
les:["Le Jour de la résurrection renversera toutes les apparences.","Ce qui compte, c'est le poids de nos actes dans la balance.","Le bon caractère et le rappel d'Allah alourdissent la balance."]};

SD[102]={ctx:"Sourate mecquoise. Selon des commentateurs, elle fut révélée au sujet de deux tribus qui se vantaient de leur nombre, jusqu'à compter leurs morts dans les cimetières. Le Prophète ﷺ la récita puis dit : « Le fils d'Adam dit : mon argent, mon argent ! Mais as-tu, fils d'Adam, de ton argent autre chose que ce que tu as mangé et consommé, porté et usé, ou donné en aumône et ainsi gardé pour l'au-delà ? » (Muslim 2958).",
parts:[
["1-2","Distraits jusqu'à la tombe","« La course aux richesses vous distrait, jusqu'à ce que vous visitiez les tombes. » Les gens rivalisent en argent, en enfants, en prestige, jusqu'à la mort. La mort est appelée « visite » : la tombe n'est qu'une étape, pas la demeure finale."],
["3-7","Vous saurez","« Non ! Vous saurez bientôt ! Encore non ! Vous saurez bientôt ! Non ! Si vous saviez d'une science certaine… » Vous verrez certainement l'Enfer, d'abord de loin, puis de vos propres yeux, avec certitude."],
["8","Interrogés sur les délices","« Puis, ce jour-là, vous serez certes interrogés sur les délices. » Un jour, le Prophète ﷺ, Abou Bakr et 'Umar, affamés, mangèrent chez un Ansari des dattes, de la viande et de l'eau fraîche. Le Prophète ﷺ dit : « Voilà les délices sur lesquels vous serez interrogés le Jour de la résurrection » (Muslim 2038). Même l'eau fraîche, l'ombre et la santé sont des bienfaits dont il faut remercier Allah."]],
les:["Ce que l'on garde vraiment de son argent, c'est ce qu'on a donné pour Allah.","La compétition matérielle distrait de l'essentiel.","Chaque bienfait, même simple, appelle la gratitude et sera questionné."]};

SD[103]={ctx:"Sourate mecquoise. Selon at-Tabarani, quand deux compagnons se rencontraient, ils ne se quittaient pas avant que l'un récite al-'Asr à l'autre. L'imam ach-Chafi'i a dit : « Si Allah n'avait révélé aux gens que cette sourate comme preuve, elle leur aurait suffi. »",
parts:[
["1","Le serment par le temps","« Par le temps ! » Le mot 'asr désigne le temps qui passe (et aussi l'après-midi). Le temps est le capital de l'homme : chaque minute qui passe ne revient pas."],
["2","Tous en perdition","« L'homme est certes en perdition. » Tous les humains perdent, comme un commerçant dont le capital fond chaque jour."],
["3","Les quatre conditions du salut","« Sauf ceux qui croient, font de bonnes œuvres, se recommandent mutuellement la vérité et se recommandent mutuellement la patience. »\nLes savants y voient quatre étapes : la foi (connaître et croire), l'action (appliquer), l'appel (transmettre la vérité aux autres) et la patience (sur l'obéissance, contre les péchés et face aux épreuves). Les deux premières concernent la personne elle-même ; les deux dernières concernent la société. Il ne suffit pas d'être bon seul : il faut s'entraider dans le bien."]],
les:["Le temps est notre capital le plus précieux.","Sans foi et bonnes œuvres, l'homme perd sa vie.","Le salut est aussi collectif : se conseiller la vérité et la patience.","Trois versets qui résument toute la religion."]};

SD[104]={ctx:"Sourate mecquoise. Des commentateurs la rattachent à certains notables de La Mecque qui dénigraient le Prophète ﷺ et les croyants, mais sa portée est générale.",
parts:[
["1","Malheur au calomniateur","« Malheur à tout calomniateur diffamateur. » Le houmaza est celui qui critique les gens par ses gestes et ses regards ; le loumaza, celui qui les dénigre par ses paroles, en face ou en leur absence."],
["2-3","L'argent compté et recompté","« Qui amasse une fortune et la compte, pensant que sa fortune l'immortalisera. » Il croit que sa richesse lui donne le droit de mépriser les autres et le protège de tout."],
["4-9","Al-Houtama","« Non ! Il sera jeté dans al-Houtama », le feu qui brise tout. « C'est le feu d'Allah allumé, qui monte jusqu'aux cœurs. » Il atteint le cœur, siège de l'orgueil et du mépris. Il sera refermé sur eux, en colonnes étendues."]],
les:["La moquerie et le dénigrement des gens sont des péchés graves.","L'argent ne donne aucune valeur supérieure et ne rend pas immortel.","Le châtiment touche le cœur, d'où partent l'orgueil et le mépris."]};

SD[105]={ctx:"Sourate mecquoise. Elle rappelle un événement que les Mecquois connaissaient bien, survenu l'année de la naissance du Prophète ﷺ (vers 570), appelée « l'année de l'Éléphant ». Abraha, gouverneur du Yémen pour le royaume d'Abyssinie, avait construit une grande église à San'a' pour détourner les Arabes du pèlerinage à La Mecque. Il marcha sur La Mecque avec une armée et des éléphants pour détruire la Ka'ba.",
parts:[
["1-2","La ruse détournée","« N'as-tu pas vu comment ton Seigneur a agi envers les gens de l'Éléphant ? N'a-t-Il pas rendu leur ruse vaine ? » Selon Ibn Kathir, 'Abd al-Mouttalib, grand-père du Prophète ﷺ, demanda seulement à Abraha de lui rendre ses chameaux, en disant : « Je suis le maître des chameaux ; la Maison a un Maître qui la protégera. » Les Mecquois se réfugièrent dans les montagnes. Arrivé près de La Mecque, l'éléphant principal refusa d'avancer vers la Ka'ba."],
["3-5","Les oiseaux Ababil","Allah envoya sur eux des oiseaux par volées (ababil), qui leur lançaient des pierres d'argile cuite. Il les rendit comme de la paille mâchée. L'armée fut anéantie et Abraha mourut en retournant au Yémen. La Ka'ba fut protégée sans que les Mecquois aient eu à combattre."]],
les:["Allah protège Sa Maison : aucune puissance ne peut l'emporter sur Sa volonté.","Les moyens les plus faibles (de petits oiseaux) peuvent vaincre les plus forts quand Allah le veut.","Cet événement préparait la venue du Prophète ﷺ, né cette même année."]};

SD[106]={ctx:"Sourate mecquoise, liée à la précédente par le sens : Allah a protégé La Mecque des gens de l'Éléphant pour que Qouraych puisse continuer ses voyages en sécurité. La tribu de Qouraych vivait du commerce : une caravane vers le Yémen en hiver, une autre vers le Cham (Syrie) en été.",
parts:[
["1-2","Les voyages de Qouraych","« À cause du pacte de Qouraych, leur pacte pour les voyages d'hiver et d'été. » Grâce au respect que les Arabes avaient pour les gardiens de la Ka'ba, les caravanes de Qouraych voyageaient en sécurité, alors que les autres tribus étaient souvent attaquées."],
["3-4","Qu'ils adorent le Seigneur de cette Maison","« Qu'ils adorent donc le Seigneur de cette Maison, qui les a nourris contre la faim et rassurés contre la peur. » La nourriture et la sécurité sont deux des plus grands bienfaits. La gratitude normale est d'adorer Celui qui les donne, et non des idoles."]],
les:["La nourriture et la sécurité sont des bienfaits immenses.","La gratitude envers Allah se montre par l'adoration.","Les bienfaits ne doivent pas faire oublier Celui qui les donne."]};

SD[107]={ctx:"Sourate mecquoise selon la majorité (une partie médinoise selon certains). Elle décrit les comportements de celui qui ne croit pas vraiment à la rétribution.",
parts:[
["1-3","Celui qui dément la religion","« As-tu vu celui qui dément la rétribution ? C'est celui qui repousse l'orphelin avec brutalité et n'encourage pas à nourrir le pauvre. » La foi en l'au-delà se voit dans le comportement envers les plus faibles. Il ne nourrit pas, et n'encourage même pas les autres à le faire."],
["4-5","Malheur à ceux qui négligent leur prière","« Malheur à ceux qui prient, tout en étant négligents de leur prière. » Il ne s'agit pas d'un oubli occasionnel, mais de ceux qui la retardent jusqu'à la laisser passer, ou qui la font sans attention ni respect de ses conditions."],
["6-7","L'ostentation et l'avarice","« Qui ne font que se faire voir, et refusent l'ustensile. » Ils prient pour être vus des gens. Al-ma'oun désigne les petites choses que les voisins se prêtent : un seau, une marmite, du sel, une aiguille. Même cette petite générosité, ils la refusent."]],
les:["La vraie foi se voit dans notre comportement envers l'orphelin et le pauvre.","Prier à l'heure et avec attention fait partie de la foi.","Faire ses actes pour être vu les annule.","Prêter les petites choses du quotidien est une bonne action."]};

SD[108]={ctx:"Sourate mecquoise, la plus courte du Coran. Selon des commentateurs, quand les fils du Prophète ﷺ moururent en bas âge, al-'As ibn Wa'il se moqua en disant qu'il était abtar : « sans postérité », sans descendant mâle pour perpétuer son nom. Anas rapporte que le Prophète ﷺ s'assoupit un instant, puis leva la tête en souriant et récita cette sourate qui venait de lui être révélée (Muslim 400).",
parts:[
["1","Al-Kawthar","« Nous t'avons accordé l'Abondance (al-Kawthar). » Le Prophète ﷺ expliqua que c'est un fleuve que son Seigneur lui a promis au Paradis, avec un bassin où sa communauté viendra boire au Jour de la résurrection ; ses récipients sont aussi nombreux que les étoiles (Muslim 400). Les savants y voient aussi tout le bien abondant donné au Prophète ﷺ : la prophétie, le Coran, sa communauté."],
["2","Prie et sacrifie","« Prie donc pour ton Seigneur et sacrifie. » La réponse aux bienfaits est d'adorer Allah sincèrement, par la prière et par le sacrifice (comme celui de l'Aïd), contrairement aux polythéistes qui sacrifiaient pour leurs idoles."],
["3","C'est lui le sans-postérité","« C'est celui qui te hait qui sera sans postérité. » Le nom du Prophète ﷺ est mentionné chaque jour dans le monde entier, alors que celui qui s'est moqué de lui est oublié."]],
les:["Allah défend Son Prophète ﷺ contre ceux qui se moquent de lui.","La réponse aux bienfaits est la prière et le sacrifice pour Allah seul.","La vraie postérité est la mémoire et le bien que l'on laisse."]};

SD[109]={ctx:"Sourate mecquoise. Selon des commentateurs, des notables de Qouraych proposèrent au Prophète ﷺ un compromis : adorer leurs idoles pendant un an, et ils adoreraient Allah l'année suivante. Cette sourate fut la réponse. Le Prophète ﷺ la récitait avec al-Ikhlas dans les deux unités de prière avant l'aube et après la circumambulation (Muslim 726, 1218). Il conseilla aussi de la lire avant de dormir, car elle est un désaveu du chirk (Abou Daoud 5055).",
parts:[
["1-5","Aucun compromis dans l'adoration","« Dis : Ô vous les mécréants ! Je n'adore pas ce que vous adorez, et vous n'adorez pas ce que j'adore. Je ne suis pas adorateur de ce que vous avez adoré, et vous n'êtes pas adorateurs de ce que j'adore. » Les répétitions excluent tout compromis, dans le présent comme dans l'avenir : on ne peut pas mélanger l'adoration d'Allah avec celle d'autre que Lui."],
["6","À vous votre religion","« À vous votre religion, et à moi ma religion. » Ce verset affirme une séparation claire dans les croyances et l'adoration. Il ne signifie pas que toutes les religions se valent, mais que chacun est responsable de son choix et qu'il n'y a pas de contrainte. Le musulman peut vivre en paix et être juste avec les non-musulmans (60:8), sans renoncer à son tawhid."]],
les:["Le tawhid ne se négocie pas : on n'adore qu'Allah.","Désavouer le chirk est une protection, d'où sa lecture avant de dormir.","Pas de contrainte en religion, mais pas de mélange non plus."]};

SD[110]={ctx:"Sourate médinoise, l'une des dernières révélées, selon Ibn 'Abbas peut-être la dernière sourate complète. 'Umar demanda aux anciens compagnons ce qu'elle signifiait ; ils dirent qu'elle ordonnait de louer Allah et de Lui demander pardon après la victoire. Ibn 'Abbas, encore jeune, répondit : « C'est l'annonce du terme de la vie du Messager d'Allah ﷺ. » 'Umar dit : « Je n'en sais pas autre chose que ce que tu dis » (Bukhari 4970).",
parts:[
["1-2","La victoire et les foules","« Quand viendra le secours d'Allah ainsi que la victoire (la conquête de La Mecque), et que tu verras les gens entrer en foule dans la religion d'Allah… » Après la conquête de La Mecque en 630, les tribus arabes vinrent en délégations embrasser l'islam."],
["3","Glorifie et demande pardon","« … alors glorifie ton Seigneur par Sa louange et demande-Lui pardon. Il est Celui qui accepte toujours le repentir. » 'Aïcha rapporte qu'après la révélation de cette sourate, le Prophète ﷺ disait souvent dans son inclinaison et sa prosternation : « Soubhanaka Allahoumma rabbana wa bihamdika, Allahoumma ghfir li » (Bukhari 4968)."]],
les:["Après une réussite, il faut glorifier Allah et demander pardon, pas s'enorgueillir.","La fin d'une mission accomplie annonce le retour vers Allah.","Demander pardon reste nécessaire même après de grandes œuvres."]};

SD[111]={ctx:"Sourate mecquoise. Quand fut révélé « Avertis les plus proches de ta famille » (26:214), le Prophète ﷺ monta sur le mont as-Safa et appela les clans de Qouraych. Il leur demanda : « Si je vous disais qu'une cavalerie va vous attaquer derrière cette vallée, me croiriez-vous ? » « Oui, nous ne t'avons jamais connu menteur. » « Je suis un avertisseur pour vous avant un châtiment terrible. » Son oncle Abou Lahab dit : « Que tu périsses ! Est-ce pour cela que tu nous as réunis ? » Et cette sourate fut révélée (Bukhari 4971).",
parts:[
["1-3","La perte d'Abou Lahab","« Que périssent les deux mains d'Abou Lahab, et qu'il périsse ! » Abou Lahab, de son vrai nom 'Abd al-'Ouzza, était l'oncle du Prophète ﷺ et l'un de ses pires ennemis : il le suivait sur les marchés pour dire aux gens de ne pas l'écouter. « Sa fortune et ce qu'il a acquis (ses enfants) ne lui serviront à rien. Il brûlera dans un feu plein de flammes (lahab). » Son surnom, « l'homme aux flammes », annonce son sort."],
["4-5","Sa femme, porteuse de bois","« Ainsi que sa femme, la porteuse de bois, qui aura au cou une corde de fibres. » Oumm Jamil, sa femme, posait des épines sur le chemin du Prophète ﷺ et propageait la calomnie (« porter le bois » est aussi une expression pour la médisance qui attise les conflits)."],
["","Un miracle","Cette sourate annonçait qu'Abou Lahab et sa femme mourraient mécréants. Pendant près de dix ans, il leur aurait suffi de prononcer la chahada, même par hypocrisie, pour contredire le Coran. Ils ne l'ont jamais fait, et Abou Lahab mourut mécréant peu après la bataille de Badr. Les savants y voient une preuve de l'origine divine du Coran."]],
les:["Le lien de parenté ne sauve pas sans la foi.","La richesse et les enfants ne protègent pas du châtiment.","Le Coran a annoncé à l'avance la fin d'Abou Lahab, et cela s'est réalisé.","Nuire aux croyants et propager la calomnie sont des fautes graves."]};

SD[112]={ctx:"Selon Tirmidhi (3364) et d'autres, les polythéistes demandèrent au Prophète ﷺ : « Décris-nous ton Seigneur, quelle est Sa généalogie ? » Allah révéla cette sourate. Le Prophète ﷺ a dit qu'elle équivaut au tiers du Coran (Bukhari 5013). Un compagnon la récitait à chaque unité de prière parce qu'elle décrit le Tout Miséricordieux et qu'il aimait la réciter ; le Prophète ﷺ dit : « Dites-lui qu'Allah l'aime » (Bukhari 7375).",
parts:[
["1","Allah est Un","« Dis : Il est Allah, Un (Ahad). » Allah est Unique dans Son essence, Ses attributs et Ses actes, sans associé ni semblable. Le mot ahad exprime une unicité absolue, qui ne peut pas être divisée ni multipliée."],
["2","As-Samad","« Allah, le Soutien universel (as-Samad). » Selon les commentateurs, as-Samad est le Maître parfait vers qui toutes les créatures se tournent dans leurs besoins, et qui n'a besoin de personne. Ibn 'Abbas a dit : « Celui dont la souveraineté, la science, la sagesse et toutes les qualités sont parfaites. »"],
["3","Il n'a pas engendré et n'a pas été engendré","« Il n'a jamais engendré, n'a pas été engendré. » Ce verset réfute l'idée qu'Allah ait un fils ou une fille (comme le croyaient certains polythéistes au sujet des anges, et les chrétiens au sujet de 'Issa), et l'idée qu'Il ait une origine. Il est le Premier, sans commencement."],
["4","Nul ne Lui est égal","« Et nul n'est égal à Lui. » Rien ne Lui ressemble ni ne Lui est comparable (42:11). Ces quatre versets résument tout le tawhid concernant Allah lui-même. C'est pourquoi la sourate équivaut au tiers du Coran, dont un tiers parle d'Allah, un tiers des lois et un tiers des récits et de la rétribution, selon l'explication de nombreux savants."]],
les:["La réciter trois fois équivaut à lire tout le Coran en récompense (selon le sens du hadith).","Aimer cette sourate est une cause de l'amour d'Allah.","Allah n'a besoin de personne, et tout a besoin de Lui.","À réciter matin et soir avec al-Falaq et an-Nas (Abou Daoud 5082)."]};

SD[113]={ctx:"Avec an-Nas, on l'appelle al-Mou'awwidhatan, « les deux sourates de protection ». 'Ouqba ibn 'Amir rapporte que le Prophète ﷺ a dit : « N'as-tu pas vu des versets révélés cette nuit, dont on n'a jamais vu de semblables ? Qoul a'oudhou bi rabbi l-falaq et Qoul a'oudhou bi rabbi n-nas » (Muslim 814). Le Prophète ﷺ les récitait chaque soir en soufflant dans ses mains et en les passant sur son corps (Bukhari 5017), et les utilisait pour se protéger quand il était malade.",
parts:[
["1","Le Seigneur de l'aube","« Dis : je cherche refuge auprès du Seigneur de l'aube naissante (al-falaq). » Celui qui fait sortir la lumière de l'obscurité peut aussi faire sortir le serviteur de ses difficultés."],
["2","Le mal de ce qu'Il a créé","« Contre le mal de ce qu'Il a créé » : une protection générale contre tout mal, venant des humains, des djinns, des animaux ou de toute autre chose."],
["3","La nuit qui s'étend","« Contre le mal de l'obscurité quand elle s'étend. » La nuit est le moment où se répandent beaucoup de dangers et où les malfaiteurs agissent."],
["4","Les souffleuses sur les nœuds","« Contre le mal de celles qui soufflent sur les nœuds » : les sorcières et sorciers, qui faisaient des nœuds en soufflant dessus avec des incantations. La sorcellerie est réelle, mais elle ne nuit que par la permission d'Allah (2:102), et ces sourates sont la meilleure protection contre elle."],
["5","L'envieux","« Et contre le mal de l'envieux quand il envie. » L'envie (hasad) consiste à souhaiter la disparition d'un bienfait chez autrui. Le mauvais œil, qui en découle, est réel selon le hadith (Bukhari 5740)."]],
les:["Chercher refuge auprès d'Allah est un acte de foi et de confiance.","À réciter le matin, le soir, avant de dormir et après chaque prière.","La sorcellerie et l'envie existent, mais rien n'arrive sans la permission d'Allah.","Purifier son propre cœur de l'envie."]};

SD[114]={ctx:"La dernière sourate du Coran, révélée avec al-Falaq (voir son contexte). Le Prophète ﷺ ordonna de réciter al-Ikhlas, al-Falaq et an-Nas trois fois matin et soir : « elles te suffiront contre toute chose » (Abou Daoud 5082, Tirmidhi 3575).",
parts:[
["1-3","Trois noms d'Allah","« Dis : je cherche refuge auprès du Seigneur des hommes, le Roi des hommes, le Dieu des hommes. » Trois attributs : Il est leur Seigneur (qui les crée et les nourrit), leur Roi (qui les gouverne) et leur Dieu (le seul qui mérite leur adoration). Quand on se protège contre un ennemi intérieur et caché, on invoque Allah par tous ces noms."],
["4","Le chuchoteur qui se retire","« Contre le mal du chuchoteur furtif (al-waswas al-khannas). » Satan chuchote des pensées mauvaises dans le cœur ; quand le serviteur se souvient d'Allah, il se retire et recule (khannas). Le rappel d'Allah est donc l'arme contre les mauvaises pensées."],
["5-6","Djinns et humains","« Qui souffle le mal dans les poitrines des hommes, qu'il soit djinn ou humain. » Il existe aussi des humains qui jouent le rôle de Satan, en poussant les autres vers le mal par leurs conseils et leurs paroles."]],
les:["Les mauvaises pensées viennent souvent de Satan : il faut chercher refuge auprès d'Allah.","Le rappel d'Allah fait reculer le chuchoteur.","Se méfier aussi des personnes qui poussent au mal.","Le Coran commence par une demande de guidée (al-Fatiha) et se termine par une demande de protection."]};

// Sourate 18, al-Kahf : explication détaillée
SD[18]={ctx:"Sourate mecquoise. Selon Ibn Ishaq, d'après Ibn 'Abbas, les Qouraychites envoyèrent deux hommes interroger les rabbins de Médine au sujet du Prophète ﷺ. Les rabbins proposèrent trois questions pour tester s'il était un vrai prophète : l'histoire de jeunes gens disparus dans les temps anciens, celle d'un homme qui parcourut la terre d'est en ouest, et la nature de l'âme. Le Prophète ﷺ répondit : « Je vous répondrai demain », sans dire « in cha Allah ». La révélation tarda une quinzaine de jours, puis vint cette sourate, avec le rappel de dire « in cha Allah » (v. 23-24). La question de l'âme fut répondue dans al-Isra' (17:85). Le Prophète ﷺ a dit que celui qui apprend ses dix premiers versets est protégé du Dajjal (Muslim 809), et l'a recommandée le vendredi (al-Hakim, authentique).",
parts:[
["1-8","Un Livre droit et la parure de la terre","Louange à Allah qui a fait descendre sur Son serviteur le Livre, sans y mettre aucune tortuosité, pour avertir d'un châtiment sévère et annoncer aux croyants qui font le bien une belle récompense éternelle. Il avertit aussi ceux qui disent qu'Allah S'est donné un enfant : une parole énorme qui sort de leurs bouches, sans aucune science. Le Prophète ﷺ se consumait presque de chagrin parce qu'ils ne croyaient pas. « Nous avons placé ce qui est sur la terre comme une parure pour elle, afin d'éprouver qui d'entre eux agit le mieux, et Nous la réduirons en un sol aride » (v. 7-8). Toute la sourate tourne autour de cette idée : les biens de ce monde sont une épreuve passagère."],
["9-16","Les jeunes gens de la Caverne","Des jeunes gens croyants vivaient dans une cité dont le roi et le peuple adoraient des idoles. Ils refusèrent et dirent : « Notre Seigneur est le Seigneur des cieux et de la terre ; jamais nous n'invoquerons de divinité en dehors de Lui » (v. 14). Allah les affermit dans leur foi. Menacés, ils décidèrent de s'isoler dans une caverne en invoquant : « Notre Seigneur, accorde-nous de Ta part une miséricorde, et assure-nous la droiture dans notre affaire » (v. 10). Quitter son milieu pour préserver sa foi est la première leçon de ce récit."],
["17-22","Le sommeil de plusieurs siècles","Allah les fit dormir dans la caverne. Le soleil, à son lever, s'écartait de leur caverne vers la droite, et à son coucher passait à leur gauche, pour qu'ils ne soient pas brûlés. On les aurait crus éveillés, alors qu'ils dormaient ; Allah les retournait sur le côté droit et le côté gauche, et leur chien était allongé à l'entrée, les pattes étendues. Quand ils se réveillèrent, ils pensèrent avoir dormi un jour ou une partie de jour. Ils envoyèrent l'un d'eux en ville avec leurs pièces d'argent pour acheter la nourriture la plus pure, en lui recommandant la discrétion. Leur histoire fut découverte, et elle devint une preuve de la résurrection pour les gens de leur époque (v. 21). Les gens discutent de leur nombre (trois, cinq ou sept) : « Mon Seigneur connaît mieux leur nombre » (v. 22). L'important n'est pas ce détail, mais la leçon."],
["23-26","Dire « in cha Allah »","« Ne dis jamais d'une chose : je la ferai demain, sans ajouter : si Allah le veut. Et rappelle-toi ton Seigneur quand tu oublies » (v. 23-24). Ce rappel est lié au retard de la révélation. Ils restèrent dans leur caverne trois cents ans, et en ajoutèrent neuf (v. 25), ce que certains commentateurs expliquent par la différence entre années solaires et lunaires (300 années solaires font environ 309 années lunaires). « Allah sait mieux combien de temps ils restèrent. »"],
["27-31","Rester avec ceux qui invoquent Allah","« Récite ce qui t'a été révélé du Livre de ton Seigneur. » Puis un ordre important : « Fais preuve de patience en restant avec ceux qui invoquent leur Seigneur matin et soir, désirant Son visage. Que tes yeux ne se détournent pas d'eux, en recherchant la parure de la vie de ce monde. Et n'obéis pas à celui dont Nous avons rendu le cœur inattentif à Notre rappel, qui suit sa passion et dont l'affaire est l'excès » (v. 28). Selon des commentateurs, des notables demandaient au Prophète ﷺ d'éloigner les croyants pauvres pour qu'ils s'assoient avec lui. « La vérité vient de votre Seigneur : que celui qui veut croie, et que celui qui veut mécroie » (v. 29)."],
["32-44","Le propriétaire des deux jardins","Une parabole de deux hommes. Allah donna à l'un deux jardins de vignes entourés de palmiers, avec des cultures entre eux et une rivière au milieu. Fier, il dit à son compagnon : « Je suis plus riche que toi et plus puissant en hommes. » Il entra dans son jardin en disant : « Je ne pense pas que ceci périsse jamais, ni que l'Heure arrive ; et si je suis ramené vers mon Seigneur, je trouverai mieux encore » (v. 35-36).\nSon compagnon croyant lui répondit : « Mécrois-tu en Celui qui t'a créé de terre, puis d'une goutte, puis t'a façonné en homme ? Pourquoi, en entrant dans ton jardin, n'as-tu pas dit : Ma cha Allah, la qouwwata illa billah (ce qu'Allah a voulu ; il n'y a de force que par Allah) ? » (v. 39). Les fruits du jardin furent détruits ; l'homme se tordit les mains de regret pour ce qu'il avait dépensé, et dit : « Hélas ! Si seulement je n'avais associé personne à mon Seigneur ! » (v. 42). C'est l'épreuve de la richesse."],
["45-49","Ce qui dure vraiment","« Donne-leur l'exemple de la vie de ce monde : elle est comme une eau que Nous faisons descendre du ciel ; les plantes de la terre s'en mélangent, puis deviennent des brindilles que les vents dispersent » (v. 45). « Les biens et les enfants sont la parure de la vie de ce monde ; mais les bonnes œuvres qui demeurent (al-baqiyat as-salihat) sont meilleures auprès de ton Seigneur en récompense et en espoir » (v. 46). Les savants expliquent ces œuvres par les paroles « Soubhan Allah, al-hamdou lillah, la ilaha illa Allah, Allahou akbar » et toutes les bonnes actions. Puis le Jour du jugement : les montagnes mises en marche, les gens présentés en rangs, et le livre des actes posé. Les criminels diront : « Malheur à nous ! Qu'a donc ce livre ? Il n'omet ni petite ni grande action sans l'avoir comptée » (v. 49)."],
["50-53","Iblis, l'ennemi","« Quand Nous dîmes aux anges : prosternez-vous devant Adam, ils se prosternèrent, sauf Iblis, qui était parmi les djinns et désobéit à l'ordre de son Seigneur. Allez-vous le prendre, lui et sa descendance, pour alliés en dehors de Moi, alors qu'ils sont vos ennemis ? » (v. 50). Le rappel d'Iblis au milieu de la sourate montre l'origine de toutes ces épreuves : l'orgueil et la tentation de Satan."],
["54-59","L'homme, le plus grand disputeur","Allah a exposé dans ce Coran toutes sortes d'exemples, mais « l'homme est, de tous les êtres, le plus grand disputeur » (v. 54). Qu'est-ce qui empêche les gens de croire quand la guidée leur est venue ? Allah est Pardonneur et Miséricordieux ; s'Il les saisissait pour ce qu'ils ont acquis, Il hâterait leur châtiment. Les cités anciennes ont été détruites quand elles ont été injustes, à un moment fixé."],
["60-70","Moussa part chercher la science","Moussa, selon le hadith de Bukhari (122), dit un jour qu'il était le plus savant des hommes. Allah lui révéla qu'un de Ses serviteurs, à la jonction des deux mers, était plus savant que lui. Moussa partit avec son jeune serviteur (Yousha' ibn Noun) et un poisson dans un panier, en disant : « Je ne cesserai d'aller jusqu'à atteindre la jonction des deux mers, dussé-je marcher de longues années » (v. 60). À un rocher, le poisson reprit vie et glissa dans la mer ; le serviteur oublia de le dire. Le lendemain, fatigués, ils comprirent que c'était l'endroit, et revinrent sur leurs pas.\nIls trouvèrent un serviteur d'Allah « à qui Nous avions donné une miséricorde de Notre part et enseigné une science émanant de Nous » (v. 65) : al-Khadir. Moussa lui demanda avec politesse : « Puis-je te suivre pour que tu m'enseignes de ce qu'on t'a enseigné ? » (v. 66). Al-Khadir répondit : « Tu ne pourras pas être patient avec moi. » Moussa promit la patience et l'obéissance, et al-Khadir posa une condition : ne rien lui demander avant qu'il ne l'explique lui-même."],
["71-78","Les trois actes déroutants","Ils montèrent dans un bateau dont les propriétaires les avaient transportés gratuitement ; al-Khadir y fit un trou. Moussa protesta : « L'as-tu troué pour noyer ses passagers ? » « Ne t'avais-je pas dit que tu ne pourrais pas être patient avec moi ? » Moussa s'excusa d'avoir oublié.\nIls rencontrèrent un jeune garçon, et al-Khadir le tua. Moussa protesta plus fortement : « As-tu tué une âme innocente ? Tu as commis une chose affreuse ! » Puis ils arrivèrent dans un village dont les habitants refusèrent de les nourrir. Ils y trouvèrent un mur sur le point de s'écrouler, et al-Khadir le redressa. Moussa dit : « Si tu voulais, tu aurais pu demander un salaire. » « Voici la séparation entre toi et moi ; je vais t'expliquer ce que tu n'as pas pu endurer. » Le Prophète ﷺ a dit : « Nous aurions aimé que Moussa patiente, pour qu'Allah nous raconte davantage de leur histoire » (Bukhari 122)."],
["79-82","L'explication de la sagesse cachée","Le bateau appartenait à des pauvres qui travaillaient en mer ; derrière eux, un roi saisissait de force tout bateau en bon état. Le défaut les a protégés. Le garçon allait devenir un tyran mécréant envers ses parents croyants ; Allah voulait leur donner à la place un enfant plus pur et plus affectueux. Le mur appartenait à deux orphelins de la ville ; dessous se trouvait un trésor pour eux, et leur père était vertueux. Allah voulait qu'ils atteignent leur maturité et sortent leur trésor, par miséricorde. « Je ne l'ai pas fait de mon propre chef » (v. 82) : tout était sur ordre d'Allah.\nLes leçons : derrière des événements qui paraissent mauvais se cache souvent une sagesse ; la piété d'un père protège ses enfants après lui ; et même le plus grand savant doit rester humble et continuer d'apprendre. C'est l'épreuve de la science."],
["83-98","Dhoul-Qarnayn","On interrogeait le Prophète ﷺ sur Dhoul-Qarnayn (« l'homme aux deux cornes », ou « aux deux époques », selon les explications). Allah lui donna le pouvoir sur terre et les moyens de toute chose. Il partit vers l'ouest jusqu'au couchant du soleil, qu'il vit se coucher dans une source boueuse (selon ce qu'il voyait à l'horizon). Il y trouva un peuple, et décida de punir l'injuste et de récompenser le croyant vertueux. Puis il partit vers l'est, où il trouva un peuple sans abri contre le soleil.\nEnfin, entre deux montagnes, un peuple qui comprenait à peine son langage se plaignit de Ya'jouj et Ma'jouj (Gog et Magog), qui semaient la corruption sur terre, et lui proposa un tribut pour construire une barrière. Il refusa l'argent : « Ce que mon Seigneur m'a donné est meilleur ; aidez-moi seulement avec votre force » (v. 95). Il fit apporter des blocs de fer jusqu'à combler l'espace entre les deux montagnes, souffla le feu, puis versa du cuivre fondu par-dessus. Ya'jouj et Ma'jouj ne purent ni l'escalader ni le percer. Il dit alors : « Ceci est une miséricorde de mon Seigneur. Quand viendra la promesse de mon Seigneur, Il le réduira en poussière » (v. 98). Le pouvoir mis au service de la justice, attribué humblement à Allah : c'est l'épreuve du pouvoir réussie."],
["99-102","Le jour où tout sera rassemblé","Ce jour-là, Allah laissera les gens déferler les uns sur les autres comme des vagues, et on soufflera dans la trompe. L'Enfer sera exposé aux mécréants, dont les yeux étaient voilés contre Son rappel et qui ne pouvaient même pas entendre. Croient-ils pouvoir prendre Mes serviteurs pour protecteurs en dehors de Moi ?"],
["103-108","Les plus grands perdants","« Dis : voulez-vous que Je vous informe de ceux qui sont les plus grands perdants dans leurs œuvres ? Ceux dont l'effort s'est égaré dans la vie de ce monde, alors qu'ils croient bien faire » (v. 103-104). On peut faire beaucoup d'efforts dans une mauvaise direction. Ceux qui croient et font de bonnes œuvres auront les jardins du Firdaws, d'où ils ne voudront jamais partir."],
["109-110","Les paroles d'Allah et la sincérité","« Si la mer était une encre pour les paroles de mon Seigneur, la mer s'épuiserait avant que ne soient épuisées les paroles de mon Seigneur, quand même Nous en apporterions une autre pareille en renfort » (v. 109). Le dernier verset résume toute la religion : « Dis : je ne suis qu'un homme comme vous ; il m'est révélé que votre Dieu est un Dieu unique. Que celui qui espère rencontrer son Seigneur fasse de bonnes œuvres et n'associe personne dans l'adoration de son Seigneur » (v. 110). Deux conditions pour que l'œuvre soit acceptée : qu'elle soit bonne (conforme à la Sunna) et sincère (faite pour Allah seul)."]],
les:["Les quatre histoires correspondent aux quatre épreuves de la vie : la foi, la richesse, la science et le pouvoir.","Protéger sa foi peut demander de s'éloigner d'un milieu qui la menace.","Rester avec ceux qui invoquent Allah, même s'ils sont pauvres et simples.","Dire « in cha Allah » pour ses projets, et « ma cha Allah, la qouwwata illa billah » devant ses biens.","Les bonnes œuvres durent ; les biens et la parure de ce monde passent.","Faire confiance à la sagesse d'Allah, même quand on ne comprend pas Ses décrets.","Rester humble dans la science et dans le pouvoir.","Une œuvre n'est acceptée que si elle est sincère et conforme à la Sunna."]};

// Sourates 1 à 4
SD[1]={ctx:"Sourate mecquoise, l'une des premières révélées en entier. Elle porte plusieurs noms : Oumm al-Kitab (la mère du Livre), as-Sab' al-Mathani (les sept versets répétés, 15:87), ach-Chifa' (la guérison) et ar-Rouqya. Le Prophète ﷺ a dit : « Pas de prière pour celui qui ne lit pas la Fatiha » (Bukhari 756), et l'a appelée « la plus grande sourate du Coran » (Bukhari 4474). Dans un hadith qoudsi, Allah dit : « J'ai partagé la prière entre Moi et Mon serviteur en deux moitiés, et Mon serviteur aura ce qu'il demande », puis Allah répond à chaque verset récité (Muslim 395).",
parts:[
["1","Au nom d'Allah","« Au nom d'Allah, le Tout Miséricordieux, le Très Miséricordieux. » Selon l'avis de nombreux savants (dont l'école chafi'ite), la basmala est le premier verset de la Fatiha. On commence tout acte au nom d'Allah, en cherchant Son aide et Sa bénédiction. Ar-Rahman désigne une miséricorde immense qui englobe toutes les créatures ; ar-Rahim, une miséricorde particulière pour les croyants."],
["2","La louange","« Louange à Allah, Seigneur des mondes. » Dans le hadith qoudsi, Allah répond : « Mon serviteur M'a loué. » Al-hamd est une louange accompagnée d'amour et de respect. Allah est le Rabb : Celui qui crée, possède, nourrit et éduque. Les mondes (al-'alamin) désignent tout ce qui existe en dehors d'Allah : humains, djinns, anges, animaux, univers."],
["3-4","Miséricorde et jugement","« Le Tout Miséricordieux, le Très Miséricordieux, Maître du Jour de la rétribution. » Allah répond : « Mon serviteur M'a glorifié », puis « Mon serviteur s'en est remis à Moi. » L'espoir (la miséricorde) et la crainte (le jugement) sont réunis : le croyant avance vers Allah avec ces deux ailes. Allah est le Maître de tous les jours, mais le Jour du jugement est cité car personne d'autre n'aura alors le moindre pouvoir."],
["5","Le pacte","« C'est Toi seul que nous adorons, et c'est Toi seul dont nous implorons le secours. » Allah répond : « Ceci est entre Moi et Mon serviteur, et Mon serviteur aura ce qu'il demande. » Le mot « Toi » est placé en premier en arabe, ce qui exprime l'exclusivité : à Toi seul et à personne d'autre. C'est le cœur du tawhid. L'adoration vient avant la demande d'aide : on remplit d'abord son devoir, puis on demande. Et on demande l'aide d'Allah parce qu'on ne peut même pas L'adorer sans Son aide."],
["6-7","La demande de guidée","« Guide-nous sur le chemin droit, le chemin de ceux que Tu as comblés de bienfaits, non pas de ceux qui ont encouru Ta colère, ni des égarés. » Allah répond : « Ceci est pour Mon serviteur, et Mon serviteur aura ce qu'il demande. » C'est la demande la plus importante qu'un être humain puisse faire, et nous la répétons au moins dix-sept fois par jour.\nCeux qui ont été comblés sont les prophètes, les véridiques, les martyrs et les vertueux (4:69). Selon le Prophète ﷺ, ceux qui ont encouru la colère sont les Juifs et les égarés sont les chrétiens (Tirmidhi 2954) ; les savants en tirent un principe général : la colère touche celui qui connaît la vérité sans la suivre, et l'égarement touche celui qui agit sans science. Le chemin droit réunit la science et l'action. À la fin, on dit « Amin » (exauce-nous)."]],
les:["La Fatiha est un dialogue avec Allah : il faut la réciter lentement en sachant qu'Il répond à chaque verset.","Le tawhid se résume en un verset : n'adorer qu'Allah et ne demander l'aide qu'à Lui.","Le croyant marche entre l'espoir en Sa miséricorde et la crainte de Son jugement.","La guidée se demande chaque jour, car on en a besoin à chaque instant.","La science sans action, ou l'action sans science, éloignent du droit chemin."]};

SD[2]={ctx:"La plus longue sourate du Coran, révélée à Médine sur plusieurs années, principalement au début de l'Hégire. Elle contient le dernier verset révélé selon Ibn 'Abbas (2:281). C'est la sourate de la construction de la communauté : elle définit qui sont les croyants, tire les leçons de l'histoire des Enfants d'Israël, transfère la direction de la prière vers La Mecque, et pose la plupart des règles de vie. Le Prophète ﷺ a dit : « Ne faites pas de vos maisons des tombes ; Satan fuit la maison où l'on récite la sourate al-Baqara » (Muslim 780).",
parts:[
["1-5","Les croyants","Après les lettres isolées Alif-Lam-Mim, dont seul Allah connaît le sens exact selon l'avis le plus prudent, la sourate présente le Coran comme un livre sans aucun doute, une guidée pour les pieux. Ils croient à l'invisible (Allah, les anges, l'au-delà), accomplissent la prière, dépensent de ce qu'Allah leur a donné, croient à ce qui a été révélé au Prophète ﷺ et avant lui, et ont la certitude de l'au-delà."],
["6-7","Les mécréants","Pour ceux qui refusent la vérité avec obstination, peu importe qu'on les avertisse ou non : Allah a scellé leur cœur et leur ouïe, et un voile couvre leur vue, en conséquence de leur refus."],
["8-20","Les hypocrites","Treize versets décrivent les hypocrites, apparus à Médine : ils disent « nous croyons » sans y croire, pensent tromper Allah et les croyants alors qu'ils ne trompent qu'eux-mêmes. Leur cœur est malade. Deux paraboles les décrivent : celui qui allume un feu puis se retrouve dans le noir quand Allah emporte la lumière, et ceux qui sont surpris par un orage, avec ténèbres, tonnerre et éclairs, et qui se bouchent les oreilles par peur de la mort."],
["21-29","L'appel à toute l'humanité","« Ô gens ! Adorez votre Seigneur qui vous a créés. » Allah rappelle qu'Il a fait de la terre un lit et du ciel un toit, et lance un défi : si vous doutez du Coran, produisez une seule sourate semblable (v. 23-24). Il annonce le Paradis aux croyants, et explique qu'Il ne se gêne pas de donner en exemple même un moustique : les croyants y voient la vérité, les pervers s'en moquent."],
["30-39","Adam et Iblis","Allah annonce aux anges qu'Il va placer un khalifa sur terre, enseigne à Adam les noms de toutes choses, ordonne aux anges de se prosterner devant lui ; Iblis refuse par orgueil. Adam et son épouse habitent le Paradis, Satan les fait trébucher, puis Adam reçoit de son Seigneur des paroles de repentir et Allah lui pardonne. Ils descendent sur terre avec la promesse que celui qui suivra la guidée n'aura ni crainte ni tristesse."],
["40-74","Les Enfants d'Israël : bienfaits et ingratitudes","Allah s'adresse aux Enfants d'Israël et leur rappelle Ses bienfaits : le sauvetage de Pharaon, la mer ouverte, la Torah, le pardon après le veau d'or, le nuage qui les ombrageait, la manne et les cailles, les douze sources jaillies du rocher. Il rappelle aussi leurs manquements : l'adoration du veau, la demande de voir Allah, la violation du sabbat.\nLe passage se termine par l'histoire de la vache (v. 67-73) : un meurtre dont on ignorait l'auteur ; Allah ordonne d'égorger une vache, mais ils multiplient les questions sur son âge, sa couleur et ses caractéristiques, rendant l'ordre de plus en plus difficile. Frappé d'un morceau de la vache, le mort revient à la vie et désigne son meurtrier. Leurs cœurs se sont ensuite durcis comme la pierre, ou plus encore."],
["75-103","Leurs prétentions et la magie","Le Coran décrit ceux qui déformaient l'Écriture, écrivaient des livres de leurs mains en disant qu'ils venaient d'Allah, prétendaient que le Feu ne les toucherait que quelques jours, et rompaient le pacte avec Allah. Il rappelle leurs prophètes tués ou démentis.\nLe verset 102 explique que Soulayman n'a jamais mécru : ce sont les démons qui ont enseigné la magie. Deux anges à Babylone, Harout et Marout, prévenaient ceux qui voulaient l'apprendre : « Nous ne sommes qu'une tentation, ne deviens pas mécréant. » La magie ne nuit qu'avec la permission d'Allah."],
["104-123","Réponses aux gens du Livre","Allah répond aux objections : l'abrogation de certains versets (v. 106), la prétention que seuls les Juifs ou les chrétiens entreront au Paradis (v. 111-112 : le Paradis est pour celui qui se soumet à Allah et fait le bien). « À Allah appartiennent l'Orient et l'Occident ; où que vous vous tourniez, la face d'Allah est là » (v. 115)."],
["124-141","Ibrahim, la Ka'ba et la religion d'Ibrahim","Allah éprouve Ibrahim par des commandements qu'il accomplit, et en fait un guide pour les gens. Ibrahim et Isma'il élèvent les fondations de la Ka'ba en invoquant : « Notre Seigneur, accepte cela de nous… envoie-leur un messager de parmi eux » (v. 127-129), invocation exaucée par la venue de Muhammad ﷺ. Ibrahim et Ya'qub recommandent à leurs fils de mourir soumis à Allah. La vraie religion est celle d'Ibrahim, le monothéiste pur, qui n'était ni juif ni chrétien."],
["142-152","Le changement de qibla","Pendant environ seize ou dix-sept mois après l'Hégire, les musulmans priaient vers Jérusalem. Le Prophète ﷺ levait souvent le visage vers le ciel en espérant prier vers la Ka'ba. Allah ordonna : « Tourne donc ton visage vers la Mosquée sacrée » (v. 144). Les sots dirent : « Qu'est-ce qui les a détournés de leur qibla ? » La réponse : l'Orient et l'Occident appartiennent à Allah. Ce changement était un test pour distinguer ceux qui suivent le Messager. Allah fait de cette communauté « une communauté du juste milieu » (v. 143). « Souvenez-vous de Moi, Je Me souviendrai de vous » (v. 152)."],
["153-157","La patience dans l'épreuve","« Cherchez secours dans la patience et la prière » (v. 153). Ceux qui sont tués dans la voie d'Allah ne sont pas morts, mais vivants. « Nous vous éprouverons par un peu de peur, de faim, de diminution de biens, de personnes et de fruits ; annonce la bonne nouvelle aux patients, qui disent quand un malheur les touche : nous sommes à Allah et c'est vers Lui que nous retournerons » (v. 155-156)."],
["158-176","Safa et Marwa, les signes et la nourriture","As-Safa et al-Marwa font partie des rites d'Allah (v. 158). Le verset 164 énumère les signes d'Allah dans la création : les cieux et la terre, la nuit et le jour, les bateaux, la pluie, les vents, les nuages. Ceux qui adorent des égaux à Allah les aiment comme on aime Allah, mais les croyants aiment Allah plus fortement (v. 165). Puis les règles alimentaires : mangez de ce qui est licite et bon ; sont interdits la bête morte, le sang, la viande de porc et ce qui est sacrifié pour autre qu'Allah, sauf en cas de nécessité (v. 173)."],
["177","La vraie piété","Un verset qui définit la piété (al-birr) : ce n'est pas de tourner son visage vers l'est ou l'ouest, mais de croire en Allah, au Jour dernier, aux anges, au Livre et aux prophètes, de donner de son argent malgré l'amour qu'on lui porte aux proches, aux orphelins, aux pauvres, aux voyageurs, aux mendiants et pour libérer les esclaves, d'accomplir la prière, de donner la zakat, de tenir ses engagements et d'être patient dans la misère, la maladie et le combat."],
["178-182","Le talion et le testament","La loi du talion (qisas) est établie avec la possibilité du pardon contre compensation : « Il y a pour vous une vie dans le talion » (v. 179), car il dissuade les meurtres. Puis les règles du testament pour les parents et les proches."],
["183-187","Le jeûne du Ramadan","« Ô vous qui croyez, le jeûne vous a été prescrit comme il a été prescrit à ceux d'avant vous, afin que vous atteigniez la piété » (v. 183). Le Ramadan est le mois où le Coran a été révélé (v. 185). Le malade et le voyageur peuvent rattraper plus tard. « Allah veut pour vous la facilité, Il ne veut pas pour vous la difficulté. » Au milieu des versets du jeûne, Allah dit : « Quand Mes serviteurs t'interrogent sur Moi, Je suis proche, Je réponds à l'appel de celui qui M'invoque » (v. 186). Les relations intimes sont permises les nuits du Ramadan, et l'on peut manger jusqu'à ce que le fil blanc de l'aube se distingue du fil noir de la nuit (v. 187)."],
["188-203","Les biens, le combat et le pèlerinage","Ne dévorez pas les biens des autres injustement et ne corrompez pas les juges (v. 188). Les nouvelles lunes servent à mesurer le temps et le pèlerinage (v. 189). Combattez ceux qui vous combattent, sans transgresser, car Allah n'aime pas les transgresseurs (v. 190) ; s'ils cessent, cessez. Puis les rites du Hajj et de la 'Omra : l'ihram, les sacrifices, le stationnement à 'Arafat, le rappel d'Allah à Mina, et l'invocation « Rabbana atina fi d-dounya hassana… » (v. 201)."],
["204-242","Société, famille et lois","Le portrait de l'hypocrite aux belles paroles qui sème la corruption (v. 204-206), l'appel à entrer entièrement dans l'islam (v. 208), la question de l'alcool et des jeux de hasard, dont le péché est plus grand que l'utilité (v. 219), le bon traitement des orphelins. Puis une longue partie sur la famille : interdiction d'épouser des polythéistes, la période des menstrues, le divorce qui peut être révoqué deux fois, puis la séparation définitive ; « retenez-les de façon convenable ou séparez-vous d'elles de façon convenable » ; le délai de viduité, l'allaitement pendant deux ans complets (v. 233), le droit des veuves, la dot. Au milieu, un rappel : « Soyez assidus aux prières, et surtout à la prière médiane » (v. 238)."],
["243-252","Talout, Jalout et Daoud","Les Enfants d'Israël demandent un roi ; Allah choisit Talout, pour sa science et sa force. À une rivière, la plupart de ses soldats désobéissent et boivent. Un petit groupe reste : « Combien de fois une petite troupe a vaincu une grande troupe, par la permission d'Allah » (v. 249). Daoud tue Jalout, et Allah lui donne la royauté et la sagesse."],
["253-257","Ayat al-Koursi","Les messagers ont des rangs différents. Puis vient le plus grand verset du Coran (Muslim 810) : « Allah ! Pas de divinité à part Lui, le Vivant, Celui qui subsiste par Lui-même. Ni somnolence ni sommeil ne Le saisissent. À Lui ce qui est dans les cieux et sur la terre… Son Koursi déborde les cieux et la terre, et leur garde ne Lui coûte aucune peine. Il est le Très-Haut, l'Immense » (v. 255). Celui qui le récite avant de dormir est protégé jusqu'au matin (Bukhari 2311). Puis : « Pas de contrainte en religion : la voie droite s'est distinguée de l'égarement » (v. 256)."],
["258-260","Trois récits sur la résurrection","Le débat d'Ibrahim avec le roi orgueilleux (v. 258) ; l'homme qui passa près d'une ville en ruine et se demanda comment Allah la ferait revivre : Allah le fit mourir cent ans puis le ressuscita, avec son âne, sous ses yeux (v. 259) ; Ibrahim qui demanda à voir comment Allah ressuscite les morts, avec les quatre oiseaux (v. 260)."],
["261-274","L'aumône","L'aumône dans la voie d'Allah est comme un grain qui produit sept épis de cent grains chacun (v. 261). Une bonne parole et le pardon valent mieux qu'une aumône suivie de reproches (v. 263). Celui qui donne pour être vu est comme un rocher couvert de terre : la pluie le laisse nu. Donnez de ce que vous avez de meilleur. Donner en secret aux pauvres est encore meilleur (v. 271), surtout à ceux qui, par dignité, ne demandent pas."],
["275-281","L'interdiction de l'usure","Ceux qui mangent l'usure (riba) se lèveront au Jour de la résurrection comme celui que Satan a frappé de folie. « Allah a rendu licite le commerce et interdit l'usure » (v. 275). « Allah anéantit l'usure et fait fructifier les aumônes » (v. 276). Ceux qui ne renoncent pas à l'usure reçoivent une déclaration de guerre d'Allah et de Son Messager. Si le débiteur est en difficulté, accordez-lui un délai, et lui faire remise est encore mieux (v. 280). « Craignez un jour où vous serez ramenés vers Allah » (v. 281), selon Ibn 'Abbas le dernier verset révélé."],
["282-283","Le verset de la dette","Le plus long verset du Coran détaille l'écriture des dettes : écrire le contrat, le faire écrire par un scribe honnête, prendre des témoins, et laisser une garantie en voyage s'il n'y a pas de scribe. L'islam organise jusqu'aux détails des transactions pour éviter les conflits et protéger les droits."],
["284-286","La conclusion","Allah sait ce qui est dans les âmes. Les croyants déclarent : « Nous avons entendu et obéi. » Allah ne charge une âme que selon sa capacité. La sourate se termine par une invocation : « Notre Seigneur, ne nous châtie pas si nous oublions ou commettons une erreur… ne nous charge pas de ce que nous ne pouvons supporter. Efface nos fautes, pardonne-nous et fais-nous miséricorde. » Allah répondait : « Je l'ai fait », à chaque phrase (Muslim 126). Le Prophète ﷺ a dit : « Celui qui récite les deux derniers versets de la sourate al-Baqara la nuit, ils lui suffisent » (Bukhari 5009)."]],
les:["Le Coran distingue trois attitudes : la foi, le refus et l'hypocrisie ; il faut sans cesse vérifier son cœur.","Obéir sans chercher d'échappatoires, contrairement à l'histoire de la vache.","La patience et la prière sont les deux secours du croyant.","La piété est un ensemble : croyance, générosité, prière et bon comportement.","Allah est proche et répond à celui qui L'invoque.","L'usure est interdite, l'aumône est bénie, et les contrats doivent être écrits.","Allah ne charge personne au-delà de ses capacités."]};

SD[3]={ctx:"Sourate médinoise. Une partie importante (le début jusqu'au verset 80 environ) fut révélée lors de la venue d'une délégation de chrétiens de Najran au Prophète ﷺ, en l'an 9 de l'Hégire selon les historiens, qui débattirent avec lui au sujet de 'Issa. Une autre grande partie (v. 121-179) commente la bataille d'Ouhoud (an 3). Le Prophète ﷺ a dit que al-Baqara et Al 'Imran viendront au Jour de la résurrection comme deux nuages ou deux nuées d'oiseaux défendant ceux qui les lisaient (Muslim 804).",
parts:[
["1-9","Le Livre et ses versets","Allah, le Vivant, a fait descendre le Coran, comme Il a fait descendre la Torah et l'Évangile. Le Coran contient des versets clairs (mouhkamat), qui sont la base du Livre, et d'autres ambigus (moutachabihat). Ceux qui ont une déviation dans le cœur suivent les versets ambigus pour semer le trouble, alors que les savants affermis disent : « Nous y croyons, tout vient de notre Seigneur » (v. 7). Puis l'invocation : « Notre Seigneur, ne laisse pas dévier nos cœurs après nous avoir guidés » (v. 8)."],
["10-32","La vraie religion","Les biens et les enfants ne serviront à rien aux mécréants. Les plaisirs de ce monde (femmes, enfants, or, chevaux, troupeaux, champs) sont embellis pour les gens, mais ce qui est auprès d'Allah est meilleur (v. 14-15). « La religion auprès d'Allah est l'islam » (v. 19). Allah donne la royauté à qui Il veut et la retire à qui Il veut (v. 26). « Dis : si vous aimez Allah, suivez-moi, Allah vous aimera » (v. 31) : l'amour d'Allah se prouve en suivant le Prophète ﷺ."],
["33-41","La famille de 'Imran, Maryam et Zakariyya","Allah a choisi Adam, Nouh, la famille d'Ibrahim et la famille de 'Imran. L'épouse de 'Imran voue l'enfant qu'elle porte au service d'Allah ; c'est une fille, Maryam. Zakariyya la prend en charge et trouve auprès d'elle des provisions venues d'Allah. Il invoque alors pour avoir un enfant, et les anges lui annoncent Yahya."],
["42-63","'Issa, fils de Maryam","Les anges annoncent à Maryam qu'Allah l'a choisie au-dessus des femmes des mondes, puis la naissance d'un fils, le Messie 'Issa, par une parole d'Allah. Il parlera aux gens au berceau. Ses miracles sont décrits : l'oiseau d'argile, la guérison de l'aveugle et du lépreux, la résurrection des morts, toujours « par la permission d'Allah » (v. 49). Les apôtres croient en lui. Ses ennemis complotent, et Allah l'élève vers Lui (v. 55). « L'exemple de 'Issa auprès d'Allah est comme celui d'Adam : Il l'a créé de terre » (v. 59). Face aux chrétiens de Najran, Allah ordonne au Prophète ﷺ de proposer une mubahala (invocation mutuelle de la malédiction d'Allah sur les menteurs) (v. 61) ; ils refusèrent."],
["64-120","Dialogue avec les gens du Livre","« Venez à une parole commune entre nous et vous : que nous n'adorions qu'Allah, sans rien Lui associer » (v. 64). Ibrahim n'était ni juif ni chrétien, mais un monothéiste soumis (v. 67). Le Coran parle des gens du Livre honnêtes et malhonnêtes. « Quiconque désire une autre religion que l'islam, elle ne sera pas acceptée de lui » (v. 85). « Vous n'atteindrez la piété qu'en dépensant de ce que vous aimez » (v. 92). La première Maison fondée pour les gens est celle de La Mecque, et le pèlerinage est un devoir pour qui en a les moyens (v. 96-97). « Cramponnez-vous tous ensemble à la corde d'Allah et ne vous divisez pas » (v. 103). « Vous êtes la meilleure communauté sortie pour les gens : vous ordonnez le bien, interdisez le mal et croyez en Allah » (v. 110)."],
["121-129","Badr et Ouhoud","Le récit commence par le matin où le Prophète ﷺ quitta sa famille pour placer les croyants en position de combat à Ouhoud. Allah rappelle la victoire de Badr, alors qu'ils étaient faibles, et le soutien des anges."],
["130-136","Se hâter vers le pardon","Au milieu du récit de la bataille, Allah interdit l'usure et appelle : « Hâtez-vous vers un pardon de votre Seigneur et un Paradis aussi vaste que les cieux et la terre, préparé pour les pieux » (v. 133). Les pieux dépensent dans l'aisance comme dans la gêne, maîtrisent leur colère et pardonnent aux gens ; et quand ils commettent une faute, ils se souviennent d'Allah et demandent pardon (v. 134-135)."],
["137-179","Les leçons de la défaite d'Ouhoud","« Ne faiblissez pas, ne vous attristez pas, vous êtes les supérieurs si vous êtes croyants » (v. 139). Les jours alternent entre les gens. À Ouhoud, les archers avaient quitté leur poste, croyant la victoire acquise, contrairement à l'ordre du Prophète ﷺ ; les musulmans subirent de lourdes pertes. Allah explique : « Certains d'entre vous voulaient ce monde, d'autres l'au-delà » (v. 152), puis Il leur pardonna. Quand la rumeur de la mort du Prophète ﷺ se répandit, certains faiblirent : « Muhammad n'est qu'un messager ; des messagers sont passés avant lui. S'il mourait ou était tué, retourneriez-vous sur vos talons ? » (v. 144). Ce verset fut récité par Abou Bakr à la mort du Prophète ﷺ.\nAllah ordonne au Prophète ﷺ la douceur et la consultation (v. 159). Les martyrs sont vivants auprès de leur Seigneur (v. 169). Face aux menaces, les croyants dirent : « Allah nous suffit, quel excellent garant » (v. 173). L'épreuve sert à distinguer le bon du mauvais (v. 179)."],
["180-189","L'avarice et les épreuves","L'avarice sera un collier de feu au Jour de la résurrection (v. 180). « Toute âme goûtera la mort » (v. 185), et la vie de ce monde n'est qu'une jouissance trompeuse. Les croyants seront éprouvés dans leurs biens et leurs personnes ; la patience et la piété sont la marque d'une grande résolution (v. 186)."],
["190-200","Méditer sur la création","« Dans la création des cieux et de la terre et l'alternance de la nuit et du jour, il y a des signes pour les doués d'intelligence, qui se souviennent d'Allah debout, assis et couchés, et méditent sur la création » (v. 190-191). Le Prophète ﷺ récitait ces versets en se réveillant la nuit (Bukhari 4569). Suit une belle invocation (v. 191-194), et Allah répond : « Je ne laisse pas perdre l'œuvre de quiconque, homme ou femme » (v. 195). Dernier verset : « Ô vous qui croyez, soyez patients, rivalisez de patience, soyez vigilants et craignez Allah, afin de réussir » (v. 200)."]],
