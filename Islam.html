function quizAnswer(k){
  const q=Q.qs[Q.i];if(Q.ans!=null)return;Q.ans=k;q.picked=k;
  const ok=k===q.a;if(ok)Q.score++;else Q.wrong.push(q);sfx(ok?"ok":"bad");
  document.querySelectorAll(".opt").forEach(b=>{const v=+b.dataset.opt;b.disabled=true;if(v===q.a)b.classList.add("good");else if(v===k)b.classList.add("bad")});
  $("#qfb").innerHTML=`<section class="lesson"><span class="eyebrow">${ok?"Bonne réponse":"Pas tout à fait"}</span><p>${esc(q.e)}</p></section>
  <div style="margin-top:12px"><button class="btn primary" id="qnext">${Q.i+1<Q.qs.length?"Question suivante →":"Voir mon score"}</button></div>`;
}

/* ---------- Événements ---------- */
document.addEventListener("pointerdown",e=>{
  try{const b=e.target.closest&&e.target.closest(".tile,.blk.tap,.sec,.item,.btn,.opt,.cat,.name,details.acc summary");
    if(b&&!matchMedia("(prefers-reduced-motion: reduce)").matches){const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height);
      const sp=document.createElement("span");sp.className="ripple";sp.style.width=sp.style.height=s+"px";sp.style.left=(e.clientX-r.left-s/2)+"px";sp.style.top=(e.clientY-r.top-s/2)+"px";
      b.appendChild(sp);setTimeout(()=>sp.remove(),950)}}catch(_){}
},{passive:true});
document.addEventListener("pointerdown",e=>{
  const t=e.target.closest&&e.target.closest("button,a,summary,input,label");
  if(!t){sfx("soft");return}
  sfx(t.dataset.opt!=null||t.id==="snd"?"none":t.dataset.count!=null?"count":(t.dataset.fav||t.dataset.learn||t.id==="kdone")?"fav":t.dataset.tab?"nav":"tap");
},{passive:true});
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");if(!t)return;
  if(t.dataset.tab){if(t.dataset.tab==="quiz"&&Q&&Q.i>=Q.qs.length)Q=null;return go(t.dataset.tab)}
  if(t.dataset.go)return go(t.dataset.go);
  if(t.id==="back"){return history.length>1?history.back():go("accueil")}
  if(t.id==="go-search")return go("recherche");
  if(t.dataset.fav){toggleFav(t.dataset.fav);const id=t.dataset.fav;
    if(t.classList.contains("btn"))t.outerHTML=favBtn(id);else{t.innerHTML=isFav(id)?IC.favOn:IC.fav;t.setAttribute("aria-pressed",isFav(id))}return}
  if(t.dataset.copy){const h=H.find(x=>"h"+x.n===t.dataset.copy);const txt=`${h.t}\n\n${h.ar.replace(/ ?۞ ?/g," ")}\n\n${h.fr}\n\n— ${h.r} · ${h.src} (${h.g})`;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copié"),()=>toast("Copie impossible ici : sélectionne le texte à la main"));return}
  if(t.dataset.count!=null){const i=t.dataset.count;S.counts[i]=(S.counts[i]||0)+1;save();t.textContent=S.counts[i];if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){};return}
  if(t.dataset.reset!=null){S.counts[t.dataset.reset]=0;save();const b=document.querySelector(`[data-count="${t.dataset.reset}"]`);if(b)b.textContent=0;return}
  if(t.dataset.ar){S.ar=+t.dataset.ar;save();applyAr();return route()}
  if(t.id==="memo"){hideMeanings=!hideMeanings;return route()}
  if(t.dataset.name!=null&&hideMeanings){t.classList.toggle("show");return}
  if(t.dataset.scroll){const el=document.getElementById(t.dataset.scroll);if(el)el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});return}
  if(t.dataset.sf){surahFilter=t.dataset.sf;document.querySelectorAll("[data-sf]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sf===surahFilter));$("#slist").innerHTML=surahListHTML();return}
  if(t.dataset.learn){const n=+t.dataset.learn;S.learned=S.learned.includes(n)?S.learned.filter(x=>x!==n):[...S.learned,n];save();toast(S.learned.includes(n)?"Macha Allah, sourate apprise":"Retirée des sourates apprises");return route()}
  if(t.id==="snd"){S.sound=S.sound===false;save();if(S.sound)sfx("ok");return route()}
  if(t.id==="rquiz"){const r=quizJActif();if(!r)return route();quizJAt=r.at;
    quizCat="Quiz du jour";Q={qs:r.quiz.filter(q=>q&&q.q&&Array.isArray(q.o)&&q.o.length>1&&q.a>=0&&q.a<q.o.length).map(q=>({c:q.c||"Quiz du jour",q:q.q,o:q.o,a:q.a,e:q.e||"",order:shuffle(q.o.map((_,i)=>i))})),i:0,score:0,ans:null,wrong:[]};
    if(!Q.qs.length){Q=null;return}return go("quiz")}
  if(t.dataset.city){const c=CITIES.find(x=>x[0]===t.dataset.city);if(c){S.qibla={n:c[0],lat:c[2],lon:c[3]};qiblaQ="";save();window.scrollTo(0,0);route()}return}
  if(t.id==="qset"){const la=parseFloat(String($("#qlat").value).replace(",",".")),lo=parseFloat(String($("#qlon").value).replace(",","."));
    if(!(la>=-90&&la<=90&&lo>=-180&&lo<=180)){toast("Coordonnées invalides : latitude entre -90 et 90, longitude entre -180 et 180");return}
    S.qibla={n:"Ma position ("+la.toFixed(2)+", "+lo.toFixed(2)+")",lat:la,lon:lo};save();window.scrollTo(0,0);return route()}
  if(t.id==="hide-install"){S.hideInstall=true;save();return route()}
  if(t.id==="kdone"){const f=kahfFriday();if(!f)return;const i=S.kahf.fridays.indexOf(f);if(i<0){S.kahf.fridays.push(f);S.kahf.verse=110;toast("Qu'Allah l'accepte de toi")}else S.kahf.fridays.splice(i,1);save();return route()}
  if(t.id==="reset"){if(t.dataset.armed){S.read={};S.quiz={};S.counts={};save();toast("Progression remise à zéro");return route()}
    t.dataset.armed="1";t.querySelector("b").textContent="Touche encore pour confirmer";return}
  if(t.dataset.cat){quizCat=t.dataset.cat;return route()}
  if(t.id==="qstart"||t.id==="qagain"||t.id==="qagain2")return quizStart();
  if(t.id==="qback"){Q=null;return route()}
  if(t.dataset.opt!=null)return quizAnswer(+t.dataset.opt);
  if(t.id==="qnext"){Q.i++;Q.ans=null;if(Q.i>=Q.qs.length){if(quizCat==="Quiz du jour"&&quizJAt){S.quizDone[quizJAt]=Q.score;const ks=Object.keys(S.quizDone).sort();while(ks.length>20)delete S.quizDone[ks.shift()];save()}const prev=S.quiz[quizCat];if(prev==null||Q.score>prev){S.quiz[quizCat]=Q.score;save()}}return route()}
  if(t.dataset.q){const i=$("#q");i.value=t.dataset.q;doSearch(t.dataset.q);return}
});

route();
(function(){const h=$("#hello");if(!h)return;let done=false;
  const close=()=>{if(done)return;done=true;h.classList.add("out");setTimeout(()=>h.remove(),900)};
  requestAnimationFrame(()=>setTimeout(()=>h.classList.add("tint"),250));
  h.addEventListener("pointerdown",close);setTimeout(close,2600);})();
})();
</script>

</body></html>
