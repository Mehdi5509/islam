"Pour convaincre son peuple, qui adorait les astres, Ibrahim utilisa un raisonnement progressif. Voyant une étoile, il dit : « Voici mon Seigneur ? » Puis quand elle disparut : « Je n'aime pas ceux qui disparaissent. » De même pour la lune, puis pour le soleil, plus grand encore. Quand le soleil se coucha, il déclara : « Ô mon peuple, je désavoue ce que vous associez. Je tourne mon visage vers Celui qui a créé les cieux et la terre, en monothéiste pur. »",
"Les savants précisent qu'il ne doutait pas lui-même : il débattait pour montrer à son peuple qu'un astre qui disparaît ne peut pas être une divinité."]},
{h:"Les idoles brisées",v:"21:57-67 · 37:88-98",p:[
"Un jour de fête, son peuple sortit de la ville. Ibrahim resta en disant : « Je suis malade. » Il entra dans le temple, s'adressa aux idoles : « Ne mangez-vous pas ? Pourquoi ne parlez-vous pas ? », puis les brisa toutes, sauf la plus grande, sur laquelle il laissa sa hache.",
"À leur retour : « Qui a fait cela à nos divinités ? » On fit venir Ibrahim. « Non, c'est la plus grande d'entre elles qui l'a fait. Demandez-leur, si elles peuvent parler ! » Ils baissèrent la tête, confus : « Tu sais bien qu'elles ne parlent pas. » « Adorez-vous donc, en dehors d'Allah, ce qui ne peut ni vous être utile ni vous nuire ? Fi de vous et de ce que vous adorez ! »"]},
{h:"Le bûcher",v:"21:68-70 · 37:97-98",p:[
"Vaincus par l'argument, ils choisirent la force : « Brûlez-le et secourez vos divinités ! » Ils allumèrent un immense feu et le jetèrent dedans au moyen d'une catapulte, selon les commentateurs. Ibrahim dit alors : « Hasbiya Allah wa ni'ma al-wakil » (Allah me suffit, quel excellent garant) (Bukhari 4563).",
"Allah dit : « Ô feu, sois fraîcheur et paix pour Ibrahim ! » Le feu ne brûla que ses liens. Ibrahim en sortit sain et sauf, et leur ruse se retourna contre eux."]},
{h:"Le débat avec le roi",v:"2:258",p:[
"Ibrahim débattit avec un roi orgueilleux (que les commentateurs nomment Namroud) qui prétendait à la divinité. « Mon Seigneur est Celui qui donne la vie et la mort. » « C'est moi qui donne la vie et la mort », répondit le roi, en graciant un condamné et en en exécutant un autre. Ibrahim dit alors : « Allah fait venir le soleil du levant ; fais-le donc venir du couchant. » Le mécréant resta confondu."]},
{h:"L'émigration et Sara en Égypte",v:"29:26 · 37:99 · Bukhari 3358",p:[
"Ibrahim émigra avec son épouse Sara et son neveu Lout vers la terre du Cham. Lors d'un passage en Égypte, un tyran voulut prendre Sara. Ibrahim lui avait dit de dire qu'elle était sa sœur, c'est-à-dire sa sœur dans la foi. Chaque fois que le tyran tendait la main vers elle, il était paralysé, et il dut la relâcher. Il lui donna une servante, Hajar (Bukhari 3358)."]},
{h:"Hajar et Isma'il à La Mecque",v:"14:37 · Bukhari 3364",p:[
"Sara, qui n'avait pas d'enfant, donna Hajar à Ibrahim, et Hajar enfanta Isma'il. Sur ordre d'Allah, Ibrahim emmena Hajar et le nourrisson dans une vallée aride et inhabitée : La Mecque. Il les laissa près de l'emplacement de la future Ka'ba, avec un sac de dattes et une outre d'eau.",
"Hajar le suivit : « Ibrahim, où pars-tu en nous laissant dans cette vallée sans personne ni rien ? » Il ne se retourna pas. « Est-ce Allah qui te l'a ordonné ? » « Oui. » « Alors Il ne nous abandonnera pas. » Ibrahim, hors de leur vue, invoqua : « Seigneur, j'ai établi une partie de ma descendance dans une vallée sans culture, près de Ta Maison sacrée… » (14:37)."]},
{h:"Zamzam",v:"Bukhari 3364",p:[
"Quand l'eau fut épuisée, l'enfant se mit à pleurer de soif. Hajar courut entre les monts as-Safa et al-Marwa, sept fois, à la recherche de quelqu'un ou d'eau. C'est l'origine du sa'y du pèlerinage. Elle entendit alors une voix : l'ange Jibril frappa le sol, et l'eau de Zamzam jaillit. Hajar l'entoura de terre pour la retenir.",
"La tribu de Jourhoum, attirée par les oiseaux qui tournaient au-dessus de l'eau, demanda à s'installer près d'elle. Ainsi La Mecque commença à être habitée."]},
{h:"Le sacrifice",v:"37:99-111",p:[
"Quand Isma'il fut en âge de l'accompagner, Ibrahim vit en rêve qu'il l'immolait ; or le rêve des prophètes est une révélation. « Ô mon fils, je me vois en rêve en train de t'immoler. Vois ce que tu en penses. » « Ô mon père, fais ce qui t'est ordonné. Tu me trouveras, si Allah le veut, parmi les patients. »",
"Quand ils se furent soumis tous deux et qu'il l'eut couché sur le front, Allah l'appela : « Ô Ibrahim, tu as confirmé le rêve. » Et Il racheta l'enfant par une immolation grandiose : un bélier. C'est l'origine du sacrifice de l'Aïd al-Adha. La majorité des savants, dont Ibn Kathir, affirment que l'enfant sacrifié était Isma'il, car la bonne nouvelle d'Ishaq vient après ce récit (37:112)."]},
{h:"La construction de la Ka'ba",v:"2:125-129 · 22:26-27",p:[
"Plus tard, Ibrahim revint et dit à Isma'il : « Allah m'a ordonné de bâtir une maison ici. » Isma'il apportait les pierres et Ibrahim construisait, debout sur une pierre (le Maqam Ibrahim). Ils disaient : « Notre Seigneur, accepte cela de notre part, Tu es Celui qui entend tout, qui sait tout. »",
"Ils invoquèrent aussi Allah d'envoyer parmi leur descendance un messager qui leur réciterait Ses versets : le Prophète Muhammad ﷺ a dit être la réponse à l'invocation de son père Ibrahim (Ahmad 17150). Puis Allah ordonna à Ibrahim d'appeler les gens au pèlerinage."]},
{h:"Les hôtes et la naissance d'Ishaq",v:"11:69-73 · 51:24-30",p:[
"Des anges vinrent chez Ibrahim sous forme humaine. Généreux, il leur servit aussitôt un veau gras rôti. Voyant qu'ils n'en mangeaient pas, il eut peur. « N'aie pas peur, nous sommes envoyés au peuple de Lout. » Ils annoncèrent à Sara, âgée et stérile, la naissance d'Ishaq, et après lui de Ya'qub. Elle se frappa le visage d'étonnement : « Vais-je enfanter alors que je suis vieille et que mon mari est un vieillard ? »"]},
{h:"Le rang d'Ibrahim",v:"4:125 · 16:120-123 · 2:124",p:[
"Allah le prit pour ami intime (khalil). Il le décrit comme « une communauté à lui seul », soumis à Allah et monothéiste. Il l'éprouva par des commandements qu'il accomplit tous, et en fit un guide (imam) pour les gens.",
"Il demanda aussi à Allah de lui montrer comment Il ressuscite les morts, « pour que mon cœur soit rassuré » : Allah lui ordonna de prendre quatre oiseaux, de les découper et de les répartir sur des collines, puis de les appeler, et ils vinrent à lui en hâte (2:260).",
"Le Prophète ﷺ a vu Ibrahim au septième ciel, adossé à la Maison peuplée (al-Bayt al-Ma'mour) (Bukhari 3207). Dans chaque prière, nous demandons à Allah de bénir Muhammad comme Il a béni Ibrahim."]}
];
PD.ismail=[
{h:"L'enfant de la vallée",v:"14:37 · Bukhari 3364",p:[
"Isma'il, fils d'Ibrahim et de Hajar, grandit à La Mecque, là où son père l'avait laissé bébé avec sa mère. C'est pour lui que jaillit l'eau de Zamzam (voir l'histoire d'Ibrahim)."]},
{h:"L'épreuve du sacrifice",v:"37:101-107",p:[
"Jeune garçon, il accepta l'ordre divin transmis par le rêve de son père avec une patience exemplaire : « Ô mon père, fais ce qui t'est ordonné ; tu me trouveras, si Allah le veut, parmi les patients. » Allah le racheta par un bélier. Le Coran l'appelle « un garçon longanime » (37:101)."]},
{h:"Sa vie avec Jourhoum",v:"Bukhari 3364",p:[
"Il grandit parmi la tribu arabe de Jourhoum, apprit d'eux la langue arabe et épousa l'une de leurs femmes. Sa mère Hajar mourut à La Mecque.",
"Ibrahim vint lui rendre visite en son absence et interrogea sa femme sur leur vie. Elle se plaignit de leur misère. Ibrahim lui dit : « Quand ton mari reviendra, transmets-lui mon salut et dis-lui de changer le seuil de sa porte. » Isma'il comprit qu'il devait se séparer d'elle. Il en épousa une autre. Lors d'une nouvelle visite, celle-ci remercia Allah pour leur situation, et Ibrahim fit dire à Isma'il de garder le seuil de sa porte. Ce hadith montre la valeur de la gratitude et du contentement."]},
{h:"Bâtisseur de la Ka'ba",v:"2:127-129",p:[
"Il aida son père à élever les fondations de la Maison, en portant les pierres, et partagea leur invocation : « Notre Seigneur, fais de nous des soumis à Toi, et de notre descendance une communauté soumise à Toi. »"]},
{h:"Prophète et père des Arabes",v:"19:54-55 · Muslim 2276",p:[
"« Et mentionne Isma'il dans le Livre. Il était fidèle à ses promesses, et c'était un messager et un prophète. Il ordonnait à sa famille la prière et la zakat, et il était agréé auprès de son Seigneur. »",
"Il est l'ancêtre des Arabes 'adnanites. Le Prophète ﷺ a dit : « Allah a choisi Kinana parmi les fils d'Isma'il, Qouraych parmi Kinana, les Banou Hachim parmi Qouraych, et Il m'a choisi parmi les Banou Hachim » (Muslim 2276). Le Prophète ﷺ a aussi indiqué qu'Isma'il était un bon archer (Bukhari 2899)."]}
];
PD.ishaq=[
{h:"Une naissance annoncée par les anges",v:"11:69-73 · 51:28-30 · 37:112-113",p:[
"Sara, épouse d'Ibrahim, était âgée et stérile. Des anges, venus chez Ibrahim, lui annoncèrent la naissance d'Ishaq, « un garçon plein de science », et après lui de Ya'qub. Sara s'en étonna, et les anges répondirent : « T'étonnes-tu de l'ordre d'Allah ? Que la miséricorde d'Allah et Ses bénédictions soient sur vous, gens de cette maison ! »"]},
{h:"Un prophète parmi les vertueux",v:"37:112-113 · 21:72-73 · 38:45-47",p:[
"Allah le décrit comme un prophète parmi les vertueux, et le cite avec Ibrahim et Ya'qub comme « des hommes forts et clairvoyants », choisis pour le rappel de la demeure dernière. Il fut béni, lui et son père."]},
{h:"Sa descendance",v:"29:27 · 2:133",p:[
"Allah plaça dans sa descendance la prophétie et le Livre. Son fils Ya'qub (Isra'il) est le père des douze tribus des Enfants d'Israël, d'où sont issus Moussa, Haroun, Daoud, Soulayman, Zakariyya, Yahya, 'Issa et beaucoup d'autres prophètes. Les détails de sa vie personnelle ne sont pas rapportés par des textes authentiques ; Ibn Kathir rapporte qu'il fut enterré à Hébron (al-Khalil) près de son père, selon les historiens."]}
];
PD.yaqub=[
{h:"Isra'il",v:"3:93 · 19:58",p:[
"Ya'qub, fils d'Ishaq et petit-fils d'Ibrahim, porte aussi le nom d'Isra'il. Ses douze fils sont à l'origine des tribus des « Enfants d'Israël » (Banou Isra'il). Parmi eux : Yousouf et Binyamin, nés de la même mère, Rahil."]},
{h:"Le rêve de Yousouf",v:"12:4-6",p:[
"Quand Yousouf lui raconta son rêve des onze astres, du soleil et de la lune qui se prosternaient devant lui, Ya'qub comprit qu'Allah le choisirait. Il lui recommanda de ne pas le raconter à ses frères, de peur de leur jalousie."]},
{h:"La perte de Yousouf",v:"12:11-18",p:[
"Ses fils lui demandèrent d'emmener Yousouf jouer avec eux. Ya'qub hésita : « Je crains que le loup ne le dévore pendant que vous serez distraits. » Ils revinrent le soir en pleurant, avec la chemise de Yousouf tachée d'un faux sang : « Le loup l'a dévoré ! » La chemise n'était même pas déchirée. Ya'qub dit : « Vos âmes vous ont embelli une chose. Belle patience (sabr jamil) ! C'est Allah dont on implore le secours contre ce que vous racontez. »"]},
{h:"La seconde épreuve",v:"12:63-87",p:[
"Des années plus tard, lors de la famine, ses fils revinrent d'Égypte en exigeant d'emmener Binyamin pour obtenir du blé. Ya'qub leur fit promettre devant Allah de le ramener. Mais Binyamin fut retenu en Égypte (voir l'histoire de Yousouf).",
"Ya'qub ne perdit pas espoir : « Peut-être Allah me les ramènera-t-Il tous. » Il se détourna d'eux en disant : « Ô ma tristesse pour Yousouf ! » Ses yeux blanchirent de chagrin, et il retenait sa peine. « Je ne me plains de ma détresse et de ma tristesse qu'à Allah. » Il ordonna à ses fils : « Allez vous enquérir de Yousouf et de son frère, et ne désespérez pas de la miséricorde d'Allah. »"]},
{h:"Les retrouvailles",v:"12:93-100",p:[
"Yousouf envoya sa chemise : « Jetez-la sur le visage de mon père, il recouvrera la vue. » Avant même l'arrivée de la caravane, Ya'qub dit : « Je sens l'odeur de Yousouf. » Quand on posa la chemise sur son visage, il recouvra la vue. Toute la famille partit en Égypte, et le rêve de Yousouf se réalisa.",
"Ses fils lui demandèrent pardon, et il leur promit d'implorer pour eux le pardon d'Allah."]},
{h:"Sa recommandation avant de mourir",v:"2:132-133",p:[
"À l'approche de sa mort, Ya'qub demanda à ses fils : « Qu'adorerez-vous après moi ? » Ils répondirent : « Nous adorerons ta divinité et la divinité de tes pères, Ibrahim, Isma'il et Ishaq, divinité unique, et nous Lui sommes soumis. » Ibrahim et Ya'qub avaient fait la même recommandation : « Ô mes fils, Allah vous a choisi la religion ; ne mourez qu'en étant soumis à Lui. »"]}
];
PD.yusuf=[
{h:"Le rêve",v:"12:1-6",p:[
"Allah appelle ce récit « la plus belle des histoires ». Le jeune Yousouf vit en rêve onze astres, le soleil et la lune se prosterner devant lui. Son père Ya'qub lui conseilla de ne pas le raconter à ses frères, et lui annonça qu'Allah le choisirait et lui apprendrait l'interprétation des rêves."]},
{h:"La jalousie des frères et le puits",v:"12:7-18",p:[
"Ses demi-frères, jaloux de l'amour de leur père pour lui et pour Binyamin, complotèrent : « Tuez Yousouf ou abandonnez-le dans une terre lointaine. » L'un d'eux proposa plutôt de le jeter au fond d'un puits, pour que des voyageurs le ramassent.",
"Ils obtinrent de leur père de l'emmener, le jetèrent dans le puits, et revinrent avec sa chemise tachée de faux sang. Au fond du puits, Allah révéla à Yousouf qu'il leur rappellerait un jour ce qu'ils avaient fait, sans qu'ils le reconnaissent."]},
{h:"Vendu en Égypte",v:"12:19-22",p:[
"Une caravane envoya un porteur d'eau ; il remonta le seau avec Yousouf accroché : « Quelle bonne nouvelle, voici un garçon ! » Ils le vendirent pour quelques dirhams en Égypte. Celui qui l'acheta était al-'Aziz, un haut dignitaire, qui dit à sa femme : « Accueille-le honorablement, il nous sera peut-être utile, ou nous l'adopterons. » Yousouf grandit dans cette maison, et Allah lui donna la sagesse et la science."]},
{h:"La tentation",v:"12:23-29",p:[
"Yousouf avait reçu la moitié de la beauté (Muslim 162). La femme d'al-'Aziz tenta de le séduire, ferma les portes et dit : « Viens ! » Il répondit : « Qu'Allah me protège ! C'est mon maître qui m'a bien accueilli. Les injustes ne réussissent pas. » Il courut vers la porte, elle le rattrapa et déchira sa chemise par derrière. Son mari apparut à la porte.",
"Elle l'accusa aussitôt. Un témoin de sa famille trancha : si la chemise est déchirée par devant, elle dit vrai ; si elle est déchirée par derrière, c'est lui qui dit vrai. La chemise était déchirée par derrière. Al-'Aziz dit à sa femme : « C'est de votre ruse, femmes ; votre ruse est immense », et demanda à Yousouf de ne plus en parler."]},
{h:"Les femmes de la ville",v:"12:30-34",p:[
"Les femmes de la ville critiquèrent l'épouse d'al-'Aziz. Elle les invita, donna à chacune un couteau avec des fruits, puis fit entrer Yousouf. En le voyant, elles furent si stupéfaites qu'elles se coupèrent les mains : « Ce n'est pas un être humain, c'est un ange noble ! » Elle menaça Yousouf de prison s'il ne lui obéissait pas.",
"Yousouf invoqua : « Seigneur, la prison m'est préférable à ce à quoi elles m'invitent. » Allah l'exauça et écarta de lui leur ruse."]},
{h:"La prison",v:"12:35-42",p:[
"Bien qu'innocent, il fut emprisonné. Deux jeunes hommes entrèrent avec lui en prison et lui demandèrent d'interpréter leurs rêves. Avant de répondre, Yousouf les appela au tawhid : « Ô mes deux compagnons de prison, des seigneurs multiples sont-ils meilleurs, ou Allah, l'Unique, le Dominateur suprême ? »",
"Puis il interpréta : l'un serait libéré et servirait à boire au roi, l'autre serait crucifié. Il demanda à celui qui serait sauvé de parler de lui au roi, mais Satan le lui fit oublier, et Yousouf resta en prison plusieurs années."]},
{h:"Le rêve du roi",v:"12:43-49",p:[
"Le roi vit en rêve sept vaches grasses mangées par sept vaches maigres, et sept épis verts et sept autres secs. Personne ne sut l'interpréter. L'échanson se souvint alors de Yousouf.",
"Yousouf expliqua : sept années d'abondance, dont il faut garder le grain dans ses épis, puis sept années de famine qui consommeront les réserves, puis une année de pluie et de soulagement. Il donna donc aussi la solution, et pas seulement l'interprétation."]},
{h:"Innocenté puis honoré",v:"12:50-57",p:[
"Le roi voulut le voir. Yousouf refusa de sortir avant que son innocence soit établie : « Demande-lui ce qu'il en est des femmes qui se sont coupé les mains. » Les femmes reconnurent : « Nous ne connaissons aucun mal de sa part », et l'épouse d'al-'Aziz avoua : « C'est moi qui ai voulu le séduire, et il est parmi les véridiques. »",
"Le roi en fit son proche conseiller. Yousouf demanda : « Confie-moi les réserves du pays : je suis un gardien compétent. » Il géra ainsi la crise de la famine."]},
{h:"La venue des frères",v:"12:58-68",p:[
"La famine toucha aussi Canaan. Les frères de Yousouf vinrent chercher du blé ; il les reconnut, eux ne le reconnurent pas. Il leur demanda de revenir avec leur frère Binyamin, faute de quoi ils n'auraient plus de blé, et fit replacer discrètement leur marchandise dans leurs sacs pour qu'ils reviennent.",
"Ya'qub ne laissa partir Binyamin qu'après leur avoir fait jurer de le ramener."]},
{h:"La coupe dans le sac de Binyamin",v:"12:69-79",p:[
"Yousouf se fit connaître à Binyamin en secret. Puis il fit placer la coupe du roi dans le sac de son frère. Un crieur annonça le vol. Selon la loi qu'ils indiquèrent eux-mêmes, le voleur devait devenir esclave de celui qu'il avait volé. On trouva la coupe dans le sac de Binyamin, qui resta ainsi auprès de Yousouf.",
"L'aîné refusa de rentrer sans lui, par honte de leur promesse à leur père."]},
{h:"« Pas de reproche aujourd'hui »",v:"12:88-92",p:[
"Les frères revinrent une troisième fois, humiliés par la misère. Yousouf leur demanda : « Savez-vous ce que vous avez fait à Yousouf et à son frère ? » « Serais-tu Yousouf ? » « Je suis Yousouf, et voici mon frère. Allah nous a comblés. Quiconque craint Allah et patiente, Allah ne laisse pas perdre la récompense des bienfaisants. »",
"Ils reconnurent leur faute, et Yousouf leur répondit : « Pas de reproche contre vous aujourd'hui. Qu'Allah vous pardonne, Il est le plus Miséricordieux des miséricordieux. » Le Prophète ﷺ reprit ces mêmes paroles en pardonnant aux Qouraychites lors de la conquête de La Mecque."]},
{h:"La réalisation du rêve",v:"12:93-101",p:[
"La chemise de Yousouf rendit la vue à Ya'qub, et toute la famille vint s'établir en Égypte. Yousouf fit asseoir ses parents sur le trône, et ils se prosternèrent devant lui (une prosternation de salutation, permise dans leur loi). « Ô mon père, voici l'interprétation de mon rêve d'autrefois. »",
"Il termina par cette invocation : « Seigneur, Tu m'as donné le pouvoir et appris l'interprétation des rêves. Créateur des cieux et de la terre, Tu es mon allié ici-bas et dans l'au-delà. Fais-moi mourir soumis à Toi et fais-moi rejoindre les vertueux » (12:101)."]}
];

// Histoires détaillées (3/4)
PD.ayyub=[
{h:"Un serviteur comblé",v:"Ibn Kathir",p:[
"Ayyoub était un descendant d'Ibrahim (6:84). Selon les historiens cités par Ibn Kathir, il possédait de grands biens (terres, troupeaux, serviteurs) et de nombreux enfants. Il était reconnaissant, généreux envers les pauvres et constant dans l'adoration."]},
{h:"L'épreuve",v:"21:83 · 38:41",p:[
"Allah l'éprouva : il perdit ses biens, puis ses enfants, puis sa santé, avec une maladie qui dura très longtemps. Un hadith rapporté par Ibn Hibban et jugé authentique par al-Albani mentionne dix-huit ans. Les gens s'éloignèrent de lui, même ses proches, sauf son épouse, qui resta fidèle et travaillait pour le nourrir.",
"Les récits populaires qui décrivent son corps rongé par des vers ne viennent d'aucun texte authentique, et les savants les rejettent : un prophète n'est pas atteint d'une maladie qui fait fuir les gens au point de rendre sa mission impossible."]},
{h:"L'invocation polie",v:"21:83 · 38:41",p:[
"Après toutes ces années, Ayyoub invoqua sans se plaindre d'Allah : « Le mal m'a touché, et Tu es le plus Miséricordieux des miséricordieux. » Dans la sourate Sad : « Satan m'a infligé fatigue et souffrance. » Il exposait son état avec politesse, sans exiger, et sans attribuer le mal à Allah."]},
{h:"La guérison",v:"38:42-43 · 21:84 · Bukhari 3391",p:[
"Allah lui répondit : « Frappe la terre de ton pied : voici une eau fraîche pour te laver et pour boire. » Il guérit complètement. Allah lui rendit sa famille, et autant encore avec elle, « par miséricorde de Notre part et comme rappel pour les doués d'intelligence ».",
"Le Prophète ﷺ a raconté que, pendant qu'Ayyoub se lavait, une pluie de sauterelles d'or tomba sur lui, et il se mit à en ramasser. Allah l'appela : « Ne t'ai-Je pas suffisamment enrichi ? » Il répondit : « Si, par Ta puissance, mais je ne peux me passer de Ta bénédiction » (Bukhari 3391)."]},
{h:"Le serment",v:"38:44",p:[
"Pendant sa maladie, Ayyoub avait juré de frapper son épouse d'un certain nombre de coups, pour une raison que les commentateurs expliquent diversement. Par miséricorde envers elle, Allah lui ordonna : « Prends dans ta main un faisceau de brindilles, frappe avec, et ne viole pas ton serment. » Ainsi le serment fut tenu sans faire de mal à cette femme fidèle.",
"Allah conclut : « Nous l'avons trouvé patient. Quel excellent serviteur ! Il était plein de repentir. »"]}
];
PD.shuayb=[
{h:"Le peuple de Madyan",v:"7:85 · 11:84",p:[
"Madyan se trouvait au nord-ouest de l'Arabie, près du golfe d'Aqaba. Ses habitants descendaient de Madyan, fils d'Ibrahim selon les historiens. Ils adoraient des idoles, et le Coran mentionne aussi les gens d'al-Ayka (le bosquet) ; les savants divergent pour savoir s'il s'agit du même peuple."]},
{h:"Un message de justice économique",v:"11:84-86 · 26:181-183",p:[
"Chou'ayb les appela à adorer Allah seul, puis à l'honnêteté : « Donnez la pleine mesure et le juste poids, ne diminuez pas aux gens leurs biens et ne semez pas la corruption sur terre. » Ils trichaient sur les balances, coupaient les routes et menaçaient ceux qui voulaient suivre Chou'ayb (7:86).",
"Il leur dit : « Ce qui reste d'Allah (le gain licite) est meilleur pour vous, si vous êtes croyants. »"]},
{h:"L'orateur des prophètes",v:"11:87-91",p:[
"Ses réponses étaient si belles qu'Ibn Kathir rapporte qu'on le surnommait « l'orateur des prophètes ». Son peuple se moqua : « Ta prière t'ordonne-t-elle que nous abandonnions ce qu'adoraient nos ancêtres, ou que nous cessions de faire de nos biens ce que nous voulons ? »",
"Il répondit : « Je ne veux que la réforme, autant que je le peux. Ma réussite ne dépend que d'Allah ; c'est en Lui que je place ma confiance et c'est vers Lui que je reviens. » Ils lui dirent : « Sans ton clan, nous t'aurions lapidé. » « Mon clan est-il plus considérable pour vous qu'Allah ? »"]},
{h:"Le châtiment",v:"7:91 · 11:94 · 26:189",p:[
"Le châtiment les saisit : un tremblement de terre et le Cri, et ils furent retrouvés gisants dans leurs maisons. Pour les gens d'al-Ayka, le Coran parle du « châtiment du jour de l'ombre » (26:189) : un nuage qui les attira par sa fraîcheur après une chaleur intense, puis fit pleuvoir le feu sur eux, selon les commentateurs.",
"Chou'ayb et les croyants furent sauvés. Il s'éloigna en disant : « Comment m'affligerais-je pour un peuple mécréant ? »"]},
{h:"Chou'ayb et Moussa ?",v:"28:22-28",p:[
"Beaucoup de gens pensent que le vieil homme de Madyan qui accueillit Moussa et lui donna sa fille en mariage était Chou'ayb. Ibn Kathir et d'autres savants signalent que le Coran ne le nomme pas, et que de longues générations séparent probablement les deux, car Chou'ayb dit à son peuple que le peuple de Lout « n'est pas loin de vous » (11:89)."]}
];
PD.musa=[
{h:"Naissance sous Pharaon",v:"28:3-13 · 20:37-40",p:[
"Pharaon dominait l'Égypte et opprimait les Enfants d'Israël. Il faisait tuer leurs nouveau-nés garçons et épargnait les filles. À la naissance de Moussa, Allah inspira à sa mère : « Allaite-le, et si tu crains pour lui, jette-le dans le fleuve. N'aie pas peur et ne t'attriste pas : Nous te le rendrons et en ferons un messager. »",
"Le coffre dériva jusqu'au palais. L'épouse de Pharaon, Assiya, dit : « Il sera la joie de mes yeux et des tiens. Ne le tuez pas. » Moussa refusa toutes les nourrices. Sa sœur, qui le suivait de loin, proposa une famille qui s'occuperait de lui : ainsi il fut rendu à sa mère, qui l'allaita en étant même rémunérée."]},
{h:"Le meurtre involontaire et la fuite",v:"28:14-21",p:[
"Devenu adulte, Moussa entra dans la ville et vit deux hommes se battre, un de son peuple et un Égyptien. Il frappa l'Égyptien d'un coup de poing qui le tua sans le vouloir. Il se repentit aussitôt : « Seigneur, je me suis fait du tort, pardonne-moi », et Allah lui pardonna.",
"Le lendemain, un homme accourut : « Ô Moussa, les notables délibèrent pour te tuer. Pars ! » Il quitta l'Égypte, inquiet, en invoquant : « Seigneur, sauve-moi du peuple injuste. »"]},
{h:"À Madyan",v:"28:22-28",p:[
"Arrivé au point d'eau de Madyan, il vit deux jeunes femmes qui retenaient leur troupeau en attendant que les bergers aient fini. Il abreuva leurs bêtes pour elles, puis se retira à l'ombre : « Seigneur, j'ai grand besoin du bien que Tu feras descendre vers moi. »",
"L'une d'elles revint, marchant avec pudeur : son père l'invitait pour le récompenser. Le vieil homme le rassura, et sa fille dit : « Ô mon père, engage-le, car le meilleur à engager est le fort et le digne de confiance. » Il lui proposa d'épouser l'une de ses filles contre huit ou dix ans de travail. Moussa accomplit le terme le plus long et le meilleur (Bukhari 2684)."]},
{h:"Le feu au mont Tour",v:"20:9-36 · 28:29-35",p:[
"Sur le chemin du retour avec sa famille, de nuit, Moussa vit un feu sur le flanc du mont Tour. Il s'en approcha et fut appelé : « Ô Moussa, c'est Moi, ton Seigneur. Ôte tes sandales, tu es dans la vallée sacrée de Touwa. Je t'ai choisi : écoute ce qui va être révélé. C'est Moi Allah, pas de divinité en dehors de Moi. Adore-Moi et accomplis la prière pour te souvenir de Moi. »",
"Allah lui donna deux signes : son bâton qui devenait un serpent, et sa main qui sortait blanche et lumineuse, sans mal. Il l'envoya à Pharaon. Moussa demanda : « Seigneur, ouvre-moi ma poitrine, facilite ma mission, dénoue ma langue pour qu'ils comprennent ma parole, et donne-moi un assistant de ma famille, Haroun, mon frère. » Allah l'exauça. C'est pourquoi on l'appelle Kalimoullah, celui à qui Allah a parlé (4:164)."]},
{h:"Face à Pharaon",v:"20:43-56 · 26:16-33",p:[
"Allah leur ordonna : « Allez vers Pharaon, il a dépassé les limites. Parlez-lui avec douceur ; peut-être se rappellera-t-il ou craindra-t-il. » Pharaon rappela à Moussa qu'il avait été élevé chez lui et qu'il avait tué un homme. Moussa répondit avec franchise, puis appela Pharaon à libérer les Enfants d'Israël et à adorer le Seigneur des mondes.",
"« Et qui est le Seigneur des mondes ? » « Le Seigneur des cieux, de la terre et de ce qui est entre eux. » Pharaon le traita de fou et le menaça de prison. Moussa montra alors ses deux signes."]},
{h:"Le duel avec les magiciens",v:"20:57-73 · 7:113-126",p:[
"Pharaon accusa Moussa de magie et fixa un rendez-vous le jour de la fête, devant tout le peuple. Les meilleurs magiciens d'Égypte jetèrent leurs cordes et leurs bâtons, qui parurent ramper. Moussa ressentit une crainte. Allah lui dit : « N'aie pas peur, c'est toi qui auras le dessus. Jette ce qui est dans ta main droite. » Le bâton avala tout ce qu'ils avaient fabriqué.",
"Les magiciens, connaissant la différence entre la magie et un miracle, tombèrent prosternés : « Nous croyons au Seigneur de Haroun et de Moussa. » Pharaon menaça de leur couper les mains et les pieds et de les crucifier. Leur réponse : « Décide ce que tu veux décider ; tu ne décides que pour cette vie. Nous croyons en notre Seigneur pour qu'Il nous pardonne nos fautes. »"]},
{h:"Les signes et l'obstination",v:"7:127-136 · 40:28-45",p:[
"Pharaon redoubla d'oppression. Allah frappa l'Égypte de signes successifs : années de sécheresse et de disette, inondation, sauterelles, poux, grenouilles et sang. À chaque fois, ils promettaient de croire si le fléau était levé, puis rompaient leur promesse.",
"Un croyant de la famille de Pharaon, qui cachait sa foi, défendit Moussa : « Allez-vous tuer un homme parce qu'il dit : mon Seigneur est Allah ? » (40:28). L'épouse de Pharaon, Assiya, crut également ; le Coran la donne en exemple aux croyants (66:11)."]},
{h:"La traversée de la mer",v:"26:52-68 · 10:90-92 · 20:77-79",p:[
"Allah ordonna à Moussa de partir de nuit avec les Enfants d'Israël. Pharaon les poursuivit avec son armée. Arrivés à la mer, les compagnons de Moussa crièrent : « Nous allons être rattrapés ! » « Non ! Mon Seigneur est avec moi, Il va me guider. »",
"Allah lui ordonna de frapper la mer de son bâton : elle se fendit en deux, chaque partie comme une énorme montagne, et un chemin sec apparut. Les Enfants d'Israël passèrent. Pharaon et son armée s'y engagèrent, et la mer se referma sur eux. En se noyant, Pharaon dit : « Je crois qu'il n'y a de divinité que Celui en qui ont cru les Enfants d'Israël. » « Maintenant ? Alors que tu as désobéi auparavant ? » Allah préserva son corps comme signe pour ceux qui viendraient après lui.",
"Le Prophète ﷺ jeûnait le jour de 'Achoura, en remerciement pour ce sauvetage (Bukhari 2004)."]},
{h:"La Torah et le veau d'or",v:"7:142-156 · 20:83-98",p:[
"Allah donna rendez-vous à Moussa pendant quarante nuits. Il laissa Haroun pour le remplacer. Moussa demanda à voir Allah : « Tu ne Me verras pas ; mais regarde la montagne. » Quand Allah Se manifesta à la montagne, elle fut réduite en poussière et Moussa tomba foudroyé. Allah lui donna les Tablettes de la Torah.",
"Pendant son absence, un homme nommé as-Samiri fondit les bijoux du peuple en un veau qui produisait un mugissement, et beaucoup l'adorèrent. Moussa revint furieux, jeta les Tablettes et saisit son frère par la tête. Haroun lui expliqua qu'il avait craint de diviser le peuple. Moussa brûla le veau et dispersa ses cendres dans la mer, et Allah imposa un repentir sévère à ceux qui l'avaient adoré."]},
{h:"La vache des Enfants d'Israël",v:"2:67-73",p:[
"Un homme fut tué et on ignorait le meurtrier. Allah ordonna d'égorger une vache. Au lieu d'obéir simplement, ils multiplièrent les questions : son âge, sa couleur, ses caractéristiques. Chaque réponse rendait l'ordre plus difficile, et ils l'égorgèrent finalement en traînant. On frappa le mort avec un morceau de la vache ; il revint à la vie et désigna son meurtrier. C'est de cet épisode que vient le nom de la sourate al-Baqara."]},
{h:"Qaroun",v:"28:76-82",p:[
"Qaroun était du peuple de Moussa et possédait des trésors dont les clés pesaient lourd à un groupe d'hommes forts. On lui conseillait de ne pas s'enorgueillir et de rechercher l'au-delà avec ce qu'Allah lui avait donné, sans oublier sa part de ce monde. Il répondit : « Je ne l'ai obtenu que par une science que je possède. »",
"Un jour, il sortit devant son peuple dans tout son apparat ; ceux qui aimaient ce monde l'envièrent. Allah le fit engloutir par la terre, lui et sa maison. Ceux qui l'enviaient la veille dirent : « Heureusement qu'Allah nous a fait grâce, sinon Il nous aurait engloutis aussi. »"]},
{h:"Moussa et al-Khadir",v:"18:60-82 · Bukhari 122",p:[
"Un jour, Moussa dit qu'il était l'homme le plus savant. Allah lui fit savoir qu'un de Ses serviteurs, à la jonction des deux mers, était plus savant que lui. Moussa partit avec son jeune serviteur (Yousha' ibn Noun) et un poisson. À l'endroit où le poisson reprit vie et s'échappa vers la mer, ils trouvèrent al-Khadir.",
"Al-Khadir accepta qu'il le suive à condition qu'il ne pose aucune question. Il perça le bateau de pauvres gens qui les avaient transportés gratuitement ; il tua un jeune garçon ; il répara gratuitement un mur dans un village qui leur avait refusé l'hospitalité. Moussa protesta à chaque fois, et ils se séparèrent.",
"Al-Khadir expliqua : un roi saisissait tous les bateaux en bon état, et le défaut protégeait celui des pauvres ; le garçon serait devenu un mécréant tyrannique envers ses parents croyants, et Allah leur en donnerait un meilleur ; sous le mur se trouvait le trésor de deux orphelins dont le père était vertueux. « Je ne l'ai pas fait de mon propre chef. »"]},
{h:"L'errance et la fin de sa vie",v:"5:20-26 · Bukhari 1339",p:[
"Moussa ordonna aux Enfants d'Israël d'entrer en Terre sainte. Ils refusèrent par peur de ses habitants puissants : « Va, toi et ton Seigneur, combattez ; nous restons ici. » Allah leur interdit cette terre pendant quarante ans, durant lesquels ils errèrent dans le désert. Allah leur donna cependant la manne et les cailles et fit jaillir douze sources d'un rocher (2:57-60).",
"Haroun mourut pendant cette période, puis Moussa. Quand l'ange de la mort vint à lui, Moussa demanda à être rapproché de la Terre sainte « d'un jet de pierre » (Bukhari 1339). Le Prophète ﷺ l'a vu, lors du Voyage nocturne, prier debout dans sa tombe (Muslim 2375), et c'est sur le conseil de Moussa qu'il demanda la réduction des prières de cinquante à cinq."]}
];
PD.harun=[
{h:"Le frère choisi",v:"20:29-36 · 28:34-35 · 19:53",p:[
"Haroun était le frère aîné de Moussa. Quand Allah envoya Moussa à Pharaon, celui-ci demanda : « Mon frère Haroun est plus éloquent que moi ; envoie-le avec moi comme soutien pour confirmer mes paroles. » Allah accepta : « Nous allons fortifier ton bras par ton frère. » Le Coran dit qu'Allah donna à Moussa, par Sa miséricorde, son frère Haroun comme prophète."]},
{h:"Face à Pharaon",v:"20:42-48",p:[
"Il accompagna Moussa auprès de Pharaon et partagea toutes les étapes : la prédication douce, le duel avec les magiciens (qui dirent « Nous croyons au Seigneur de Haroun et de Moussa »), puis la sortie d'Égypte."]},
{h:"L'épreuve du veau d'or",v:"7:150 · 20:85-94",p:[
"Pendant les quarante nuits où Moussa s'était retiré au mont Tour, Haroun le remplaça. Quand as-Samiri fabriqua le veau d'or, Haroun avertit le peuple : « Ô mon peuple, vous êtes seulement éprouvés par cela. Votre Seigneur est le Tout Miséricordieux. Suivez-moi et obéissez à mon ordre. » Ils répondirent : « Nous continuerons à l'adorer jusqu'au retour de Moussa. »",
"À son retour, Moussa saisit sa tête et sa barbe. Haroun répondit : « Ô fils de ma mère, ne me prends ni par la barbe ni par la tête. J'ai craint que tu ne dises : tu as divisé les Enfants d'Israël. Le peuple m'a traité en faible et a failli me tuer. » Moussa invoqua alors pour lui-même et pour son frère (7:151)."]},
{h:"Sa mort",v:"Ibn Kathir",p:[
"Selon les historiens cités par Ibn Kathir, Haroun mourut pendant les années d'errance dans le désert, avant Moussa. Le Prophète ﷺ le rencontra au cinquième ciel lors du Mi'raj (Bukhari 3207).",
"Le Prophète ﷺ dit à 'Ali : « N'es-tu pas satisfait d'être pour moi ce que Haroun était pour Moussa, sauf qu'il n'y a pas de prophète après moi ? » (Bukhari 4416)."]}
];
PD.dhulkifl=[
{h:"Ce que dit le Coran",v:"21:85-86 · 38:48",p:[
"« Et Isma'il, Idris et Dhoul-Kifl : tous étaient parmi les patients. Nous les fîmes entrer dans Notre miséricorde, car ils étaient parmi les vertueux » (21:85-86). « Et rappelle-toi Isma'il, al-Yasa' et Dhoul-Kifl : tous parmi les meilleurs » (38:48)."]},
{h:"Prophète ou homme pieux ?",v:"Ibn Kathir",p:[
"Son nom signifie « celui qui a la part » ou « celui qui s'est porté garant ». Ibn Kathir rapporte que la majorité le considère comme un prophète, puisqu'il est cité parmi eux, mais que d'autres savants y voient un homme pieux et un juge juste. Selon un récit des Tabi'in, il se serait engagé auprès d'al-Yasa' à jeûner le jour, prier la nuit et juger sans colère, et aurait tenu sa promesse malgré les tentations.",
"Ces détails ne viennent pas de textes authentiques. On retient ce que le Coran affirme : patience et vertu."]}
];
PD.dawud=[
{h:"Talout et Jalout",v:"2:246-251",p:[
"Après Moussa, les Enfants d'Israël demandèrent à un de leurs prophètes de leur désigner un roi pour combattre. Allah choisit Talout, qui n'était pas riche mais avait reçu « une ample science et une grande force physique ». Pour éprouver ses soldats, Talout leur interdit de boire plus d'une gorgée à une rivière ; la plupart burent, et seul un petit groupe resta.",
"Face à l'armée immense de Jalout (Goliath), ce petit groupe dit : « Combien de fois une troupe peu nombreuse a vaincu une troupe nombreuse, par la permission d'Allah ! » Dans la bataille, le jeune Daoud tua Jalout. Allah lui donna ensuite la royauté et la sagesse."]},
{h:"Les dons faits à Daoud",v:"34:10-11 · 21:79-80 · 4:163",p:[
"Allah lui révéla le Zabour (les Psaumes). Il avait une voix magnifique : « Ô montagnes, ô oiseaux, répétez avec lui les louanges d'Allah ! » Le fer s'assouplissait dans ses mains, et Allah lui apprit à fabriquer des cottes de mailles pour protéger les combattants.",
"Le Prophète ﷺ a dit : « Personne n'a jamais mangé meilleure nourriture que celle qu'il a gagnée de ses mains, et le prophète d'Allah Daoud mangeait du travail de ses mains » (Bukhari 2072)."]},
{h:"Son adoration",v:"Bukhari 1131, Muslim 1159",p:[
"« La prière la plus aimée d'Allah est celle de Daoud, et le jeûne le plus aimé d'Allah est celui de Daoud. Il dormait la moitié de la nuit, priait un tiers et dormait un sixième, et il jeûnait un jour sur deux. » Le Prophète ﷺ a aussi dit qu'il ne fuyait jamais face à l'ennemi."]},
{h:"Les deux plaideurs",v:"38:21-26",p:[
"Deux hommes escaladèrent le mur de son oratoire, ce qui l'effraya. « N'aie pas peur, nous sommes deux plaideurs. » L'un dit : « Mon frère a quatre-vingt-dix-neuf brebis, et moi une seule ; il m'a dit de la lui confier et m'a vaincu dans la discussion. » Daoud répondit que l'autre avait commis une injustice, avant d'avoir entendu la seconde partie.",
"Il comprit qu'Allah l'éprouvait, demanda pardon, tomba prosterné et se repentit. Allah lui pardonna et lui dit : « Ô Daoud, Nous avons fait de toi un lieutenant sur terre ; juge donc entre les gens en toute justice et ne suis pas la passion. » Les récits bibliques qui accusent Daoud d'un adultère avec la femme d'Urie sont rejetés par les savants musulmans : ils contredisent l'infaillibilité des prophètes."]},
{h:"Le jugement du champ",v:"21:78-79",p:[
"Des moutons étaient entrés la nuit dans un champ et l'avaient dévasté. Daoud jugea que les moutons reviendraient au propriétaire du champ. Son fils Soulayman, encore jeune, proposa mieux : le propriétaire du champ garderait les moutons et profiterait de leur lait et de leur laine, pendant que le propriétaire des moutons remettrait le champ en état, puis chacun récupérerait son bien. « Nous fîmes comprendre cela à Soulayman, et à chacun Nous avons donné sagesse et science. »"]}
];

// Histoires détaillées (4/4)
PD.sulayman=[
{h:"L'héritier de Daoud",v:"27:15-16 · 38:35",p:[
"Soulayman hérita de la prophétie et de la royauté de son père Daoud. Il invoqua : « Seigneur, pardonne-moi et accorde-moi un royaume que nul après moi n'aura. Tu es le Grand Donateur. » Allah l'exauça.",
"Il dit à son peuple : « On nous a appris le langage des oiseaux, et on nous a donné de toute chose. C'est là la grâce évidente. »"]},
{h:"Un royaume unique",v:"34:12-13 · 38:36-39 · 21:81-82",p:[
"Le vent lui était soumis : il parcourait en une matinée la distance d'un mois de marche, et autant le soir. Les djinns travaillaient pour lui sur ordre d'Allah : ils construisaient des sanctuaires, des statues (alors permises dans leur loi), de grands bassins et des marmites fixes. Allah fit aussi couler pour lui une source de cuivre fondu."]},
{h:"Les chevaux",v:"38:31-33",p:[
"Un soir, on lui présenta des chevaux de race qui l'occupèrent jusqu'au coucher du soleil. Les commentateurs divergent sur la suite. Selon une interprétation, il les fit égorger, par regret d'avoir manqué une adoration à cause d'eux. Selon une autre, retenue par at-Tabari, il les caressait aux jambes et au cou par affection. Le Coran ne tranche pas explicitement."]},
{h:"La vallée des fourmis",v:"27:17-19",p:[
"Il avançait avec son armée d'hommes, de djinns et d'oiseaux. Arrivés à la vallée des fourmis, une fourmi dit : « Ô fourmis, entrez dans vos demeures, de peur que Soulayman et ses armées ne vous écrasent sans s'en rendre compte. » Soulayman sourit et invoqua : « Seigneur, inspire-moi de Te remercier pour le bienfait dont Tu m'as comblé, ainsi que mes parents, et de faire le bien que Tu agrées. »",
"La fourmi elle-même reconnaissait que les soldats d'un prophète ne font pas de mal volontairement."]},
{h:"La huppe et la reine de Saba'",v:"27:20-31",p:[
"Soulayman passa les oiseaux en revue et remarqua l'absence de la huppe. Elle revint avec une nouvelle : « J'ai trouvé une femme qui règne sur Saba' (au Yémen), comblée de toute chose et possédant un trône immense. Elle et son peuple se prosternent devant le soleil au lieu d'Allah. »",
"Soulayman envoya par la huppe une lettre : « De la part de Soulayman. Au nom d'Allah, le Tout Miséricordieux, le Très Miséricordieux. Ne soyez pas orgueilleux envers moi, et venez à moi soumis. »"]},
{h:"Le cadeau refusé et le trône apporté",v:"27:32-40",p:[
"La reine consulta ses conseillers puis envoya un riche cadeau pour tester Soulayman. Il le refusa : « Ce qu'Allah m'a donné est meilleur que ce qu'Il vous a donné. »",
"Il demanda : « Qui m'apportera son trône avant qu'ils viennent à moi soumis ? » Un djinn puissant proposa de l'apporter avant qu'il se lève de sa place. Celui qui avait une science du Livre dit : « Je te l'apporterai avant que ton regard ne revienne à toi. » Le trône apparut aussitôt devant lui. Soulayman dit : « Ceci est une grâce de mon Seigneur, pour m'éprouver : serai-je reconnaissant ou ingrat ? »"]},
{h:"La soumission de la reine",v:"27:41-44",p:[
"Il fit modifier le trône pour voir si elle le reconnaîtrait. « Est-ce ainsi qu'est ton trône ? » « C'est comme s'il l'était. » Puis on l'invita à entrer dans un palais au sol de cristal ; croyant que c'était de l'eau, elle releva sa robe. Comprenant la supériorité de ce qu'Allah avait donné à Soulayman, elle dit : « Seigneur, je me suis fait du tort, et je me soumets avec Soulayman à Allah, Seigneur des mondes. »"]},
{h:"Sa mort",v:"34:14 · 2:102",p:[
"Soulayman mourut debout, appuyé sur son bâton, pendant que les djinns travaillaient. Ils ne s'aperçurent de sa mort que lorsqu'une bête de la terre eut rongé le bâton et qu'il tomba. « S'ils avaient connu l'invisible, ils ne seraient pas restés dans ce châtiment humiliant. »",
"Le Coran le lave aussi de l'accusation de magie : « Ce n'est pas Soulayman qui a mécru, ce sont les démons qui ont mécru en enseignant aux gens la magie » (2:102)."]}
];
PD.ilyas=[
{h:"L'envoyé contre Ba'l",v:"37:123-126",p:[
"Ilyas fut envoyé aux Enfants d'Israël, à une époque où ils s'étaient mis à adorer une idole nommée Ba'l. Ibn Kathir rapporte qu'ils vivaient dans la région de Ba'labak (au Liban actuel), qui tire son nom de cette idole.",
"« Ne craindrez-vous pas Allah ? Invoquez-vous Ba'l et délaissez-vous le Meilleur des créateurs, Allah, votre Seigneur et le Seigneur de vos premiers ancêtres ? »"]},
{h:"Le refus et la récompense",v:"37:127-132 · 6:85",p:[
"Ils le traitèrent de menteur ; le Coran annonce qu'ils seront amenés au châtiment, sauf les serviteurs sincères d'Allah. Allah laissa pour lui un éloge parmi les générations suivantes : « Paix sur Il-Yassin. Ainsi récompensons-Nous les bienfaisants. Il était parmi Nos serviteurs croyants. »",
"Il est cité parmi les vertueux avec Zakariyya, Yahya et 'Issa (6:85). Les récits sur la suite de sa vie (qu'il serait encore vivant, etc.) ne reposent sur aucun texte authentique, selon Ibn Kathir."]}
];
PD.alyasa=[
{h:"Ce que dit le Coran",v:"6:86 · 38:48",p:[
"Al-Yasa' est cité deux fois : avec Isma'il, Younous et Lout, « chacun d'eux Nous l'avons favorisé sur les mondes » (6:86), et parmi « les meilleurs » (38:48)."]},
{h:"Ce que rapportent les historiens",v:"Ibn Kathir",p:[
"Ibn Kathir rapporte qu'il était le disciple et le successeur d'Ilyas auprès des Enfants d'Israël, qu'il continua à les appeler à la voie de son maître et à la loi de la Torah, et qu'il accomplit des miracles. Les détails viennent des historiens et non de textes authentiques. Sa mention dans le Coran montre l'importance de transmettre le savoir à la génération suivante."]}
];
PD.yunus=[
{h:"L'envoyé de Ninive",v:"37:139-147 · 10:98",p:[
"Younous fils de Matta fut envoyé aux habitants de Ninive, en Irak, une ville de plus de cent mille personnes. Il les appela au tawhid, mais ils refusèrent pendant longtemps."]},
{h:"Le départ en colère",v:"21:87 · 37:140",p:[
"Désespéré par leur refus, Younous partit en colère contre son peuple, sans attendre la permission d'Allah, en pensant qu'Allah ne le mettrait pas à l'étroit. Il « s'enfuit vers le bateau chargé » (37:140)."]},
{h:"Le tirage au sort et le poisson",v:"37:141-144",p:[
"Le bateau surchargé risquait de couler. On tira au sort pour savoir qui jeter à la mer, et le sort tomba sur Younous, plusieurs fois selon les commentateurs. Il fut jeté à l'eau, et un énorme poisson l'avala. Allah ordonna au poisson de ne pas lui briser un os ni lui déchirer la chair."]},
{h:"L'invocation dans les ténèbres",v:"21:87-88 · Tirmidhi 3505",p:[
"Dans trois ténèbres (la nuit, la mer et le ventre du poisson), Younous reconnut sa faute : « La ilaha illa anta, soubhanaka, inni kountou mina adh-dhalimin » : il n'y a de divinité que Toi, gloire à Toi, j'ai été parmi les injustes.",
"« Nous l'avons exaucé et sauvé de l'angoisse, et c'est ainsi que Nous sauvons les croyants. » Le Coran précise : « S'il n'avait pas été parmi ceux qui glorifient Allah, il serait resté dans son ventre jusqu'au jour de la résurrection » (37:143-144). Le Prophète ﷺ a dit qu'aucun musulman n'invoque par cette invocation sans qu'Allah ne l'exauce (Tirmidhi 3505)."]},
{h:"Le rivage et la plante",v:"37:145-146",p:[
"Le poisson le rejeta sur un rivage nu, affaibli et malade. Allah fit pousser au-dessus de lui une plante de la famille des courges (yaqtin), dont les larges feuilles le protégeaient et qui, selon les commentateurs, éloignait les mouches."]},
{h:"Un peuple entier sauvé",v:"10:98 · 37:147-148",p:[
"Pendant son absence, son peuple vit les signes du châtiment approcher. Ils sortirent tous, se repentirent et implorèrent Allah. Allah leva le châtiment : c'est le seul peuple du Coran dont le repentir collectif a écarté le châtiment annoncé (10:98).",
"Younous fut renvoyé vers eux, et ils crurent tous. Le Prophète ﷺ a dit : « Il ne convient à personne de dire qu'il est meilleur que Younous fils de Matta » (Bukhari 3395)."]}
];
PD.zakariyya=[
{h:"Le gardien de Maryam",v:"3:35-37",p:[
"Zakariyya était prophète et prêtre au Temple de Jérusalem. Il était marié à la tante (ou à la sœur, selon les avis) de Maryam. Quand la mère de Maryam la consacra au service du Temple, on tira au sort, avec des calames, pour savoir qui la prendrait en charge (3:44), et ce fut Zakariyya.",
"Chaque fois qu'il entrait auprès d'elle dans le sanctuaire, il trouvait des provisions. « Ô Maryam, d'où te vient cela ? » « Cela vient d'Allah. Allah donne à qui Il veut sans compter. »"]},
{h:"L'invocation discrète",v:"19:2-6 · 3:38 · 21:89",p:[
"Voyant cela, Zakariyya, âgé et dont la femme était stérile, invoqua à voix basse : « Seigneur, mes os sont affaiblis et ma tête s'est enflammée de cheveux blancs, mais je n'ai jamais été malheureux en T'invoquant. Je crains ce que feront mes proches après moi. Accorde-moi de Ta part un héritier qui hérite de moi et de la famille de Ya'qub, et rends-le agréable. »",
"Il ne demandait pas un héritier pour les biens, mais pour la prophétie et la religion, car les prophètes ne laissent pas d'héritage matériel (Bukhari 6727)."]},
{h:"La bonne nouvelle",v:"3:39-41 · 19:7-11",p:[
"Les anges l'appelèrent pendant qu'il priait dans le sanctuaire : « Allah t'annonce Yahya, qui confirmera une parole venant d'Allah ; un seigneur, chaste et prophète parmi les vertueux. » C'était un nom qu'aucun n'avait porté avant lui.",
"Zakariyya s'étonna et demanda un signe. « Ton signe : tu ne pourras parler aux gens pendant trois nuits, bien qu'en bonne santé. » Il sortit vers son peuple et leur fit signe de glorifier Allah matin et soir."]},
{h:"Ses qualités",v:"21:90 · Muslim 2379",p:[
"« Ils rivalisaient dans les bonnes œuvres, Nous invoquaient avec espoir et crainte, et étaient humbles devant Nous. » Le Prophète ﷺ a dit que Zakariyya était menuisier (Muslim 2379) : un prophète qui vivait du travail de ses mains."]}
];
PD.yahya=[
{h:"Un enfant miraculeux",v:"19:7 · 3:39",p:[
"Yahya naquit de Zakariyya, âgé, et d'une mère stérile, en réponse à une invocation. Allah lui choisit Lui-même son nom, que personne n'avait porté avant lui. Il est décrit comme un seigneur (sayyid), chaste et prophète, qui confirmerait « une parole venant d'Allah », c'est-à-dire 'Issa, son cousin."]},
{h:"La sagesse dès l'enfance",v:"19:12-15",p:[
"« Ô Yahya, tiens fermement le Livre. » Et Nous lui donnâmes la sagesse dès l'enfance, ainsi que la tendresse de Notre part et la pureté. Il était pieux, bon envers ses parents, et n'était ni tyran ni désobéissant. « Que la paix soit sur lui le jour où il naquit, le jour où il mourra et le jour où il sera ressuscité vivant. »"]},
{h:"Les cinq commandements",v:"Tirmidhi 2863 (authentique)",p:[
"Le Prophète ﷺ a raconté qu'Allah ordonna à Yahya cinq commandements à appliquer et à enseigner aux Enfants d'Israël : adorer Allah sans rien Lui associer ; la prière (« Allah fait face à Son serviteur tant qu'il ne se détourne pas ») ; le jeûne, dont l'odeur est comme le parfum du musc ; l'aumône, qui rachète l'âme comme un captif est racheté ; et le rappel d'Allah, qui protège de Satan comme une forteresse protège de l'ennemi.",
"Yahya réunit les gens au Temple de Jérusalem jusqu'à ce qu'il soit rempli, et leur transmit ces commandements."]},
{h:"Sa mort",v:"Ibn Kathir",p:[
"Le Coran ne décrit pas sa mort. Ibn Kathir rapporte, d'après les historiens, qu'il fut tué par un roi injuste parce qu'il avait refusé d'approuver un mariage illicite. Le Prophète ﷺ a rencontré Yahya et 'Issa au deuxième ciel lors du Voyage nocturne (Bukhari 3207)."]}
];
PD.isa=[
{h:"La famille de 'Imran",v:"3:33-37",p:[
"L'épouse de 'Imran, enceinte, voua l'enfant qu'elle portait au service d'Allah. Elle mit au monde une fille et la nomma Maryam, en demandant à Allah de la protéger, elle et sa descendance, de Satan. Le Prophète ﷺ a dit que tout nouveau-né est touché par Satan à sa naissance, sauf Maryam et son fils (Bukhari 3431). Maryam grandit au Temple sous la garde de Zakariyya."]},
{h:"L'annonce à Maryam",v:"19:16-21 · 3:42-47",p:[
"Les anges dirent : « Ô Maryam, Allah t'a choisie, purifiée et élue au-dessus des femmes des mondes. » Un jour, retirée à l'écart, elle vit Jibril sous la forme d'un homme parfait. Effrayée : « Je cherche refuge auprès du Tout Miséricordieux contre toi, si tu crains Allah. » « Je suis l'envoyé de ton Seigneur, pour te donner un garçon pur. » « Comment aurais-je un garçon alors qu'aucun homme ne m'a touchée ? » « C'est facile pour Moi. »",
"« L'exemple de 'Issa auprès d'Allah est comme celui d'Adam : Il l'a créé de terre, puis lui a dit « Sois », et il fut » (3:59)."]},
{h:"La naissance sous le palmier",v:"19:22-26",p:[
"Maryam se retira dans un lieu éloigné. Les douleurs l'amenèrent au tronc d'un palmier : « Hélas, si seulement j'étais morte avant cela et complètement oubliée ! » Une voix l'appela d'en dessous : « Ne t'attriste pas : ton Seigneur a placé un ruisseau à tes pieds. Secoue vers toi le tronc du palmier, il fera tomber sur toi des dattes fraîches et mûres. Mange, bois et réjouis-toi. Si tu vois quelqu'un, dis : j'ai voué un jeûne de silence au Tout Miséricordieux. »"]},
{h:"Le bébé qui parle",v:"19:27-34",p:[
"Elle revint vers les siens en portant l'enfant. « Ô Maryam, tu as commis une chose monstrueuse ! Ô sœur de Haroun, ton père n'était pas un homme mauvais, ni ta mère une femme de mauvaise vie. » Elle désigna l'enfant. « Comment parlerions-nous à un bébé au berceau ? »",
"Le bébé parla : « Je suis le serviteur d'Allah. Il m'a donné le Livre et a fait de moi un prophète. Il m'a béni où que je sois, et m'a recommandé la prière et la zakat tant que je vivrai, ainsi que la bonté envers ma mère. Paix sur moi le jour où je naquis, le jour où je mourrai et le jour où je serai ressuscité vivant. »"]},
{h:"Les miracles",v:"3:49 · 5:110",p:[
"Allah lui enseigna le Livre, la sagesse, la Torah et l'Évangile (Injil), et l'envoya aux Enfants d'Israël avec des miracles, tous « par la permission d'Allah » : il façonnait de l'argile en forme d'oiseau, soufflait dedans, et il devenait un oiseau ; il guérissait l'aveugle-né et le lépreux ; il ressuscitait les morts ; il informait les gens de ce qu'ils mangeaient et gardaient chez eux.",
"Il confirmait la Torah et rendait licites certaines choses qui leur avaient été interdites."]},
{h:"Les apôtres et la table servie",v:"3:52-53 · 5:111-115 · 61:14",p:[
"Quand il sentit leur mécréance, il dit : « Qui sont mes alliés dans la voie d'Allah ? » Les apôtres (al-hawariyyoun) répondirent : « Nous sommes les alliés d'Allah. Nous croyons en Allah, sois témoin que nous Lui sommes soumis. »",
"Ils demandèrent une table servie descendue du ciel, pour que leurs cœurs soient rassurés. 'Issa invoqua, et Allah répondit qu'Il la ferait descendre, mais que celui qui mécroirait ensuite serait sévèrement châtié. Cet épisode a donné son nom à la sourate al-Ma'ida."]},
{h:"L'annonce de Muhammad ﷺ",v:"61:6",p:[
"« Ô Enfants d'Israël, je suis le messager d'Allah envoyé vers vous, confirmant la Torah qui est venue avant moi, et annonçant un messager qui viendra après moi, dont le nom sera Ahmad. »"]},
{h:"Le complot et l'élévation",v:"3:54-55 · 4:157-158",p:[
"Ceux qui refusaient son message complotèrent pour le tuer. Allah dit : « Ô 'Issa, Je vais mettre fin à ta vie terrestre (ou : te prendre), t'élever vers Moi et te purifier des mécréants. »",
"« Ils ne l'ont ni tué ni crucifié, mais cela leur a été rendu ambigu. Ceux qui divergent à son sujet sont dans le doute : ils n'en ont aucune connaissance certaine, ils ne font que suivre des conjectures. Ils ne l'ont certainement pas tué, mais Allah l'a élevé vers Lui. » Selon l'avis majoritaire rapporté par Ibn Kathir, quelqu'un d'autre reçut son apparence et fut crucifié à sa place."]},
{h:"Son retour à la fin des temps",v:"43:61 · 4:159 · Muslim 2937",p:[
"Le Prophète ﷺ a annoncé que 'Issa descendra, près du minaret blanc à l'est de Damas, les mains posées sur les ailes de deux anges. Il tuera le Dajjal à la porte de Loud, brisera la croix, tuera le porc et supprimera la jizya, et la richesse abondera au point que personne ne l'acceptera (Bukhari 3448, Muslim 2937). Il jugera selon la loi de Muhammad ﷺ."]},

"Pour sa vie en détail, étape par étape, consulte la section « La Sira » de l'application."]}

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const view=$("#view");
const AR_DIG="٠١٢٣٤٥٦٧٨٩";
const arNum=n=>String(n).replace(/\d/g,d=>AR_DIG[d]);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const arHTML=s=>esc(s).replace(/ ?۞ ?/g,' <span class="sep">۞</span> ');

/* ---------- État (stocké dans ce navigateur) ---------- */
const KEY="sabil-ilm-v1";
let S={qibla:null,quizDone:{},sound:true,learned:[],fav:[],read:{},quiz:{},ar:1.55,hideInstall:false,counts:{},kahf:{fridays:[],verse:0}};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
if(!Array.isArray(S.learned))S.learned=[];
if(!S.quizDone||typeof S.quizDone!=="object")S.quizDone={};
if(!S.kahf||!Array.isArray(S.kahf.fridays))S.kahf={fridays:[],verse:0};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const applyAr=()=>document.documentElement.style.setProperty("--ar-size",S.ar+"rem");
applyAr();
const isFav=id=>S.fav.includes(id);
const toggleFav=id=>{S.fav=isFav(id)?S.fav.filter(x=>x!==id):[...S.fav,id];save();toast(isFav(id)?"Ajouté aux favoris":"Retiré des favoris")};
const markRead=id=>{if(!S.read[id]){S.read[id]=Date.now();save()}};
const readCount=prefix=>Object.keys(S.read).filter(k=>k.startsWith(prefix)).length;

/* ---------- Sons (générés, sans fichier) ---------- */
let AC=null;
function tone(freq,start,dur,vol,end){
  const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+start;
  o.type="sine";o.frequency.setValueAtTime(freq,t0);
  if(end)o.frequency.exponentialRampToValueAtTime(end,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.02);
}
function sfx(kind){
  if(S.sound===false||kind==="none")return;
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C()}
    if(AC.state==="suspended")AC.resume();
    if(kind==="ok"){tone(988,0,.09,.04);tone(1319,.06,.14,.035)}          /* bonne réponse : deux notes claires */
    else if(kind==="bad"){tone(440,0,.16,.03,330)}                         /* mauvaise réponse : glissé doux vers le bas */
    else if(kind==="count"){tone(2000,0,.025,.025)}                        /* compteur : goutte très brève */
    else if(kind==="fav"){tone(1568,0,.05,.025);tone(2093,.04,.09,.02)}    /* favori / appris : petit carillon */
    else if(kind==="nav"){tone(700,0,.05,.03,900)}                         /* onglets : glissé montant */
    else if(kind==="soft"){tone(1500,0,.02,.015)}                          /* toucher ailleurs : effleurement */
    else tone(1200,0,.035,.025,800);                                        /* bouton : petit « pop » */
  }catch(e){}
}

/* ---------- Rappel en direct (écrit par la tâche programmée) ---------- */
const RAPPEL_MS=10*60*1000,QUIZJ_MS=2*60*60*1000;
let RAPPEL=null,QUIZJ=null,rappelTimer=null,quizJAt=null;
function rappelActif(){
  if(!RAPPEL||!RAPPEL.at)return null;
  const age=Date.now()-Date.parse(RAPPEL.at);
  return age>=0&&age<RAPPEL_MS?RAPPEL:null;
}
function quizJActif(){
  if(!QUIZJ||!QUIZJ.at||!Array.isArray(QUIZJ.quiz)||!QUIZJ.quiz.length)return null;
  const age=Date.now()-Date.parse(QUIZJ.at);
  return age>=0&&age<QUIZJ_MS?QUIZJ:null;
}
function quizJHTML(){
  const z=quizJActif();if(!z)return "";
  const left=QUIZJ_MS-(Date.now()-Date.parse(z.at));
  const h=Math.floor(left/3600000),m=Math.max(1,Math.ceil((left%3600000)/60000));
  const done=S.quizDone[z.at];
  return `<section class="today" id="quiz-live" style="border-color:var(--lapis);background:var(--lapis-soft)" aria-labelledby="t-qj">
    <div class="row" style="justify-content:space-between"><span class="eyebrow" id="t-qj" style="color:var(--lapis)">🧠 Quiz du jour</span><span class="chip" style="font-variant-numeric:tabular-nums">encore ${h?h+" h ":""}${m} min</span></div>
    ${done!=null?`<h2>Terminé : ${done} / ${z.quiz.length}</h2><p class="small muted">Tu peux le refaire tant qu'il est disponible.</p>`:`<h2>${z.quiz.length} questions t'attendent</h2><p class="small muted">Disponible pendant 2 heures après l'envoi, avec la correction complète à la fin.</p>`}
    <div><button class="btn primary" id="rquiz">${done!=null?"Refaire le quiz":"Faire le quiz"} ${IC.chev}</button></div>
  </section>`;
}
function rappelHTML(){
  const r=rappelActif();if(!r)return "";
  const left=Math.max(1,Math.ceil((RAPPEL_MS-(Date.now()-Date.parse(r.at)))/60000));
  const quiz=false;
  return `<section class="today" id="rappel-live" style="border-color:var(--teal);background:var(--teal-soft)" aria-labelledby="t-r">
    <div class="row" style="justify-content:space-between"><span class="eyebrow" id="t-r">${quiz?"🧠 Rappel et quiz du jour":"Rappel de l'heure"}</span><span class="chip" style="font-variant-numeric:tabular-nums">disparaît dans ${left} min</span></div>
    ${r.titre?`<h2>${esc(r.titre)}</h2>`:""}
    ${r.ar?`<p class="ar" lang="ar">${esc(r.ar)}</p>`:""}
    ${r.fr?`<p class="fr">${esc(r.fr)}</p>`:""}
    ${r.conseil?`<p><b>Pour aujourd'hui :</b> ${esc(r.conseil)}</p>`:""}
    ${r.source?`<div><span class="chip ref">${esc(r.source)}</span></div>`:""}
    ${quiz?`<div><button class="btn primary" id="rquiz">Faire le quiz du jour (${r.quiz.length} questions) ${IC.chev}</button></div>`:""}
  </section>`;
}
function rappelRefresh(){
  const key=(location.hash||"#accueil").slice(1)||"accueil";
  if(key!=="accueil")return;
  const w=$("#view");if(!w)return;
  for(const [id,fn] of [["quiz-live",quizJHTML],["rappel-live",rappelHTML]]){
    const el=document.getElementById(id),html=fn();
    if(el){if(html)el.outerHTML=html;else el.remove()}
    else if(html)w.insertAdjacentHTML("afterbegin",html);
  }
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use("db");if(!db)return;
    db.doc("rappels/actuel").onSnapshot(s=>{RAPPEL=s.exists?s.data():null;rappelRefresh()},()=>{});
    db.doc("rappels/quiz").onSnapshot(s=>{QUIZJ=s.exists?s.data():null;rappelRefresh()},()=>{});
    clearInterval(rappelTimer);rappelTimer=setInterval(rappelRefresh,20000);
  }catch(e){}
})();

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=true;void t.offsetWidth;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}

/* ---------- Icônes ---------- */
const STAR='<svg viewBox="0 0 44 44" aria-hidden="true"><g fill="var(--surface)" stroke="currentColor" stroke-width="1.4"><rect x="9" y="9" width="26" height="26" rx="2"/><rect x="9" y="9" width="26" height="26" rx="2" transform="rotate(45 22 22)"/></g></svg>';
const star=(n,big)=>`<span class="star${big?" big":""}">${STAR}<span>${arNum(n)}</span></span>`;
const IC={
 fav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>',
 favOn:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>',
 copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
 chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>'
};
const favBtn=id=>`<button class="btn" data-fav="${id}" aria-pressed="${isFav(id)}">${isFav(id)?IC.favOn:IC.fav}${isFav(id)?"Dans les favoris":"Favori"}</button>`;

/* ---------- Données dérivées ---------- */
const H=HADITHS, P=PROPHETS;
const dayIdx=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const todayHadith=()=>H[dayIdx()%H.length];
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[ʿ'’`-]/g,"").toLowerCase();

/* ---------- Routage par hash ---------- */
const TITLES={accueil:"Islam",apprendre:"Apprendre",quiz:"Quiz",favoris:"Favoris",recherche:"Recherche",hadiths:"Les 42 hadiths",prophetes:"Les prophètes",sira:"La Sira",douas:"Invocations",noms:"Les 99 noms",bases:"Bases de la pratique",sources:"Sources",qibla:"Direction de la prière",kahf:"Sourate al-Kahf",sourates:"Sourates"};
const TAB_OF={accueil:"accueil",apprendre:"apprendre",hadiths:"apprendre",prophetes:"apprendre",sira:"apprendre",douas:"apprendre",noms:"apprendre",bases:"apprendre",sources:"apprendre",kahf:"sourates",sourates:"sourates",qibla:"apprendre",quiz:"quiz",favoris:"favoris",recherche:"accueil"};
function go(h){if(location.hash==="#"+h)route();else location.hash=h}
function route(){
  const h=(location.hash||"#accueil").slice(1)||"accueil";
  let m;
  if((m=h.match(/^hadith-(\d+)$/)))return show("hadiths",renderHadith(+m[1]),"Hadith "+m[1]);
  if(h==="quiz-du-jour")return show("accueil",renderHome(),TITLES.accueil);
  if((m=h.match(/^sira-(\d+)$/)))return show("sira",renderSiraCh(+m[1]),"La Sira");
  if((m=h.match(/^sourate-(\d+)$/)))return show("sourates",renderSurah(+m[1]),"Sourate "+m[1]);
  if((m=h.match(/^prophete-([a-z]+)$/)))return show("prophetes",renderProphet(m[1]),"Prophètes");
  const R={accueil:renderHome,apprendre:renderLearn,hadiths:renderHadiths,prophetes:renderProphets,sira:renderSira,douas:renderDuas,noms:renderNames,bases:renderBases,quiz:renderQuiz,favoris:renderFav,recherche:renderSearch,sources:renderSources,kahf:renderKahf,sourates:renderSurahs,qibla:renderQibla};
  const fn=R[h]||renderHome;
  show(R[h]?h:"accueil",fn(),TITLES[h]||TITLES.accueil);
}
function show(key,html,title){
  const depth=["accueil","apprendre","sourates","quiz","favoris","recherche"].includes(key)&&!/-/.test(location.hash)?0:(/-\d|-[a-z]/.test(location.hash)?2:1);
  const anim=window.__depth==null?"v-tab":depth>window.__depth?"v-fwd":depth<window.__depth?"v-back":"v-tab";window.__depth=depth;
  view.innerHTML=html;view.classList.remove("view","v-fwd","v-back","v-tab");void view.offsetWidth;view.classList.add("view",anim);
  view.querySelectorAll(".list .item,.sections .sec,.names .name,.chap,details.acc,.ev").forEach((el,i)=>el.style.setProperty("--i",i));
  $("#ttl").textContent=title;$("#brand-ar").hidden=key!=="accueil";
  $("#back").hidden=["accueil","apprendre","sourates","quiz","favoris"].includes(key)&&!/-/.test(location.hash);
  const tab=TAB_OF[key]||"apprendre";
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  window.scrollTo(0,0);
  if(key==="recherche"){const i=$("#q");if(i){i.focus();i.addEventListener("input",()=>doSearch(i.value))}}
  if(key==="quiz")quizBind();
  {const bl=view.querySelector(".blocks");if(bl){if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>{if(es.some(x=>x.isIntersecting)){bl.classList.add("seen");io.disconnect()}},{threshold:.12});io.observe(bl);setTimeout(()=>{if(!bl.classList.contains("seen")&&bl.getBoundingClientRect().top<innerHeight)bl.classList.add("seen")},400)}else bl.classList.add("seen")}}
  if(key==="qibla"){const i=$("#qq");if(i)i.addEventListener("input",()=>{qiblaQ=i.value;$("#qlist").innerHTML=qiblaList()});const n=view.querySelector(".needle");if(n){n.classList.remove("spin");void n.getBoundingClientRect();requestAnimationFrame(()=>n.classList.add("spin"))}}
  if(key==="sourates"&&location.hash==="#sourates"){const i=$("#sq");if(i)i.addEventListener("input",()=>{surahQ=i.value;$("#slist").innerHTML=surahListHTML()})}
  if(key==="kahf"){const k=$("#kv");if(k)k.addEventListener("change",()=>{S.kahf.verse=Math.max(0,Math.min(110,parseInt(k.value)||0));save();route()})}
}
window.addEventListener("hashchange",route);

/* ---------- Accueil ---------- */
function renderHome(){
  const d=todayHadith();
  const total=H.length+P.length;
  const done=readCount("h")+readCount("p");
  const install=S.hideInstall?"":`<section class="install">
    <div class="eyebrow">Installer sur ton téléphone</div>
    <p class="small">Ouvre ce lien dans le navigateur de ton téléphone, puis :</p>
    <ol class="small"><li><b>iPhone (Safari)</b> : bouton Partager ⬆︎ → « Sur l'écran d'accueil ».</li><li><b>Android (Chrome)</b> : menu ⋮ → « Ajouter à l'écran d'accueil ».</li></ol>
    <div><button class="btn" id="hide-install">C'est fait</button></div></section>`;
  const hr=new Date().getHours();
  const moment=hr<5?"Bonne nuit":hr<12?"Bonne matinée":hr<18?"Bon après-midi":"Bonne soirée";
  return `${rappelHTML()}${quizJHTML()}
  <div><span class="ar" lang="ar" style="display:block;text-align:left;direction:rtl;color:var(--gold);font-size:1.5rem;line-height:1.6">السَّلَامُ عَلَيْكُمْ</span>
  <h1>Salam aleykoum</h1><p class="muted">${moment}, qu'Allah facilite ton apprentissage.</p></div>
  ${kahfBanner()}
  <section class="today" aria-labelledby="t-d">
    <div class="row" style="justify-content:space-between"><span class="eyebrow" id="t-d">Hadith du jour</span>${star(d.n)}</div>
    <h2>${esc(d.t)}</h2>
    <p class="ar" lang="ar">${arHTML(d.ar.split("۞")[0])}</p>
    <p class="fr">${esc(d.fr.length>260?d.fr.split(/(?<=[.!?])\s/)[0]:d.fr)}</p>
    <div class="row"><span class="chip ref">${esc(d.src)}</span><span class="chip ok">${esc(d.g.split(" (")[0])}</span></div>
    <div><button class="btn primary" data-go="hadith-${d.n}">Lire et comprendre ${IC.chev}</button></div>
  </section>
  ${install}
  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="row" style="justify-content:space-between"><h2>Ton parcours</h2><span class="muted small" style="font-variant-numeric:tabular-nums">${done} / ${total} leçons lues</span></div>
    <div class="bar"><i style="width:${Math.round(done/total*100)}%"></i></div>
  </section>
  ${homeBlocks()}
  <p class="muted small">Ce contenu s'appuie sur des sources sunnites reconnues (voir <a href="#sources">Sources</a>).</p>`;
}
function homeBlocks(){
  const c=S.qibla,r=c?qiblaOf(c.lat,c.lon):null,deg=r?r.deg:120;
  const pct=(p,n)=>Math.round(readCount(p)/n*100);
  const tile=(go,ar,title,sub,p,n,i)=>`<button class="tile" data-go="${go}" style="--ti:${i}"><span class="ar-s" lang="ar">${ar}</span><b>${title}</b><small>${sub}</small>${p!=null?`<span class="tb"><i style="width:${p}%"></i></span>`:""}</button>`;
  return `<div class="blocks">
  <section class="blk b2" style="--bi:0" aria-labelledby="blk2">
    <div class="blk-h"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg></span>
      <span><b id="blk2">Le savoir</b><small>Hadiths, noms d'Allah et prophètes</small></span><span class="ar-t" lang="ar">العلم</span></div>
    <div class="tiles">
      ${tile("hadiths","الأحاديث","Les 42 hadiths",readCount("h")+" / "+H.length+" lus",pct("h",H.length),0,0)}
      ${tile("noms","الأسماء","Les 99 noms","Avec mémorisation",null,0,1)}
      ${tile("prophetes","الأنبياء","Les prophètes",readCount("p")+" / "+P.length+" lus",pct("p",P.length),0,2)}
    </div>
  </section>
  <section class="blk b3" style="--bi:1" aria-labelledby="blk3">
    <div class="blk-h"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.6 2.6H18v3.4L21 12l-3 3v3.4h-3.4L12 21l-2.6-2.6H6V15L3 12l3-3V5.6h3.4z"/></svg></span>
      <span><b id="blk3">La vie du croyant</b><small>Sira, invocations et pratique</small></span><span class="ar-t" lang="ar">العمل</span></div>
    <div class="tiles">
      ${tile("sira","السيرة","La Sira",readCount("r")+" / "+SIRA_D.length+" chapitres",Math.round(readCount("r")/SIRA_D.length*100),0,0)}
      ${tile("douas","الأذكار","Invocations",DUAS.length+" douas",null,0,1)}
      ${tile("bases","العبادة","Bases de la pratique","Piliers, ablutions, prière",null,0,2)}

/* ---------- Qibla ---------- */
function qiblaOf(lat,lon){
  const r=Math.PI/180,p1=lat*r,p2=KAABA[0]*r,dl=(KAABA[1]-lon)*r;
  const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  const deg=(Math.atan2(y,x)/r+360)%360;
  const a=Math.sin((p2-p1)/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  const km=2*6371*Math.asin(Math.sqrt(a));
  return {deg,km};
}
const DIRS=["nord","nord-est","est","sud-est","sud","sud-ouest","ouest","nord-ouest"];
const dirName=d=>DIRS[Math.round(d/45)%8];
let qiblaQ="";
function qiblaList(){
  const q=norm(qiblaQ.trim());
  const rows=CITIES.filter(c=>!q||norm(c[0]+" "+c[1]).includes(q)).slice(0,q?40:12);
  if(!rows.length)return `<p class="small muted">Aucune ville trouvée. Utilise les coordonnées ci-dessous.</p>`;
  return `<div class="list">${rows.map(c=>`<button class="item" data-city="${esc(c[0])}" style="grid-template-columns:minmax(0,1fr) auto"><span><b>${esc(c[0])}</b><small>${esc(c[1])}</small></span><span class="small muted" style="font-variant-numeric:tabular-nums">${Math.round(qiblaOf(c[2],c[3]).deg)}°</span></button>`).join("")}</div>`;
}
function compassSVG(deg){
  let ticks="";
  for(let i=0;i<72;i++){const a=i*5,big=a%30===0;ticks+=`<line x1="100" y1="${big?14:18}" x2="100" y2="24" stroke="var(--muted)" stroke-width="${big?1.6:.8}" transform="rotate(${a} 100 100)"/>`;}
  const lab=[["N",0],["E",90],["S",180],["O",270]].map(([l,a])=>{const r=a*Math.PI/180;return `<text x="${100+66*Math.sin(r)}" y="${100-66*Math.cos(r)+5}" text-anchor="middle" font-size="14" font-weight="700" fill="${l==="N"?"var(--danger)":"var(--ink)"}" font-family="var(--f-ui)">${l}</text>`}).join("");
  return `<svg viewBox="0 0 200 200" width="100%" style="max-width:300px;display:block;margin:0 auto" role="img" aria-label="Boussole : la Qibla est à ${Math.round(deg)} degrés du nord">
    <circle cx="100" cy="100" r="92" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
    ${ticks}${lab}
    <g class="needle" style="--deg:${deg}deg">
      <line x1="100" y1="100" x2="100" y2="34" stroke="var(--gold)" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="91" y="20" width="18" height="18" rx="2" fill="var(--ink)"/><rect x="91" y="24" width="18" height="3" fill="var(--gold)"/>
      <line x1="100" y1="100" x2="100" y2="140" stroke="var(--line)" stroke-width="3" stroke-linecap="round"/>
    </g>
    <circle cx="100" cy="100" r="6" fill="var(--gold)"/>
  </svg>`;
}
function renderQibla(){

const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function kahfFriday(){ // date du vendredi en cours (jeudi soir 18h → vendredi), sinon null
  const d=new Date(),wd=d.getDay();
  if(wd===5)return ymd(d);
  if(wd===4&&d.getHours()>=18){const f=new Date(d);f.setDate(d.getDate()+1);return ymd(f)}
  return null;
}
function lastFriday(){const d=new Date();const back=(d.getDay()+2)%7;d.setDate(d.getDate()-back);return d}
function kahfStreak(){
  const set=new Set(S.kahf.fridays);let d=lastFriday();
  const cur=kahfFriday();if(cur&&!set.has(cur)&&ymd(d)===cur)d.setDate(d.getDate()-7);
  let n=0;while(set.has(ymd(d))){n++;d.setDate(d.getDate()-7)}return n;
}

  const f=kahfFriday();if(!f)return "";

/* ---------- Recherche ---------- */
let INDEX=null;
function buildIndex(){
  INDEX=[];
  H.forEach(h=>INDEX.push({k:"Hadith "+h.n,t:h.t,go:"hadith-"+h.n,text:[h.t,h.ta,h.fr,h.l,h.r,h.ar,h.intro||""].join(" ")}));
  P.forEach(p=>INDEX.push({k:"Prophète",t:p.n,go:"prophete-"+p.id,text:[p.n,p.ar,p.tag,p.s,p.les.join(" "),...(PD[p.id]||[]).map(c=>c.h+" "+c.p.join(" "))].join(" ")}));
  SIRA_D.forEach((c,i)=>INDEX.push({k:"Sira · "+(c.y||"Portrait"),t:c.h,go:"sira-"+(i+1),text:c.h+" "+c.p.join(" ")}));
  DUAS.forEach(d=>INDEX.push({k:"Invocation",t:d.t,go:"douas",text:[d.t,d.fr,d.ar,d.n].join(" ")}));
  NAMES.forEach((x,i)=>INDEX.push({k:"Nom d'Allah n° "+(i+1),t:x[1]+" — "+x[2],go:"noms",text:x.join(" ")}));
  INDEX.push({k:"Sourate",t:"Al-Kahf du vendredi",go:"kahf",text:"kahf caverne vendredi sourate "+KAHF.parts.map(p=>p.t+" "+p.d).join(" ")+" "+KAHF.virtues.flat().join(" ")});
  SURAHS.forEach(s=>INDEX.push({k:"Sourate "+s[0],t:s[2]+" — "+s[3],go:s[0]===18?"kahf":"sourate-"+s[0],text:[s[1],s[2],s[3],s[6],s[7].join(" "),s[8],SD[s[0]]?SD[s[0]].ctx+" "+SD[s[0]].parts.map(x=>x[1]+" "+x[2]).join(" "):""].join(" ")}));
  INDEX.push({k:"Prière",t:"Direction de la prière (Qibla)",go:"qibla",text:"qibla direction priere boussole kaaba mecque"});
  BASES.forEach(b=>INDEX.push({k:"Pratique",t:b.t,go:"bases",text:b.t+" "+b.items.flat().join(" ")}));
  INDEX.forEach(e=>e.n=norm(e.text));
}
function renderSearch(){
  return `<div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Patience, Moussa, prière, صبر…" autocomplete="off" aria-label="Rechercher dans l'application"></div>

}
function doSearch(q){
  if(!INDEX)buildIndex();
  const nq=norm(q.trim());const out=$("#res");
  if(nq.length<2){out.innerHTML="";return}
  const words=nq.split(/\s+/);
  const hits=INDEX.filter(e=>words.every(w=>e.n.includes(w))).slice(0,40);
  if(!hits.length){out.innerHTML=`<div class="empty"><p><b>Aucun résultat pour « ${esc(q)} ».</b></p><p class="small">Essaie un mot plus court ou sans accent (ex. « priere »).</p></div>`;return}
  out.innerHTML=`<p class="muted small" style="margin-bottom:8px">${hits.length} résultat${hits.length>1?"s":""}</p><div class="list">${hits.map(e=>{
    const sents=e.text.split(/(?<=[.!?;])\s+/);
    let snip=sents.find(s=>norm(s).includes(words[0]))||sents[0];
    if(snip.length>170)snip=snip.slice(0,167)+"…";
    return `<button class="item" data-go="${e.go}" style="grid-template-columns:minmax(0,1fr) auto"><span><small class="eyebrow" style="font-size:.7rem">${esc(e.k)}</small><b>${esc(e.t)}</b><small>${esc(snip)}</small></span>${IC.chev}</button>`}).join("")}</div>`;
}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
