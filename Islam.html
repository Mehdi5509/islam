["58-64","Les moments d'intimité et la vie commune","Les enfants et les serviteurs doivent demander la permission d'entrer à trois moments : avant l'aube, à midi quand on se change, et après la prière de 'Icha (v. 58). Il n'y a pas de gêne à manger chez ses proches ou ensemble (v. 61). Ne pas quitter une assemblée avec le Prophète ﷺ sans sa permission, et ne pas l'appeler comme on s'appelle entre nous (v. 62-63)."]],
les:["Ne jamais répandre une rumeur sans preuve : c'est un péché énorme.","Penser du bien des croyants en premier.","Pardonner à ceux qui nous ont blessés, pour être pardonné par Allah.","Baisser le regard et respecter l'intimité des maisons.","La foi est une lumière qu'on nourrit par le rappel d'Allah."]};

SD[25]={ctx:"Sourate mecquoise. Elle répond aux objections des polythéistes contre le Prophète ﷺ (pourquoi mange-t-il et marche-t-il dans les marchés ? pourquoi n'a-t-il pas de trésor ?) et contre le Coran. Elle se termine par le portrait célèbre des « serviteurs du Tout Miséricordieux ».",
parts:[
["1-20","Les objections contre le Messager","« Béni soit Celui qui a fait descendre le Fourqan (le Discernement) sur Son serviteur, pour qu'il soit un avertisseur pour l'univers » (v. 1). Les polythéistes disent que le Coran est des légendes anciennes, et que le Prophète ﷺ mange et marche dans les marchés comme tout le monde. Allah répond que tous les messagers avant lui mangeaient et marchaient dans les marchés (v. 20)."],
["21-34","Le regret et le Coran délaissé","« Le jour où l'injuste se mordra les mains en disant : hélas, si seulement j'avais pris un chemin avec le Messager ! Malheur à moi, si seulement je n'avais pas pris untel pour ami ! » (v. 27-28). Le Messager se plaindra : « Seigneur, mon peuple a délaissé ce Coran » (v. 30). Le Coran a été révélé progressivement pour affermir le cœur du Prophète ﷺ (v. 32)."],
["35-44","Les peuples qui ont démenti","Moussa et Haroun, le peuple de Nouh, 'Ad, Thamoud, les gens d'ar-Rass et d'autres générations. « As-tu vu celui qui prend sa passion pour divinité ? » (v. 43). Ils sont comme le bétail, et même plus égarés."],
["45-62","Les signes de la création","L'ombre qu'Allah étend puis retire ; la nuit comme vêtement, le sommeil comme repos ; les vents porteurs de bonnes nouvelles ; l'eau pure du ciel. Les deux mers, l'une douce et l'autre salée, avec une barrière entre elles (v. 53). Allah a créé l'homme de l'eau et en a fait des liens de parenté. Il a fait se succéder la nuit et le jour pour celui qui veut se rappeler ou être reconnaissant (v. 62)."],
["63-77","Les serviteurs du Tout Miséricordieux","Leur portrait : ils marchent humblement sur terre, et quand les ignorants leur parlent, ils répondent « paix » ; ils passent la nuit prosternés et debout ; ils demandent à être protégés de l'Enfer ; ils ne sont ni gaspilleurs ni avares, mais au juste milieu ; ils n'invoquent pas d'autre divinité avec Allah, ne tuent pas et ne commettent pas la fornication. Celui qui se repent, croit et fait le bien, Allah change ses mauvaises actions en bonnes (v. 70). Ils ne portent pas de faux témoignage, passent dignement devant les futilités, ne restent pas sourds et aveugles aux versets, et invoquent : « Notre Seigneur, fais que nos épouses et nos enfants soient la joie de nos yeux, et fais de nous un modèle pour les pieux » (v. 74)."]],
les:["Les prophètes étaient des êtres humains qui vivaient parmi les gens.","Bien choisir ses amis : un mauvais ami peut mener au regret éternel.","Ne pas délaisser le Coran : le lire, le comprendre et l'appliquer.","Répondre aux ignorants par la paix.","Le repentir sincère transforme les péchés en bonnes actions."]};

SD[26]={ctx:"Sourate mecquoise, de la période moyenne. Le Prophète ﷺ était profondément peiné par le refus de son peuple : « Tu vas peut-être te consumer de chagrin parce qu'ils ne sont pas croyants » (v. 3). Allah le console en racontant sept prophètes, chacun terminé par le même refrain : « Il y a là un signe, mais la plupart d'entre eux ne croient pas, et ton Seigneur est le Tout-Puissant, le Très Miséricordieux. »",
parts:[
["1-9","La consolation","Ta-Sin-Mim. Allah pourrait faire descendre un signe devant lequel leurs nuques se plieraient, mais la foi doit être un choix. Ne voient-ils pas toutes les belles espèces de plantes qu'Allah fait pousser ?"],
["10-68","Moussa et Pharaon","Moussa craint d'être démenti et que sa langue ne se délie pas ; Allah lui donne Haroun. Pharaon lui rappelle qu'il a été élevé chez lui. Le dialogue : « Qu'est-ce que le Seigneur des mondes ? » « Le Seigneur des cieux, de la terre, de l'Orient et de l'Occident. » Les magiciens croient. Moussa part de nuit ; devant la mer, ses compagnons crient « nous allons être rattrapés ! » Il répond : « Jamais ! Mon Seigneur est avec moi, Il va me guider » (v. 62). La mer s'ouvre."],
["69-104","Ibrahim","Ibrahim demande à son peuple ce qu'ils adorent. Il décrit son Seigneur : « Celui qui m'a créé et me guide, qui me nourrit et me donne à boire, qui me guérit quand je suis malade, qui me fera mourir puis revivre, et dont j'espère le pardon au Jour de la rétribution » (v. 78-82). Il invoque : « Accorde-moi une bonne renommée parmi les générations futures » (v. 84). Au Jour du jugement, ni les biens ni les enfants ne serviront, sauf à celui qui vient à Allah avec un cœur sain (v. 88-89)."],
["105-122","Nouh","Nouh dit : « Je suis pour vous un messager digne de confiance ; craignez Allah et obéissez-moi. Je ne vous demande aucun salaire. » La même phrase revient chez tous les prophètes de la sourate. Son peuple lui reproche d'être suivi par les plus vils ; il refuse de les repousser."],
["123-140","Houd","Houd reproche à 'Ad leurs constructions de prestige sur chaque colline et leurs forteresses, comme s'ils devaient vivre éternellement, et leur tyrannie (v. 128-130)."],
["141-159","Salih","Salih rappelle à Thamoud leurs jardins, leurs sources et leurs maisons taillées dans les montagnes, et leur demande de ne pas obéir aux transgresseurs qui sèment la corruption. La chamelle, puis leur crime et leur châtiment."],
["160-175","Lout","Lout reproche à son peuple de délaisser les épouses qu'Allah a créées pour eux. Ils menacent de l'expulser ; Allah le sauve avec sa famille, sauf une vieille femme."],
["176-191","Chou'ayb","Chou'ayb demande aux gens d'al-Ayka de donner la pleine mesure, de peser avec une balance exacte et de ne pas léser les gens dans leurs biens. Ils sont saisis par le châtiment du jour de l'ombre."],
["192-227","Le Coran et les poètes","Le Coran a été descendu par l'Esprit fidèle (Jibril) sur le cœur du Prophète ﷺ, en une langue arabe claire, et il était annoncé dans les Écritures anciennes. « Avertis les plus proches de ta famille » (v. 214) : le Prophète ﷺ monta alors sur as-Safa pour appeler son clan. « Abaisse ton aile pour les croyants qui te suivent » (v. 215). Les démons descendent sur tout menteur pécheur. Les poètes sont suivis par les égarés ; ils errent dans chaque vallée et disent ce qu'ils ne font pas, sauf ceux qui croient et font le bien (v. 224-227)."]],
les:["Le chagrin face au refus des gens est naturel ; la foi reste un choix.","La confiance totale en Allah, comme Moussa face à la mer.","Ibrahim décrit Allah présent à chaque étape de la vie.","Seul un cœur sain sera utile au Jour du jugement.","Les messagers ne demandaient aucun salaire : la sincérité dans l'appel."]};

SD[27]={ctx:"Sourate mecquoise. Elle met en avant la science donnée par Allah à Daoud et Soulayman, qui comprenaient le langage des animaux, et l'histoire de la reine de Saba'. Elle contient une prosternation de récitation (v. 26).",
parts:[
["1-14","Moussa et le feu","Le Coran est une guidée et une bonne nouvelle pour les croyants. Moussa voit un feu ; il est appelé : « Béni soit celui qui est dans le feu et autour. » Son bâton devient serpent, sa main sort blanche ; il est envoyé avec neuf signes à Pharaon, que son peuple a nié par injustice et orgueil alors que leurs âmes en étaient convaincues (v. 14)."],
["15-44","Soulayman, la fourmi, la huppe et la reine","Daoud et Soulayman reçoivent la science et remercient Allah. Soulayman, à la tête de son armée d'hommes, de djinns et d'oiseaux, arrive à la vallée des fourmis ; une fourmi avertit les siennes, et il sourit en invoquant : « Seigneur, inspire-moi de Te remercier pour le bienfait dont Tu m'as comblé ainsi que mes parents » (v. 19). La huppe absente revient avec une nouvelle : une reine à Saba' et son peuple adorent le soleil. Soulayman envoie une lettre commençant par « Bismillah ar-Rahman ar-Rahim » (v. 30). La reine consulte ses conseillers, envoie un cadeau refusé, puis vient. Son trône est apporté en un clin d'œil ; Soulayman dit : « Ceci est une grâce de mon Seigneur pour m'éprouver : serai-je reconnaissant ou ingrat ? » (v. 40). La reine se soumet à Allah."],
["45-58","Salih et Lout","Neuf hommes de Thamoud complotent d'assassiner Salih et sa famille de nuit ; Allah fait échouer leur ruse et les détruit. Le peuple de Lout veut l'expulser, et il est sauvé."],
["59-93","Qui est meilleur, Allah ou les idoles ?","Une série de questions : « Qui a créé les cieux et la terre, fait descendre l'eau et pousser des jardins ? Qui a fait de la terre un lieu stable ? Qui répond à l'angoissé quand il L'invoque et dissipe le mal ? Qui vous guide dans les ténèbres ? Qui commence la création puis la recommence ? Y a-t-il une divinité avec Allah ? » (v. 60-64). Seul Allah connaît l'invisible. Parmi les signes de la fin : une bête qui sortira de la terre et parlera aux gens (v. 82). « Tu vois les montagnes, tu les crois figées, alors qu'elles passent comme des nuages » (v. 88)."]],
les:["La gratitude est la réponse aux bienfaits, même à un royaume immense.","Même une fourmi pense à protéger sa communauté.","Commencer ses écrits par Bismillah, comme la lettre de Soulayman.","Allah répond à l'angoissé qui L'invoque."]};

SD[28]={ctx:"Sourate mecquoise, révélée selon certains rapports pendant l'Hégire, sur la route entre La Mecque et Médine, avec le verset 85 qui promet au Prophète ﷺ qu'il reviendra à La Mecque. Elle raconte la vie de Moussa, de sa naissance à sa mission, et l'histoire de Qaroun.",
parts:[
["1-13","La naissance et le fleuve","Pharaon divise son peuple en castes et opprime les Enfants d'Israël ; Allah veut favoriser les opprimés. La mère de Moussa reçoit l'inspiration de le jeter dans le fleuve. La femme de Pharaon le recueille. Il refuse toutes les nourrices ; sa sœur propose une famille, et il est rendu à sa mère, « pour que son œil se réjouisse et qu'elle sache que la promesse d'Allah est vraie » (v. 13)."],
["14-21","Le meurtre et la fuite","Devenu adulte, Moussa intervient dans une bagarre et tue un Égyptien d'un coup de poing, sans le vouloir. Il se repent : « Seigneur, je me suis fait du tort, pardonne-moi », et Allah lui pardonne (v. 16). Averti d'un complot, il fuit l'Égypte."],
["22-28","Madyan","Au puits de Madyan, il abreuve le troupeau de deux jeunes femmes, puis se retire à l'ombre : « Seigneur, j'ai grand besoin du bien que Tu feras descendre vers moi » (v. 24). L'une d'elles revient, marchant avec pudeur. Son père l'accueille ; elle dit : « Le meilleur à engager est le fort et le digne de confiance » (v. 26). Il épouse l'une d'elles contre huit ou dix ans de travail."],
["29-42","La mission","Sur le chemin du retour, l'appel au mont Tour, les deux signes, et la mission auprès de Pharaon avec Haroun. Pharaon dit : « Je ne vous connais pas d'autre divinité que moi » et demande à Haman de lui construire une tour pour monter voir le dieu de Moussa (v. 38). Il est noyé avec son armée."],
["43-75","Le Coran et ses opposants","Le Prophète ﷺ ne pouvait connaître ces récits sans révélation. Certains gens du Livre croient au Coran et reçoivent une double récompense pour leur patience (v. 52-54). « Tu ne guides pas qui tu aimes, mais Allah guide qui Il veut » (v. 56), révélé au sujet d'Abou Talib, l'oncle que le Prophète ﷺ aimait et qui mourut sans croire (Muslim 24)."],
["76-84","Qaroun","Qaroun, du peuple de Moussa, possédait des trésors immenses. Les sages de son peuple lui dirent : « Ne te réjouis pas avec orgueil… Recherche la demeure dernière avec ce qu'Allah t'a donné, et n'oublie pas ta part de ce monde. Fais le bien comme Allah t'a fait du bien, et ne cherche pas la corruption sur terre » (v. 76-77). Il répondit : « Je l'ai obtenu grâce à une science que je possède. » Il sortit en grand apparat ; ceux qui aimaient ce monde l'envièrent. La terre l'engloutit avec sa maison. « Cette demeure dernière, Nous la réservons à ceux qui ne recherchent ni l'orgueil sur terre ni la corruption » (v. 83)."],
["85-88","La promesse du retour","« Celui qui t'a imposé le Coran te ramènera certainement au lieu de retour » (v. 85) : La Mecque, conquise huit ans plus tard. « Toute chose périt, sauf Son visage » (v. 88)."]],
les:["Allah protège ceux qu'Il veut par les moyens les plus inattendus.","Se repentir immédiatement après une faute.","Avouer son besoin à Allah dans la détresse.","La force et l'honnêteté sont les qualités du bon travailleur.","Utiliser sa richesse pour l'au-delà sans oublier sa part de ce monde."]};

SD[29]={ctx:"Sourate mecquoise, sauf ses premiers versets révélés à Médine selon certains savants. Elle fut révélée au moment où les musulmans de La Mecque subissaient les persécutions, pour leur expliquer que l'épreuve fait partie de la foi.",
parts:[
["1-13","La foi est éprouvée","« Les gens pensent-ils qu'on les laissera dire : nous croyons, sans les éprouver ? Nous avons éprouvé ceux d'avant eux » (v. 2-3). Celui qui fait un effort ne le fait que pour lui-même. Être bon envers ses parents, mais ne pas leur obéir s'ils poussent à associer à Allah (v. 8), un verset révélé au sujet de Sa'd ibn Abi Waqqas dont la mère avait juré de ne plus manger jusqu'à ce qu'il renie l'islam (Muslim 1748)."],
["14-40","Les prophètes et les peuples","Nouh resta parmi les siens mille ans moins cinquante (v. 14). Ibrahim appelle son peuple et est jeté au feu ; Lout croit en lui. Les anges et le peuple de Lout. Chou'ayb et Madyan. 'Ad et Thamoud, Qaroun, Pharaon et Haman : « Chacun, Nous l'avons saisi pour son péché : sur certains Nous avons envoyé une pluie de pierres, d'autres ont été saisis par le Cri, d'autres engloutis par la terre, et d'autres noyés » (v. 40)."],
["41-44","La maison de l'araignée","« Ceux qui prennent des protecteurs en dehors d'Allah ressemblent à l'araignée qui s'est donné une maison ; or la plus fragile des maisons est celle de l'araignée, s'ils savaient » (v. 41). Toute protection en dehors d'Allah est aussi fragile qu'une toile."],
["45-55","La prière et le dialogue","« Récite ce qui t'est révélé du Livre et accomplis la prière : la prière préserve de la turpitude et du blâmable, et le rappel d'Allah est plus grand encore » (v. 45). « Ne discutez avec les gens du Livre que de la meilleure manière, sauf ceux d'entre eux qui sont injustes » (v. 46). Le Prophète ﷺ ne savait ni lire ni écrire avant le Coran, ce qui prouve qu'il ne l'a pas copié (v. 48)."],
["56-69","L'émigration et la vraie vie","« Ô Mes serviteurs croyants, Ma terre est vaste ; adorez-Moi donc » (v. 56). « Toute âme goûtera la mort. » « Que de bêtes ne portent pas leur subsistance ; c'est Allah qui les nourrit, ainsi que vous » (v. 60). « La vie de ce monde n'est qu'amusement et jeu ; la demeure de l'au-delà est la vraie vie, s'ils savaient » (v. 64). Dernier verset : « Ceux qui font des efforts pour Nous, Nous les guiderons certes sur Nos chemins » (v. 69)."]],
les:["L'épreuve est une étape normale de la foi.","Être bon envers ses parents sans leur obéir dans la désobéissance à Allah.","Toute protection en dehors d'Allah est fragile.","La vraie prière éloigne des mauvaises actions.","Celui qui fait des efforts pour Allah sera guidé."]};

// Sourates 30 à 45
SD[30]={ctx:"Sourate mecquoise, révélée vers l'an 615, quand l'empire perse venait de battre les Byzantins (chrétiens) et de prendre Jérusalem. Les polythéistes de La Mecque s'en réjouissaient, se sentant proches des Perses idolâtres, alors que les musulmans étaient attristés pour les Byzantins, gens du Livre. Le Coran annonça la revanche byzantine « dans quelques années » (moins de dix) ; Abou Bakr paria même avec des Qouraychites. La victoire byzantine eut lieu vers 622-624, au moment de la victoire de Badr (Tirmidhi 3193).",
parts:[
["1-7","La prophétie","« Les Romains ont été vaincus dans la terre la plus proche (ou la plus basse), et après leur défaite ils vaincront, dans quelques années. L'ordre appartient à Allah, avant et après. Ce jour-là, les croyants se réjouiront du secours d'Allah » (v. 2-5). Cette prophétie s'est réalisée exactement. Les gens connaissent l'apparence de la vie de ce monde, mais sont insouciants de l'au-delà (v. 7)."],
["8-19","Réfléchir et voyager","Ne réfléchissent-ils pas en eux-mêmes ? Allah n'a créé les cieux et la terre qu'en vérité et pour un terme fixé. Ne parcourent-ils pas la terre pour voir la fin de ceux d'avant, plus forts qu'eux ? Glorifiez Allah le soir et le matin (v. 17-18)."],
["20-27","Les signes d'Allah","Une série de « parmi Ses signes » : vous avoir créés de terre ; « avoir créé de vous, pour vous, des épouses pour que vous trouviez la tranquillité auprès d'elles, et avoir mis entre vous de l'affection et de la miséricorde » (v. 21) ; la création des cieux et de la terre et la diversité de vos langues et de vos couleurs (v. 22) ; votre sommeil la nuit et le jour ; l'éclair, entre crainte et espoir ; le ciel et la terre qui tiennent par Son ordre."],
["28-40","La fitra","« Dirige tout ton être vers la religion en monothéiste pur, selon la nature (fitra) qu'Allah a donnée aux hommes ; pas de changement à la création d'Allah » (v. 30). Le Prophète ﷺ a dit : « Tout enfant naît selon la fitra, ce sont ses parents qui en font un juif, un chrétien ou un mazdéen » (Bukhari 1385). Ne soyez pas de ceux qui divisent leur religion en sectes. L'usure n'augmente pas auprès d'Allah, mais la zakat donnée pour Son visage se multiplie (v. 39)."],
["41-53","La corruption sur terre","« La corruption est apparue sur la terre et dans la mer à cause de ce que les mains des hommes ont acquis, afin qu'Allah leur fasse goûter une partie de ce qu'ils ont fait, peut-être reviendront-ils » (v. 41). Les vents porteurs de pluie et la terre morte qui revit sont des preuves de la résurrection."],
["54-60","Faiblesse, force, faiblesse","« Allah est Celui qui vous a créés faibles, puis après la faiblesse a donné la force, puis après la force a donné la faiblesse et les cheveux blancs » (v. 54). « Patiente : la promesse d'Allah est vérité » (v. 60)."]],
les:["Le Coran a annoncé des événements futurs qui se sont réalisés.","Le mariage est fondé sur la tranquillité, l'affection et la miséricorde.","La diversité des langues et des couleurs est un signe d'Allah, pas une raison de mépris.","Chaque enfant naît avec une nature tournée vers Allah.","Les dégâts sur la terre sont aussi la conséquence de nos actes."]};

SD[31]={ctx:"Sourate mecquoise. Elle porte le nom de Louqman, un homme sage que le Coran cite pour ses conseils à son fils. Les savants divergent sur son identité : la majorité dit qu'il n'était pas prophète mais un homme vertueux à qui Allah a donné la sagesse.",
parts:[
["1-11","Les bienfaisants et le divertissement","Le Coran est une guidée et une miséricorde pour les bienfaisants, qui accomplissent la prière, donnent la zakat et croient fermement à l'au-delà. Certains achètent des « paroles distrayantes » pour égarer du chemin d'Allah (v. 6) ; Ibn Mas'oud expliquait ce verset par le chant qui détourne du rappel. Allah a créé les cieux sans piliers visibles et répandu toutes sortes d'animaux : « Montrez-moi ce qu'ont créé ceux que vous adorez en dehors de Lui ! » (v. 11)."],
["12-19","Les conseils de Louqman à son fils","Allah donna la sagesse à Louqman : « Sois reconnaissant envers Allah. » Ses conseils à son fils : « Ô mon fils, ne donne pas d'associé à Allah, car le chirk est une injustice énorme » (v. 13). Puis Allah insère un rappel : sois bon envers tes parents ; ta mère t'a porté, faiblesse sur faiblesse, et ton sevrage a duré deux ans ; mais ne leur obéis pas s'ils te poussent au chirk, tout en les accompagnant convenablement dans ce monde (v. 14-15).\nLouqman continue : même le poids d'un grain de moutarde, caché dans un rocher, dans les cieux ou la terre, Allah le fera venir (v. 16). « Accomplis la prière, ordonne le bien, interdis le mal, et endure ce qui t'atteint » (v. 17). « Ne détourne pas ton visage des gens par orgueil, et ne marche pas sur terre avec arrogance… Sois modeste dans ta démarche et baisse ta voix, car la plus laide des voix est celle de l'âne » (v. 18-19)."],
["20-32","Les bienfaits et la reconnaissance","Allah a mis à votre service ce qui est dans les cieux et sur la terre, et vous a comblés de Ses bienfaits apparents et cachés (v. 20). Si tous les arbres de la terre étaient des calames et la mer de l'encre, prolongée de sept mers, les paroles d'Allah ne seraient pas épuisées (v. 27). Sur la mer, les gens invoquent Allah sincèrement, puis une fois sauvés, certains restent modérés et d'autres renient."],
["33-34","Les cinq clés de l'invisible","Craignez un jour où un père ne pourra rien pour son fils, ni un fils pour son père. « La connaissance de l'Heure est auprès d'Allah ; c'est Lui qui fait descendre la pluie, Il sait ce qu'il y a dans les matrices. Aucune âme ne sait ce qu'elle acquerra demain, et aucune âme ne sait sur quelle terre elle mourra » (v. 34). Le Prophète ﷺ a dit que ce sont les cinq clés de l'invisible que seul Allah connaît (Bukhari 4697)."]],
les:["Le chirk est la plus grande des injustices.","Le droit de la mère, qui a porté l'enfant faiblesse sur faiblesse.","Éduquer ses enfants par des conseils doux et clairs, comme Louqman.","Prière, appel au bien et patience vont ensemble.","Modestie dans la démarche et dans la voix."]};

SD[32]={ctx:"Sourate mecquoise. Le Prophète ﷺ la récitait dans la première unité de la prière de l'aube le vendredi, et al-Insan dans la seconde (Bukhari 891). Il ne dormait pas avant d'avoir récité as-Sajda et al-Moulk (Tirmidhi 2892). Elle contient une prosternation de récitation au verset 15.",
parts:[
["1-9","Le Livre et la création de l'homme","Le Livre est sans aucun doute révélé par le Seigneur des mondes. Allah a créé les cieux et la terre en six jours, puis S'est établi sur le Trône. Il a perfectionné tout ce qu'Il a créé, a commencé la création de l'homme d'argile, puis sa descendance d'une eau vile, puis l'a façonné et lui a insufflé de Son esprit, et vous a donné l'ouïe, la vue et les cœurs : combien peu vous êtes reconnaissants (v. 7-9) !"],
["10-14","La mort et le regret","Ils disent : « Quand nous serons perdus dans la terre, renaîtrons-nous ? » L'ange de la mort chargé de vous prendra vos âmes. Les criminels, tête baissée devant leur Seigneur, diront : « Nous avons vu et entendu ; renvoie-nous et nous ferons le bien » (v. 12)."],
["15-22","Ceux qui se prosternent","« Seuls croient en Nos versets ceux qui, quand on les leur rappelle, tombent prosternés et glorifient leur Seigneur sans orgueil » (v. 15). « Leurs flancs s'arrachent de leurs lits pour invoquer leur Seigneur, par crainte et par espoir, et ils dépensent de ce que Nous leur avons attribué. Aucune âme ne sait ce qu'on leur a réservé en secret de réjouissances pour les yeux » (v. 16-17). Le Prophète ﷺ cita ce verset dans le hadith qoudsi : « J'ai préparé pour Mes serviteurs vertueux ce qu'aucun œil n'a vu, ce qu'aucune oreille n'a entendu et ce qui n'a jamais traversé le cœur d'un homme » (Bukhari 3244). Le croyant et le pervers ne sont pas égaux."],
["23-30","Moussa et l'attente","Allah donna le Livre à Moussa et fit des Enfants d'Israël des guides tant qu'ils patientèrent. Ne voient-ils pas qu'Allah pousse l'eau vers la terre aride et en fait sortir des cultures ? « Détourne-toi d'eux et attends » (v. 30)."]],
les:["Réciter as-Sajda et al-Insan le vendredi à l'aube est une Sunna.","La prière de nuit fait partie des qualités des vrais croyants.","Le Paradis contient ce qu'aucun œil n'a vu.","Remercier Allah pour l'ouïe, la vue et le cœur."]};

SD[33]={ctx:"Sourate médinoise, révélée surtout autour de l'an 5. Elle traite de la bataille du Fossé (al-Khandaq) contre la coalition (al-Ahzab) de Qouraych et de tribus alliées, de la trahison de la tribu juive des Banou Qourayza, et de plusieurs règles familiales et sociales, notamment le statut des épouses du Prophète ﷺ et l'abolition de l'adoption avec changement de filiation.",
parts:[
["1-8","L'adoption et la place du Prophète ﷺ","Allah n'a pas mis deux cœurs dans la poitrine d'un homme. Les enfants adoptifs ne deviennent pas vos fils : « Appelez-les du nom de leurs pères » (v. 5). Le Prophète ﷺ avait adopté Zayd ibn Haritha, qu'on appelait Zayd ibn Muhammad ; il reprit alors le nom de son père. L'islam garde la prise en charge des orphelins (kafala) sans effacer leur filiation. « Le Prophète a plus de droits sur les croyants qu'ils n'en ont sur eux-mêmes, et ses épouses sont leurs mères » (v. 6)."],
["9-27","La bataille du Fossé et les Banou Qourayza","Une coalition d'environ 10 000 hommes assiégea Médine. Les musulmans creusèrent un fossé. « Quand ils vinrent à vous d'en haut et d'en bas, que les regards se troublèrent et que les cœurs remontèrent aux gorges » (v. 10). Les hypocrites dirent : « Allah et Son Messager ne nous ont promis que tromperie » et demandèrent à rentrer chez eux. Les croyants dirent : « Voilà ce qu'Allah et Son Messager nous avaient promis » (v. 22). « Vous avez dans le Messager d'Allah un excellent modèle » (v. 21). Allah envoya un vent glacial et des armées invisibles, et les coalisés repartirent sans avoir rien obtenu. Puis la tribu des Banou Qourayza, qui avait trahi son pacte pendant le siège, fut assiégée et vaincue (v. 26-27)."],
["28-35","Les épouses du Prophète ﷺ et l'égalité devant Allah","Les épouses du Prophète ﷺ reçoivent le choix entre la vie de ce monde et Allah, Son Messager et l'au-delà ; toutes choisissent Allah et Son Messager. Des recommandations particulières leur sont faites. Puis un verset qui cite dix qualités pour les hommes et les femmes à égalité : « Les musulmans et les musulmanes, les croyants et les croyantes, les obéissants et les obéissantes, les véridiques et les véridiques, les patients et les patientes, les humbles et les humbles, ceux et celles qui font l'aumône, ceux et celles qui jeûnent, ceux et celles qui préservent leur chasteté, et ceux et celles qui se souviennent beaucoup d'Allah : Allah leur a préparé un pardon et une énorme récompense » (v. 35)."],
["36-40","Zayd, Zaynab et le sceau des prophètes","Quand Allah et Son Messager ont décidé une chose, le croyant n'a plus de choix (v. 36). Zayd divorça de Zaynab bint Jahch, et Allah ordonna au Prophète ﷺ de l'épouser, pour montrer qu'il est permis d'épouser l'ancienne femme d'un fils adoptif (v. 37). « Muhammad n'est le père d'aucun de vos hommes, mais le Messager d'Allah et le sceau des prophètes » (v. 40)."],
["41-48","Le rappel d'Allah","« Ô vous qui croyez, souvenez-vous beaucoup d'Allah et glorifiez-Le matin et soir » (v. 41-42). Le Prophète ﷺ est envoyé comme témoin, annonciateur, avertisseur, appelant à Allah et lampe éclairante (v. 45-46)."],
["49-62","Règles de vie et prière sur le Prophète ﷺ","Règles du divorce avant consommation, des mariages permis au Prophète ﷺ, et de l'entrée dans ses maisons : ne pas entrer sans permission, ne pas s'attarder après le repas (v. 53). « Allah et Ses anges prient sur le Prophète. Ô vous qui croyez, priez sur lui et adressez-lui vos salutations » (v. 56). « Ô Prophète, dis à tes épouses, à tes filles et aux femmes des croyants de ramener sur elles leurs grands voiles : c'est le meilleur moyen d'être reconnues et de ne pas être importunées » (v. 59)."],
["63-73","La parole juste et le dépôt","« Craignez Allah et dites des paroles justes : Il améliorera vos actions et pardonnera vos péchés » (v. 70-71). « Nous avons proposé le dépôt (la responsabilité) aux cieux, à la terre et aux montagnes ; ils ont refusé de le porter et en ont eu peur, et l'homme l'a porté ; il est très injuste et très ignorant » (v. 72)."]],
les:["Le Prophète ﷺ est le meilleur modèle, surtout dans les épreuves.","La filiation d'un enfant ne doit pas être effacée.","Hommes et femmes sont égaux dans la récompense de la foi et des œuvres.","Prier sur le Prophète ﷺ est un ordre d'Allah.","Dire des paroles justes améliore les actes."]};

SD[34]={ctx:"Sourate mecquoise. Elle compare deux exemples de bienfaits : la famille de Daoud, reconnaissante, et le peuple de Saba', ingrat. Elle répond aussi longuement aux négateurs de la résurrection.",
parts:[
["1-9","Allah sait tout","Louange à Allah, à qui appartient ce qui est dans les cieux et sur la terre. Il sait ce qui pénètre dans la terre et ce qui en sort, ce qui descend du ciel et ce qui y monte. Rien ne Lui échappe, même le poids d'un atome (v. 3). Les mécréants se moquent de l'homme qui annonce la résurrection."],
["10-14","Daoud et Soulayman","Les montagnes et les oiseaux glorifiaient avec Daoud ; le fer s'assouplissait pour lui. « Ô famille de Daoud, œuvrez avec reconnaissance. Mais peu de Mes serviteurs sont reconnaissants » (v. 13). Soulayman reçut le vent et les djinns à son service. Il mourut appuyé sur son bâton, et les djinns ne s'en rendirent compte que quand une bête rongea le bâton : preuve qu'ils ne connaissent pas l'invisible (v. 14)."],
["15-21","Le peuple de Saba'","Saba' (au Yémen) avait deux jardins, à droite et à gauche : « Mangez de la subsistance de votre Seigneur et soyez reconnaissants : un bon pays et un Seigneur pardonneur » (v. 15). Ils se détournèrent ; Allah envoya l'inondation du barrage (de Ma'rib), et leurs jardins furent remplacés par des arbres aux fruits amers. Ils demandèrent même que les distances entre leurs étapes de voyage soient allongées. Satan trouva vraie son opinion à leur sujet."],
["22-54","Les arguments contre les idoles","Ceux que vous invoquez en dehors d'Allah ne possèdent pas le poids d'un atome. Qui vous nourrit des cieux et de la terre ? Le Prophète ﷺ est envoyé à toute l'humanité (v. 28). Les riches de chaque cité disent : « Nous avons plus de biens et d'enfants, nous ne serons pas châtiés. » Ce ne sont pas les biens ni les enfants qui rapprochent d'Allah, mais la foi et les bonnes œuvres (v. 37). « Je vous exhorte à une seule chose : levez-vous pour Allah, à deux ou seul, puis réfléchissez » (v. 46)."]],
les:["La reconnaissance se montre par les actes, pas seulement par les paroles.","Les bienfaits peuvent disparaître à cause de l'ingratitude.","Les djinns ne connaissent pas l'invisible.","La richesse ne rapproche pas d'Allah, seules la foi et les œuvres le font."]};

SD[35]={ctx:"Sourate mecquoise. Elle s'appelle aussi « al-Mala'ika » (les anges), car elle commence par Allah qui fait des anges des messagers dotés d'ailes. Elle célèbre la puissance d'Allah Créateur et la dépendance totale de l'homme envers Lui.",
parts:[
["1-14","Le Créateur","Louange à Allah, Créateur des cieux et de la terre, qui fait des anges des messagers aux ailes deux, trois et quatre. Ce qu'Allah accorde de miséricorde aux gens, nul ne peut le retenir (v. 2). « Ô gens, la promesse d'Allah est vérité : que la vie de ce monde ne vous trompe pas » (v. 5). Satan est un ennemi ; prenez-le pour ennemi (v. 6). « Vers Lui monte la bonne parole, et l'œuvre vertueuse l'élève » (v. 10). Ceux que vous invoquez ne possèdent même pas la pellicule d'un noyau de datte (v. 13)."],
["15-26","Les pauvres ayant besoin d'Allah","« Ô gens, vous êtes les pauvres ayant besoin d'Allah, et Allah est Celui qui se suffit à Lui-même, le Digne de louange » (v. 15). Nul ne portera le fardeau d'autrui. L'aveugle et le voyant, les ténèbres et la lumière, l'ombre et la chaleur, les vivants et les morts ne sont pas égaux."],
["27-38","Les couleurs et les savants","Allah fait sortir de la même eau des fruits de couleurs variées ; il y a dans les montagnes des sillons blancs, rouges et noirs ; et les hommes, les animaux et les bestiaux ont aussi des couleurs différentes. « Parmi Ses serviteurs, seuls les savants craignent Allah » (v. 28) : la vraie science mène à la crainte d'Allah. Ceux qui récitent le Livre, prient et dépensent espèrent un commerce qui ne périra jamais (v. 29). Les héritiers du Livre sont de trois sortes : celui qui se fait du tort à lui-même, celui qui est modéré, et celui qui devance dans les bonnes œuvres (v. 32)."],
["39-45","La patience d'Allah","Les mécréants avaient juré que si un avertisseur venait, ils seraient mieux guidés que les autres ; quand il est venu, ils se sont éloignés davantage. « Si Allah s'en prenait aux gens pour ce qu'ils ont fait, Il ne laisserait sur la terre aucun être vivant ; mais Il leur accorde un délai jusqu'à un terme fixé » (v. 45)."]],
les:["L'homme est totalement dépendant d'Allah.","La diversité des couleurs dans la création est un signe d'Allah.","La vraie science mène à la crainte d'Allah.","Lire le Coran, prier et donner : un commerce qui ne perd jamais.","La vie de ce monde ne doit pas nous tromper."]};

SD[36]={ctx:"Sourate mecquoise, très récitée. Le hadith « Ya-Sin est le cœur du Coran » est jugé faible par plusieurs spécialistes, de même que ceux qui lui attribuent des vertus particulières ; mais sa grandeur vient de son contenu : elle présente avec force les trois bases de la foi (l'unicité d'Allah, la mission du Prophète ﷺ et la résurrection). Le Prophète ﷺ a recommandé de la lire auprès des mourants selon un hadith d'Abou Daoud (3121), dont l'authenticité est discutée.",
parts:[
["1-12","La mission du Messager","Allah jure par le Coran plein de sagesse que Muhammad ﷺ est parmi les messagers, sur un chemin droit. Il est envoyé pour avertir un peuple dont les ancêtres n'avaient pas été avertis. Allah écrit ce que les gens ont fait et les traces qu'ils ont laissées (v. 12) : leurs pas vers les mosquées et les effets de leurs actes après eux."],
["13-32","Les gens de la cité","Une cité reçut deux messagers, puis un troisième pour les renforcer. Les habitants les traitèrent de menteurs et les menacèrent. Un homme vint en courant du bout de la ville : « Ô mon peuple, suivez les messagers ! Suivez ceux qui ne vous demandent aucun salaire et qui sont bien guidés. Pourquoi n'adorerais-je pas Celui qui m'a créé ? » Ils le tuèrent. On lui dit : « Entre au Paradis. » Il dit : « Si seulement mon peuple savait comment mon Seigneur m'a pardonné et m'a mis parmi les honorés ! » (v. 26-27). Même après sa mort, il souhaitait le bien de ceux qui l'avaient tué. Un seul Cri suffit à les anéantir."],
["33-44","Les signes de l'univers","La terre morte qu'Allah fait revivre avec les grains et les jardins de palmiers et de vignes. La nuit d'où Allah retire le jour. « Le soleil court vers un lieu de séjour qui lui est assigné… La lune, Nous lui avons fixé des phases jusqu'à ce qu'elle devienne comme la vieille palme. Le soleil ne peut rattraper la lune, ni la nuit devancer le jour : chacun vogue dans une orbite » (v. 38-40). Les bateaux chargés qui portent leur descendance."],
["45-68","La résurrection et le jugement","Les mécréants demandent quand viendra la promesse. Un seul Cri, puis on soufflera dans la trompe et ils sortiront des tombes : « Malheur à nous ! Qui nous a réveillés de notre lieu de repos ? » (v. 52). Les gens du Paradis sont occupés à leur bonheur, avec leurs épouses à l'ombre. « Paix ! Parole d'un Seigneur très miséricordieux » (v. 58). « Ce jour-là, Nous scellerons leurs bouches ; leurs mains Nous parleront et leurs pieds témoigneront de ce qu'ils faisaient » (v. 65)."],
["69-83","Celui qui a créé la première fois","Le Prophète ﷺ n'est pas un poète. Un homme (Oubayy ibn Khalaf selon des commentateurs) vint avec un os desséché, l'émietta et demanda : « Qui fera revivre ces ossements quand ils sont réduits en poussière ? » « Dis : Celui qui les a créés une première fois les fera revivre » (v. 78-79). Celui qui fait sortir le feu du bois vert peut ressusciter les morts. « Son ordre, quand Il veut une chose, est de lui dire : Sois, et elle est. Gloire à Celui qui détient en Sa main la royauté de toute chose, et c'est vers Lui que vous serez ramenés » (v. 82-83)."]],
les:["Nos traces comptent : le bien que l'on laisse continue d'être écrit.","Le croyant souhaite le bien même à ceux qui lui font du mal.","L'univers suit des lois précises fixées par Allah.","Nos mains et nos pieds témoigneront contre nous.","Celui qui a créé une première fois peut recréer."]};

SD[37]={ctx:"Sourate mecquoise. Elle commence par les anges rangés en rangs pour adorer Allah, réfute la croyance des Arabes qui disaient que les anges sont les filles d'Allah, et raconte plusieurs prophètes, dont le récit le plus clair du sacrifice d'Ibrahim.",
parts:[
["1-10","Les anges","Allah jure par les anges rangés en rangs, par ceux qui repoussent les démons et par ceux qui récitent le rappel : votre Dieu est unique. Le ciel est orné d'étoiles et protégé contre tout démon rebelle qui tente d'écouter."],
["11-74","La résurrection, le Paradis et l'Enfer","Les mécréants se moquent de la résurrection ; ils seront réunis et interrogés. Les gens du Paradis, sur des lits face à face, avec une boisson pure qui n'enivre pas. L'un d'eux se souvient d'un ami qui niait la résurrection ; il regarde et le voit au milieu de l'Enfer : « Par Allah, tu as failli me perdre ! » (v. 56). L'arbre de Zaqqoum, nourriture des gens de l'Enfer, aux fruits comme des têtes de démons (v. 62-65)."],
["75-82","Nouh","Nouh appela son Seigneur, qui le sauva avec sa famille. « Paix sur Nouh dans l'univers » (v. 79)."],
["83-113","Ibrahim et le sacrifice","Ibrahim vient à son Seigneur avec un cœur sain. Il brise les idoles, est jeté dans un brasier et sauvé. Il dit : « Je pars vers mon Seigneur, Il me guidera. Seigneur, donne-moi un enfant d'entre les vertueux » (v. 99-100). Allah lui annonce un garçon longanime. Quand l'enfant atteignit l'âge de l'accompagner, Ibrahim lui dit : « Ô mon fils, je me vois en rêve en train de t'immoler ; vois ce que tu en penses. » « Ô mon père, fais ce qui t'est ordonné ; tu me trouveras, si Allah le veut, parmi les patients » (v. 102). Quand ils se furent soumis et qu'il l'eut couché sur le front, Allah l'appela et racheta l'enfant par une immolation grandiose. Ensuite seulement vient l'annonce d'Ishaq (v. 112), d'où la conclusion de la majorité des savants que l'enfant sacrifié était Isma'il."],
["114-148","Moussa, Haroun, Ilyas, Lout et Younous","Moussa et Haroun sauvés de la grande angoisse. Ilyas reproche à son peuple d'invoquer Ba'l et de délaisser le meilleur des créateurs. Lout sauvé avec sa famille. Younous qui s'enfuit vers le bateau chargé, tiré au sort et avalé par le poisson : « S'il n'avait pas été parmi ceux qui glorifient Allah, il serait resté dans son ventre jusqu'au jour de la résurrection » (v. 143-144). Rejeté sur le rivage, il fut envoyé à plus de cent mille personnes, qui crurent."],
["149-182","Allah n'a pas de filles","Les polythéistes attribuaient des filles à Allah et des fils à eux-mêmes ; ils croyaient aussi en une parenté entre Allah et les djinns. Gloire à Allah, au-dessus de ce qu'ils décrivent. Les anges disent : « Nous sommes ceux qui se rangent, et ceux qui glorifient » (v. 165-166). « Gloire à ton Seigneur, le Seigneur de la puissance, au-dessus de ce qu'ils décrivent ; paix sur les messagers, et louange à Allah, Seigneur des mondes » (v. 180-182). Le Prophète ﷺ terminait souvent ses assemblées par ces paroles."]],
les:["Venir à Allah avec un cœur sain.","L'obéissance d'Ibrahim et d'Isma'il, modèle de soumission totale.","La glorification d'Allah sauve de la détresse, comme pour Younous.","Choisir ses amis avec soin : un ami peut nous perdre ou nous sauver."]};

SD[38]={ctx:"Sourate mecquoise. Selon Tirmidhi (3232), elle fut révélée quand les chefs de Qouraych vinrent se plaindre auprès d'Abou Talib, malade, de ce que le Prophète ﷺ critiquait leurs idoles. Le Prophète ﷺ leur demanda de prononcer une seule parole qui leur soumettrait les Arabes : « La ilaha illa Allah ». Ils répondirent : « Fait-il des divinités une seule divinité ? Voilà une chose bien étrange ! » (v. 5).",
parts:[
["1-16","L'orgueil des chefs de Qouraych","Sad. Par le Coran plein de rappel ! Les mécréants sont dans l'orgueil et la dispute. Ils s'étonnent qu'un avertisseur vienne d'entre eux et disent : « C'est un magicien menteur. » Leurs chefs disent : « Allez-vous-en et restez attachés à vos divinités. »"],
["17-26","Daoud et les deux plaideurs","« Endure ce qu'ils disent et rappelle-toi Notre serviteur Daoud, plein de force et de repentir » (v. 17). Les montagnes et les oiseaux glorifiaient avec lui. Deux plaideurs escaladent son oratoire ; l'un a quatre-vingt-dix-neuf brebis et veut prendre la seule brebis de l'autre. Daoud comprend qu'il a été éprouvé, demande pardon et tombe prosterné (prosternation de récitation, v. 24). « Ô Daoud, Nous avons fait de toi un lieutenant sur la terre ; juge entre les gens en toute justice et ne suis pas la passion » (v. 26)."],
["27-29","Le Coran, livre à méditer","Allah n'a pas créé le ciel et la terre en vain. « Un Livre béni que Nous avons fait descendre vers toi, pour qu'ils méditent sur ses versets et que les gens doués d'intelligence réfléchissent » (v. 29)."],
["30-40","Soulayman","Soulayman, excellent serviteur, plein de repentir. L'épisode des chevaux qui l'occupèrent jusqu'au coucher du soleil (interprétations différentes). Allah l'éprouva, puis il se repentit et demanda un royaume que nul n'aurait après lui. Le vent et les démons furent mis à son service."],
["41-44","Ayyoub","Ayyoub invoqua : « Satan m'a infligé détresse et souffrance. » Allah lui dit de frapper le sol du pied : une eau fraîche pour se laver et boire. Il lui rendit sa famille, et autant avec elle. « Prends dans ta main un faisceau de brindilles, frappe avec, et ne viole pas ton serment » (v. 44). « Nous l'avons trouvé patient. Quel excellent serviteur ! »"],
["45-64","Les élus et la dispute des gens du Feu","Ibrahim, Ishaq, Ya'qub, Isma'il, al-Yasa' et Dhoul-Kifl, parmi les meilleurs. Les jardins d'Éden aux portes ouvertes. Les gens de l'Enfer se disputent entre eux et se rejettent la faute."],
["65-88","Adam et Iblis","Le récit de la création d'Adam, que Allah a créé de Ses deux mains, et du refus d'Iblis. Iblis jure : « Par Ta puissance, je les égarerai tous, sauf Tes serviteurs sincères » (v. 82-83). Le Prophète ﷺ ne demande aucun salaire et n'est pas de ceux qui inventent (v. 86)."]],
les:["Méditer le Coran est le but de sa révélation.","Juger avec justice et ne pas suivre sa passion.","Se repentir vite, comme Daoud et Soulayman.","La patience d'Ayyoub : « Quel excellent serviteur ! »","Satan n'a pas de pouvoir sur les serviteurs sincères."]};

SD[39]={ctx:"Sourate mecquoise. Le Prophète ﷺ ne dormait pas avant d'avoir récité al-Isra' et az-Zoumar (Tirmidhi 3405). Elle insiste sur la sincérité dans l'adoration et contient l'un des versets les plus porteurs d'espoir du Coran (v. 53).",
parts:[
["1-9","La sincérité","« Adore Allah en Lui vouant un culte sincère. C'est à Allah qu'appartient la religion pure » (v. 2-3). Les polythéistes disaient : « Nous ne les adorons que pour qu'ils nous rapprochent d'Allah. » Allah vous a créés d'une seule âme. « Celui qui passe la nuit en prière, prosterné et debout, craignant l'au-delà et espérant la miséricorde de son Seigneur… Dis : ceux qui savent et ceux qui ne savent pas sont-ils égaux ? » (v. 9)."],
["10-22","La patience et la meilleure parole","« Les patients recevront leur pleine récompense sans compter » (v. 10). « Annonce la bonne nouvelle à Mes serviteurs qui écoutent la parole et suivent ce qu'elle a de meilleur » (v. 17-18). Celui dont Allah ouvre la poitrine à l'islam est sur une lumière ; malheur à ceux dont les cœurs sont durs (v. 22)."],
["23-35","La meilleure des paroles","« Allah a fait descendre la plus belle des paroles : un Livre dont les versets se ressemblent et se répètent. La peau de ceux qui craignent leur Seigneur en frissonne, puis leur peau et leur cœur s'apaisent au rappel d'Allah » (v. 23). L'exemple d'un esclave qui a plusieurs maîtres en désaccord, et d'un esclave qui appartient à un seul : sont-ils égaux ? (v. 29). « Tu mourras, et ils mourront » (v. 30)."],
["36-52","Allah ne suffit-Il pas ?","« Allah ne suffit-Il pas à Son serviteur ? » (v. 36). Allah reprend les âmes au moment de la mort, et pendant le sommeil celles qui ne sont pas mortes : Il retient celles dont Il a décrété la mort et renvoie les autres jusqu'à un terme fixé (v. 42). Quand on mentionne Allah seul, les cœurs des mécréants se crispent ; quand on mentionne d'autres, ils se réjouissent."],
["53-63","Ne désespérez pas","« Dis : Ô Mes serviteurs qui avez commis des excès contre vous-mêmes, ne désespérez pas de la miséricorde d'Allah. Allah pardonne tous les péchés. Il est le Pardonneur, le Très Miséricordieux » (v. 53). Selon Bukhari (4810), ce verset fut révélé au sujet de polythéistes qui avaient beaucoup tué et commis la fornication, et qui demandaient si l'islam pouvait effacer cela. Il faut revenir à Allah avant que vienne le châtiment, pour ne pas dire : « Hélas, quelle négligence envers Allah ! » (v. 56)."],
["64-75","La trompe et les groupes","« Ils n'ont pas estimé Allah à Sa juste valeur ; la terre entière sera dans Sa poignée le Jour de la résurrection, et les cieux pliés dans Sa main droite » (v. 67). On soufflera dans la trompe, et tous mourront sauf qui Allah voudra ; puis une seconde fois, et ils se lèveront. Les mécréants seront conduits en groupes vers l'Enfer, et les pieux en groupes vers le Paradis, dont les portes seront ouvertes : « Paix sur vous, vous avez été bons ; entrez-y pour l'éternité » (v. 73)."]],
les:["La sincérité est la base de toute adoration.","Écouter les paroles et suivre la meilleure.","Aucun péché n'est trop grand pour le pardon d'Allah, si l'on se repent.","Le sommeil est une petite mort : se coucher en se souvenant d'Allah.","La patience est récompensée sans compter."]};

SD[40]={ctx:"Sourate mecquoise, la première des sept sourates qui commencent par Ha-Mim (al-Hawamim, sourates 40 à 46). Elle s'appelle aussi « al-Mou'min » (le croyant), à cause du croyant de la famille de Pharaon qui cachait sa foi et défendit Moussa.",
parts:[
["1-9","Le Pardonneur et les anges du Trône","La révélation vient d'Allah, le Tout-Puissant, l'Omniscient, qui pardonne le péché, accepte le repentir, est dur en punition et plein de largesse (v. 3). Les anges qui portent le Trône et ceux qui l'entourent glorifient leur Seigneur et demandent pardon pour les croyants : « Notre Seigneur, Tu embrasses toute chose de Ta miséricorde et de Ta science ; pardonne à ceux qui se repentent et suivent Ton chemin… fais-les entrer dans les jardins d'Éden, avec les vertueux parmi leurs pères, leurs épouses et leurs descendants » (v. 7-8)."],
["10-22","Le Jour de la rencontre","Les mécréants reconnaîtront leurs péchés et demanderont une issue. « À qui appartient la royauté aujourd'hui ? À Allah, l'Unique, le Dominateur » (v. 16). Il connaît la trahison des yeux et ce que cachent les poitrines (v. 19)."],
["23-46","Le croyant de la famille de Pharaon","Pharaon veut tuer Moussa : « Laissez-moi tuer Moussa, et qu'il invoque son Seigneur ! » Un croyant de sa famille, qui cachait sa foi, prend la parole : « Allez-vous tuer un homme parce qu'il dit : Mon Seigneur est Allah, alors qu'il vous a apporté des preuves ? S'il est menteur, son mensonge retombera sur lui ; s'il est véridique, une partie de ce dont il vous menace vous atteindra » (v. 28). Il leur rappelle le sort des peuples anciens et celui de Yousouf. Pharaon demande à Haman de lui construire une tour pour monter jusqu'au dieu de Moussa. Le croyant conclut : « Ô mon peuple, suivez-moi, je vous guiderai sur le chemin de la droiture. Cette vie n'est qu'une jouissance passagère… Je confie mon affaire à Allah » (v. 38-44). Allah le protégea, et la famille de Pharaon fut exposée au Feu matin et soir (v. 46), une preuve du châtiment de la tombe selon les savants."],
["47-60","Invoquez-Moi","Les suiveurs et les chefs se disputent dans le Feu. Allah secourt Ses messagers et les croyants dans ce monde et au Jour où se lèveront les témoins (v. 51). « Votre Seigneur a dit : Invoquez-Moi, Je vous répondrai » (v. 60). Le Prophète ﷺ a dit : « L'invocation est l'adoration », puis récita ce verset (Tirmidhi 2969)."],
["61-85","Les signes et la fin","Allah a fait la nuit pour le repos et le jour pour voir clair. Il vous a créés de terre, puis d'une goutte, puis d'une adhérence, puis vous fait sortir enfants, puis atteindre votre maturité, puis devenir vieillards. Les bestiaux, les bateaux. Quand les peuples anciens virent le châtiment, ils dirent : « Nous croyons en Allah seul », mais leur foi ne leur servit à rien à ce moment-là (v. 84-85)."]],
les:["Les anges du Trône demandent pardon pour les croyants.","Défendre la vérité avec sagesse, comme le croyant de la famille de Pharaon.","L'invocation est l'adoration elle-même.","La foi au moment de voir le châtiment n'est plus acceptée."]};

SD[41]={ctx:"Sourate mecquoise, deuxième des Hawamim. Selon les historiens de la Sira, 'Outba ibn Rabi'a, un notable de Qouraych, vint proposer au Prophète ﷺ argent, pouvoir ou guérison en échange de l'abandon de sa prédication. Le Prophète ﷺ lui récita le début de cette sourate jusqu'au verset 13 ; 'Outba retourna troublé vers les siens et leur conseilla de le laisser tranquille. Elle contient une prosternation de récitation (v. 37-38).",
parts:[
["1-8","Un Livre détaillé","Un Livre dont les versets sont détaillés, un Coran arabe pour des gens qui savent. Mais la plupart se détournent : « Nos cœurs sont enveloppés, il y a une surdité dans nos oreilles, et entre nous et toi un voile » (v. 5). « Je ne suis qu'un homme comme vous ; il m'est révélé que votre Dieu est un Dieu unique » (v. 6)."],
["9-12","La création en six jours","Allah a créé la terre en deux jours, y a placé des montagnes, l'a bénie et y a réparti les subsistances en quatre jours. Puis Il s'est tourné vers le ciel, qui était fumée, et lui a dit ainsi qu'à la terre : « Venez, de gré ou de force. » Ils dirent : « Nous venons obéissants » (v. 11)."],
["13-18","'Ad et Thamoud","Si vous vous détournez, Je vous avertis d'une foudre semblable à celle de 'Ad et Thamoud. 'Ad s'enorgueillit : « Qui est plus fort que nous ? » Thamoud préféra l'aveuglement à la guidée."],
["19-25","Les membres témoignent","Le jour où les ennemis d'Allah seront rassemblés vers le Feu, leur ouïe, leurs yeux et leurs peaux témoigneront contre eux. Ils diront à leurs peaux : « Pourquoi avez-vous témoigné contre nous ? » Elles répondront : « C'est Allah qui nous a fait parler, Lui qui fait parler toute chose » (v. 21). Vous ne pouviez vous cacher de vos propres membres ; vous pensiez qu'Allah ne savait pas beaucoup de ce que vous faisiez."],
["26-36","Le bruit contre le Coran et la meilleure parole","Les mécréants disaient : « N'écoutez pas ce Coran et faites du bruit pendant sa récitation, peut-être aurez-vous le dessus » (v. 26). « Ceux qui disent : Notre Seigneur est Allah, puis se tiennent droits, les anges descendent sur eux : N'ayez pas peur et ne soyez pas tristes, réjouissez-vous du Paradis promis » (v. 30). « Qui profère plus belle parole que celui qui appelle à Allah, fait le bien et dit : Je suis parmi les musulmans ? » (v. 33). « Repousse le mal par ce qui est meilleur, et voilà que celui qui avait de l'inimitié envers toi devient comme un ami chaleureux. Mais cela n'est donné qu'aux patients » (v. 34-35)."],
["37-54","Les signes dans les horizons","La nuit, le jour, le soleil et la lune sont des signes : ne vous prosternez ni devant le soleil ni devant la lune, mais devant Allah qui les a créés (v. 37). Le Coran est un livre puissant : le faux ne l'atteint ni par devant ni par derrière (v. 41-42). « Nous leur montrerons Nos signes dans les horizons et en eux-mêmes, jusqu'à ce qu'il leur devienne évident que c'est la vérité » (v. 53)."]],
les:["Nos propres membres témoigneront de nos actes.","La droiture après la foi attire la protection des anges.","Appeler à Allah par la parole et l'exemple est la plus belle des paroles.","Répondre au mal par le bien peut transformer un ennemi en ami.","Les signes d'Allah sont dans l'univers et en nous-mêmes."]};

SD[42]={ctx:"Sourate mecquoise, troisième des Hawamim. Elle porte le nom de la consultation (ach-choura), citée parmi les qualités des croyants, et insiste sur l'unité du message de tous les prophètes.",
parts:[
["1-12","Rien n'est semblable à Lui","Ha-Mim, 'Ayn-Sin-Qaf. Les cieux se fendent presque de Sa majesté, et les anges demandent pardon pour ceux qui sont sur terre. « Rien n'est semblable à Lui, et Il est Celui qui entend tout et voit tout » (v. 11). Ce verset est la base de la croyance des sunnites : on affirme les noms et attributs d'Allah sans les comparer à ceux des créatures."],
["13-16","Une seule religion","« Il vous a prescrit, en religion, ce qu'Il avait recommandé à Nouh, ce que Nous t'avons révélé, et ce que Nous avions recommandé à Ibrahim, Moussa et 'Issa : établissez la religion et n'en faites pas un sujet de division » (v. 13). Les cinq grands messagers sont cités ensemble. Les gens se sont divisés par jalousie après que la science leur était venue."],
["17-35","La subsistance et les épreuves","Allah est bienveillant envers Ses serviteurs. Celui qui veut le champ de l'au-delà, Allah le lui augmente ; celui qui veut le champ de ce monde, Il lui en donne, mais il n'aura aucune part dans l'au-delà (v. 20). « Si Allah étendait la subsistance à Ses serviteurs, ils commettraient des excès sur la terre ; mais Il la fait descendre avec mesure » (v. 27). « Les malheurs qui vous touchent viennent de ce que vos mains ont acquis, et Il pardonne beaucoup » (v. 30)."],
["36-43","Les qualités des croyants","Ce qui est auprès d'Allah est meilleur pour ceux qui croient et placent leur confiance en leur Seigneur, qui évitent les grands péchés et les turpitudes, qui pardonnent quand ils sont en colère, qui répondent à leur Seigneur, accomplissent la prière, « dont l'affaire se règle par consultation entre eux » (v. 38), et qui dépensent. Quand ils subissent une injustice, ils se défendent. « La rétribution d'un mal est un mal équivalent ; mais celui qui pardonne et réconcilie, sa récompense incombe à Allah » (v. 40). « Celui qui endure et pardonne, voilà une marque de grande résolution » (v. 43)."],
["44-53","La révélation","Il n'est pas donné à un homme qu'Allah lui parle, sauf par inspiration, ou derrière un voile, ou en envoyant un messager (un ange) (v. 51). Le Coran est un esprit (une révélation qui donne la vie) : « Tu ne savais pas ce qu'est le Livre ni la foi, mais Nous en avons fait une lumière par laquelle Nous guidons qui Nous voulons » (v. 52)."]],
les:["On affirme les attributs d'Allah sans les comparer aux créatures.","Tous les prophètes ont apporté la même religion.","La consultation fait partie des qualités des croyants.","Pardonner dans la colère est une grande qualité.","Beaucoup de malheurs sont des conséquences de nos actes, et Allah pardonne beaucoup."]};

SD[43]={ctx:"Sourate mecquoise, quatrième des Hawamim. Elle critique deux attitudes des polythéistes : suivre aveuglément les ancêtres, et mesurer la valeur des gens à leur richesse (« l'ornement » de ce monde).",
parts:[
["1-14","Les bienfaits et l'invocation du voyage","Le Coran est dans la Mère du Livre auprès d'Allah. Si on leur demande qui a créé les cieux et la terre, ils diront : Allah. Il a fait de la terre un berceau, créé les couples, et donné les bateaux et les bêtes comme montures, pour que vous disiez : « Gloire à Celui qui nous a soumis ceci, alors que nous n'aurions pu le maîtriser ; c'est vers notre Seigneur que nous retournerons » (v. 13-14). C'est l'invocation que l'on dit en montant dans un véhicule."],
["15-25","Les filles et les ancêtres","Ils attribuent à Allah des filles (les anges), alors que l'annonce de la naissance d'une fille les attriste. Leur seul argument : « Nous avons trouvé nos ancêtres sur une religion, et nous suivons leurs traces » (v. 22). Chaque fois qu'un avertisseur est venu, les riches ont répondu la même chose."],
["26-35","Ibrahim et l'ornement","Ibrahim désavoua ce qu'adoraient son père et son peuple, et fit de l'unicité « une parole qui demeure dans sa descendance » (v. 28). Les Mecquois disaient : « Pourquoi ce Coran n'a-t-il pas été révélé à un grand homme de l'une des deux cités ? » Allah répond que c'est Lui qui répartit la subsistance. Si ce n'était pour que les gens ne deviennent pas tous mécréants, Allah aurait donné aux mécréants des maisons aux toits d'argent et des escaliers d'or : tout cela n'est que jouissance de ce monde (v. 33-35)."],
["36-45","Le compagnon démon","« Celui qui se détourne du rappel du Tout Miséricordieux, Nous lui attachons un démon qui devient son compagnon inséparable » (v. 36). Au Jour du jugement, il dira : « Si seulement il y avait entre toi et moi la distance des deux levants ! » Le Coran est un rappel pour toi et pour ton peuple, et vous en serez interrogés (v. 44)."],
["46-65","Moussa, Pharaon et 'Issa","Pharaon se vantait : « Le royaume d'Égypte ne m'appartient-il pas, avec ces rivières qui coulent sous moi ? Ne suis-je pas meilleur que cet homme méprisable (Moussa) ? » Il rendit son peuple léger d'esprit et ils lui obéirent (v. 51-54). Puis 'Issa : « Il n'est qu'un serviteur que Nous avons comblé de bienfaits et donné en exemple aux Enfants d'Israël » (v. 59), et son retour est un signe de l'Heure (v. 61)."],
["66-89","Le Paradis et la fin","« Les amis, ce jour-là, seront ennemis les uns des autres, sauf les pieux » (v. 67). Les croyants entrent au Paradis avec leurs épouses : des plats et des coupes d'or, et ce que les âmes désirent et ce qui réjouit les yeux. Les gens du Feu appellent Malik, le gardien : « Que ton Seigneur nous achève ! » Il répond : « Vous y resterez » (v. 77)."]],
les:["Dire l'invocation du voyage en montant dans un véhicule.","Suivre les ancêtres n'est pas un argument face à la vérité.","La richesse n'est pas une mesure de la valeur auprès d'Allah.","Se détourner du rappel d'Allah ouvre la porte à Satan.","Les amitiés fondées sur la piété sont les seules qui durent."]};

SD[44]={ctx:"Sourate mecquoise, cinquième des Hawamim. Elle fut révélée dans une période où le Prophète ﷺ invoqua contre Qouraych, qui persistait dans son refus, des années de famine comme celles de Yousouf ; selon Ibn Mas'oud, la faim fut si forte qu'ils voyaient entre le ciel et eux comme une fumée (Bukhari 4821).",
parts:[
["1-8","La nuit bénie","Par le Livre explicite ! « Nous l'avons fait descendre en une nuit bénie… durant laquelle est décidée toute affaire sage » (v. 3-4). Selon la majorité, c'est Laylat al-Qadr, au mois de Ramadan."],
["9-16","La fumée","« Attends le jour où le ciel apportera une fumée visible, qui enveloppera les gens : voilà un châtiment douloureux » (v. 10-11). Ibn Mas'oud l'explique par la famine de Qouraych ; d'autres savants y voient un des grands signes de la fin des temps. Les deux avis peuvent se compléter. Les Mecquois promirent de croire si le châtiment était levé, puis revinrent à leur mécréance."],
["17-33","Moussa et Pharaon","Moussa vint à Pharaon : « Laisse partir avec moi les serviteurs d'Allah. » Ils voulurent le lapider. Allah lui ordonna de partir de nuit et de laisser la mer calme. Pharaon et son armée furent noyés. « Que de jardins et de sources ils ont laissés, de cultures et de demeures magnifiques ! Ni le ciel ni la terre ne les ont pleurés » (v. 25-29). Les savants expliquent que le ciel et la terre pleurent le croyant : la terre où il priait et le ciel où montaient ses œuvres."],
["34-42","Le jour du tri","Les Mecquois disaient : « Il n'y a que notre première mort, nous ne serons pas ressuscités. » Allah n'a pas créé les cieux et la terre par jeu. Le jour du tri est leur rendez-vous à tous, où aucun proche ne pourra rien pour un autre."],
["43-59","L'arbre de Zaqqoum et les jardins","L'arbre de Zaqqoum est la nourriture du pécheur ; il bouillonne dans les ventres comme le métal fondu. Les pieux seront dans un séjour sûr, parmi les jardins et les sources, vêtus de soie, face à face. « Nous avons facilité le Coran dans ta langue pour qu'ils se rappellent » (v. 58)."]],
les:["Le Coran a été révélé pendant une nuit bénie du Ramadan.","Les promesses faites dans la détresse doivent être tenues.","Le ciel et la terre pleurent le croyant, pas le tyran.","Le Coran a été rendu facile pour qu'on s'en rappelle."]};

SD[45]={ctx:"Sourate mecquoise, sixième des Hawamim. Elle tire son nom de la scène où chaque communauté sera agenouillée (jathiya) au Jour du jugement. Elle critique particulièrement ceux qui prennent leur passion pour divinité et ceux qui attribuent tout au temps qui passe.",
parts:[
["1-15","Les signes pour ceux qui ont la certitude","Dans les cieux, la terre, la création de l'homme et des animaux, l'alternance de la nuit et du jour, la pluie et les vents, il y a des signes pour des gens qui ont la certitude et qui raisonnent. Malheur à tout menteur pécheur qui entend les versets d'Allah puis persiste avec orgueil. Allah a soumis la mer et tout ce qui est dans les cieux et sur la terre. Que les croyants pardonnent à ceux qui n'espèrent pas les jours d'Allah (v. 14)."],
["16-23","La voie et la passion","Allah donna aux Enfants d'Israël le Livre, la sagesse et la prophétie, mais ils divergèrent par jalousie. « Puis Nous t'avons mis sur une voie (charia) concernant l'ordre ; suis-la, et ne suis pas les passions de ceux qui ne savent pas » (v. 18). « As-tu vu celui qui prend sa passion pour divinité ? Allah l'égare sciemment, scelle son ouïe et son cœur et met un voile sur sa vue » (v. 23)."],
["24-37","Le temps et l'agenouillement","Ils disent : « Il n'y a que notre vie d'ici-bas : nous mourons et vivons, et seul le temps nous fait périr » (v. 24). Le Prophète ﷺ rapporte qu'Allah dit : « Le fils d'Adam M'offense : il insulte le temps, alors que Je suis le temps ; c'est Moi qui fais alterner la nuit et le jour » (Bukhari 4826) : on ne doit pas insulter le temps, car c'est Allah qui fait arriver les événements. « Tu verras chaque communauté agenouillée ; chaque communauté sera appelée vers son livre » (v. 28). « Voici Notre livre, il parle de vous avec vérité ; Nous enregistrions tout ce que vous faisiez » (v. 29)."]],
les:["Suivre la voie d'Allah, pas ses passions.","Faire de sa passion une divinité est une forme d'égarement.","Ne pas insulter le temps : c'est Allah qui décide des événements.","Chaque acte est enregistré et sera présenté."]};

// Sourates 46 à 60
SD[46]={ctx:"Sourate mecquoise, dernière des Hawamim. Elle fut révélée après le retour du Prophète ﷺ de Ta'if, où il avait été chassé ; sur le chemin du retour, un groupe de djinns écouta sa récitation et crut (v. 29-32). Elle porte le nom des dunes (al-Ahqaf) où vivait le peuple de 'Ad.",
parts:[
["1-14","Les preuves et la Torah","Allah n'a créé les cieux et la terre qu'avec la vérité et pour un terme fixé. Montrez-moi ce qu'ont créé ceux que vous invoquez en dehors d'Allah ! Qui est plus égaré que celui qui invoque, en dehors d'Allah, ce qui ne lui répondra pas jusqu'au Jour de la résurrection ? Avant le Coran, il y avait le Livre de Moussa, un guide et une miséricorde. « Ceux qui disent : Notre Seigneur est Allah, puis se tiennent droits, n'auront rien à craindre » (v. 13)."],
["15-20","Le droit des parents","« Nous avons recommandé à l'homme la bonté envers ses parents : sa mère l'a porté avec peine et l'a enfanté avec peine ; sa grossesse et son sevrage durent trente mois » (v. 15). Les savants en ont déduit que la durée minimale d'une grossesse est de six mois (30 mois moins 24 mois d'allaitement). À quarante ans, l'homme mûr invoque : « Seigneur, inspire-moi de Te remercier pour le bienfait dont Tu m'as comblé, ainsi que mes parents, de faire le bien que Tu agrées, et rends vertueuse ma descendance. Je me repens à Toi » (v. 15). À l'inverse, le fils ingrat qui dit à ses parents : « Fi de vous ! » (v. 17)."],
["21-28","Houd et 'Ad","Le frère de 'Ad (Houd) avertit son peuple dans les dunes. Ils lui demandèrent de faire venir le châtiment. Ils virent un nuage avancer vers leurs vallées et dirent : « Voici un nuage qui nous apportera la pluie. » « Non, c'est ce que vous cherchiez à hâter : un vent porteur d'un châtiment douloureux, qui détruit tout par l'ordre de son Seigneur » (v. 24-25). Au matin, on ne voyait plus que leurs demeures."],
["29-35","Les djinns et la patience","Un groupe de djinns écouta le Coran : « Écoutez attentivement ! » Ils retournèrent vers leur peuple en avertisseurs : « Nous avons entendu un Livre descendu après Moussa, qui guide vers la vérité ; répondez à l'appel d'Allah » (v. 29-31). « Endure comme ont enduré les messagers doués de fermeté » (v. 35). Les savants comptent parmi eux Nouh, Ibrahim, Moussa, 'Issa et Muhammad ﷺ."]],
les:["La mère a un droit immense, à cause de la grossesse et de l'accouchement.","L'invocation des quarante ans : demander la gratitude et une bonne descendance.","Le nuage attendu peut porter le châtiment : ne pas juger aux apparences.","Les djinns aussi ont reçu le message du Coran.","La patience des grands messagers est un modèle."]};

SD[47]={ctx:"Sourate médinoise, révélée après la bataille de Badr selon certains, ou au début de la période médinoise. Elle s'appelle aussi « al-Qital » (le combat). Elle oppose ceux qui croient et suivent la vérité à ceux qui détournent du chemin d'Allah, et démasque les hypocrites.",
parts:[
["1-15","Les deux groupes","Allah rend vaines les œuvres de ceux qui mécroient et détournent du chemin d'Allah, et efface les fautes de ceux qui croient et croient en ce qui a été révélé à Muhammad ﷺ. Des règles pour le combat et les prisonniers (libération gratuite ou contre rançon) (v. 4). « Ô vous qui croyez, si vous secourez (la religion d') Allah, Il vous secourra et affermira vos pas » (v. 7). Le Paradis contient quatre sortes de rivières : d'eau jamais corrompue, de lait au goût inaltérable, de vin délicieux et de miel purifié (v. 15)."],
["16-31","Les hypocrites","Les hypocrites écoutent le Prophète ﷺ puis demandent aux savants : « Qu'a-t-il dit tout à l'heure ? » Quand une sourate ordonne le combat, ils regardent comme celui qui s'évanouit devant la mort. « Ne méditent-ils pas le Coran ? Ou y a-t-il des cadenas sur leurs cœurs ? » (v. 24). Allah fera apparaître leurs rancunes, et tu les reconnaîtras au ton de leurs paroles (v. 30). « Nous vous éprouverons pour distinguer ceux qui luttent et ceux qui patientent » (v. 31)."],
["32-38","N'annulez pas vos œuvres","« Obéissez à Allah et au Messager, et n'annulez pas vos œuvres » (v. 33). Ne faiblissez pas en appelant à la paix quand vous êtes les plus forts. La vie de ce monde n'est que jeu. « Vous êtes appelés à dépenser dans le chemin d'Allah ; certains sont avares, et celui qui est avare ne l'est qu'envers lui-même. Allah est le Riche et vous êtes les pauvres. Si vous vous détournez, Il vous remplacera par un autre peuple, qui ne sera pas comme vous » (v. 38)."]],
les:["Aider la cause d'Allah attire Son aide.","Méditer le Coran ouvre les cœurs ; ne pas le méditer les ferme.","Les péchés et l'ostentation peuvent annuler les bonnes œuvres.","Allah n'a besoin de personne : c'est nous qui avons besoin de Lui."]};

SD[48]={ctx:"Sourate médinoise, révélée en l'an 6, sur le chemin du retour de Houdaybiyya. Le Prophète ﷺ et environ 1 400 compagnons étaient partis faire la 'Omra, mais les Qouraychites les empêchèrent d'entrer à La Mecque. Une trêve de dix ans fut signée, avec des conditions qui parurent humiliantes aux compagnons, et ils durent rentrer sans faire la 'Omra. 'Umar était très troublé. La sourate fut révélée et le Prophète ﷺ dit : « Une sourate m'a été révélée cette nuit, qui m'est plus chère que tout ce sur quoi le soleil se lève » (Bukhari 4177).",
parts:[
["1-10","Une victoire éclatante","« Nous t'avons accordé une victoire éclatante, afin qu'Allah te pardonne tes péchés passés et futurs » (v. 1-2). La trêve permit aux gens de se rencontrer librement et de découvrir l'islam : en deux ans, plus de gens se convertirent qu'en dix-neuf ans auparavant, et la conquête de La Mecque suivit. Allah fit descendre la sérénité (sakina) dans les cœurs des croyants. « Ceux qui te prêtent serment ne font que prêter serment à Allah ; la main d'Allah est au-dessus de leurs mains » (v. 10)."],
["11-17","Les Bédouins restés en arrière","Les Bédouins qui avaient refusé de partir s'excusent : « Nos biens et nos familles nous ont occupés. » Ils disent de leurs langues ce qui n'est pas dans leurs cœurs ; ils pensaient que le Prophète ﷺ et les croyants ne reviendraient jamais. Les excuses légitimes sont citées : l'aveugle, le boiteux et le malade (v. 17)."],
["18-26","Le serment sous l'arbre","« Allah a été satisfait des croyants quand ils t'ont prêté serment sous l'arbre ; Il savait ce qu'il y avait dans leurs cœurs et a fait descendre sur eux la sérénité » (v. 18). C'est la Bay'at ar-Ridwan, prêtée quand une rumeur annonça la mort de 'Uthman, envoyé négocier à La Mecque. Le Prophète ﷺ a dit qu'aucun de ceux qui prêtèrent ce serment n'entrerait en Enfer (Muslim 2496). Allah retint les mains des deux camps pour éviter un combat où des croyants cachés à La Mecque auraient été tués sans le savoir (v. 25)."],
["27-29","Le rêve vrai et le portrait des compagnons","Le Prophète ﷺ avait vu en rêve qu'il entrait à La Mecque en sécurité, tête rasée : le rêve se réalisa l'année suivante (v. 27). « Il a envoyé Son Messager avec la guidée et la religion de vérité, pour la faire prévaloir sur toute autre religion » (v. 28). Le dernier verset décrit les compagnons : « Muhammad est le Messager d'Allah. Ceux qui sont avec lui sont durs envers les mécréants et miséricordieux entre eux. Tu les vois inclinés, prosternés, recherchant une grâce d'Allah et Sa satisfaction. Leur signe est sur leurs visages, de la trace de la prosternation. » Ils sont comparés à une semence qui sort sa pousse, se fortifie, s'épaissit et se dresse sur sa tige, à l'émerveillement des semeurs (v. 29)."]],
les:["Ce qui semble une défaite peut être une grande victoire.","La paix permet souvent mieux la diffusion de la vérité que la guerre.","Allah fait descendre la sérénité dans les cœurs au moment des épreuves.","Les compagnons sont un modèle : fermes, miséricordieux entre eux et assidus à la prière.","Faire confiance à la sagesse d'Allah même quand on ne la comprend pas."]};

SD[49]={ctx:"Sourate médinoise, révélée vers l'an 9, l'année des délégations, quand de nombreuses tribus venaient rencontrer le Prophète ﷺ. Elle est appelée « la sourate des bonnes manières ». Le verset 2 fut révélé quand Abou Bakr et 'Umar élevèrent la voix en se disputant devant le Prophète ﷺ (Bukhari 4845) ; le verset 4, au sujet d'une délégation de Banou Tamim qui appela le Prophète ﷺ à grands cris derrière ses appartements.",
parts:[
["1-5","Le respect du Prophète ﷺ","« Ô vous qui croyez, ne devancez pas Allah et Son Messager » (v. 1) : ne pas décider avant de savoir ce qu'ils ont dit. N'élevez pas vos voix au-dessus de la voix du Prophète ﷺ, de peur que vos œuvres ne soient annulées sans que vous vous en rendiez compte (v. 2). Après cette révélation, Thabit ibn Qays, qui avait une voix forte, s'enferma chez lui en pleurant, croyant que ses œuvres étaient perdues ; le Prophète ﷺ lui fit dire qu'il était parmi les gens du Paradis (Bukhari 4846). Les savants appliquent aujourd'hui ce respect à ses hadiths."],
["6-10","Vérifier et réconcilier","« Ô vous qui croyez, si un pervers vous apporte une nouvelle, vérifiez-la, de peur de porter atteinte à des gens par ignorance et de regretter ensuite ce que vous avez fait » (v. 6). Une règle essentielle à l'époque des réseaux sociaux. Si deux groupes de croyants se combattent, réconciliez-les avec justice. « Les croyants ne sont que des frères ; établissez donc la paix entre vos frères » (v. 10)."],
["11-12","Six interdictions","« Qu'un groupe ne se moque pas d'un autre groupe : ceux-ci sont peut-être meilleurs qu'eux. Et que des femmes ne se moquent pas d'autres femmes. Ne vous dénigrez pas et ne vous lancez pas de sobriquets » (v. 11). « Évitez de trop conjecturer, car une partie des conjectures est péché. N'espionnez pas, et ne médisez pas les uns des autres. L'un de vous aimerait-il manger la chair de son frère mort ? Vous en auriez horreur ! » (v. 12). La médisance est comparée à manger la chair de son frère mort, car il est absent et ne peut se défendre."],
["13","L'égalité des humains","« Ô gens ! Nous vous avons créés d'un mâle et d'une femelle, et Nous avons fait de vous des peuples et des tribus pour que vous vous connaissiez. Le plus noble d'entre vous auprès d'Allah est le plus pieux. » La diversité des peuples est faite pour se connaître, pas pour se mépriser. La seule supériorité est celle de la piété, que seul Allah connaît."],
["14-18","Islam et iman","Des Bédouins disent : « Nous croyons. » « Dites plutôt : nous nous sommes soumis (islam), car la foi (iman) n'est pas encore entrée dans vos cœurs » (v. 14). Les vrais croyants sont ceux qui croient en Allah et en Son Messager, sans douter ensuite, et luttent par leurs biens et leurs personnes. Ne considérez pas votre islam comme une faveur envers Allah : c'est Allah qui vous fait une faveur en vous guidant vers la foi (v. 17)."]],
les:["Vérifier toute information avant de la croire ou de la partager.","Les croyants sont frères : réconcilier ceux qui se disputent.","Interdiction de la moquerie, des surnoms méprisants, des soupçons, de l'espionnage et de la médisance.","Aucune race ni origine n'est supérieure : seule la piété compte.","La foi est un bienfait d'Allah, pas une faveur que l'on Lui fait."]};

SD[50]={ctx:"Sourate mecquoise. Le Prophète ﷺ la récitait souvent dans le sermon du vendredi : Oumm Hicham bint Haritha dit l'avoir apprise de sa bouche, à force de l'entendre sur le minbar chaque vendredi (Muslim 873). Il la récitait aussi dans la prière de l'Aïd (Muslim 891).",
parts:[
["1-15","L'étonnement des négateurs","Qaf. Par le Coran glorieux ! Ils s'étonnent qu'un avertisseur soit venu d'entre eux : « Quand nous serons morts et poussière, est-ce un retour ? C'est un retour lointain ! » Allah sait ce que la terre ronge d'eux. Le ciel construit sans fissures, la terre étendue, les montagnes, les palmiers élancés, la pluie bénie et la terre morte qui revit : « Ainsi sera la sortie des tombes » (v. 11). « Serions-Nous fatigués par la première création ? » (v. 15)."],
["16-29","Plus proche que la veine jugulaire","« Nous avons créé l'homme et Nous savons ce que son âme lui chuchote, et Nous sommes plus proche de lui que sa veine jugulaire » (v. 16). Deux anges, à droite et à gauche, recueillent ses actes. « Il ne prononce pas une parole sans avoir auprès de lui un observateur prêt à l'inscrire » (v. 18). « L'agonie de la mort apporte la vérité : voilà ce que tu cherchais à fuir » (v. 19). Au Jour du jugement, chaque âme viendra avec un ange qui la conduit et un témoin. « Tu étais inattentif à cela ; Nous avons ôté ton voile, et ta vue aujourd'hui est perçante » (v. 22)."],
["30-35","L'Enfer et le Paradis","Allah demandera à l'Enfer : « Es-tu rempli ? » Il répondra : « Y en a-t-il encore ? » (v. 30). Le Paradis sera rapproché des pieux : « Voici ce qui vous a été promis, pour tout homme repentant et attentif, qui craignait le Tout Miséricordieux sans Le voir et venait avec un cœur repentant » (v. 32-33). « Ils auront là tout ce qu'ils désireront, et auprès de Nous il y a davantage » (v. 35)."],
["36-45","Patience et rappel","Combien de générations plus fortes Allah a fait périr ! « Il y a là un rappel pour celui qui a un cœur, ou qui prête l'oreille en étant présent d'esprit » (v. 37). Allah a créé les cieux et la terre en six jours sans aucune fatigue (v. 38). « Endure ce qu'ils disent et glorifie ton Seigneur avant le lever du soleil et avant son coucher » (v. 39). « Rappelle, par le Coran, celui qui craint Ma menace » (v. 45)."]],
les:["Allah sait même ce que notre âme nous chuchote.","Chaque parole est écrite : faire attention à ce que l'on dit.","Le Paradis est pour le repentant attentif qui craint Allah sans Le voir.","Le Coran est utile à celui qui écoute avec un cœur présent."]};

SD[51]={ctx:"Sourate mecquoise. Elle affirme la réalité de la rétribution par des serments sur les phénomènes de la nature, et contient le verset qui explique le but de la création des djinns et des hommes.",
parts:[
["1-23","Les serments et les pieux","Par les vents qui éparpillent la poussière, les nuages chargés de pluie, les bateaux qui voguent avec aisance, et les anges qui répartissent les ordres : ce qui vous est promis est vrai, et la rétribution arrivera. Les pieux étaient bienfaisants : « Ils dormaient peu la nuit, et aux dernières heures de la nuit ils demandaient pardon, et dans leurs biens il y avait un droit pour le mendiant et le démuni » (v. 17-19). Il y a des signes sur la terre et en vous-mêmes : « Ne voyez-vous donc pas ? » (v. 21). « Votre subsistance est dans le ciel, ainsi que ce qui vous est promis » (v. 22)."],
["24-37","Les hôtes d'Ibrahim","Des hôtes honorés entrent chez Ibrahim : « Paix ! » Il leur apporte vite un veau gras ; ils n'en mangent pas, il prend peur. Ils lui annoncent un garçon savant. Sa femme s'avance en criant et se frappe le visage : « Une vieille femme stérile ! » Ils sont envoyés vers le peuple de Lout, pour faire pleuvoir sur eux des pierres d'argile marquées."],
["38-46","Les peuples anciens","Moussa envoyé à Pharaon, qui se détourna avec son armée. 'Ad, sur qui Allah envoya le vent stérile. Thamoud, à qui l'on dit : « Jouissez un moment », et que la foudre saisit. Le peuple de Nouh avant eux."],
["47-60","Le but de la création","« Le ciel, Nous l'avons construit par Notre puissance, et Nous l'étendons » (v. 47). De toute chose Allah a créé deux éléments d'un couple. « Fuyez donc vers Allah » (v. 50). « Je n'ai créé les djinns et les hommes que pour qu'ils M'adorent. Je ne veux d'eux aucune subsistance et Je ne veux pas qu'ils Me nourrissent. C'est Allah qui est le Pourvoyeur, le Détenteur de la force, l'Inébranlable » (v. 56-58). Le but de la vie est l'adoration, au sens large : toute action faite pour Allah selon Sa voie."]],
les:["Demander pardon dans les dernières heures de la nuit.","Le pauvre a un droit dans nos biens.","Fuir vers Allah, pas loin de Lui.","Le but de notre existence est d'adorer Allah.","Notre subsistance vient d'Allah, pas de nos seuls efforts."]};

SD[52]={ctx:"Sourate mecquoise. Joubayr ibn Mout'im, encore polythéiste, était venu à Médine négocier pour les prisonniers de Badr. Il entendit le Prophète ﷺ réciter at-Tour à la prière du Maghrib : « Quand il arriva aux versets 35-37, mon cœur faillit s'envoler » ; ce fut le début de sa foi (Bukhari 4854).",
parts:[
["1-16","Le châtiment inévitable","Allah jure par le mont Tour (Sinaï), par un Livre écrit sur un parchemin déployé, par la Maison peuplée (al-Bayt al-Ma'mour, au septième ciel), par la voûte élevée et par la mer embrasée : le châtiment de ton Seigneur arrivera, nul ne pourra le repousser. Ce jour-là, le ciel tournoiera et les montagnes se mettront en marche."],
