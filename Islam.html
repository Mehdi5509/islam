const SIRA = [
{y:"≈ 570",h:"Année de l'Éléphant",t:"Naissance à La Mecque",d:"Né un lundi du mois de Rabi' al-Awwal, de 'Abdullah (mort avant sa naissance) et d'Amina, du clan des Banou Hachim (tribu de Qouraych). La même année, Abraha tenta de détruire la Ka'ba avec des éléphants (sourate 105)."},
{y:"570-575",t:"Enfance chez Halima",d:"Confié à une nourrice bédouine, Halima as-Sa'diyya, dans le désert, comme le voulait la coutume. C'est là qu'eut lieu l'ouverture de sa poitrine par Jibril (Muslim 162)."},
{y:"≈ 576",t:"Orphelin de mère",d:"Sa mère Amina meurt à al-Abwa'. Il a six ans. Son grand-père 'Abd al-Mouttalib le prend en charge, puis, à sa mort deux ans plus tard, son oncle Abou Talib."},
{y:"≈ 595",t:"Mariage avec Khadija",d:"À 25 ans, connu comme al-Amin, il commerce pour Khadija bint Khouwaylid, qui lui propose le mariage. Elle a environ 40 ans. Ils vivent 25 ans ensemble et elle sera la première à croire en lui."},
{y:"≈ 605",t:"La pierre noire",d:"Lors de la reconstruction de la Ka'ba, les clans se disputent l'honneur de replacer la pierre noire. Il pose la pierre sur un manteau et fait porter chaque coin par un chef de clan, évitant une guerre."},
{y:"610",t:"Première révélation",d:"À 40 ans, pendant une retraite dans la grotte de Hira', l'ange Jibril lui apporte les premiers versets : « Lis, au nom de ton Seigneur qui a créé » (96:1-5). Khadija le réconforte."},
{y:"610-613",t:"Prédication secrète",d:"Les premiers croyants : Khadija, Abou Bakr, 'Ali (enfant), Zayd ibn Haritha. La communauté grandit discrètement autour de Dar al-Arqam."},
{y:"613",t:"Appel public et persécutions",d:"Il appelle ouvertement depuis le mont as-Safa. Qouraych réagit par les moqueries puis la torture des plus faibles : Bilal, la famille de Yassir (Soumayya est la première martyre)."},
{y:"615",t:"Émigration en Abyssinie",d:"Un groupe de musulmans se réfugie auprès du Négus, roi chrétien juste, qui les protège après avoir entendu la récitation de la sourate Maryam par Ja'far ibn Abi Talib."},
{y:"616-619",t:"Le boycott",d:"Qouraych boycotte les Banou Hachim pendant environ trois ans dans la vallée d'Abou Talib : ni commerce ni mariage. Les musulmans souffrent de la faim."},
{y:"619",t:"L'année de la tristesse",d:"Mort de son oncle protecteur Abou Talib, puis de son épouse bien-aimée Khadija."},
{y:"619",t:"Voyage à Ta'if",d:"Il va appeler la tribu de Thaqif à Ta'if : il est chassé à coups de pierres. Il refuse pourtant que leur ville soit détruite, espérant que leurs descendants adoreront Allah."},
{y:"≈ 620",t:"Al-Isra' wal-Mi'raj",d:"Voyage nocturne de La Mecque à Jérusalem (al-Aqsa), où il dirige les prophètes en prière, puis ascension à travers les cieux. Les cinq prières quotidiennes sont prescrites (17:1)."},
{y:"621-622",t:"Serments d'al-'Aqaba",d:"Des habitants de Yathrib (Médine) embrassent l'islam et promettent de protéger le Prophète ﷺ. Mous'ab ibn 'Oumayr part leur enseigner le Coran."},
{y:"622",h:"An 1 de l'Hégire",t:"L'Hégire vers Médine",d:"Échappant à un complot de meurtre, il quitte La Mecque avec Abou Bakr, se cache trois jours dans la grotte de Thawr (9:40), puis arrive à Médine. Il construit la mosquée, fraternise les Mouhajiroun et les Ansar, et rédige la Charte de Médine. Le calendrier islamique commence."},
{y:"624",h:"An 2",t:"Bataille de Badr",d:"313 musulmans environ face à près de 1000 Mecquois : victoire décisive le 17 Ramadan. La même année, la qibla passe de Jérusalem à La Mecque et le jeûne du Ramadan est prescrit."},
{y:"625",h:"An 3",t:"Bataille d'Ouhoud",d:"Les archers quittent leur poste en croyant la victoire acquise ; les musulmans subissent de lourdes pertes, dont Hamza, l'oncle du Prophète ﷺ, qui est blessé. Leçon sur l'obéissance (3:152)."},
{y:"627",h:"An 5",t:"Bataille du Fossé",d:"Une coalition de 10 000 hommes assiège Médine. Sur conseil de Salman al-Farisi, les musulmans creusent un fossé. Le vent et la discorde dispersent les assaillants (33:9-27)."},
{y:"628",h:"An 6",t:"Traité de Houdaybiyya",d:"Empêché de faire la 'Omra, le Prophète ﷺ signe une trêve de dix ans aux conditions apparemment défavorables. Le Coran l'appelle « une victoire éclatante » (48:1) : la paix permet à l'islam de se répandre largement."},
{y:"630",h:"An 8",t:"Conquête de La Mecque",d:"Après la rupture du traité par les alliés de Qouraych, il entre à La Mecque avec 10 000 hommes, presque sans combat. Il brise les idoles de la Ka'ba et pardonne à ses anciens persécuteurs : « Allez, vous êtes libres. »"},
{y:"632",h:"An 10",t:"Pèlerinage d'adieu",d:"Seul pèlerinage du Prophète ﷺ. Dans son sermon à 'Arafat, il proclame la sacralité de la vie, des biens et de l'honneur, l'égalité des êtres humains et les droits des femmes. Le verset 5:3 est révélé : « Aujourd'hui, J'ai parachevé pour vous votre religion. »"},
{y:"632",h:"12 Rabi' al-Awwal, an 11",t:"Décès à Médine",d:"Il meurt à 63 ans dans la chambre de 'Aïcha, après une maladie. Abou Bakr annonce aux gens : « Celui qui adorait Muhammad, Muhammad est mort ; celui qui adore Allah, Allah est Vivant et ne meurt pas », puis récite le verset 3:144."}
];

["8. Le salut final","Tourner la tête à droite puis à gauche : « As-salamou 'alaykoum wa rahmatou Allah »."]]},

["La manière complète (Sunna)","Se laver les mains, laver les parties intimes, faire les ablutions, verser l'eau trois fois sur la tête en faisant pénétrer jusqu'à la racine des cheveux, puis laver tout le corps en commençant par la droite."]]},

virtues:[
["La lumière d'un vendredi à l'autre","« Celui qui lit la sourate al-Kahf le jour du vendredi, une lumière brillera pour lui entre les deux vendredis. »","Al-Hakim 2/368, al-Bayhaqi ; jugé authentique par al-Albani (Sahih al-Jami' 6470)"],
["Protection contre le Dajjal","« Celui qui apprend par cœur les dix premiers versets de la sourate al-Kahf sera protégé du Dajjal. »","Muslim 809, d'Abou ad-Darda'"],
["La sérénité descend","Un compagnon récitait al-Kahf et un nuage descendit sur lui. Le Prophète ﷺ dit : « C'est la sérénité (as-sakina) qui est descendue pour le Coran. »","Bukhari 5011, Muslim 795"]],
when:"Le vendredi commence au coucher du soleil le jeudi et se termine au coucher du soleil le vendredi. Tu peux donc lire la sourate dès le jeudi soir, et jusqu'au Maghrib du vendredi.",
parts:[
{v:"1 – 8",t:"Ouverture : le Livre sans tortuosité",d:"Louange à Allah qui a révélé le Livre droit, avertissement pour ceux qui attribuent un enfant à Allah, et rappel que la terre et sa parure sont une épreuve.",th:"Introduction"},
{v:"9 – 26",t:"Les gens de la Caverne",d:"Des jeunes croyants fuient un roi idolâtre et se réfugient dans une caverne. Allah les fait dormir 309 ans, puis les réveille comme signe de la résurrection. On y apprend à dire « in cha Allah » (v. 23-24).",th:"Épreuve de la foi"},
{v:"27 – 31",t:"Rester avec ceux qui invoquent Allah",d:"Ordre de patienter avec ceux qui invoquent leur Seigneur matin et soir, et de ne pas suivre celui dont le cœur est distrait du rappel.",th:"Transition"},
{v:"32 – 46",t:"Le propriétaire des deux jardins",d:"Un homme riche, orgueilleux de ses jardins, oublie Allah ; son ami croyant le met en garde. Ses jardins sont détruits. Les biens et les enfants sont la parure de cette vie, les bonnes œuvres durables valent mieux (v. 46).",th:"Épreuve de la richesse"},
{v:"47 – 59",t:"Le Jour du jugement et Iblis",d:"Les montagnes se déplacent, le livre des actes est posé. Rappel du refus d'Iblis de se prosterner devant Adam (v. 50) : comment prendre Satan et sa descendance pour alliés ?",th:"Rappel"},
{v:"60 – 82",t:"Moussa et al-Khadir",d:"Moussa voyage pour apprendre d'un serviteur à qui Allah a donné une science venant de Lui. Trois actes déroutants (le bateau percé, le garçon, le mur réparé) sont ensuite expliqués : la sagesse d'Allah dépasse ce que l'on voit.",th:"Épreuve de la science"},
{v:"83 – 98",t:"Dhoul-Qarnayn",d:"Un roi juste à qui Allah a donné le pouvoir parcourt la terre d'ouest en est, aide un peuple et bâtit une barrière contre Ya'jouj et Ma'jouj, en attribuant tout à la miséricorde de son Seigneur (v. 98).",th:"Épreuve du pouvoir"},
{v:"99 – 110",t:"Conclusion",d:"Les plus grands perdants sont ceux dont l'effort s'égare ici-bas en croyant bien faire. Dernier verset : que celui qui espère rencontrer son Seigneur fasse de bonnes œuvres et n'associe personne à Son adoration (v. 110).",th:"Conclusion"}],
lesson:"Les savants remarquent que les quatre histoires correspondent à quatre épreuves : la foi (la Caverne), la richesse (les deux jardins), la science (Moussa et al-Khadir) et le pouvoir (Dhoul-Qarnayn). Ce sont les épreuves par lesquelles le Dajjal tentera les gens, d'où la protection liée à cette sourate. Les remèdes cités dans la sourate : la bonne compagnie (v. 28), le rappel de l'au-delà (v. 45-49), l'humilité dans la science (v. 66-70) et la sincérité (v. 110)."
};

// Les 114 sourates. Nombre de versets : lecture de Hafs ('ad koufi). Lieu de révélation : selon le Mushaf de Médine.
// [numéro, nom arabe, translittération, sens, versets, "M" (mecquoise) / "D" (médinoise), explication, points clés, vertu authentique]
const SURAHS=[
[1,"الفاتحة","Al-Fatiha","L'Ouverture",7,"M","La sourate qui ouvre le Coran et que l'on récite dans chaque unité de prière. Elle résume toute la religion : la louange d'Allah, Seigneur des mondes, le rappel du Jour du jugement, l'engagement à n'adorer et ne demander l'aide qu'à Lui, puis la demande la plus importante : être guidé sur le droit chemin, celui des bienheureux, loin de ceux qui ont encouru la colère et des égarés.",["Louange et glorification d'Allah (v. 1-4)","Le pacte : « C'est Toi seul que nous adorons » (v. 5)","La demande de guidée (v. 6-7)"],"La plus grande sourate du Coran (Bukhari 4474). Pas de prière valide sans elle (Bukhari 756)."],
[2,"البقرة","Al-Baqara","La Vache",286,"D","La plus longue sourate, révélée au début de la période de Médine pour construire la nouvelle communauté. Elle décrit trois catégories de gens (croyants, mécréants, hypocrites), raconte la création d'Adam, rappelle longuement l'histoire des Enfants d'Israël (dont l'épisode de la vache qui lui donne son nom), puis pose les bases de la loi : la qibla vers La Mecque, le jeûne du Ramadan, le pèlerinage, le mariage et le divorce, l'interdiction de l'usure et les règles des dettes.",["Ayat al-Koursi, le plus grand verset (v. 255)","« Pas de contrainte en religion » (v. 256)","Le plus long verset du Coran, sur l'écriture des dettes (v. 282)","Les deux derniers versets, invocation des croyants (v. 285-286)"],"Satan fuit la maison où elle est récitée (Muslim 780). Les deux derniers versets suffisent à celui qui les lit la nuit (Bukhari 5009)."],
[3,"آل عمران","Al 'Imran","La Famille de 'Imran",200,"D","Elle affermit la foi face aux doutes. Elle explique les versets clairs et ambigus du Coran, raconte la famille de 'Imran : la naissance de Maryam, l'histoire de Zakariyya et Yahya, puis celle de 'Issa, et dialogue avec les gens du Livre. Elle tire ensuite les leçons de la bataille d'Ouhoud : l'obéissance, la patience, les erreurs à éviter et le sens de l'épreuve.",["Les versets clairs et ambigus (v. 7)","« La religion auprès d'Allah est l'islam » (v. 19)","Les leçons d'Ouhoud (v. 121-175)","Méditer sur la création des cieux et de la terre (v. 190-194)"],"Al-Baqara et Al 'Imran viendront au Jour de la résurrection comme deux nuages défendant leurs lecteurs (Muslim 804)."],
[4,"النساء","An-Nisa'","Les Femmes",176,"D","Une sourate de justice sociale. Elle protège les plus faibles : les orphelins et leurs biens, les femmes et leurs droits (dot, héritage, traitement juste). Elle détaille les parts d'héritage, les femmes que l'on ne peut épouser, la vie conjugale, puis traite de l'obéissance à Allah et au Messager, de la lutte contre l'injustice, de la prière en voyage et en danger, et démasque les hypocrites.",["Les règles d'héritage (v. 11-12, 176)","« Allah veut vous alléger » (v. 28)","Rendre les dépôts et juger avec justice (v. 58)","'Issa n'a été ni tué ni crucifié (v. 157-158)"],""],
[5,"المائدة","Al-Ma'ida","La Table servie",120,"D","L'une des dernières sourates révélées. Elle commence par l'ordre de respecter les engagements, détaille le licite et l'illicite en nourriture, les ablutions et le tayammoum, et contient le verset de la religion parachevée. Elle raconte le meurtre du fils d'Adam, insiste sur la justice même envers ses ennemis, discute avec les gens du Livre et se termine par la table descendue du ciel à la demande des apôtres de 'Issa.",["« Aujourd'hui, J'ai parachevé pour vous votre religion » (v. 3)","La description des ablutions (v. 6)","Qui tue une âme, c'est comme s'il avait tué l'humanité (v. 32)","Interdiction définitive de l'alcool et des jeux de hasard (v. 90-91)"],""],
[6,"الأنعام","Al-An'am","Les Bestiaux",165,"M","Une grande sourate de croyance (tawhid), révélée à La Mecque. Elle présente les preuves de l'unicité d'Allah dans la création, répond aux arguments des polythéistes, raconte le raisonnement d'Ibrahim sur les astres, et critique les superstitions des Arabes sur les animaux qu'ils s'interdisaient, d'où son nom. Elle se termine par les dix commandements de la religion.",["Les clés de l'invisible ne sont connues que d'Allah (v. 59)","Ibrahim et les astres (v. 74-83)","Les dix recommandations (v. 151-153)","« Ma prière, mes sacrifices, ma vie et ma mort appartiennent à Allah » (v. 162)"],""],
[7,"الأعراف","Al-A'raf","Les Murailles",206,"M","Elle retrace la lutte entre la vérité et l'égarement depuis le début : la création d'Adam, le refus d'Iblis et la sortie du Paradis, puis les histoires de Nouh, Houd, Salih, Lout et Chou'ayb, et longuement celle de Moussa face à Pharaon puis avec les Enfants d'Israël. Son nom vient des gens d'al-A'raf, placés sur les hauteurs entre le Paradis et l'Enfer.",["Le repentir d'Adam (v. 23)","Les gens d'al-A'raf (v. 46-49)","Le pacte de toute la descendance d'Adam (v. 172)","« À Allah les plus beaux noms, invoquez-Le par eux » (v. 180)"],""],
[8,"الأنفال","Al-Anfal","Le Butin",75,"D","Révélée après la bataille de Badr, la première grande victoire des musulmans. Elle explique comment partager le butin, rappelle que la victoire vient d'Allah (les anges envoyés en renfort), décrit les qualités des vrais croyants, et pose les règles de la guerre, de la paix et des traités.",["Les qualités des croyants (v. 2-4)","La victoire vient d'Allah (v. 10, 17)","« S'ils inclinent à la paix, incline vers elle » (v. 61)"],""],
[9,"التوبة","At-Tawba","Le Repentir",129,"D","La seule sourate sans « Bismillah ». Elle commence par une proclamation de rupture des traités avec les polythéistes qui les avaient violés, traite de l'expédition de Tabouk et démasque longuement les hypocrites qui refusèrent d'y participer. Elle raconte aussi le repentir des trois compagnons restés en arrière, qui donne son nom à la sourate.",["La grotte de Thawr : « Ne t'attriste pas, Allah est avec nous » (v. 40)","Les huit catégories de bénéficiaires de la zakat (v. 60)","Le repentir accepté des trois compagnons (v. 117-118)"],""],
[10,"يونس","Younous","Jonas",109,"M","Elle répond à ceux qui s'étonnaient qu'un homme reçoive la révélation, présente les signes d'Allah dans l'univers et le jour et la nuit, et décrit la réaction des gens face à l'épreuve. Elle raconte Nouh, Moussa face à Pharaon, et mentionne le peuple de Younous, le seul dont le repentir collectif écarta le châtiment.",["Allah est Celui qui a créé et qui recommence la création (v. 4)","La noyade de Pharaon et son corps préservé (v. 90-92)","Le peuple de Younous sauvé (v. 98)"],""],
[11,"هود","Houd","Houd",123,"M","Sourate des peuples anéantis, révélée dans la période difficile de La Mecque pour consoler le Prophète ﷺ. Elle raconte en détail Nouh et l'arche, Houd face à 'Ad, Salih face à Thamoud, la visite des anges à Ibrahim, Lout, Chou'ayb et Moussa. Le message : la droiture et la patience mènent au succès, et l'injustice mène à la perte.",["Le fils de Nouh refuse de monter dans l'arche (v. 42-46)","« Sois droit comme il t'a été ordonné » (v. 112)","Les bonnes actions effacent les mauvaises (v. 114)"],"Le Prophète ﷺ a dit : « Houd et ses sœurs m'ont fait blanchir les cheveux » (Tirmidhi 3297)."],
[12,"يوسف","Yousouf","Joseph",111,"M","La seule sourate qui raconte une histoire complète du début à la fin : celle de Yousouf, depuis son rêve d'enfant, la jalousie de ses frères et le puits, jusqu'à sa position de ministre en Égypte et les retrouvailles avec sa famille. Allah l'appelle « la plus belle des histoires ». Elle a été révélée lors de l'année de la tristesse pour consoler le Prophète ﷺ.",["La chasteté face à la tentation (v. 23-24)","« Belle patience » de Ya'qub (v. 18, 83)","« Ne désespérez pas de la miséricorde d'Allah » (v. 87)","« Pas de reproche contre vous aujourd'hui » (v. 92)"],""],
[13,"الرعد","Ar-Ra'd","Le Tonnerre",43,"D","Elle décrit la puissance d'Allah dans la nature (le ciel sans piliers, la terre, les fruits, les éclairs et le tonnerre qui glorifie Allah) et compare la vérité qui demeure à l'écume qui disparaît. Elle rappelle que le changement d'une société commence par le changement de ses membres.",["« Allah ne change pas l'état d'un peuple tant qu'ils ne changent pas ce qui est en eux » (v. 11)","Le tonnerre glorifie Allah (v. 13)","« C'est par le rappel d'Allah que les cœurs s'apaisent » (v. 28)"],""],
[14,"إبراهيم","Ibrahim","Abraham",52,"M","Elle présente le Coran comme une lumière qui sort les gens des ténèbres, rappelle la mission des prophètes et la gratitude envers Allah. Elle compare la bonne parole à un bel arbre aux racines fermes et la mauvaise parole à un arbre arraché, et contient l'invocation d'Ibrahim pour La Mecque et sa descendance.",["« Si vous êtes reconnaissants, J'augmenterai Mes bienfaits » (v. 7)","Le discours de Satan au Jour du jugement (v. 22)","La bonne parole comme un bel arbre (v. 24-26)","L'invocation d'Ibrahim pour La Mecque (v. 35-41)"],""],
[15,"الحجر","Al-Hijr","Al-Hijr",99,"M","Elle affirme qu'Allah préserve Lui-même le Coran, décrit la création de l'homme d'argile et le refus d'Iblis, puis raconte la visite des anges à Ibrahim, le peuple de Lout et le peuple d'al-Hijr (Thamoud), qui lui donne son nom. Elle console le Prophète ﷺ face aux moqueries.",["« C'est Nous qui avons fait descendre le Rappel, et c'est Nous qui en sommes gardien » (v. 9)","Al-Fatiha : les sept versets répétés (v. 87)","« Adore ton Seigneur jusqu'à ce que te vienne la certitude » (v. 99)"],""],
[16,"النحل","An-Nahl","Les Abeilles",128,"M","La sourate des bienfaits. Elle énumère les dons d'Allah : le bétail, la pluie, les fruits, la mer, les étoiles pour se guider, et l'abeille qui produit un miel de guérison. Elle invite à la gratitude, interdit de rompre ses engagements et enseigne la méthode de la prédication : avec sagesse et bonne exhortation.",["L'abeille et le miel (v. 68-69)","« Allah ordonne la justice, la bienfaisance et la générosité envers les proches » (v. 90)","« Appelle au chemin de ton Seigneur par la sagesse et la bonne exhortation » (v. 125)"],""],
[17,"الإسراء","Al-Isra'","Le Voyage nocturne",111,"M","Elle commence par le Voyage nocturne de La Mecque à Jérusalem, évoque l'histoire des Enfants d'Israël, puis donne un ensemble de commandements moraux : bonté envers les parents, ne pas gaspiller, ne pas tuer ses enfants, ne pas approcher la fornication, respecter les biens de l'orphelin, ne pas être arrogant. Elle parle aussi de l'âme et du défi du Coran.",["Le Voyage nocturne (v. 1)","Bonté envers les parents : ne pas leur dire « ouf » (v. 23-24)","« L'âme relève de l'ordre de mon Seigneur » (v. 85)","Le défi : nul ne peut produire un Coran semblable (v. 88)"],""],
[18,"الكهف","Al-Kahf","La Caverne",110,"M","Elle raconte quatre histoires qui correspondent à quatre épreuves : les gens de la Caverne (la foi), le propriétaire des deux jardins (la richesse), Moussa et al-Khadir (la science) et Dhoul-Qarnayn (le pouvoir). Elle protège du Dajjal et se lit chaque vendredi.",["Dire « in cha Allah » (v. 23-24)","Les biens et les enfants sont la parure de cette vie (v. 46)","La sagesse cachée des décrets d'Allah (v. 60-82)","La sincérité dans les œuvres (v. 110)"],"Lumière entre deux vendredis pour qui la lit le vendredi (al-Hakim, authentique). Protection contre le Dajjal (Muslim 809)."],
[19,"مريم","Maryam","Marie",98,"M","La seule sourate qui porte le nom d'une femme. Elle raconte la naissance miraculeuse de Yahya pour Zakariyya âgé, puis celle de 'Issa pour Maryam, et la parole de 'Issa au berceau. Elle évoque ensuite Ibrahim et son père, Moussa, Isma'il et Idris. Elle insiste sur la miséricorde d'Allah (le nom ar-Rahman y revient souvent) et réfute l'idée qu'Allah ait un enfant. Ja'far l'a récitée devant le Négus d'Abyssinie.",["L'invocation discrète de Zakariyya (v. 3-6)","La naissance de 'Issa sous le palmier (v. 22-26)","Ibrahim parle à son père avec douceur (v. 41-48)"],""],
[20,"طه","Ta-Ha","Ta-Ha",135,"M","Elle commence par rassurer le Prophète ﷺ : le Coran n'a pas été révélé pour le rendre malheureux. Elle raconte en détail l'histoire de Moussa : le feu au mont Tour, sa mission auprès de Pharaon, le duel des magiciens, la sortie d'Égypte et le veau d'or. Puis elle rappelle la faute et le repentir d'Adam. C'est en l'entendant que 'Umar ibn al-Khattab embrassa l'islam.",["« Je suis Allah, adore-Moi et accomplis la prière » (v. 14)","« Seigneur, ouvre-moi ma poitrine » (v. 25-28)","Parler à Pharaon avec douceur (v. 44)","« Seigneur, augmente-moi en science » (v. 114)"],""],
[21,"الأنبياء","Al-Anbiya'","Les Prophètes",112,"M","Elle rappelle l'approche du Jour du jugement et cite seize prophètes, chacun avec son épreuve et la réponse d'Allah à son invocation : Ibrahim et le feu, Ayyoub et sa maladie, Younous dans le poisson, Zakariyya sans enfant… Le message : tous les prophètes ont apporté le même tawhid, et Muhammad ﷺ est envoyé comme miséricorde pour l'univers.",["Ibrahim brise les idoles (v. 51-70)","L'invocation d'Ayyoub (v. 83) et de Younous (v. 87)","« Nous ne t'avons envoyé que comme miséricorde pour l'univers » (v. 107)"],""],
[22,"الحج","Al-Hajj","Le Pèlerinage",78,"D","Elle commence par la terreur de l'Heure, décrit la création de l'homme comme preuve de la résurrection, puis raconte l'origine du pèlerinage : Ibrahim appelle les gens à la Maison sacrée. Elle détaille certains rites, le sens du sacrifice (seule la piété atteint Allah), et donne la première autorisation de combattre pour ceux qui étaient opprimés.",["L'appel au pèlerinage (v. 27)","« Ni leur chair ni leur sang n'atteignent Allah, mais la piété de votre part » (v. 37)","Première permission de se défendre (v. 39-40)","Contient deux prosternations de récitation"],""],
[23,"المؤمنون","Al-Mou'minoun","Les Croyants",118,"M","Elle s'ouvre sur les qualités des croyants qui réussissent : humilité dans la prière, rejet des futilités, zakat, chasteté, fidélité aux engagements. Elle décrit les étapes de la création de l'embryon, rappelle les messagers et leurs peuples, et décrit les regrets des mécréants après la mort.",["Les qualités des croyants (v. 1-11)","Les étapes de l'embryon (v. 12-14)","« Seigneur, fais-moi revenir pour que je fasse le bien » (v. 99-100)"],""],
[24,"النور","An-Nour","La Lumière",64,"D","Une sourate de morale et de protection de la famille. Elle fixe la peine de la fornication et de la fausse accusation, raconte la calomnie contre 'Aïcha et son innocence révélée, et donne des règles de vie : demander la permission avant d'entrer, baisser le regard, la tenue des femmes, faciliter le mariage. Elle contient le célèbre verset de la lumière.",["L'innocence de 'Aïcha (v. 11-20)","Baisser le regard et la pudeur (v. 30-31)","Le verset de la lumière (v. 35)"],""],
[25,"الفرقان","Al-Fourqan","Le Discernement",77,"M","Le Coran est le Fourqan, ce qui distingue le vrai du faux. La sourate répond aux objections des polythéistes contre le Prophète ﷺ et le Coran, rappelle les peuples anciens, et se termine par le beau portrait des « serviteurs du Tout Miséricordieux ».",["Les serviteurs du Tout Miséricordieux marchent humblement (v. 63-76)","Le repentir change les mauvaises actions en bonnes (v. 70)","« Seigneur, fais de nos épouses et de nos enfants la joie de nos yeux » (v. 74)"],""],
[26,"الشعراء","Ach-Chou'ara'","Les Poètes",227,"M","Elle console le Prophète ﷺ en racontant sept prophètes face à leurs peuples : Moussa, Ibrahim, Nouh, Houd, Salih, Lout et Chou'ayb. Chaque histoire se termine par le même refrain : « Il y a là un signe, mais la plupart d'entre eux ne croient pas. » Elle distingue le Coran de la poésie.",["Moussa face à Pharaon et la mer (v. 10-68)","« Avertis les plus proches de ta famille » (v. 214)","Les poètes errent dans chaque vallée (v. 224-227)"],""],
[27,"النمل","An-Naml","Les Fourmis",93,"M","Elle raconte l'histoire de Soulayman, qui comprenait le langage des animaux : la fourmi qui avertit les siennes, la huppe qui découvre la reine de Saba', et la soumission de la reine à Allah. Elle évoque aussi Moussa, Salih et Lout, et présente les preuves de l'unicité d'Allah par une série de questions.",["La fourmi de Soulayman (v. 18-19)","La reine de Saba' et son trône (v. 22-44)","« Qui répond à l'angoissé quand il L'invoque ? » (v. 62)"],""],
[28,"القصص","Al-Qasas","Le Récit",88,"M","Elle raconte en détail la vie de Moussa : sa naissance sous Pharaon, son enfance au palais, sa fuite à Madyan, son mariage, puis sa mission. Elle se termine par l'histoire de Qaroun, englouti avec ses trésors à cause de son orgueil.",["La mère de Moussa le confie au fleuve (v. 7-13)","« Seigneur, j'ai grand besoin du bien que Tu feras descendre vers moi » (v. 24)","Qaroun et son orgueil (v. 76-82)"],""],
[29,"العنكبوت","Al-'Ankabout","L'Araignée",69,"M","Elle explique que la foi est toujours éprouvée, raconte Nouh, Ibrahim, Lout et Chou'ayb, et compare ceux qui prennent des protecteurs en dehors d'Allah à l'araignée qui se fabrique une maison, la plus fragile de toutes.",["« Les gens pensent-ils qu'on les laissera dire « nous croyons » sans les éprouver ? » (v. 2)","La maison de l'araignée (v. 41)","« La prière préserve de la turpitude et du blâmable » (v. 45)"],""],
[30,"الروم","Ar-Roum","Les Romains",60,"M","Elle commence par une prophétie : les Romains, vaincus par les Perses, les vaincraient en quelques années, ce qui se réalisa. Elle présente ensuite les signes d'Allah dans la création : le mariage et l'amour entre époux, la diversité des langues et des couleurs, le sommeil, la pluie. Elle parle aussi de la fitra, la nature saine de l'homme.",["La victoire annoncée des Romains (v. 2-4)","Les signes d'Allah : l'amour entre époux (v. 21)","La fitra, la nature originelle (v. 30)"],""],
[31,"لقمان","Louqman","Louqman",34,"M","Elle tire son nom de Louqman le Sage et rapporte ses conseils à son fils : ne rien associer à Allah, être bon envers ses parents, savoir qu'Allah voit tout, accomplir la prière, ordonner le bien, être patient, ne pas être arrogant et parler avec modération.",["Les conseils de Louqman à son fils (v. 13-19)","Le chirk est une injustice énorme (v. 13)","Les cinq clés de l'invisible (v. 34)"],""],
[32,"السجدة","As-Sajda","La Prosternation",30,"M","Elle affirme la vérité du Coran, décrit la création en six jours et les étapes de la création de l'homme, puis décrit les croyants qui se prosternent et quittent leur lit la nuit pour invoquer leur Seigneur. Elle contient une prosternation de récitation.",["Les croyants se prosternent humblement (v. 15)","Ils quittent leur lit pour invoquer Allah (v. 16-17)"],"Le Prophète ﷺ la récitait à la prière de l'aube du vendredi, avec al-Insan (Bukhari 891)."],
[33,"الأحزاب","Al-Ahzab","Les Coalisés",73,"D","Elle tire son nom de la bataille du Fossé, quand une coalition assiégea Médine. Elle traite aussi de règles familiales : l'adoption, le statut des épouses du Prophète ﷺ (mères des croyants), le hijab, et contient le célèbre verset ordonnant de prier sur le Prophète ﷺ.",["Le Prophète ﷺ est le meilleur modèle (v. 21)","La bataille du Fossé (v. 9-27)","Muhammad ﷺ, sceau des prophètes (v. 40)","« Priez sur lui et adressez-lui vos salutations » (v. 56)"],""],
[34,"سبأ","Saba'","Saba'",54,"M","Elle compare deux familles comblées : celle de Daoud et Soulayman, reconnaissante, et le peuple de Saba', ingrat, dont les jardins furent détruits par la rupture d'un barrage. Elle répond aux négateurs de la résurrection.",["Daoud et Soulayman, gens de gratitude (v. 10-13)","« Peu de Mes serviteurs sont reconnaissants » (v. 13)","La mort de Soulayman appuyé sur son bâton (v. 14)","Le barrage de Saba' (v. 15-19)"],""],
[35,"فاطر","Fatir","Le Créateur",45,"M","Elle célèbre Allah Créateur des cieux et de la terre, qui envoie les anges et donne la miséricorde. Elle rappelle que l'homme est pauvre et dépendant d'Allah, et décrit trois catégories d'héritiers du Livre.",["« Ô gens, vous êtes les pauvres ayant besoin d'Allah » (v. 15)","Seuls les savants craignent vraiment Allah (v. 28)","Trois catégories d'héritiers du Coran (v. 32)"],""],
[36,"يس","Ya-Sin","Ya-Sin",83,"M","Elle affirme la mission du Prophète ﷺ, raconte l'histoire d'une cité qui rejeta ses messagers et d'un homme venu du bout de la ville pour les défendre, puis présente les signes d'Allah (la terre morte qui revit, la nuit et le jour, le soleil et la lune) et des preuves fortes de la résurrection.",["L'homme venu du bout de la ville (v. 20-27)","Le soleil et la lune suivent chacun leur orbite (v. 38-40)","« Qui fera revivre les ossements ? Celui qui les a créés la première fois » (v. 78-79)","« Son ordre, quand Il veut une chose, est de dire : Sois, et elle est » (v. 82)"],""],
[37,"الصافات","As-Saffat","Les Rangés",182,"M","Elle commence par les anges rangés en rangs, réfute l'idée que les anges soient des filles d'Allah, décrit le Paradis et l'Enfer, et raconte Nouh, Ibrahim (dont l'épreuve du sacrifice de son fils), Moussa et Haroun, Ilyas, Lout et Younous.",["Le sacrifice d'Ibrahim (v. 99-111)","Younous et le poisson (v. 139-148)","« Paix sur les messagers » (v. 181)"],""],
[38,"ص","Sad","Sad",88,"M","Elle répond à l'orgueil des chefs de Qouraych, puis raconte Daoud et les deux plaideurs, Soulayman et son royaume, Ayyoub et sa patience, et la création d'Adam avec le refus d'Iblis.",["Daoud, juge entre les gens avec justice (v. 26)","Le Coran, livre béni à méditer (v. 29)","La guérison d'Ayyoub : « Quel excellent serviteur ! » (v. 41-44)"],""],
[39,"الزمر","Az-Zoumar","Les Groupes",75,"M","Elle insiste sur la sincérité dans l'adoration et décrit à la fin comment les gens seront conduits en groupes : les mécréants vers l'Enfer, les pieux vers le Paradis. Elle contient l'un des versets les plus porteurs d'espoir du Coran.",["« Ceux qui savent et ceux qui ne savent pas sont-ils égaux ? » (v. 9)","« Ne désespérez pas de la miséricorde d'Allah, Il pardonne tous les péchés » (v. 53)","Les groupes conduits au Paradis et à l'Enfer (v. 71-75)"],""],
[40,"غافر","Ghafir","Le Pardonneur",85,"M","Elle s'ouvre sur les noms d'Allah qui pardonne et accepte le repentir. Elle raconte longuement le croyant de la famille de Pharaon, qui cachait sa foi et défendit Moussa avec courage et sagesse.",["Les anges porteurs du Trône demandent pardon pour les croyants (v. 7-9)","Le croyant de la famille de Pharaon (v. 28-45)","« Invoquez-Moi, Je vous répondrai » (v. 60)"],""],
[41,"فصلت","Fussilat","Les versets détaillés",54,"M","Elle répond aux polythéistes qui détournaient les gens du Coran, raconte la création des cieux et de la terre, le sort de 'Ad et Thamoud, et décrit les organes qui témoigneront contre leurs propriétaires. Elle enseigne à repousser le mal par le bien.",["La peau et les membres témoignent (v. 20-22)","Les anges descendent sur ceux qui disent « Notre Seigneur est Allah » puis sont droits (v. 30)","Repousser le mal par ce qui est meilleur (v. 34)"],""],
[42,"الشورى","Ach-Choura","La Consultation",53,"M","Elle affirme que tous les prophètes ont apporté la même religion, décrit les qualités des croyants (dont la consultation dans leurs affaires, d'où le nom) et explique les modes de la révélation.",["« Rien n'est semblable à Lui » (v. 11)","Les croyants se consultent entre eux (v. 38)","Pardonner est preuve de grande résolution (v. 43)"],""],
[43,"الزخرف","Az-Zoukhrouf","L'Ornement",89,"M","Elle critique ceux qui suivent aveuglément leurs ancêtres et ceux qui mesurent la valeur des gens à leur richesse, en montrant que les ornements de ce monde sont sans valeur auprès d'Allah. Elle évoque Ibrahim, Moussa face à Pharaon et 'Issa.",["« Nous avons trouvé nos ancêtres sur une religion » (v. 22-23)","Les ornements de ce monde sont peu de chose (v. 33-35)","Les amis deviendront ennemis, sauf les pieux (v. 67)"],""],
[44,"الدخان","Ad-Doukhan","La Fumée",59,"M","Elle annonce la révélation du Coran pendant une nuit bénie, avertit d'une fumée qui couvrira les gens, raconte la noyade de Pharaon et compare le sort des gens de l'Enfer et du Paradis.",["Le Coran révélé lors d'une nuit bénie (v. 3)","Le ciel et la terre n'ont pas pleuré Pharaon (v. 29)"],""],
[45,"الجاثية","Al-Jathiya","L'Agenouillée",37,"M","Elle présente les signes d'Allah dans la création, critique celui qui prend sa passion pour divinité, et décrit chaque communauté agenouillée au Jour du jugement, appelée vers son livre.",["Celui qui prend sa passion pour divinité (v. 23)","Chaque communauté agenouillée (v. 28)"],""],
[46,"الأحقاف","Al-Ahqaf","Les Dunes",35,"M","Elle tire son nom des dunes où vivait le peuple de 'Ad, raconte leur destruction par un nuage qu'ils prenaient pour de la pluie, insiste sur la bonté envers les parents et rapporte qu'un groupe de djinns écouta le Coran et crut.",["La bonté envers la mère qui a porté l'enfant (v. 15)","L'invocation à quarante ans (v. 15)","Les djinns écoutent le Coran (v. 29-32)"],""],
[47,"محمد","Mouhammad","Muhammad",38,"D","Elle oppose ceux qui croient et suivent la vérité à ceux qui détournent du chemin d'Allah, donne des règles de combat contre les agresseurs, décrit les rivières du Paradis et démasque les hypocrites.",["Si vous secourez Allah, Il vous secourra (v. 7)","Les quatre rivières du Paradis (v. 15)","« Ne méditent-ils pas le Coran ? » (v. 24)"],""],
[48,"الفتح","Al-Fath","La Victoire",29,"D","Révélée au retour de Houdaybiyya : la trêve, qui semblait une défaite, est appelée « victoire éclatante ». Elle mentionne le serment d'allégeance sous l'arbre et décrit les compagnons : durs envers les mécréants, miséricordieux entre eux.",["« Nous t'avons accordé une victoire éclatante » (v. 1)","Le serment sous l'arbre (v. 18)","Le portrait des compagnons (v. 29)"],""],
[49,"الحجرات","Al-Houjourat","Les Appartements",18,"D","Une sourate courte entièrement consacrée au comportement : respect du Prophète ﷺ, vérifier les informations, réconcilier les croyants, ne pas se moquer, ne pas médire, ne pas espionner, ne pas mal penser des autres, et l'égalité de tous les humains, dont la valeur se mesure à la piété.",["Vérifier une information avant d'agir (v. 6)","Les croyants sont frères (v. 10)","Interdiction de la moquerie, de la médisance et de l'espionnage (v. 11-12)","« Le plus noble d'entre vous est le plus pieux » (v. 13)"],""],
[50,"ق","Qaf","Qaf",45,"M","Une sourate sur la résurrection. Elle répond à l'étonnement des polythéistes, décrit les deux anges qui notent chaque parole, l'agonie de la mort, le soufflement dans la trompe et le Jour du jugement.",["« Nous sommes plus proche de lui que sa veine jugulaire » (v. 16)","Pas une parole sans un observateur prêt à l'écrire (v. 18)","L'agonie de la mort (v. 19)"],"Le Prophète ﷺ la récitait souvent lors du sermon du vendredi (Muslim 873) et à la prière de l'Aïd (Muslim 891)."],
[51,"الذاريات","Adh-Dhariyat","Qui éparpillent",60,"M","Elle jure par les vents et affirme la réalité de la rétribution, décrit les pieux qui priaient la nuit et demandaient pardon à l'aube, raconte les hôtes d'Ibrahim et rappelle le but de la création.",["Les pieux demandent pardon à l'aube (v. 17-18)","Les hôtes d'Ibrahim (v. 24-30)","« Je n'ai créé les djinns et les hommes que pour qu'ils M'adorent » (v. 56)"],""],
[52,"الطور","At-Tour","Le Mont",49,"M","Elle jure par le mont Tour et la Maison peuplée, annonce que le châtiment est inévitable, décrit les délices du Paradis et pose aux polythéistes une série de questions qui démontent leurs arguments.",["« Ont-ils été créés à partir de rien, ou sont-ils les créateurs ? » (v. 35)","Les familles réunies au Paradis (v. 21)"],""],
[53,"النجم","An-Najm","L'Étoile",62,"M","Elle affirme que le Prophète ﷺ ne parle pas sous l'effet de la passion, décrit sa vision de Jibril et le Voyage nocturne jusqu'au Lotus de la limite, réfute les idoles al-Lat et al-'Ouzza, et rappelle que chacun ne porte que ses propres actes.",["« Il ne parle pas sous l'effet de la passion » (v. 3-4)","Le Lotus de la limite (v. 14)","« L'homme n'obtient que le fruit de ses efforts » (v. 39)"],"Première sourate contenant une prosternation que le Prophète ﷺ récita en public (Bukhari 1067)."],
[54,"القمر","Al-Qamar","La Lune",55,"M","Elle commence par le miracle de la lune fendue, puis rappelle en séquences rapides les peuples de Nouh, 'Ad, Thamoud, Lout et Pharaon, avec un refrain : « Nous avons rendu le Coran facile pour la méditation. Y a-t-il quelqu'un pour réfléchir ? »",["La lune s'est fendue (v. 1)","« Nous avons rendu le Coran facile pour le rappel » (v. 17, 22, 32, 40)"],""],
[55,"الرحمن","Ar-Rahman","Le Tout Miséricordieux",78,"D","La sourate des bienfaits. Elle énumère les grâces d'Allah (l'enseignement du Coran, la parole, le soleil et la lune, les mers, les perles), décrit le Jour du jugement puis deux jardins du Paradis, avec un refrain répété 31 fois : « Lequel donc des bienfaits de votre Seigneur nierez-vous ? »",["Il a enseigné le Coran et créé l'homme (v. 1-4)","Tout ce qui est sur terre périra, seul subsiste le visage de ton Seigneur (v. 26-27)","« La récompense du bien est-elle autre chose que le bien ? » (v. 60)"],""],
[56,"الواقعة","Al-Waqi'a","L'Événement",96,"M","Elle décrit l'Événement (le Jour du jugement) et la répartition des gens en trois groupes : les devanciers rapprochés d'Allah, les gens de la droite et les gens de la gauche, avec le sort de chacun. Elle présente des preuves de la résurrection tirées de la vie quotidienne : la semence, les cultures, l'eau et le feu.",["Les trois groupes de gens (v. 7-11)","« Est-ce vous qui faites pousser ce que vous semez ? » (v. 63-64)","Seuls les purifiés touchent le Livre préservé (v. 79)"],""],
[57,"الحديد","Al-Hadid","Le Fer",29,"D","Elle appelle les croyants à dépenser dans la voie d'Allah et à adoucir leur cœur, décrit la lumière des croyants au Jour du jugement et compare la vie de ce monde à une plante qui pousse puis se dessèche. Elle mentionne le fer, descendu avec une grande force et des utilités.",["« Il est le Premier et le Dernier, l'Apparent et le Caché » (v. 3)","N'est-il pas temps que les cœurs des croyants s'humilient ? (v. 16)","La vie de ce monde n'est que jeu et amusement (v. 20)"],""],
[58,"المجادلة","Al-Moujadila","La Discussion",22,"D","Elle commence par la plainte d'une femme, Khawla, dont le mari avait prononcé une formule de répudiation pré-islamique (dhihar) : Allah entendit sa discussion et abolit cette pratique. Elle traite aussi des conciliabules secrets et de l'adab dans les assemblées.",["Allah a entendu la parole de celle qui discutait (v. 1)","Faire de la place dans les assemblées (v. 11)","Allah élève en degrés ceux qui ont reçu la science (v. 11)"],""],
[59,"الحشر","Al-Hachr","Le Rassemblement",24,"D","Elle traite de l'expulsion de la tribu des Banou Nadir après leur trahison, décrit la générosité des Ansar envers les émigrés, et se termine par une série de noms d'Allah.",["Les Ansar préfèrent les autres à eux-mêmes (v. 9)","« Que chaque âme regarde ce qu'elle a préparé pour demain » (v. 18)","Les beaux noms d'Allah (v. 22-24)"],""],
[60,"الممتحنة","Al-Moumtahana","L'Éprouvée",13,"D","Elle définit les relations avec les non-musulmans : ne pas prendre pour alliés ceux qui combattent les musulmans, mais être bon et juste envers ceux qui ne les combattent pas. Elle parle aussi des femmes émigrées qu'on mettait à l'épreuve.",["Ibrahim, un bel exemple (v. 4)","Allah ne vous interdit pas d'être bons et justes envers ceux qui ne vous combattent pas (v. 8)"],""],
[61,"الصف","As-Saff","Le Rang",14,"D","Elle reproche de dire ce que l'on ne fait pas, évoque Moussa et 'Issa (qui annonça un messager nommé Ahmad), et propose le « commerce » qui sauve du châtiment : la foi et l'effort dans la voie d'Allah.",["« Pourquoi dites-vous ce que vous ne faites pas ? » (v. 2)","'Issa annonce Ahmad (v. 6)","Le commerce qui sauve (v. 10-11)"],""],
[62,"الجمعة","Al-Joumou'a","Le Vendredi",11,"D","Elle rappelle la grâce d'Allah d'avoir envoyé un messager aux illettrés, puis ordonne de se rendre à la prière du vendredi dès l'appel et de laisser le commerce, avant de se disperser ensuite sur la terre.",["L'ordre de se rendre à la prière du vendredi (v. 9)","Ne pas laisser le Prophète ﷺ debout pour le commerce (v. 11)"],"Le Prophète ﷺ la récitait à la prière du vendredi avec al-Mounafiqoun (Muslim 877)."],
[63,"المنافقون","Al-Mounafiqoun","Les Hypocrites",11,"D","Elle décrit les hypocrites : leurs belles paroles, leurs faux serments, leur mépris des croyants. Elle met en garde contre la distraction par les biens et les enfants, et invite à donner avant que la mort ne vienne.",["Les biens et les enfants ne doivent pas distraire du rappel d'Allah (v. 9)","Donner avant que vienne la mort (v. 10)"],""],
[64,"التغابن","At-Taghabun","La Grande Perte",18,"D","Elle annonce le Jour de la grande perte, où les uns gagnent et les autres perdent, explique que tout malheur arrive par la permission d'Allah, et avertit que certaines épouses et enfants peuvent être une épreuve.",["Aucun malheur n'arrive sans la permission d'Allah (v. 11)","« Craignez Allah autant que vous le pouvez » (v. 16)"],""],
[65,"الطلاق","At-Talaq","Le Divorce",12,"D","Elle fixe les règles du divorce de façon juste et humaine : le délai de viduité, le logement et l'entretien de la femme, l'allaitement. Elle contient des promesses célèbres pour celui qui craint Allah.",["« Quiconque craint Allah, Il lui donnera une issue et le pourvoira d'où il ne s'attend pas » (v. 2-3)","« Quiconque place sa confiance en Allah, Il lui suffit » (v. 3)"],""],
[66,"التحريم","At-Tahrim","L'Interdiction",12,"D","Elle commence par un épisode de la vie du Prophète ﷺ qui s'était interdit une chose licite pour plaire à certaines épouses, ordonne de protéger sa famille du Feu, appelle au repentir sincère et donne quatre femmes en exemple : deux mécréantes (les épouses de Nouh et de Lout) et deux croyantes (Assiya et Maryam).",["« Préservez-vous, vous et vos familles, d'un Feu » (v. 6)","Le repentir sincère (v. 8)","Assiya et Maryam, modèles de foi (v. 11-12)"],""],
[67,"الملك","Al-Moulk","La Royauté",30,"M","Elle célèbre Allah qui détient la royauté, qui a créé la mort et la vie pour éprouver qui agit le mieux, et invite à regarder le ciel et les oiseaux. Elle décrit les regrets des gens de l'Enfer.",["Allah a créé la mort et la vie pour vous éprouver (v. 2)","« Si nous avions écouté ou raisonné… » (v. 10)","Les oiseaux tenus dans le ciel par le Tout Miséricordieux (v. 19)"],"Une sourate de trente versets a intercédé pour un homme jusqu'à ce qu'il soit pardonné (Tirmidhi 2891, hassan). On la lit chaque soir."],
[68,"القلم","Al-Qalam","Le Calame",52,"M","Elle défend le Prophète ﷺ accusé de folie et loue son caractère, raconte les propriétaires d'un jardin qui voulurent priver les pauvres et le perdirent, et évoque la patience de Younous.",["« Tu es d'un caractère éminent » (v. 4)","Les gens du jardin (v. 17-33)"],""],
[69,"الحاقة","Al-Haqqa","L'Inévitable",52,"M","Elle décrit le Jour du jugement comme l'inévitable réalité, rappelle la destruction de 'Ad, Thamoud et Pharaon, et décrit celui qui reçoit son livre de la main droite et sa joie, puis celui qui le reçoit de la main gauche et ses regrets.",["« Voici, lisez mon livre ! » (v. 19)","« Mes biens ne m'ont servi à rien » (v. 28)"],""],
[70,"المعارج","Al-Ma'arij","Les Voies d'ascension",44,"M","Elle décrit le Jour où une journée vaut cinquante mille ans, la nature anxieuse de l'homme, puis les qualités de ceux qui prient et y échappent.",["L'homme a été créé impatient (v. 19-21)","Les qualités de ceux qui prient (v. 22-35)"],""],
[71,"نوح","Nouh","Noé",28,"M","Elle est entièrement consacrée à Nouh et à sa prédication : ses efforts jour et nuit, en public et en privé, ses arguments tirés de la création, la promesse de pluie et de richesse pour qui demande pardon, et le refus de son peuple qui s'accrochait à ses idoles.",["Demander pardon apporte pluie, biens et enfants (v. 10-12)","Les noms des idoles du peuple de Nouh (v. 23)"],""],
[72,"الجن","Al-Jinn","Les Djinns",28,"M","Elle rapporte les paroles d'un groupe de djinns qui écoutèrent le Coran et crurent. On y apprend qu'il y a parmi eux des croyants et des mécréants, et que seul Allah connaît l'invisible.",["Les djinns écoutent un « Coran merveilleux » (v. 1-2)","Les mosquées sont à Allah, n'invoquez personne avec Lui (v. 18)"],""],
[73,"المزمل","Al-Mouzzammil","L'Enveloppé",20,"M","Une des premières sourates. Allah ordonne au Prophète ﷺ de prier une grande partie de la nuit et de réciter le Coran lentement, pour le préparer à une parole lourde. Le dernier verset allège cette obligation pour la communauté.",["Réciter le Coran lentement et clairement (tartil) (v. 4)","L'allègement de la prière de nuit (v. 20)"],""],
[74,"المدثر","Al-Mouddaththir","Le Revêtu d'un manteau",56,"M","Parmi les toutes premières révélations après al-'Alaq. Allah ordonne au Prophète ﷺ de se lever pour avertir, de glorifier son Seigneur et de purifier ses vêtements. Elle décrit un notable mecquois qui traita le Coran de magie, et Saqar, l'un des noms de l'Enfer.",["« Lève-toi et avertis ! » (v. 2)","Chaque âme est l'otage de ce qu'elle a acquis (v. 38)"],""],
[75,"القيامة","Al-Qiyama","La Résurrection",40,"M","Elle jure par le Jour de la résurrection et par l'âme qui se blâme, affirme qu'Allah peut reconstituer même le bout des doigts, enseigne au Prophète ﷺ à ne pas se presser en récitant la révélation, et décrit l'agonie.",["Allah reconstituera même les bouts des doigts (v. 4)","Ne pas se hâter dans la récitation (v. 16-19)","Des visages ce jour-là regarderont leur Seigneur (v. 22-23)"],""],
[76,"الإنسان","Al-Insan","L'Homme",31,"D","Elle rappelle la création de l'homme pour l'éprouver, puis décrit les pieux qui nourrissent le pauvre, l'orphelin et le captif uniquement pour Allah, et la récompense qui les attend au Paradis.",["L'homme guidé : reconnaissant ou ingrat (v. 3)","« Nous vous nourrissons pour le visage d'Allah » (v. 8-9)"],"Récitée avec as-Sajda à la prière de l'aube du vendredi (Bukhari 891)."],
[77,"المرسلات","Al-Moursalat","Les Envoyés",50,"M","Elle jure par les vents envoyés et décrit les bouleversements du Jour du jugement avec un refrain répété dix fois : « Malheur, ce jour-là, à ceux qui criaient au mensonge ! »",["Le refrain d'avertissement (v. 15 et suivants)"],""],
[78,"النبأ","An-Naba'","La Nouvelle",40,"M","Elle commence par la question sur la grande nouvelle (la résurrection), énumère les bienfaits d'Allah comme preuves (la terre étalée, les montagnes comme piquets, le sommeil comme repos, la pluie), puis décrit le Jour du tri, l'Enfer et le Paradis.",["Les montagnes comme des piquets (v. 7)","Le sommeil comme repos (v. 9)","« Hélas, si seulement j'étais poussière ! » (v. 40)"],""],
[79,"النازعات","An-Nazi'at","Les Anges qui arrachent",46,"M","Elle jure par les anges qui arrachent les âmes, décrit la résurrection, raconte brièvement Moussa face à Pharaon qui prétendait être « votre Seigneur le très-haut », et oppose celui qui préfère ce monde à celui qui craint Allah et retient ses passions.",["Pharaon : « Je suis votre Seigneur le très-haut » (v. 24)","Celui qui retient son âme de la passion (v. 40-41)"],""],
[80,"عبس","'Abasa","Il s'est renfrogné",42,"M","Elle commence par un reproche doux au Prophète ﷺ, qui s'était détourné d'un aveugle, Ibn Oumm Maktoum, venu apprendre, pendant qu'il parlait aux notables. Le message : chaque personne sincère mérite l'attention. Elle invite ensuite à réfléchir à la nourriture, et décrit le jour où l'homme fuira son frère, sa mère et son père.",["L'aveugle venu chercher la guidée (v. 1-10)","Que l'homme regarde sa nourriture (v. 24-32)","Le jour où l'homme fuira ses proches (v. 34-37)"],""],
[81,"التكوير","At-Takwir","L'Obscurcissement",29,"M","Elle décrit les grands bouleversements de la fin du monde (le soleil obscurci, les étoiles qui tombent, les mers en feu) et la question posée à la fillette enterrée vivante, pratique des Arabes avant l'islam.",["« Pour quel péché a-t-elle été tuée ? » (v. 8-9)","Le Coran est la parole d'un noble messager (v. 19)"],""],
[82,"الانفطار","Al-Infitar","La Rupture",19,"M","Elle décrit le ciel qui se rompt, interpelle l'homme sur ce qui l'a trompé au sujet de son Seigneur généreux, et rappelle les anges gardiens qui écrivent les actes.",["« Ô homme, qu'est-ce qui t'a trompé au sujet de ton Seigneur ? » (v. 6)","Les nobles scribes (v. 10-12)"],""],
[83,"المطففين","Al-Moutaffifin","Les Fraudeurs",36,"M","Elle menace ceux qui trichent sur les mesures : ils exigent la pleine mesure pour eux et diminuent pour les autres. Elle décrit la rouille que les péchés déposent sur les cœurs et la joie des pieux qui rient de ceux qui se moquaient d'eux.",["Malheur aux fraudeurs (v. 1-3)","La rouille sur les cœurs (v. 14)"],""],
[84,"الانشقاق","Al-Inchiqaq","La Déchirure",25,"M","Elle décrit le ciel qui se déchire et la terre qui s'étend, l'homme qui marche avec effort vers la rencontre de son Seigneur, et le jugement facile pour celui qui reçoit son livre dans sa main droite.",["« Ô homme, tu fais tous tes efforts vers ton Seigneur » (v. 6)","Le jugement facile (v. 8)"],""],
[85,"البروج","Al-Bourouj","Les Constellations",22,"M","Elle raconte les « gens du fossé », qui brûlèrent des croyants à cause de leur foi, pour consoler les musulmans persécutés à La Mecque, et affirme qu'Allah est le Très Aimant et que le Coran est préservé sur une Tablette gardée.",["Les gens du fossé (v. 4-8)","Allah, le Pardonneur, le Très Aimant (v. 14)"],""],
[86,"الطارق","At-Tariq","L'Astre nocturne",17,"M","Elle jure par l'astre qui frappe la nuit, affirme que chaque âme a un gardien, et invite l'homme à regarder de quoi il a été créé pour comprendre qu'Allah peut le ressusciter.",["Chaque âme a un gardien (v. 4)","Le jour où les secrets seront dévoilés (v. 9)"],""],
[87,"الأعلى","Al-A'la","Le Très-Haut",19,"M","Elle ordonne de glorifier le nom du Seigneur, le Très-Haut, qui a créé et harmonisé, promet au Prophète ﷺ qu'il n'oubliera pas le Coran, et affirme que celui qui se purifie réussit, alors que les gens préfèrent la vie de ce monde.",["« Glorifie le nom de ton Seigneur, le Très-Haut » (v. 1)","Celui qui se purifie réussit (v. 14-15)","L'au-delà est meilleur et plus durable (v. 17)"],"Récitée avec al-Ghachiya à la prière du vendredi et de l'Aïd (Muslim 878)."],
[88,"الغاشية","Al-Ghachiya","L'Enveloppante",26,"M","Elle décrit le Jour qui enveloppera tout, avec des visages humiliés et des visages heureux, puis invite à regarder les chameaux, le ciel, les montagnes et la terre comme preuves de la création.",["« Ne regardent-ils pas les chameaux, comment ils ont été créés ? » (v. 17)","« Tu n'es qu'un rappeleur » (v. 21)"],""],
[89,"الفجر","Al-Fajr","L'Aube",30,"M","Elle jure par l'aube et les dix nuits, rappelle la fin de 'Ad, Thamoud et Pharaon, critique l'homme qui croit qu'Allah l'honore quand il est riche et l'humilie quand il est pauvre, et se termine par l'appel à l'âme apaisée.",["La richesse et la pauvreté sont des épreuves (v. 15-16)","« Ô toi, âme apaisée, retourne vers ton Seigneur » (v. 27-30)"],""],
[90,"البلد","Al-Balad","La Cité",20,"M","Elle jure par La Mecque, rappelle que l'homme a été créé pour l'effort, et décrit la « voie difficile » : affranchir un esclave et nourrir l'orphelin proche ou le pauvre en temps de famine.",["Les deux voies montrées à l'homme (v. 10)","La voie difficile (v. 11-16)"],""],
[91,"الشمس","Ach-Chams","Le Soleil",15,"M","Elle contient onze serments, le plus grand nombre consécutif dans le Coran, pour affirmer une vérité : celui qui purifie son âme réussit, celui qui la corrompt perd. Elle rappelle l'histoire de Thamoud et de la chamelle.",["Celui qui purifie son âme réussit (v. 9-10)","La chamelle de Thamoud (v. 11-15)"],""],
[92,"الليل","Al-Layl","La Nuit",21,"M","Elle oppose deux types de personnes : celui qui donne, craint Allah et croit à la meilleure récompense, à qui Allah facilite la voie du bonheur, et l'avare qui se suffit à lui-même.",["Les efforts des gens sont divergents (v. 4)","Celui qui donne pour le seul visage d'Allah (v. 17-21)"],""],
[93,"الضحى","Ad-Douha","Le Jour montant",11,"M","Révélée après une interruption de la révélation qui avait attristé le Prophète ﷺ. Allah le rassure : « Ton Seigneur ne t'a ni abandonné ni détesté », lui rappelle qu'Il l'a trouvé orphelin et lui a donné un refuge, et lui ordonne de ne pas maltraiter l'orphelin ni repousser le mendiant.",["« Ton Seigneur ne t'a ni abandonné ni détesté » (v. 3)","Ne pas maltraiter l'orphelin (v. 9)","Parler des bienfaits de son Seigneur (v. 11)"],""],
[94,"الشرح","Ach-Charh","L'Ouverture",8,"M","Elle complète la précédente : Allah a ouvert la poitrine du Prophète ﷺ, enlevé son fardeau et élevé sa renommée. Elle répète deux fois une promesse : avec la difficulté vient la facilité.",["« Avec la difficulté vient la facilité » (v. 5-6)"],""],
[95,"التين","At-Tin","Le Figuier",8,"M","Elle jure par le figuier, l'olivier, le mont Sinaï et La Mecque pour affirmer que l'homme a été créé sous la plus belle forme, puis qu'il tombe au plus bas s'il ne croit pas et ne fait pas le bien.",["L'homme créé sous la plus belle forme (v. 4)"],""],
[96,"العلق","Al-'Alaq","L'Adhérence",19,"M","Ses cinq premiers versets sont la toute première révélation reçue dans la grotte de Hira'. Elle commence par l'ordre de lire au nom d'Allah qui a enseigné par le calame, puis évoque Abou Jahl qui voulait empêcher le Prophète ﷺ de prier.",["« Lis, au nom de ton Seigneur qui a créé » (v. 1-5)","« Prosterne-toi et rapproche-toi » (v. 19)"],""],
[97,"القدر","Al-Qadr","La Destinée",5,"M","Elle raconte la révélation du Coran pendant la Nuit du destin (Laylat al-Qadr), au mois de Ramadan, une nuit meilleure que mille mois, où les anges descendent et qui est paix jusqu'à l'aube.",["Une nuit meilleure que mille mois (v. 3)"],"Qui veille la Nuit du destin avec foi et espoir de récompense voit ses péchés passés pardonnés (Bukhari 1901)."],
[98,"البينة","Al-Bayyina","La Preuve",8,"D","Elle explique que les gens du Livre et les polythéistes attendaient une preuve claire, et que la religion consiste à adorer Allah sincèrement, accomplir la prière et donner la zakat. Elle décrit les meilleurs et les pires des créatures.",["La religion droite : sincérité, prière, zakat (v. 5)","Les meilleurs des créatures (v. 7-8)"],""],
[99,"الزلزلة","Az-Zalzala","Le Tremblement",8,"D","Elle décrit le tremblement final de la terre, qui rejettera ses fardeaux et racontera ce qui s'est passé sur elle. Chacun verra alors le moindre de ses actes.",["Qui fait le poids d'un atome de bien le verra (v. 7-8)"],""],
[100,"العاديات","Al-'Adiyat","Les Coursiers",11,"M","Elle jure par les chevaux lancés au galop et affirme que l'homme est ingrat envers son Seigneur et très attaché aux biens, en lui rappelant le jour où le contenu des tombes et des poitrines sera dévoilé.",["L'homme est ingrat envers son Seigneur (v. 6)"],""],
[101,"القارعة","Al-Qari'a","Le Fracas",11,"M","Elle décrit le fracas du Jour du jugement, où les gens seront comme des papillons dispersés et les montagnes comme de la laine cardée. Celui dont la balance est lourde aura une vie agréable.",["La balance lourde ou légère (v. 6-9)"],""],
[102,"التكاثر","At-Takathour","La Course aux richesses",8,"M","Elle reproche aux gens de se distraire par la course à l'accumulation de biens et d'enfants jusqu'à la tombe, et annonce qu'ils seront interrogés sur chaque bienfait reçu.",["Vous serez interrogés sur les délices (v. 8)"],""],
[103,"العصر","Al-'Asr","Le Temps",3,"M","Trois versets qui résument la voie du salut : tous les hommes sont en perdition, sauf ceux qui croient, font de bonnes œuvres, se recommandent la vérité et se recommandent la patience. L'imam ach-Chafi'i a dit que si les gens méditaient seulement cette sourate, elle leur suffirait.",["Les quatre conditions du salut (v. 3)"],""],
[104,"الهمزة","Al-Houmaza","Le Calomniateur",9,"M","Elle menace celui qui dénigre et diffame les autres, qui amasse des richesses et les compte en croyant qu'elles le rendront immortel.",["Malheur au diffamateur (v. 1)"],""],
[105,"الفيل","Al-Fil","L'Éléphant",5,"M","Elle rappelle comment Allah protégea la Ka'ba de l'armée d'Abraha et de ses éléphants, l'année de la naissance du Prophète ﷺ, en envoyant des oiseaux qui lancèrent sur eux des pierres d'argile.",["Les oiseaux Ababil (v. 3-4)"],""],
[106,"قريش","Qouraych","Qouraych",4,"M","Elle rappelle à Qouraych les bienfaits d'Allah : leurs caravanes d'hiver et d'été, la nourriture contre la faim et la sécurité contre la peur, et leur demande d'adorer le Seigneur de cette Maison.",["Qu'ils adorent le Seigneur de cette Maison (v. 3)"],""],
[107,"الماعون","Al-Ma'oun","L'Ustensile",7,"M","Elle décrit celui qui dément la religion : il repousse l'orphelin, n'encourage pas à nourrir le pauvre, néglige sa prière, agit pour être vu et refuse même de prêter les petits ustensiles.",["Malheur à ceux qui négligent leur prière (v. 4-5)"],""],
[108,"الكوثر","Al-Kawthar","L'Abondance",3,"M","La plus courte sourate. Allah donne au Prophète ﷺ al-Kawthar, un fleuve du Paradis, lui ordonne de prier et de sacrifier pour Allah, et affirme que c'est son ennemi qui sera sans postérité.",["Al-Kawthar, fleuve du Paradis (v. 1)"],"Le Prophète ﷺ a décrit al-Kawthar comme un fleuve promis par son Seigneur, avec un bassin où sa communauté viendra boire (Muslim 400)."],
[109,"الكافرون","Al-Kafiroun","Les Mécréants",6,"M","Révélée quand les Qouraychites proposèrent au Prophète ﷺ d'adorer leurs idoles une année contre l'adoration d'Allah l'année suivante. Elle refuse tout compromis dans l'adoration : « À vous votre religion, et à moi ma religion. »",["« À vous votre religion, et à moi ma religion » (v. 6)"],"Le Prophète ﷺ la récitait avec al-Ikhlas dans les deux unités avant l'aube (Muslim 726)."],
[110,"النصر","An-Nasr","Le Secours",3,"D","Elle annonce le secours d'Allah et la victoire, quand les gens entreront en masse dans l'islam, et ordonne alors de glorifier Allah et de Lui demander pardon. Les compagnons, dont Ibn 'Abbas, y ont compris l'annonce de la fin de la mission du Prophète ﷺ.",["Glorifier Allah et demander pardon après la victoire (v. 3)"],""],
[111,"المسد","Al-Masad","Les Fibres",5,"M","Elle annonce la perte d'Abou Lahab, oncle du Prophète ﷺ et l'un de ses pires ennemis, et de sa femme, qui semait des épines sur son chemin. Abou Lahab mourut mécréant, comme le Coran l'avait annoncé.",["Ses biens ne lui servent à rien (v. 2)"],""],
[112,"الإخلاص","Al-Ikhlas","Le Monothéisme pur",4,"M","Elle définit Allah en quatre versets : Il est Un, le Soutien universel dont tous ont besoin, Il n'a pas engendré et n'a pas été engendré, et nul ne Lui est égal. C'est le résumé du tawhid.",["Allah est Un, As-Samad (v. 1-2)","Nul ne Lui est égal (v. 4)"],"Elle équivaut au tiers du Coran (Bukhari 5013)."],
[113,"الفلق","Al-Falaq","L'Aube naissante",5,"M","Une demande de protection auprès du Seigneur de l'aube contre le mal de la création, de la nuit qui s'étend, des sorcières qui soufflent sur les nœuds et de l'envieux.",["Protection contre l'envie (v. 5)"],"Avec an-Nas : « Jamais on n'a vu de versets semblables » (Muslim 814). Le Prophète ﷺ les récitait avant de dormir (Bukhari 5017)."],
[114,"الناس","An-Nas","Les Hommes",6,"M","La dernière sourate du Coran. Une demande de protection auprès du Seigneur, du Roi et du Dieu des hommes, contre le mal du tentateur qui murmure dans les poitrines puis se retire, qu'il soit djinn ou humain.",["Protection contre le chuchoteur (al-waswas) (v. 4-6)"],"À réciter trois fois matin et soir avec al-Ikhlas et al-Falaq : elles suffisent contre toute chose (Abou Daoud 5082)."]
];
